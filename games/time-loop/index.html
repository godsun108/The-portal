<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIME//LOOP</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030508;color:#edf5ff;font-family:ui-monospace}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:16px;top:14px;font-size:10px;letter-spacing:.12em;line-height:1.7;z-index:2}.back{position:fixed;right:16px;top:14px;color:#788492;text-decoration:none;font-size:9px;z-index:3}.gate{position:fixed;inset:0;background:#020407ee;display:grid;place-items:center;text-align:center;padding:24px;z-index:8}.gate h1{font:900 clamp(52px,14vw,100px)/.78 Arial Black;letter-spacing:-.07em;margin:16px}.gate p{color:#7a8796;line-height:1.8}.gate button{padding:14px 22px;border:1px solid #70839b;background:#080d13;color:#eef;border-radius:999px;font:10px ui-monospace;letter-spacing:.14em}.hidden{display:none}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud"></div><a class="back" href="../../arcade/">ARCADE ↑</a><div class="gate" id="gate"><div><div>COOPERATIVE // WITH YOURSELF</div><h1>TIME//<br>LOOP</h1><p>WASD / ARROWS OR DRAG TO MOVE.<br>STAND ON BOTH ANCHORS AT ONCE.<br>WHEN THE LOOP RESETS, YOUR PAST REPEATS.<br>SOLVE BY LOOP 2 FOR THE CHRONOKEY.</p><button id="start">BEGIN LOOP</button></div></div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();const hud=document.querySelector("#hud"),gate=document.querySelector("#gate"),start=document.querySelector("#start"),cv=document.querySelector("#c"),x=cv.getContext("2d");let W,H,run,player,keys={},record=[],ghosts=[],loop=0,frameN=0,ended=false,drag=null,best=Number(localStorage.getItem("portal-time-loop-best")||0);const LOOP_FRAMES=360;function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);cv.addEventListener("pointerdown",e=>{drag=1;moveTouch(e)});cv.addEventListener("pointermove",e=>{if(drag)moveTouch(e)});cv.addEventListener("pointerup",()=>drag=null);function moveTouch(e){const r=cv.getBoundingClientRect();player.x=(e.clientX-r.left)*devicePixelRatio;player.y=(e.clientY-r.top)*devicePixelRatio}function anchors(){return[{x:W*.22,y:H*.3},{x:W*.78,y:H*.3}]}function reset(){if(record.length){ghosts.push(record.slice());event(run,"loop-recorded",{loop,frames:record.length});if(ghosts.length>4)ghosts.shift()}loop++;frameN=0;record=[];player={x:W*.5,y:H*.78};if(loop>5)end(false)}function near(p,a){return Math.hypot(p.x-a.x,p.y-a.y)<30*devicePixelRatio}function end(win){ended=true;if(win){if(!best||loop<best){best=loop;localStorage.setItem("portal-time-loop-best",best)}const mastery=loop<=2;grantArtifact(mastery?"chronokey":"loop-thread");finishRun(run,{result:"clear",loops:loop,artifact:mastery?"chronokey":"loop-thread"})}else{scar("time-fray");finishRun(run,{result:"lost",loops:loop,scar:"time-fray"})}gate.classList.remove("hidden");gate.innerHTML='<div><div>TIME//LOOP</div><h1>'+(win?"PARADOX<br>CLOSED":"LOOP<br>FRAYED")+'</h1><p>'+(win?(loop<=2?"ARTIFACT // CHRONOKEY":"ARTIFACT // LOOP THREAD"):"SCAR // TIME FRAY")+'<br>LOOPS '+loop+(best?' // BEST '+best:'')+'</p><button onclick="location.reload()">RESET TIME</button></div>'}let last=0;function frame(ms){if(ended)return;const dt=Math.min(.03,(ms-last)/1000||.016);last=ms;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),d=Math.hypot(dx,dy)||1;if(!drag){player.x+=dx/d*250*devicePixelRatio*dt;player.y+=dy/d*250*devicePixelRatio*dt}player.x=Math.max(12,Math.min(W-12,player.x));player.y=Math.max(12,Math.min(H-12,player.y));record.push({x:player.x,y:player.y});const A=anchors(),actors=[player];for(const g of ghosts){const p=g[Math.min(frameN,g.length-1)];if(p)actors.push(p)}const active=A.map(a=>actors.some(p=>near(p,a)));if(active.every(Boolean))return end(true);x.fillStyle="#030508";x.fillRect(0,0,W,H);for(let i=0;i<A.length;i++){x.strokeStyle=active[i]?"#fff":"#536174";x.lineWidth=2*devicePixelRatio;x.beginPath();x.arc(A[i].x,A[i].y,28*devicePixelRatio,0,7);x.stroke()}ghosts.forEach((g,i)=>{const p=g[Math.min(frameN,g.length-1)];if(p){x.globalAlpha=.22+.1*i;x.fillStyle="#b7d9ff";x.beginPath();x.arc(p.x,p.y,9*devicePixelRatio,0,7);x.fill()}});x.globalAlpha=1;x.fillStyle="#fff";x.beginPath();x.arc(player.x,player.y,10*devicePixelRatio,0,7);x.fill();hud.textContent="LOOP "+loop+"/5 // GHOSTS "+ghosts.length+" // TIME "+Math.ceil((LOOP_FRAMES-frameN)/60);frameN++;if(frameN>=LOOP_FRAMES)return reset();requestAnimationFrame(frame)}start.onclick=()=>{run=beginRun("time-loop");gate.classList.add("hidden");reset();requestAnimationFrame(frame)};</script></body></html>
