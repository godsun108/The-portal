<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIFT // PORTAL</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050507;color:#eee;font-family:ui-monospace,monospace;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}#hud{position:fixed;inset:18px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}.panel{background:#050507aa;border:1px solid #ffffff28;padding:10px 12px;backdrop-filter:blur(8px)}#msg{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);letter-spacing:.18em;text-align:center}a{color:#fff;pointer-events:auto}</style><canvas id="c"></canvas><div id="hud"><div class="panel">RIFT ◇<br><span id="score">STABILITY 0</span></div><div class="panel"><a href="../../stations/">EXIT</a></div></div><div id="msg">TOUCH / CLICK THE ANOMALIES BEFORE THEY COLLAPSE</div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{physicsState}from"../../physics.js";import{eventHas}from"../../events.js";const c=document.querySelector("#c"),x=c.getContext("2d"),s=document.querySelector("#score"),msg=document.querySelector("#msg");let W,H,dpr,run=beginRun("rift"),score=0,lives=5,ended=false,orbs=[];const physics=physicsState(),redshift=eventHas("rift-pressure"),stillness=eventHas("rift-slow");function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();function spawn(){const life=(1800+Math.random()*1800)*(redshift?.72:stillness?1.45:1);orbs.push({x:40+Math.random()*(W-80),y:70+Math.random()*(H-140),r:14+Math.random()*24,born:performance.now(),life,phase:Math.random()*6.28})}for(let i=0;i<4;i++)spawn();setInterval(()=>!ended&&orbs.length<8&&spawn(),650);function end(){if(ended)return;ended=true;const tier=score>=20?"rift-key":score>=10?"stabilizer-fragment":"rift-scar";const outcome={score,artifact:tier,scar:lives<=0?"rift-collapse":null,physics:physics.mode,worldEvent:redshift?"redshift":stillness?"stillness":null};finishRun(run,outcome);if(tier==="rift-scar")scar({id:"rift-collapse",source:"rift"});else grantArtifact({id:tier,source:"rift"});localStorage.setItem("portal-last-game-artifact",JSON.stringify({game:"rift",artifact:tier,score,at:new Date().toISOString()}));msg.textContent="RIFT CLOSED // "+tier.toUpperCase()+" // TAP TO RETURN";setTimeout(()=>addEventListener("pointerdown",()=>location.href="../../stations/",{once:true}),300)}addEventListener("pointerdown",e=>{if(ended)return;let hit=-1,best=1e9;orbs.forEach((o,i)=>{const d=Math.hypot(e.clientX-o.x,e.clientY-o.y);if(d<o.r*1.8&&d<best){hit=i;best=d}});if(hit>=0){const o=orbs.splice(hit,1)[0],age=(performance.now()-o.born)/o.life,gain=Math.max(1,Math.round((1-age)*5));score+=gain;event(run,"stabilized",{gain});s.textContent="STABILITY "+score+" // INTEGRITY "+lives;spawn()}});function frame(t){x.clearRect(0,0,W,H);for(let i=orbs.length-1;i>=0;i--){const o=orbs[i],age=(t-o.born)/o.life;if(age>=1){orbs.splice(i,1);lives--;event(run,"collapsed");s.textContent="STABILITY "+score+" // INTEGRITY "+lives;if(lives<=0)end();continue}if(physics.mode==="converged"){o.x+=Math.sin(t/700+o.phase)*.32;o.y+=Math.cos(t/850+o.phase)*.32;o.x=Math.max(20,Math.min(W-20,o.x));o.y=Math.max(55,Math.min(H-20,o.y))}const pulse=1+.18*Math.sin(t/180+o.phase),r=o.r*pulse;x.beginPath();x.arc(o.x,o.y,r,0,7);x.strokeStyle=`hsla(${(t/20+o.phase*50)%360},90%,70%,${.25+.65*(1-age)})`;x.lineWidth=2+4*(1-age);x.stroke();x.beginPath();x.arc(o.x,o.y,r*(1-age),0,7);x.fillStyle="#ffffff18";x.fill()}requestAnimationFrame(frame)}requestAnimationFrame(frame);setTimeout(()=>!ended&&end(),45000)</script>
