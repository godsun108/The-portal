<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020304"><title>WINDOW // THE PORTAL</title><script src="../world.js"></script><script src="https://godsun108.github.io/window-earth/cameras.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020304;color:#e8edef;font-family:ui-monospace,monospace}body{min-height:100svh}.back{position:fixed;z-index:30;left:20px;top:20px;color:#778086;text-decoration:none;font-size:9px;letter-spacing:.18em}.shell{width:min(1120px,100%);margin:auto;padding:64px 16px 34px}.ey{font-size:9px;letter-spacing:.3em;color:#596268}.frame{position:relative;margin-top:20px;width:100%;aspect-ratio:16/10;background:#000;border:1px solid #30373b;overflow:hidden;box-shadow:0 30px 110px #000}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.shade{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px #0008;z-index:4}.live{position:absolute;z-index:6;left:14px;top:14px;padding:8px 10px;background:#030506c9;border:1px solid #344047;color:#cbd8dc;font-size:8px;letter-spacing:.18em}.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#7ee6a0;margin-right:7px;box-shadow:0 0 10px #7ee6a0}.unknown{position:absolute;z-index:5;right:14px;top:14px;background:#030506c9;border:1px solid #344047;padding:8px 10px;color:#7c898e;font-size:8px;letter-spacing:.14em}.info{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-top:22px}.place{font:900 clamp(46px,10vw,96px)/.82 Arial Black,Impact,sans-serif;letter-spacing:-.06em;margin:10px 0}.place.hidden{filter:blur(11px);user-select:none}.meta{color:#68747a;font-size:9px;line-height:1.8;letter-spacing:.12em}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #343b40;background:#07090a;color:#b3bdc1;padding:13px 17px;border-radius:999px;font:9px ui-monospace;letter-spacing:.13em;cursor:pointer}.btn:active{transform:scale(.97)}.source{margin-top:22px;color:#465057;font-size:8px;line-height:1.8}.source a{color:#69777e}.memory{position:fixed;z-index:20;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;border:1px solid #36434a;background:#050708ee;padding:12px 16px;color:#9fadb2;font-size:8px;letter-spacing:.13em;transition:.3s;pointer-events:none}.memory.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.shell{padding-top:58px}.frame{aspect-ratio:9/12}.frame iframe{width:213%;left:-56.5%}.info{grid-template-columns:1fr}.controls{justify-content:flex-start}.place{font-size:clamp(48px,16vw,80px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body>
<a class="back" href="../">← PORTAL</a><main class="shell"><div class="ey">WINDOW // PUBLIC LIVE CAMERA</div><section class="frame"><iframe id="feed" title="Live public camera" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="shade"></div><div class="live">LIVE FEED</div><div class="unknown" id="counter"></div></section><section class="info"><div><div class="meta" id="kind">LOCATION WITHHELD</div><h1 class="place hidden" id="place">UNKNOWN</h1><div class="meta" id="detail">You are looking at somewhere real, right now.</div></div><div class="controls"><button class="btn" id="reveal">WHERE AM I?</button><button class="btn" id="next">ANOTHER WINDOW</button></div></section><div class="source" id="source"></div></main><div class="memory" id="memory"></div><script>
const feeds=(window.WINDOW_CAMERAS||[]).map((x,i)=>({id:"canonical-"+i,place:String(x.place||"UNKNOWN").toUpperCase(),kind:(x.status||"NEAR-LIVE")+" // "+String(x.provider||"PUBLIC CAMERA").toUpperCase(),detail:x.place||"Somewhere else on Earth, right now.",source:x.provider||"public source",embed:x.embed,status:x.status||"NEAR-LIVE",sourceUrl:x.source||""}));
const feed=document.querySelector("#feed"),place=document.querySelector("#place"),kind=document.querySelector("#kind"),detail=document.querySelector("#detail"),source=document.querySelector("#source"),counter=document.querySelector("#counter"),memory=document.querySelector("#memory");let index=Number(sessionStorage.getItem("portal-window-index")||Math.floor(Math.random()*feeds.length))%feeds.length,revealed=false;
function note(t){memory.textContent=t;memory.classList.add("show");setTimeout(()=>memory.classList.remove("show"),2600)}
function load(i){if(!feeds.length){place.textContent="NO VERIFIED WINDOW";kind.textContent="CANONICAL REGISTRY UNAVAILABLE";detail.textContent="Portal will not fabricate a live view.";counter.textContent="WINDOW OFFLINE";feed.removeAttribute("src");return}index=(i+feeds.length)%feeds.length;sessionStorage.setItem("portal-window-index",index);const x=feeds[index];revealed=false;place.textContent=x.place;place.classList.add("hidden");kind.textContent="LOCATION WITHHELD";detail.textContent="You are looking at somewhere real, right now.";counter.textContent="WINDOW "+String(index+1).padStart(2,"0")+" / "+String(feeds.length).padStart(2,"0");document.querySelector(".live").textContent=x.status+" FEED";feed.src="https://www.youtube-nocookie.com/embed/"+x.id+"?autoplay=1&mute=1&controls=1&playsinline=1&rel=0";source.innerHTML="PUBLIC STREAM // "+x.source+" · Feed availability is controlled by its broadcaster.";localStorage.setItem("portal-window","1")}
document.querySelector("#reveal").onclick=()=>{const x=feeds[index];revealed=true;place.classList.remove("hidden");kind.textContent=x.kind;detail.textContent=x.detail;const seen=JSON.parse(localStorage.getItem("portal-window-seen")||"[]");if(!seen.includes(x.place)){seen.push(x.place);localStorage.setItem("portal-window-seen",JSON.stringify(seen));window.PortalWorld?.event("window-"+x.place.replace(/\W/g,"").toLowerCase(),"YOU LOOKED THROUGH A WINDOW IN "+x.place+".");window.PortalWorld?.save();note("THE PORTAL REMEMBERS THIS PLACE.")}};
document.querySelector("#next").onclick=()=>load(index+1);load(index);
</script></body></html>
