name: Music Foundry preview player checks
on:
  push:
    paths:
      - 'music-foundry/preview-player.html'
      - 'scripts/check-music-preview-player.cjs'
      - 'scripts/test-music-preview-player.browser.cjs'
      - '.github/workflows/music-preview-player.yml'
  pull_request:
    paths:
      - 'music-foundry/preview-player.html'
      - 'scripts/check-music-preview-player.cjs'
      - 'scripts/test-music-preview-player.browser.cjs'
      - '.github/workflows/music-preview-player.yml'
jobs:
  preview-player:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local preview player
        run: node scripts/check-music-preview-player.cjs
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Test real WAV decoding and transport in Chromium
        run: node scripts/test-music-preview-player.browser.cjs
