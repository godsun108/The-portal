OOR"];function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);addEventListener("keydown",e=>keys[e.key]=1);addEventListener("keyup",e=>keys[e.key]=0);addEventListener("pointermove",e=>{px=e.clientX/innerWidth;py=e.clientY/innerHeight});function hit(){lives--;event(run,"impact",{phase});if(lives<=0)end(false)}function end(win){if(win){grantArtifact("black-token");finishRun(run,{result:"clear",score,artifact:"black-token"})}else{scar("deep-run-loss");finishRun(run,{result:"lost",score,scar:"deep-run-loss"})}G?.remove?.();const q=document.createElement("div");q.className="gate";q.innerHTML='<div><div>DEEP//RUN</div><h1>'+(win?"CLEAR":"LOST")+'</h1><p>SCORE '+score+'<br>'+(win?"ARTIFACT // BLACK TOKEN":"THE SUBLEVEL REMEMBERS THE FALL")+'</p><button onclick="location.reload()">AGAIN</button></div>';document.body.append(q)}let lastHit=0;function frame(ms){if(lives<=0)return;t+=.016;const local=t-phase*8;if(local>=8){phase++;event(run,"phase",{phase});if(phase>=5)return end(true)}x.fillStyle="#020204";x.fillRect(0,0,W,H);x.strokeStyle="#705b8a";x.lineWidth=devicePixelRatio;for(let i=0;i<9;i++){x.beginPath();x.moveTo(0,H*i/9);x.lineTo(W,H*(i/9)+Math.sin(t+i)*20*devicePixelRatio);x.stroke()}let danger=false;if(phase===0){for(let i=0;i<7;i++){let xx=((i*.19+t*.12)%1)*W,yy=((i*.31+t*.17)%1)*H;x.fillStyle="#9d7bc4";x.beginPath();x.arc(xx,yy,15*devicePixelRatio,0,7);x.fill();if(Math.hypot(xx-px*W,yy-py*H)<35*devicePixelRatio)danger=true}}else if(phase===1){let gap=Math.floor(t*1.7)%3;for(let i=0;i<3;i++)if(i!==gap){x.fillStyle="#8265a4";x.fillRect(i*W/3,H*.38,W/3-8*devicePixelRatio,28*devicePixelRatio);if(py>.35&&py<.46&&Math.floor(px*3)===i)danger=true}}else if(phase===2){for(let i=0;i<6;i++){let a=t*(.6+i*.03)+i,rr=(.12+.07*i)*Math.min(W,H),xx=W/2+Math.cos(a)*rr,yy=H/2+Math.sin(a)*rr;x.fillStyle="#a88bc9";x.fillRect(xx,yy,10*devicePixelRatio,10*devicePixelRatio);if(Math.hypot(xx-px*W,yy-py*H)<28*devicePixelRatio)danger=true}}else if(phase===3){let beat=(t*2.1)%1;x.fillStyle=beat<.18?"#ddd":"#44394f";x.fillRect(0,H*.48,W,8*devicePixelRatio);if(beat<.18&&Math.abs(py-.5)<.16)score+=2}else{let doorX=(.5+Math.sin(t)*.25)*W;x.strokeStyle="#fff";x.strokeRect(doorX-35*devicePixelRatio,H*.18,70*devicePixelRatio,110*devicePixelRatio);if(local>6&&Math.abs(px*W-doorX)<70*devicePixelRatio)score+=4}x.fillStyle="#fff";x.beginPath();x.arc(px*W,py*H,7*devicePixelRatio,0,7);x.fill();if(danger&&ms-lastHit>700){lastHit=ms;hit()}score++;hud.textContent=names[phase]+" // "+(phase+1)+"/5 // LIVES "+lives+" // DEPTH "+score;requestAnimationFrame(frame)}requestAnimationFrame(frame)}}</script></body></html>
