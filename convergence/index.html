<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020204"><title>CONVERGENCE // THE PORTAL</title><script src="../world.js"></script><style>*{box-sizing:border-box}html,body{margin:0;background:#020204;color:#eee;font-family:ui-monospace,monospace;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.back{position:fixed;z-index:4;top:max(20px,env(safe-area-inset-top));left:20px;color:#777;text-decoration:none;font-size:9px;letter-spacing:.16em}.words{position:fixed;z-index:3;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;padding:25px}.ey{font-size:8px;letter-spacing:.34em;color:#777}.words h1{font:900 clamp(48px,14vw,120px)/.78 Arial Black,sans-serif;letter-spacing:-.07em;margin:18px 0}.words p{font-size:9px;line-height:1.9;color:#8b8790;max-width:500px}.no{color:#5a555f}</style></head><body><canvas id="c"></canvas><a class="back" href="../">← PORTAL</a><main class="words"><div><div class="ey">WORLD EVENT // ∴</div><h1>CONVERGENCE</h1><p id="text"></p></div></main><script>
const unlocked=localStorage.getItem("portal-convergence")==="1",text=document.querySelector("#text");if(!unlocked){text.innerHTML='<span class="no">THIS ROOM HAS NOT HAPPENED TO YOU.</span>';setTimeout(()=>location.replace("../"),1800)}
else{text.innerHTML="You made something and destroyed it.<br>You learned to fall without hitting.<br>You seeded life under rules it could not see.<br>You sent a consequence through rooms that were supposed to be separate.<br><br><b>THE PORTAL NOTICED THE PATTERN.</b>";localStorage.setItem("portal-convergence-seen","1");PortalWorld?.event?.("convergence-seen","THE TRAVELER ENTERED A ROOM CREATED BY THEIR OWN HISTORY.");PortalWorld?.save?.()}
const c=document.querySelector("#c"),x=c.getContext("2d");let W,H,t=0;function size(){W=c.width=innerWidth*(devicePixelRatio||1);H=c.height=innerHeight*(devicePixelRatio||1);x.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0);W=innerWidth;H=innerHeight}size();addEventListener("resize",size);function draw(){t+=.008;x.fillStyle="rgba(2,2,4,.14)";x.fillRect(0,0,W,H);const cx=W/2,cy=H/2;for(let k=0;k<4;k++){x.beginPath();for(let i=0;i<180;i++){const a=i/180*Math.PI*2+t*(k%2?1:-1),r=50+k*36+24*Math.sin(a*(k+2)+t*9),px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*.55;x.lineTo(px,py)}x.closePath();x.strokeStyle=`hsla(${(t*80+k*75)%360},75%,65%,.18)`;x.stroke()}requestAnimationFrame(draw)}draw();
</script></body></html>
