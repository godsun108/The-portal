<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORLD CLOCK</title><style>html,body{margin:0;background:#050507;color:#eee;min-height:100%;font:13px ui-monospace,monospace}main{max-width:720px;margin:auto;padding:9vh 24px}.clock{font-size:clamp(48px,13vw,100px);letter-spacing:-.07em}.event{border:1px solid #ffffff28;padding:18px;margin:14px 0}button{background:#09090d;color:#eee;border:1px solid #ffffff35;padding:12px 15px;font:inherit;cursor:pointer}a{color:#eee}.dim{opacity:.5}</style><main><div class="clock" id="clock"></div><h1>WORLD CLOCK</h1><p class="dim">LOCAL PORTAL TIME // FICTIONAL WORLD EVENTS ARE EXPLICITLY LABELED</p><div id="active"></div><h2>LOCAL EVENT CHAMBER</h2><p>These switches begin temporary events in this browser's Portal world.</p><button data-e="redshift">BEGIN REDSHIFT</button> <button data-e="stillness">BEGIN STILLNESS</button><p><a href="../stations/">RETURN</a></p></main><script type="module">import{activeEvents,beginEvent,eventCatalog}from"../events.js";const clock=document.querySelector("#clock"),active=document.querySelector("#active");function render(){const now=new Date();clock.textContent=now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});const xs=activeEvents();active.innerHTML=xs.length?xs.map(e=>'<div class="event"><b>'+e.label+'</b> // LOCAL FICTIONAL EVENT<br>ENDS '+new Date(e.endsAt).toLocaleTimeString()+'<br>'+e.effects.join(" · ")+'</div>').join(""):'<div class="event dim">NO ACTIVE WORLD EVENT</div>'}setInterval(render,1000);render();document.querySelectorAll("button[data-e]").forEach(b=>b.onclick=()=>{beginEvent(b.dataset.e);render()})</script>
<script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>

<script type="module">import{installTransitions}from"../transitions.js";installTransitions("clock");</script>
