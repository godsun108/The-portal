<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIDOLON · 3D Scene Preview</title><style>body{margin:0;background:#0b1220;color:#eef5ff;font:15px system-ui}main{max-width:960px;margin:auto;padding:12px}a{color:#91e5d6}canvas{display:block;width:100%;height:58vh;border-radius:14px;background:#152239}button,select{background:#1d3851;border:1px solid #6b8ca7;border-radius:9px;color:white;padding:12px;font:inherit;min-height:44px}select{max-width:100%}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}p{color:#b6c8dc}#status{min-height:24px;color:#b6eadc}</style></head><body><main><a href="./index.html">← Scene Director</a><h2>EIDOLON · 3D Scene Preview</h2><p>Experimental 3D scene using our existing MakeHuman rig and approved motion assets. This is a real-time prototype, not a photorealistic render.</p><div id="viewport"></div><div class="row"><label for="motion">Motion</label><select id="motion"><option>Loading…</option></select><button id="play">▶ Play</button><button id="stop">■ Stop</button><button id="reset">Frame full body</button><button id="cinema">✦ Cinematic mode</button><button id="shot">◉ Change shot</button><button id="record">● Record 10s</button></div><p id="status" role="status">Loading renderer…</p></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;
const scene=new THREE.Scene();scene.background=new THREE.Color('#172740');scene.fog=new THREE.Fog('#172740',12,42);
const camera=new THREE.PerspectiveCamera(42,1,.05,100);camera.position.set(3,2.3,5.8);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.domElement.setAttribute('aria-label','Interactive 3D character and environment');$('viewport').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.update();
scene.add(new THREE.HemisphereLight(0xcce5ff,0x29394b,2));const sun=new THREE.DirectionalLight(0xffe0bb,2.4);sun.position.set(4,8,3);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);sun.shadow.camera.left=-10;sun.shadow.camera.right=10;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;sun.shadow.bias=-.0003;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x28394d,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(28,28,0x3b7b83,0x365166);grid.position.y=.012;scene.add(grid);
for(let i=0;i<14;i++){const h=2+(i*17%7);const building=new THREE.Mesh(new THREE.BoxGeometry(1.1,h,1.1),new THREE.MeshStandardMaterial({color:i%2?0x28465a:0x33415f,roughness:.55,emissive:i%3===0?0x07191d:0x000000}));building.position.set((i%7-3)*2.3,h/2,-4-Math.floor(i/7)*2);scene.add(building)}
const accents=[];for(let i=0;i<14;i++){const x=(i%7-3)*2.3,z=-4-Math.floor(i/7)*2,h=2+(i*17%7);const strip=new THREE.Mesh(new THREE.BoxGeometry(.08,h*.76,.035),new THREE.MeshBasicMaterial({color:i%2?0xff79c6:0x65e7ef}));strip.position.set(x-.35,h*.53,z+.57);scene.add(strip);accents.push(strip)}const rim=new THREE.PointLight(0x5ce8ef,26,9,2);rim.position.set(-2,2.7,1.5);scene.add(rim);const pink=new THREE.PointLight(0xfa6cbd,19,9,2);pink.position.set(2,2.5,-1);scene.add(pink);const markers=[];for(let i=0;i<8;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.08,.025,.65),new THREE.MeshBasicMaterial({color:0x4ad8db}));m.position.set(i%2===0?-2.8:2.8,.03,2-Math.floor(i/2)*1.5);scene.add(m);markers.push(m)}
let actor=null,mixer=null,active=null,catalog=[],playing=false,recording=false,baseY=0,cinematic=false,shot=0,elapsed=0;const loader=new GLTFLoader();
async function load(){try{status('Loading native rig and motion catalog…');const [rig,res]=await Promise.all([loader.loadAsync('../eidolon-human-base/assets/makehuman-native-rig.glb'),fetch('../eidolon-native-motion/motion-catalog.json',{cache:'no-store'})]);if(!res.ok)throw Error('Catalog HTTP '+res.status);const json=await res.json();catalog=(json.motions||[]).filter(x=>x.rig==='makehuman-native-163'&&x.path&&x.id);if(!catalog.length)throw Error('No approved rig-compatible clips');actor=rig.scene;actor.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(actor);const box=new THREE.Box3().setFromObject(actor);if(Number.isFinite(box.min.y)){baseY=-box.min.y;actor.position.y=baseY}mixer=new THREE.AnimationMixer(actor);frameActor();$('motion').replaceChildren(...catalog.map(x=>new Option(x.title||x.id,x.id)));const params=new URLSearchParams(location.search),requested=params.get('motion');$('motion').value=catalog.some(x=>x.id===requested)?requested:(catalog.some(x=>x.id==='eidolon-natural-walk-v2')?'eidolon-natural-walk-v2':catalog[0].id);await playSelected();status('3D rig loaded · '+catalog.length+' approved motion references · drag to orbit')}catch(e){status('3D preview unavailable: '+e.message);console.error(e)}}
async function playSelected(){if(!actor||!mixer)return;const entry=catalog.find(x=>x.id===$('motion').value);if(!entry)return;status('Loading '+entry.title+'…');try{const gltf=await loader.loadAsync('../eidolon-native-motion/'+entry.path);if(!gltf.animations.length)throw Error('No animation tracks');mixer.stopAllAction();mixer.uncacheRoot(actor);const clip=gltf.animations[0];active=mixer.clipAction(clip);active.reset().setLoop(THREE.LoopRepeat,Infinity).play();playing=true;status('Playing '+entry.title+' · source: '+entry.license+' · experimental gait')}catch(e){playing=false;status('Could not load clip: '+e.message)}}
$('motion').onchange=playSelected;$('play').onclick=()=>{if(active){active.paused=false;playing=true;status('Playing '+$('motion').selectedOptions[0].text)}};$('stop').onclick=()=>{if(active)active.paused=true;playing=false;status('Paused')};$('reset').onclick=()=>{cinematic=false;$('cinema').textContent='✦ Cinematic mode';frameActor()};$('cinema').onclick=()=>{cinematic=!cinematic;$('cinema').textContent=cinematic?'✦ Cinematic ON':'✦ Cinematic mode';if(!cinematic)frameActor();status(cinematic?'Cinematic orbit enabled · record a 10-second shot':'Manual orbit enabled')};$('shot').onclick=()=>{shot=(shot+1)%3;cinematic=true;$('cinema').textContent='✦ Cinematic ON';status(['Hero orbit','Wide establishing shot','Portrait dolly'][shot])};
function frameActor(){if(!actor)return;actor.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(actor);const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const height=Math.max(size.y,1.7);controls.target.copy(center);camera.position.set(center.x+height*.75,center.y+height*.22,center.z+height*2.25);camera.near=.05;camera.far=150;camera.updateProjectionMatrix();controls.update()}
function alignFeet(){if(!actor)return;actor.position.y=baseY;actor.updateMatrixWorld(true);const feet=[];for(const name of ['foot.L','foot.R']){const bone=actor.getObjectByName(name);if(bone){const pos=new THREE.Vector3();bone.getWorldPosition(pos);feet.push(pos.y)}}if(!feet.length)return;const lowest=Math.min(...feet);const shift=THREE.MathUtils.clamp(-lowest,-.3,.3);actor.position.y=baseY+shift;actor.updateMatrixWorld(true)}
$('record').onclick=()=>{if(recording)return;if(!renderer.domElement.captureStream||!window.MediaRecorder){status('Video recording not supported in this browser');return}let stream,rec;try{stream=renderer.domElement.captureStream(30);const mime=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){status('Recorder unavailable: '+e.message);return}const chunks=[],button=$('record');recording=true;button.disabled=true;rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{recording=false;button.disabled=false;stream.getTracks().forEach(x=>x.stop());const type=rec.mimeType||'video/webm',ext=type.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type});if(!blob.size){status('Recording was empty');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='eidolon-3d-preview.'+ext;a.click();status('Saved '+ext.toUpperCase()+' recording · '+(blob.size/1048576).toFixed(1)+' MB');setTimeout(()=>URL.revokeObjectURL(url),60000)};rec.onerror=e=>status('Recording error: '+(e.error?.message||'unknown'));try{rec.start(250);status('Recording 10 seconds · keep the page visible');setTimeout(()=>{if(rec.state==='recording')rec.stop()},10000)}catch(e){recording=false;button.disabled=false;stream.getTracks().forEach(x=>x.stop());status('Recording failed: '+e.message)}};
function resize(){const width=$('viewport').clientWidth,height=Math.max(300,Math.min(innerHeight*.58,650));renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.06);if(mixer&&playing)mixer.update(dt);if(actor)alignFeet();if(cinematic&&actor){elapsed+=dt;actor.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(actor),center=box.getCenter(new THREE.Vector3()),height=Math.max(box.getSize(new THREE.Vector3()).y,1.7),angle=elapsed*.23;const distance=shot===1?height*3.3:shot===2?height*1.5:height*2.25;const target=new THREE.Vector3(center.x,center.y+(shot===2?height*.18:0),center.z);controls.target.lerp(target,.06);camera.position.lerp(new THREE.Vector3(center.x+Math.sin(angle)*distance*.7,center.y+height*(shot===1?.65:shot===2?.08:.3),center.z+Math.cos(angle)*distance),.045)}controls.update();renderer.render(scene,camera)}tick();load();
</script></body></html>
