<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGNAL HUNT</title><style>html,body{margin:0;min-height:100%;background:#030605;color:#dff;font:15px ui-monospace,monospace}main{max-width:760px;margin:auto;padding:8vh 24px}.sig{font-size:clamp(44px,10vw,100px);letter-spacing:.18em;animation:p 2s infinite}@keyframes p{50%{opacity:.25}}.bar{height:3px;background:#163;margin:35px 0}.fill{height:100%;background:#dff}.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.r{border:1px solid #8ff3;padding:14px}.got{background:#8ff1}.locked{opacity:.35}a{color:#dff}#decode{margin-top:30px;border:1px solid #dff;padding:18px;display:none}</style><main><div class="sig">⌁⌁⌁</div><h1>SIGNAL HUNT</h1><p>THE SIGNAL IS NOT HERE. IT IS LEAKING THROUGH THE WORLD.</p><div class="bar"><div class="fill" id="fill"></div></div><div id="count"></div><div class="rooms" id="rooms"></div><div id="decode"></div><p><a href="../../stations/">RETURN TO STATIONS</a></p></main><script type="module">import{signalState}from"../signal.js";import{grantArtifact,hasArtifact}from"../state.js";const names={earth:"EARTH",color:"COLOR",oracle:"ORACLE",void:"VOID",machine:"MACHINE"},links={earth:"../../earth/",color:"../../color/",oracle:"../../oracle/",void:"../../void/",machine:"../../machine/"};const s=signalState(),rooms=document.querySelector("#rooms");document.querySelector("#fill").style.width=(s.fragments.length/s.total*100)+"%";document.querySelector("#count").textContent=`${s.fragments.length} / ${s.total} FRAGMENTS RECOVERED`;for(const id of Object.keys(names)){const got=s.fragments.includes(id),d=document.createElement("div");d.className="r "+(got?"got":"");d.innerHTML=`${got?"◆":"◇"} ${names[id]}<br><a href="${links[id]}">${got?"REVISIT":"SEARCH"}</a>`;rooms.append(d)}if(s.complete){const d=document.querySelector("#decode");d.style.display="block";const crown=hasArtifact("echo-crown");const artifact=crown?"deep-signal":"decoded-signal";if(!hasArtifact(artifact))grantArtifact({id:artifact,source:"signal-hunt"});d.textContent=crown?"ECHO CROWN INTERFERENCE DETECTED // DEEP SIGNAL RECOVERED":"SIGNAL DECODED // ARTIFACT RECOVERED"}</script>
<script type="module">import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();</script>

<script type="module">import{installTransitions}from"../../transitions.js";installTransitions("signal-hunt");</script>
