<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarthChain Seller Studio · Demo</title><style>:root{font:16px system-ui;color-scheme:dark;background:#071914;color:#e9fff3}body{max-width:620px;margin:auto;padding:20px}main{background:#123429;border:1px solid #2d6851;border-radius:20px;padding:20px}label{display:block;margin:16px 0 6px}input,select,textarea,button{font:inherit;border-radius:10px;padding:12px;box-sizing:border-box}input,select,textarea{width:100%;background:#09241b;color:white;border:1px solid #649d7f}button{background:#257451;color:white;border:1px solid #75bb93;margin-top:14px}button:disabled{opacity:.5}p{line-height:1.5}small{color:#b6d7c5}#output{white-space:pre-wrap;background:#09241b;border-radius:12px;padding:12px;overflow-wrap:anywhere}</style></head><body><main><a href="./earthwallet-demo.html">← EarthWallet</a><h1>🌎 Seller Studio</h1><p><strong>EC-YGO-0001 · Exodia the Forbidden One</strong></p><p>Private local draft preview. No account login, photo upload, listing publication, or real payments.</p><label for="price">Asking price (USD)</label><input id="price" type="number" min="0.01" max="1000000" step="0.01" value="14.99"><label for="quantity">Quantity</label><input id="quantity" type="number" min="0" max="10000" step="1" value="1"><label for="condition">Condition (seller assessment)</label><select id="condition"><option value="UNVERIFIED">Unverified</option><option value="NM">Near Mint</option><option value="LP">Lightly Played</option><option value="MP">Moderately Played</option><option value="HP">Heavily Played</option><option value="DMG">Damaged</option></select><label for="notes">Private notes (optional)</label><textarea id="notes" maxlength="500" rows="3"></textarea><button id="preview" type="button">Preview draft</button> <button disabled>Publish (unavailable)</button><p id="output" role="status" aria-live="polite"></p><small>Changes remain only in this browser page until you leave or refresh. Do not enter personal identity or payment information.</small></main><script type="module">import {makeSellerDraft,draftValidation} from './earthchain-seller-draft.mjs';const $=id=>document.getElementById(id);$('preview').addEventListener('click',()=>{try{const price=Number($('price').value);if(!Number.isFinite(price)||Math.round(price*100)!==price*100)throw Error('Enter a valid dollar amount with at most two decimals');const draft=makeSellerDraft({priceUsdCents:Math.round(price*100),quantity:Number($('quantity').value),condition:$('condition').value,notes:$('notes').value});const status=draftValidation(draft);$('output').textContent='PRIVATE PREVIEW\n'+draft.title+'\n$'+(draft.priceUsdCents/100).toFixed(2)+' · '+draft.quantity+' available · '+draft.condition+'\nNotes: '+(draft.notes||'none')+'\nNot publishable. Pending: '+status.issues.join(', ')}catch(e){$('output').textContent='Validation error: '+e.message}});</script></body></html>
