<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARALLAX</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#050609;color:#e8edf2;font-family:ui-monospace;display:grid;place-items:center;padding:20px}.wrap{width:min(720px,96vw)}header{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.16em;color:#75808d}h1{font:900 clamp(48px,12vw,88px)/.8 Arial Black;letter-spacing:-.07em;margin:22px 0}.meta{font-size:10px;color:#84909c;margin-bottom:16px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tile{aspect-ratio:1;border:1px solid #28313b;background:#090c10;border-radius:9px;position:relative;cursor:pointer;transition:transform .14s,border-color .14s}.tile:before,.tile:after{content:"";position:absolute;background:#8998aa}.tile:before{width:8%;height:52%;left:46%;top:0}.tile:after{height:8%;width:52%;top:46%;left:48%}.tile.corner:after{width:48%}.tile.straight:after{left:0;width:100%}.tile.straight:before{display:none}.tile.t:before{height:100%}.tile.t:after{width:100%;left:0}.tile.on{border-color:#d9ecff;box-shadow:0 0 18px #9ed0ff44}.tile.on:before,.tile.on:after{background:#e8f5ff;box-shadow:0 0 9px #b8dcff}.tile.source{outline:1px solid #fff}.tile.sink{outline:1px dashed #fff}.status{min-height:54px;margin-top:18px;color:#778390;font-size:10px;line-height:1.7}.gate{position:fixed;inset:0;background:#030405;display:grid;place-items:center;text-align:center;z-index:5;padding:24px}.gate button{padding:13px 20px;border:1px solid #657484;background:#090c10;color:#eee;border-radius:999px;font:10px ui-monospace;letter-spacing:.15em;cursor:pointer}.hidden{display:none}@media(max-width:520px){.board{gap:4px}.tile{border-radius:5px}}</style></head><body><main class="wrap"><header><a href="../../arcade/" style="color:inherit;text-decoration:none">← ARCADE</a><span>SPATIAL LOGIC // CABINET</span></header><h1>PARALLAX</h1><div class="meta" id="meta"></div><div class="board" id="board"></div><div class="status" id="status"></div></main><div class="gate" id="gate"><div><div>ROTATE THE FIELD.<br>CONNECT SOURCE TO SINK.<br>CLEAR 3 BOARDS // 42 MOVES OR FEWER EARNS THE LENS.</div><h1>PARALLAX</h1><button id="start">BEGIN</button></div></div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();const meta=document.querySelector("#meta"),board=document.querySelector("#board"),status=document.querySelector("#status"),gate=document.querySelector("#gate"),start=document.querySelector("#start");const N=5,DIR=[[-1,0],[0,1],[1,0],[0,-1]],OP=[2,3,0,1];let run,grid,moves=0,level=0,total=0,solved=false,best=Number(localStorage.getItem("portal-parallax-best")||0);function rng(seed){return()=>((seed=Math.imul(seed^seed>>>15,1|seed))^=seed+Math.imul(seed^seed>>>7,61|seed),((seed^seed>>>14)>>>0)/4294967296)}function make(){const r=rng((Date.now()>>>0)+level*991),path=[[2,0]],seen=new Set(["2,0"]);let y=2,x=0;while(x<4){const opts=[];if(x<4)opts.push([y,x+1]);if(y>0)opts.push([y-1,x]);if(y<4)opts.push([y+1,x]);const viable=opts.filter(p=>!seen.has(p.join(","))||p[1]===4);let p=viable[Math.floor(r()*viable.length)]||[y,x+1];y=p[0];x=p[1];path.push(p);seen.add(p.join(","));if(path.length>18){y=2;x=Math.min(4,x+1);path.push([y,x])}}grid=Array.from({length:N},()=>Array.from({length:N},()=>({type:r()<.6?"corner":"straight",rot:Math.floor(r()*4),links:[]})));for(let i=0;i<path.length;i++){const [py,px]=path[i],links=[];for(const j of [i-1,i+1])if(path[j]){const [qy,qx]=path[j];links.push(DIR.findIndex(d=>py+d[0]===qy&&px+d[1]===qx))}let type=links.length<2?"straight":((links[0]+2)%4===links[1]?"straight":"corner");let base=type==="straight"?[1,3]:[0,1],rot=0;while(!links.every(v=>base.map(b=>(b+rot)%4).includes(v)))rot++;grid[py][px]={type,rot:(rot+1+Math.floor(r()*3))%4,solution:rot};}grid[2][0].source=true;grid[path.at(-1)[0]][4].sink=true;render()}function links(t){const base=t.type==="straight"?[1,3]:[0,1];return base.map(v=>(v+t.rot)%4)}function powered(){const q=[[2,0]],vis=new Set(["2,0"]);while(q.length){const [y,x]=q.shift();for(const d of links(grid[y][x])){const ny=y+DIR[d][0],nx=x+DIR[d][1];if(ny<0||nx<0||ny>=N||nx>=N)continue;if(links(grid[ny][nx]).includes(OP[d])&&!vis.has(ny+","+nx)){vis.add(ny+","+nx);q.push([ny,nx])}}}return vis}function render(){const on=powered();board.innerHTML="";grid.flat().forEach((t,i)=>{const y=Math.floor(i/N),x=i%N,b=document.createElement("button");b.className="tile "+t.type+(on.has(y+","+x)?" on":"")+(t.source?" source":"")+(t.sink?" sink":"");b.style.transform="rotate("+t.rot*90+"deg)";b.onclick=()=>{if(solved)return;t.rot=(t.rot+1)%4;moves++;total++;event(run,"rotate",{level,moves});render();check()};board.append(b)});meta.textContent="BOARD "+(level+1)+"/3 // MOVES "+moves+" // TOTAL "+total;status.textContent="SOURCE ◉ // SINK ◎ // TAP A TILE TO ROTATE"}function check(){const on=powered();let sink=null;grid.flat().forEach((t,i)=>{if(t.sink)sink=[Math.floor(i/N),i%N]});if(sink&&on.has(sink.join(","))){solved=true;event(run,"board-clear",{level,moves});setTimeout(()=>{level++;if(level>=3)return end(true);moves=0;solved=false;make()},350)}}function end(win){if(win){const mastery=total<=42;if(!best||total<best){best=total;localStorage.setItem("portal-parallax-best",best)}grantArtifact(mastery?"parallax-lens":"signal-glass");finishRun(run,{result:"clear",moves:total,artifact:mastery?"parallax-lens":"signal-glass"});gate.classList.remove("hidden");gate.innerHTML='<div><div>FIELD CONNECTED</div><h1>PARALLAX</h1><p>'+(mastery?"ARTIFACT // PARALLAX LENS":"ARTIFACT // SIGNAL GLASS")+'<br>TOTAL MOVES '+total+' // BEST '+best+'</p><button onclick="location.reload()">NEW FIELD</button> <a href="../../arcade/" style="color:#eee;margin-left:12px">ARCADE</a></div>'}}start.onclick=()=>{run=beginRun("parallax");gate.classList.add("hidden");make()};</script></body></html>
