name: PORTAL Cinema catalog guard
on:
  pull_request:
    paths:
      - 'tv-cinema.html'
      - 'tv-open-library.json'
      - 'tv-cinema-device-evidence.json'
      - 'tv-cinema-classics.json'
      - 'tv-cinema-genre-goals.json'
      - 'scripts/report-cinema-genre-coverage.mjs'
      - 'scripts/audit-cinema-sources.mjs'
      - 'scripts/discover-cinema-candidates.mjs'
      - 'scripts/verify-cinema.mjs'
      - '.github/workflows/portal-cinema-guard.yml'
  push:
    branches: [main]
    paths:
      - 'tv-cinema.html'
      - 'tv-open-library.json'
      - 'tv-cinema-device-evidence.json'
      - 'tv-cinema-classics.json'
      - 'tv-cinema-genre-goals.json'
      - 'scripts/report-cinema-genre-coverage.mjs'
      - 'scripts/audit-cinema-sources.mjs'
      - 'scripts/discover-cinema-candidates.mjs'
      - 'scripts/verify-cinema.mjs'
      - '.github/workflows/portal-cinema-guard.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 12 * * *'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check admitted catalog, cinema player contract and evidence
        run: node scripts/verify-cinema.mjs
      - name: Check Wikimedia Commons movie sources (non-fatal network failures)
        run: node scripts/audit-cinema-sources.mjs
      - name: Report progress toward 100 titles per genre
        run: node scripts/report-cinema-genre-coverage.mjs
      - name: Discover future film candidates for human review
        run: node scripts/discover-cinema-candidates.mjs
      - name: Upload per-genre coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-genre-coverage
          path: cinema-genre-coverage.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish discovery queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-discovery-queue
          path: cinema-discovery-queue.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish source-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-source-audit
          path: cinema-source-audit.json
          if-no-files-found: ignore
          retention-days: 14
