<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020205"><title>RELEASE // THE PORTAL</title><script src="../world.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020205;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}.back{position:fixed;z-index:3;top:max(18px,env(safe-area-inset-top));left:18px;color:#777582;text-decoration:none;font-size:9px;letter-spacing:.18em}.head{position:fixed;z-index:2;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 42px));transform:translateX(-50%);width:min(560px,calc(100% - 40px));text-align:center;pointer-events:none}.ey{font-size:8px;letter-spacing:.3em;color:#6e6a78}.head h1{margin:10px 0 7px;font:900 clamp(36px,10vw,72px)/.8 Arial Black,sans-serif;letter-spacing:-.06em}.head p{margin:0;color:#777382;font-size:9px;line-height:1.6}.controls{position:fixed;z-index:3;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px}.btn{border:1px solid #373441;background:#08070ddd;color:#aaa5b7;padding:13px 17px;border-radius:999px;font:8px ui-monospace;letter-spacing:.15em;backdrop-filter:blur(10px)}.release{border-color:#695475;color:#d6c3df}.after{position:fixed;z-index:4;inset:0;display:none;place-items:center;text-align:center;padding:28px;background:#020205}.after.show{display:grid}.after .mark{font-size:72px;filter:drop-shadow(0 0 25px #d7b8ee88)}.after h2{font:900 clamp(44px,13vw,94px)/.8 Arial Black,sans-serif;letter-spacing:-.06em;margin:24px 0}.after p{max-width:430px;color:#797381;font-size:10px;line-height:1.9}.after a{margin-top:24px;color:#8c8193;font-size:9px;letter-spacing:.16em;text-decoration:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><canvas id="art" aria-label="Draw with light"></canvas><a class="back" href="../">← PORTAL</a><header class="head"><div class="ey">AN EPHEMERAL ROOM</div><h1>RELEASE</h1><p>Draw something you don't want to keep.<br>Your finger is light. The darkness remembers nothing.</p></header><div class="controls"><button class="btn" id="clear">BEGIN AGAIN</button><button class="btn release" id="release">LET IT GO</button></div><section class="after" id="after"><div><div class="mark">·</div><h2>IT EXISTED.</h2><p>You made something here. Portal did not upload it. Portal did not save it. You chose to let it disappear.</p><a href="../">RETURN TO THE PORTAL</a></div></section><script>
const canvas=document.querySelector("#art"),ctx=canvas.getContext("2d"),after=document.querySelector("#after");let drawing=false,last=null,marks=0,dpr=1;
function size(){const old=document.createElement("canvas");old.width=canvas.width;old.height=canvas.height;old.getContext("2d").drawImage(canvas,0,0);dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(old,0,0,old.width,old.height,0,0,innerWidth,innerHeight)}size();addEventListener("resize",size);
function point(e){return{x:e.clientX,y:e.clientY}}function start(e){drawing=true;last=point(e);canvas.setPointerCapture?.(e.pointerId)}function move(e){if(!drawing)return;const p=point(e),dx=p.x-last.x,dy=p.y-last.y,s=Math.hypot(dx,dy),h=(Date.now()/35+marks*7)%360;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="hsla("+h+",85%,75%,.72)";ctx.shadowColor="hsla("+h+",90%,70%,.8)";ctx.shadowBlur=12+Math.min(24,s);ctx.lineWidth=1.4+Math.min(5,s/8);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.quadraticCurveTo((last.x+p.x)/2,(last.y+p.y)/2,p.x,p.y);ctx.stroke();ctx.shadowBlur=0;last=p;marks++}function stop(){drawing=false;last=null}canvas.addEventListener("pointerdown",start);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",stop);canvas.addEventListener("pointercancel",stop);
document.querySelector("#clear").onclick=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);marks=0};
document.querySelector("#release").onclick=()=>{if(marks<2)return;const start=performance.now(),duration=1800;function fade(t){const q=Math.min(1,(t-start)/duration);ctx.globalCompositeOperation="destination-out";ctx.fillStyle="rgba(0,0,0,"+(0.025+q*.075)+")";ctx.fillRect(0,0,innerWidth,innerHeight);ctx.globalCompositeOperation="source-over";if(q<1)requestAnimationFrame(fade);else{ctx.clearRect(0,0,innerWidth,innerHeight);localStorage.setItem("portal-release-made","1");localStorage.setItem("portal-release-count",String(Number(localStorage.getItem("portal-release-count")||0)+1));window.PortalWorld?.event?.("release","SOMETHING BEAUTIFUL WAS MADE AND DELIBERATELY NOT KEPT.");window.PortalWorld?.save?.();after.classList.add("show")}}requestAnimationFrame(fade)};
</script><script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>
<script type="module">import{installTransitions}from"../transitions.js";installTransitions("release");</script>
</body></html>
