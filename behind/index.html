<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEHIND // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#030405;color:#aeb9c4;font-family:ui-monospace;display:grid;place-items:center;padding:24px}.shell{width:min(700px,94vw)}.ey{font-size:9px;letter-spacing:.24em;color:#59636e}h1{font:900 clamp(62px,18vw,128px)/.72 Arial Black;color:#e8edf2;letter-spacing:-.08em;margin:28px 0}.rail{border-left:1px solid #39434d;padding-left:18px}.row{padding:13px 0;border-bottom:1px solid #171d22;display:flex;justify-content:space-between;gap:18px;font-size:10px}.dim{color:#4f5962}a{color:#707b85;text-decoration:none;font-size:9px}.denied{text-align:center}.token{margin-top:20px;padding:14px 16px;border:1px solid #29333c;background:#06090c;color:#8d99a5;font:9px ui-monospace;letter-spacing:.13em;cursor:pointer}.token.live{color:#eef;border-color:#66798a;box-shadow:0 0 30px #b8dcff18}</style></head><body><main class="shell" id="shell"></main><script type="module">import{artifacts,scars,hasArtifact,grantArtifact}from"../games/state.js";const ok=hasArtifact("seam-found"),shell=document.querySelector("#shell");if(!ok){shell.className="denied";shell.innerHTML='<div class="ey">NO SERVICE COORDINATE</div><h1>WALL</h1><p class="dim">Knowing the address is not the same as finding the seam.</p><a href="../arcade/">RETURN</a>'}else{const a=artifacts(),s=scars();shell.innerHTML='<a href="../arcade/">← ARCADE</a><div class="ey" style="margin-top:36px">SERVICE LAYER // LOCAL MACHINE STATE</div><h1>BEHIND</h1><div class="rail"><div class="row"><span>ARTIFACT RECORDS</span><b>'+a.length+'</b></div><div class="row"><span>SCAR RECORDS</span><b>'+s.length+'</b></div><div class="row"><span>REPAIR</span><b>'+(hasArtifact("repair-mark")?"KNOWN":"—")+'</b></div><div class="row"><span>SIDEWAYS SCRIPT</span><b>'+(hasArtifact("sideways-script")?"KNOWN":"—")+'</b></div><div class="row"><span>BACKSTEP</span><b>'+(hasArtifact("backstep")?"KNOWN":"—")+'</b></div><div class="row"><span>WORK SURFACE</span><b id="workState" class="dim">NO INTERFACE</b></div></div><div id="tokenDock"></div><p class="dim">This is not a room. It is where rooms leave their wiring.</p>';grantArtifact("service-layer-seen");const powered=localStorage.getItem("portal-work-surface-power")==="1";const state=document.querySelector("#workState"),dock=document.querySelector("#tokenDock");if(powered){state.textContent="POWER // NO INTERFACE";state.classList.remove("dim")}else if(hasArtifact("black-token")){dock.innerHTML='<button class="token" id="seatToken">■ SEAT BLACK TOKEN</button>';seatToken.onclick=()=>{localStorage.setItem("portal-work-surface-power","1");grantArtifact("surface-powered");state.textContent="POWER // NO INTERFACE";state.classList.remove("dim");seatToken.textContent="■ TOKEN SEATED";seatToken.classList.add("live");seatToken.disabled=true;document.dispatchEvent(new CustomEvent("portal:surface-powered"))}}}</script></body></html>
