<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1 Enoch | EarthChain Living Scriptures</title><style>:root{color-scheme:dark;background:#0b0c16;color:#f1e8d6;font-family:Georgia,serif}body{margin:0}main{max-width:780px;margin:auto;padding:24px 18px 80px}a{color:#e8cd8e}h1{font-size:clamp(36px,7vw,60px);font-weight:400}p{line-height:1.65}select,button{font:16px system-ui;padding:12px;border-radius:9px;background:#252334;color:#fff;border:1px solid #8a7959}button{cursor:pointer}#text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:21px;line-height:1.85}#status{font:14px system-ui;color:#c8bca7}label{display:block;margin:20px 0 8px}nav{display:flex;gap:12px;flex-wrap:wrap}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #e8cd8e;outline-offset:3px}</style></head><body><main><a href="./scripture-reader.html">← Living Scriptures</a><h1>1 Enoch</h1><p>R. H. Charles translation (1917), Project Gutenberg #77935. This is a development reading edition, pending editorial proofreading. 1 Enoch belongs to the Ethiopian Orthodox scriptural tradition.</p><label for="chapter">Chapter</label><select id="chapter"></select><nav><button id="prev" type="button">← Previous</button><button id="next" type="button">Next →</button></nav><p id="status" role="status"></p><h2 id="heading"></h2><article id="text"></article><p><a href="https://www.gutenberg.org/ebooks/77935">Source and editorial information</a></p></main><script>
const base='./data/extra-scriptures/1-enoch/';
const select=document.getElementById('chapter'),status=document.getElementById('status'),body=document.getElementById('text'),heading=document.getElementById('heading');
for(let i=1;i<=108;i++){const o=document.createElement('option');o.value=i;o.textContent='Chapter '+i;select.append(o)}
let chapter=Math.max(1,Math.min(108,Number(new URLSearchParams(location.search).get('chapter'))||1));select.value=chapter;
async function load(){chapter=Number(select.value);heading.textContent='Chapter '+chapter;body.textContent='';status.textContent='Loading…';history.replaceState(null,'','?chapter='+chapter);try{const r=await fetch(base+String(chapter).padStart(3,'0')+'.json');if(!r.ok)throw Error('Chapter file not installed (HTTP '+r.status+')');const d=await r.json();if(d.chapter!==chapter||d.work!=='1-enoch'||!d.text)throw Error('Invalid chapter data');body.textContent=d.text;status.textContent='R. H. Charles · 1 Enoch '+chapter+' · Editorial review pending'}catch(e){status.textContent='This chapter is not yet available in PORTAL: '+e.message+'. The 108 chapter JSON files must be added from the verified import package. No placeholder scripture will be shown.'}}
select.addEventListener('change',load);document.getElementById('prev').addEventListener('click',()=>{select.value=Math.max(1,chapter-1);load()});document.getElementById('next').addEventListener('click',()=>{select.value=Math.min(108,chapter+1);load()});load();
</script></body></html>
