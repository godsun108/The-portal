<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03080a"><title>EARTH NOW — THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 15%,#09202a,#030709 48%);color:#e8fbff;font-family:ui-monospace,monospace}.back{position:fixed;z-index:5;top:18px;left:18px;color:#78959c;text-decoration:none;font-size:11px}.wrap{width:min(920px,calc(100% - 30px));margin:auto;padding:80px 0 50px}.hero{text-align:center}.earth{width:min(52vw,280px);aspect-ratio:1;border-radius:50%;margin:auto;background:radial-gradient(circle at 35% 30%,#b9f3ff 0 1%,#3285a1 2% 7%,#184b5c 8% 25%,#09212c 48%,#020709 72%);box-shadow:0 0 80px #14728a55,inset -45px -25px 70px #000;animation:float 8s ease-in-out infinite}h1{font:900 clamp(48px,13vw,100px)/.8 Arial Black,sans-serif;letter-spacing:-.06em;margin:35px 0 15px}.sub{color:#7f9ca4;font-size:10px;letter-spacing:.13em}.status{display:inline-block;margin:18px 0 36px;padding:9px 13px;border:1px solid #1d4149;border-radius:999px;color:#78c4d3;font-size:9px;letter-spacing:.12em}.dot{display:inline-block;width:6px;height:6px;background:#7ce9a2;border-radius:50%;margin-right:7px;box-shadow:0 0 9px #7ce9a2}.grid{display:grid;gap:10px}.event{border:1px solid #153039;background:#061014bb;border-radius:16px;padding:17px}.event header{display:flex;justify-content:space-between;gap:12px}.mag{font-size:20px;font-weight:bold}.place{font-size:11px;line-height:1.5;color:#c2dce1}.meta{font-size:9px;color:#66838a;margin-top:10px}.empty{text-align:center;color:#66838a;padding:30px;border:1px dashed #173039;border-radius:16px}.sources{text-align:center;color:#46636a;font-size:9px;line-height:1.8;margin-top:28px}.sources a{color:#6896a0}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.earth{animation:none}}</style></head><body><a class="back" href="../">← THE PORTAL</a><main class="wrap"><section class="hero"><div class="earth"></div><h1>EARTH<br>NOW</h1><p class="sub">IF IT GLOWS, IT HAPPENED.</p><div class="status" id="status"><span class="dot"></span>CONNECTING TO EARTH…</div></section><section id="events" class="grid" aria-live="polite"><div class="empty">LISTENING TO THE PLANET…</div></section><p class="sources">LIVE EARTHQUAKE FEED: <a href="https://earthquake.usgs.gov/" target="_blank" rel="noreferrer">USGS</a><br>Showing recent M2.5+ events. Times are reported from the source.</p></main><script>const out=document.querySelector("#events"),status=document.querySelector("#status");const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson").then(r=>{if(!r.ok)throw Error("feed");return r.json()}).then(d=>{const xs=(d.features||[]).slice(0,12);status.innerHTML='<span class="dot"></span>LIVE // '+xs.length+' RECENT SIGNALS';out.innerHTML=xs.length?xs.map(x=>{const p=x.properties||{},m=Number(p.mag);return '<article class="event"><header><span class="mag">M '+(Number.isFinite(m)?m.toFixed(1):"?")+'</span><span class="place">'+esc(p.place||"Unknown location")+'</span></header><div class="meta">'+new Date(p.time).toLocaleString()+' // USGS</div></article>'}).join(""):'<div class="empty">NO M2.5+ EVENTS IN THIS FEED WINDOW.</div>'}).catch(()=>{status.textContent="LIVE FEED UNAVAILABLE";out.innerHTML='<div class="empty">THE PLANET IS STILL THERE. THE DATA FEED IS NOT.<br>TRY AGAIN LATER.</div>'})</script></body></html>
