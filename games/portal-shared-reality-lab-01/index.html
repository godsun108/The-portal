<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PORTAL Shared Reality Lab 01</title><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#eaf6ff;font:14px ui-monospace}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.device{border:1px solid #28465b;background:#0b1722;padding:12px}.view{position:relative;aspect-ratio:4/3;background:linear-gradient(#152737,#0c1822);overflow:hidden}.anchor,.orb{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}.anchor{width:18px;height:18px;border:2px solid #8deaff;left:50%;top:68%}.orb{width:42px;height:42px;background:#d4a2ff;left:50%;top:42%;transition:.15s}.hud{display:flex;justify-content:space-between;margin-top:8px;color:#9fc0d4}.pair{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:16px 0}.qr{background:white;padding:8px;width:164px;min-height:164px;display:grid;place-items:center}.qr svg{width:148px;height:148px;display:block}.join{max-width:560px;overflow-wrap:anywhere;color:#9fc0d4}button{padding:10px 14px;background:#143049;color:white;border:1px solid #47718b;margin:4px}#state{white-space:pre-wrap;background:#08121b;padding:12px;margin-top:16px}</style></head><body><main><h1>PORTAL // SHARED REALITY LAB 01</h1><p>ROOM <strong id="room"></strong> · Three simulated devices observe one anchored spatial object from different viewpoints. Move it from any device; all views receive the same versioned world state.</p><div class="pair"><div id="qr" class="qr" aria-label="Scannable room QR"></div><div><strong>JOIN THIS ROOM</strong><div class="join" id="join"></div><div>Scan this standards-based QR to open the room join URL.</div></div></div><div class="grid" id="devices"></div><div><button id="left">MOVE OBJECT LEFT</button><button id="right">MOVE OBJECT RIGHT</button><button id="reset">RESET</button></div><div id="state"></div></main><script type="module">import{spatialAnchorConsensus,localSpatialBus,replicatedSpatialClient,createRoom,roomCoordinator,roomJoinUrl}from"../runtime/shared-spatial.js";import{beginRun,event}from"../protocol.js";const bus=localSpatialBus(),room=createRoom({code:new URLSearchParams(location.search).get("room")||"PORTAL",hostId:"phone-a"}),consensus=spatialAnchorConsensus({required:2,tolerance:.25}),run=beginRun("portal-shared-reality-lab-01");const defs=[["phone-a",-0.12],["phone-b",0.08],["phone-c",0.03]],clients=new Map(defs.map(([id])=>[id,replicatedSpatialClient({sessionId:"shared-lab-01",deviceId:id,bus})]));for(const[id,error]of defs){const coordinator=roomCoordinator({room,client:clients.get(id)});coordinator.announce(id,{kind:"phone"});consensus.observe(id,{x:error,y:0,z:0})}clients.get("phone-a").object({id:"shared-orb",position:{x:0,y:1,z:-2},owner:"world"});const session=clients.get("phone-a").session;document.querySelector("#room").textContent=room.id;const joinUrl=roomJoinUrl(room,{base:location.href});document.querySelector("#join").textContent=joinUrl;renderQR(document.querySelector("#qr"),joinUrl);async function renderQR(el,value){try{const{default:QRCode}=await import("https://cdn.jsdelivr.net/npm/qrcode-svg@1.1.0/+esm");el.innerHTML=new QRCode({content:value,padding:0,width:148,height:148,ecl:"M",join:true}).svg()}catch{el.textContent=room.id;el.style.color="#000"}}const root=document.querySelector("#devices"),state=document.querySelector("#state");for(const[id]of defs){const el=document.createElement("section");el.className="device";el.dataset.id=id;el.innerHTML='<strong>'+id.toUpperCase()+'</strong><div class="view"><div class="anchor"></div><div class="orb"></div></div><div class="hud"><span>COMMON ANCHOR</span><span class="version"></span></div>';root.append(el)}function render(){const s=session.snapshot(),o=s.objects.find(x=>x.id==="shared-orb");for(const el of root.children){const idx=defs.findIndex(x=>x[0]===el.dataset.id),perspective=(idx-1)*7;el.querySelector(".orb").style.left=(50+o.position.x*18+perspective)+"%";el.querySelector(".version").textContent="WORLD v"+o.version}state.textContent=JSON.stringify({session:s.id,players:s.players.map(p=>p.id),object:o},null,2)}function move(dx,source){const o=session.snapshot().objects.find(x=>x.id==="shared-orb");const next=clients.get(source).object({...o,position:{...o.position,x:Math.max(-1.5,Math.min(1.5,o.position.x+dx))},owner:source});event(run,"shared-object-move",{source,version:next.version,position:next.position});render()}document.querySelector("#left").onclick=()=>move(-.2,"phone-a");document.querySelector("#right").onclick=()=>move(.2,"phone-b");document.querySelector("#reset").onclick=()=>{clients.get("phone-a").object({id:"shared-orb",position:{x:0,y:1,z:-2},owner:"world"});render()};render();</script></body></html>
