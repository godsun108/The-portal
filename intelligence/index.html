<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>INTELLIGENCE // THE PORTAL</title><script src="../world.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#eee;font-family:ui-monospace,monospace}.back{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));left:18px;color:#777784;text-decoration:none;font-size:9px}.shell{height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:max(58px,calc(env(safe-area-inset-top) + 42px)) 18px max(18px,env(safe-area-inset-bottom));max-width:860px;margin:auto}.head{text-align:center}.glyph{font-size:42px;filter:drop-shadow(0 0 28px #9c8cff77)}h1{font:900 clamp(34px,9vw,70px)/.9 Arial Black,sans-serif;letter-spacing:-.055em;margin:5px}.truth{font-size:8px;letter-spacing:.16em;color:#666674}.minds{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:14px 0}.minds button{border:1px solid #292933;background:#09090d;color:#777784;border-radius:999px;padding:9px 11px;font:8px ui-monospace;letter-spacing:.08em}.minds button.on{border-color:#8174aa;color:#eee}.log{min-height:0;overflow:auto;border:1px solid #1d1d25;border-radius:18px;padding:16px;background:#08080c}.msg{max-width:82%;margin:9px 0;padding:11px 13px;border-radius:14px;font-size:11px;line-height:1.55;white-space:pre-wrap}.user{margin-left:auto;background:#171720}.ai{background:#0e0e14;border:1px solid #22222d}.system{max-width:100%;text-align:center;color:#666674;font-size:9px}.discoveries{display:flex;gap:8px;overflow-x:auto;padding:8px 0 0}.discovery{flex:0 0 auto;border:1px solid #3b3450;border-radius:999px;padding:9px 12px;color:#c8bfff;text-decoration:none;font-size:8px;letter-spacing:.08em;background:#0d0b13}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding-top:10px}.composer input{min-width:0;border:1px solid #292933;border-radius:999px;background:#09090d;color:#eee;padding:13px 16px;font:11px ui-monospace}.composer button{border:1px solid #8174aa;border-radius:999px;background:#121019;color:#ddd;padding:0 17px;font:9px ui-monospace}.composer button:disabled{opacity:.35}
.fallbacks{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0}.fallbacks a{border:1px solid #292933;border-radius:999px;padding:9px 11px;color:#9188ad;text-decoration:none;font-size:8px;letter-spacing:.08em}.proposal{margin:10px auto;max-width:90%;border:1px solid #66558c;background:#100d18;padding:12px;border-radius:14px;text-align:center}.proposal button{margin-top:8px;border:1px solid #8174aa;background:#171222;color:#eee;border-radius:999px;padding:9px 14px;font:8px ui-monospace;letter-spacing:.1em}</style><link rel="stylesheet" href="../portal-atmosphere.css"><link rel="stylesheet" href="../portal-magic.css"></head><body><a class="back" href="../stations/?s=intelligence">← INTELLIGENCE STATION</a><main class="shell"><header class="head"><div class="glyph" id="glyph">◇</div><h1>INTELLIGENCE</h1><div class="truth">NATIVE PORTAL SURFACE // NO FABRICATED REPLIES</div><div class="minds" id="minds"></div></header><section class="log" id="log"></section><div class="discoveries" id="discoveries" aria-label="Mind discoveries"></div><nav class="fallbacks" id="fallbacks" hidden><a href="../oracle/">ORACLE</a><a href="../machine/">MACHINE</a><a href="../earth/">EARTH</a><a href="../passport/">MY MEMORY</a></nav><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="ask Portal anything…" aria-label="Message"><button id="send">SEND</button></form></main><script>
let cfg,mind="portal",history=[];const log=document.querySelector("#log"),discoveries=document.querySelector("#discoveries"),input=document.querySelector("#input"),send=document.querySelector("#send"),minds=document.querySelector("#minds"),glyph=document.querySelector("#glyph");
function say(role,text){const d=document.createElement("div");d.className="msg "+role;d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight}function readJSON(key,fallback){try{const x=JSON.parse(localStorage.getItem(key)||"null");return x??fallback}catch(_){return fallback}}
function worldContext(){const travel=readJSON("portal-travel-history-v1",[]),events=readJSON("portal-world-events-v1",{history:[]}),legacy=window.PortalWorld?.state||{},discoveries=readJSON("portal-intelligence-discoveries",[]),j=window.__portalJourney?.()||null,e=window.PortalEvolution||null,rooms=j?.rooms||[...new Set((Array.isArray(travel)?travel:[]).map(x=>x.room).filter(Boolean))];return{schema:"portal.context.v3",traveler:{id:j?.traveler||localStorage.getItem("portal-passport-id")||null,firstContact:localStorage.getItem("portal-first-contact")||null,lastRoom:localStorage.getItem("portal-last-room")||null},journey:j?{rooms:j.rooms,roomCount:j.roomCount,recent:(Array.isArray(travel)?travel:[]).slice(-16),artifacts:j.artifacts,scars:j.scars,dailyCompleted:j.dailyCompleted,ageDays:j.ageDays,returnBand:j.returnBand,fork:j.fork,converged:j.converged}:{rooms,roomCount:rooms.length,recent:(Array.isArray(travel)?travel:[]).slice(-16)},evolution:e?{revision:e.revision,traits:e.traits}:null,world:{visits:j?.visits??legacy.visits??0,pressure:j?.pressure??legacy.pressure??0,inventory:j?.inventory||legacy.inventory||[],scars:j?.scars||legacy.scars||[],activeEvent:window.PortalEvents?.active||null,eventHistory:Array.isArray(events?.history)?events.history.slice(-12):[]},discoveries:Array.isArray(discoveries)?discoveries.slice(-12):[]}}
function narrateWorld(w){const n=w?.journey?.roomCount||0,last=w?.traveler?.lastRoom,ev=w?.world?.activeEvent?.id;return"PORTAL MEMORY ONLINE // "+n+" ROOM"+(n===1?"":"S")+" REMEMBERED"+(last?" // LAST: "+String(last).toUpperCase():"")+(ev?" // EVENT: "+String(ev).toUpperCase():"")}

function select(id){mind=id;const m=cfg.minds.find(x=>x.id===id)||cfg.minds[0];glyph.textContent=m.glyph;minds.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));localStorage.setItem("portal-intelligence-mind",id);say("system",m.label+" // "+m.purpose)}
function renderDiscoveries(){discoveries.innerHTML="";let ds=[];try{ds=JSON.parse(localStorage.getItem("portal-intelligence-discoveries")||"[]")}catch(_){}ds.slice(-8).reverse().forEach(x=>{const a=document.createElement("a");a.className="discovery";a.href="../"+x.destination;a.textContent="↗ "+x.label;a.title=x.reason||("discovered by "+x.mind);discoveries.append(a)})}
function renderProposal(raw){const p=validateProposal(raw);if(!p)return;const d=document.createElement("div");d.className="proposal";const title=document.createElement("div");title.textContent=(p.type+" // "+p.title).toUpperCase();const why=document.createElement("div");why.textContent=p.objective||p.reason;const b=document.createElement("button");b.type="button";b.textContent=p.type==="event"?"ACCEPT EVENT":"ENTER";b.onclick=()=>acceptProposal(p);d.append(title,why,b);log.append(d);log.scrollTop=log.scrollHeight}
function acceptDiscoveries(items){if(!cfg.discovery?.enabled||!Array.isArray(items))return;const allowed=new Set(cfg.discovery.allowed_destinations||[]),max=cfg.discovery.max_per_response||3;let ds=[];try{ds=JSON.parse(localStorage.getItem("portal-intelligence-discoveries")||"[]")}catch(_){}for(const x of items.slice(0,max)){if(x?.schema!=="portal.discovery.v1"||!allowed.has(x.destination)||typeof x.label!=="string")continue;ds.push({destination:x.destination,label:x.label.slice(0,48),reason:typeof x.reason==="string"?x.reason.slice(0,180):"",mind,at:Date.now()});say("system",mind.toUpperCase()+" DISCOVERED A PORTAL // "+x.label)}localStorage.setItem("portal-intelligence-discoveries",JSON.stringify(ds.slice(-24)));renderDiscoveries()}
function ready(){say("system",narrateWorld(worldContext()));const live=cfg.endpoint&&cfg.mode==="live";send.disabled=!live;if(!live){say("system","THE MIND HAS A BODY BUT NO ENGINE YET. PORTAL WILL NOT PRETEND TO ANSWER.");document.querySelector("#fallbacks").hidden=false;say("system","OTHER INSTRUMENTS ARE AVAILABLE BELOW.")}}
fetch("config.json").then(r=>r.json()).then(c=>{if(c.schema!=="portal.intelligence.v1")throw 0;cfg=c;c.minds.forEach(m=>{const b=document.createElement("button");b.type="button";b.dataset.id=m.id;b.textContent=m.glyph+" "+m.label;b.onclick=()=>select(m.id);minds.append(b)});select(localStorage.getItem("portal-intelligence-mind")||"portal");renderDiscoveries();ready();localStorage.setItem("portal-intelligence","1")}).catch(()=>say("system","INTELLIGENCE REGISTRY UNAVAILABLE."));
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||!cfg?.endpoint)return;input.value="";say("user",text);history.push({role:"user",content:text});send.disabled=true;try{const legacy=window.PortalWorld?.state||{};const world=worldContext();world.legacy={visits:legacy.visits,pressure:legacy.pressure,inventory:legacy.inventory,scars:legacy.scars};const r=await fetch(cfg.endpoint,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({schema:"portal.chat.v1",mind,messages:history.slice(-20),world})});const d=await r.json();if(!r.ok||d.schema!=="portal.chat.v1"||d.verified!==true||typeof d.message?.content!=="string"||!d.message.content.trim())throw 0;history.push({role:"assistant",content:d.message.content});say("ai",d.message.content);acceptDiscoveries(d.discoveries);renderProposal(d.proposal);localStorage.setItem("portal-intelligence-spoke","1")}catch(_){say("system","NO VERIFIED INTELLIGENCE RESPONSE RETURNED.")}finally{send.disabled=!(cfg.endpoint&&cfg.mode==="live")}};
</script><script type="module">import{journey}from"../journey.js";window.__portalJourney=journey;</script>
<script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>

<script type="module">import{installTransitions}from"../transitions.js";installTransitions("intelligence");</script>
</body></html>
