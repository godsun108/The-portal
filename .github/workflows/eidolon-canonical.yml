name: EIDOLON Canonical Mesh Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_eidolon_canonical.py'
      - 'scripts/build_eidolon_rigged.py'
      - 'scripts/build_eidolon_rigged_v2.py'
      - 'scripts/build_eidolon_rigged_v3.py'
      - '.github/workflows/eidolon-canonical.yml'
permissions:
  contents: write
concurrency:
  group: eidolon-canonical-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic mesh dependencies
        run: python -m pip install "numpy==2.3.5" "scikit-image==0.26.0"
      - name: Reconstruct and verify canonical actor
        run: python scripts/build_eidolon_canonical.py
      - name: Build experimental 17-joint actor and two clips
        run: python scripts/build_eidolon_rigged.py
      - name: Build experimental deformation v2
        run: python scripts/build_eidolon_rigged_v2.py
      - name: Build adjacency-smoothed V3 rig
        run: python scripts/build_eidolon_rigged_v3.py
      - name: Archive GLB and manifest
        uses: actions/upload-artifact@v4
        with:
          name: eidolon-human-v1-canonical
          path: |
            eidolon-canonical/assets/eidolon-human-v1-canonical.glb
            eidolon-canonical/assets/manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-experimental.glb
            eidolon-canonical/assets/rig-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v2-experimental.glb
            eidolon-canonical/assets/rig-v2-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v3-experimental.glb
            eidolon-canonical/assets/rig-v3-manifest.json
      - name: Publish static assets for iPhone viewer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eidolon-canonical/assets/eidolon-human-v1-canonical.glb eidolon-canonical/assets/manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-experimental.glb eidolon-canonical/assets/rig-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v2-experimental.glb eidolon-canonical/assets/rig-v2-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v3-experimental.glb eidolon-canonical/assets/rig-v3-manifest.json
          if git diff --cached --quiet; then
            echo "Canonical assets unchanged."
          else
            git commit -m "build: publish verified EIDOLON Human v1 canonical GLB"
            git push
          fi
