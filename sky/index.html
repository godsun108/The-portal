<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03040a"><title>SKY // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 30%,#111638,#020309 65%);color:#eef0ff;font-family:ui-monospace,monospace;display:grid;place-items:center;padding:28px}.back{position:absolute;top:22px;left:22px;color:#555d80;text-decoration:none;font-size:9px}.s{text-align:center;max-width:650px}.moon{font-size:clamp(110px,34vw,220px);line-height:1}.eye{font-size:9px;letter-spacing:.3em;color:#687096}h1{font:900 clamp(55px,16vw,110px)/.8 Arial Black,sans-serif}.meta{color:#7980a0;font-size:10px;line-height:2}.go{margin:18px 4px 0;border:1px solid #30395d;background:#050716;color:#9ca6d5;padding:12px 16px;border-radius:999px;font:9px ui-monospace}.stars{margin-top:18px;color:#5f688c;font-size:9px;line-height:1.8}.time-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.go{min-height:44px;cursor:pointer}@media(max-width:600px){body{padding:20px}.back{top:max(16px,env(safe-area-inset-top));left:18px}.moon{font-size:clamp(104px,40vw,180px)}h1{margin:16px 0 24px}.time-controls{display:grid;grid-template-columns:1fr 1fr 1fr}.go{margin:8px 0 0}}</style></head><body><a class="back" href="../">← PORTAL</a><main class="s"><div class="eye">LOCAL CLOCK ASTRONOMY // APPROXIMATE</div><div class="moon" id="moon"></div><h1>SKY</h1><div class="meta" id="meta"></div><div class="time-controls"><button class="go" id="past">− 1 DAY</button><button class="go" id="now">NOW</button><button class="go" id="future">+ 1 DAY</button></div><div class="stars" id="stars">TOUCH TIME TO WATCH THE MOON CHANGE.</div></main><script>let offset=0;const syn=29.53058867,known=Date.UTC(2000,0,6,18,14),icons=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"],names=["NEW MOON","WAXING CRESCENT","FIRST QUARTER","WAXING GIBBOUS","FULL MOON","WANING GIBBOUS","LAST QUARTER","WANING CRESCENT"];function render(){const t=Date.now()+offset*86400000,age=((t-known)/86400000%syn+syn)%syn,phase=age/syn;const i=Math.floor((phase*8+.5)%8);moon.textContent=icons[i];meta.innerHTML=names[i]+"<br>MOON AGE ≈ "+age.toFixed(1)+" DAYS<br>YOUR LOCAL CLOCK // "+new Date(t).toLocaleDateString()+"<br><br>No location permission required.";stars.textContent=offset?"VIEWING "+(offset>0?"+":"")+offset+" DAYS FROM NOW // APPROXIMATE LUNAR PHASE":"LOCAL CLOCK // APPROXIMATE LUNAR PHASE";localStorage.setItem("portal-sky","1")}past.onclick=()=>{offset--;render()};future.onclick=()=>{offset++;render()};now.onclick=()=>{offset=0;render()};render();</script><script src="../station-nav.js"></script></body></html>
<script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>
