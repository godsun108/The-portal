name: PORTAL TV sports health review
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - 'tv-sports-health-probe.cjs'
      - '.github/workflows/tv-sports-health.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check tv-sports-health-probe.cjs
      - name: Check sports stream manifests
        run: node tv-sports-health-probe.cjs
      - name: Validate health report invariants
        run: |
          node -e "const r=require('./tv-sports-health.json');if(r.schema!=='portal.tv.health.v1'||r.counts.tested!==14||r.items.length!==14||r.items.some(x=>x.admitted!==false||x.rightsStatus!=='unverified'))process.exit(1);console.log('Report schema and non-admission assertions passed')"
      - name: Archive report
        uses: actions/upload-artifact@v4
        with:
          name: portal-tv-sports-health
          path: tv-sports-health.json
          retention-days: 14
