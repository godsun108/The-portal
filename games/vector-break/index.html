<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VECTOR//BREAK</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020305;color:#eef;font-family:ui-monospace}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;left:16px;top:14px;z-index:2;font-size:10px;letter-spacing:.12em;line-height:1.8}.back{position:fixed;right:16px;top:14px;z-index:3;color:#78808c;text-decoration:none;font-size:9px}.gate{position:fixed;inset:0;z-index:8;background:#020305ee;display:grid;place-items:center;text-align:center;padding:24px}.gate h1{font:900 clamp(50px,14vw,100px)/.78 Arial Black;letter-spacing:-.07em;margin:16px}.gate p{color:#7c8490;line-height:1.8}.gate button{padding:14px 22px;border:1px solid #718095;background:#080b10;color:#eef;border-radius:999px;font:10px ui-monospace;letter-spacing:.14em}.hidden{display:none}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud"></div><a class="back" href="../../arcade/">ARCADE ↑</a><div class="gate" id="gate"><div><div>ARCADE // ACTION CABINET</div><h1>VECTOR//<br>BREAK</h1><p>MOVE WITH WASD / ARROWS OR DRAG.<br>AIM WITH POINTER. FIRE AUTOMATICALLY.<br>BREAK THE FIELD BEFORE IT CLOSES.<br>CLEAR 7 WAVES. FINISH WITH 3+ LIVES AND 1800+ SCORE FOR VECTOR CORE.</p><button id="start">BREAK IN</button></div></div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{physicsState}from"../../physics.js";import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();const cv=c,x=cv.getContext("2d"),P=physicsState();let W,H,run,player,shots=[],blocks=[],sparks=[],keys={},pointer={x:.7,y:.5},wave=1,score=0,combo=1,lives=4,lastShot=0,lastHit=0,ended=false,best=Number(localStorage.getItem("portal-vector-break-best")||0);function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);cv.addEventListener("pointermove",e=>{pointer.x=e.clientX/innerWidth;pointer.y=e.clientY/innerHeight;if(e.pointerType==="touch"){player.x=pointer.x*W;player.y=pointer.y*H}});function spawnWave(){blocks=[];for(let i=0;i<5+wave*2;i++){let s=(22+Math.random()*24)*devicePixelRatio;blocks.push({x:Math.random()*(W-s),y:Math.random()*(H-s),w:s,h:s,hp:1+Math.floor(wave/2),vx:(Math.random()-.5)*(20+wave*5)*devicePixelRatio,vy:(Math.random()-.5)*(20+wave*5)*devicePixelRatio})}event(run,"wave",{wave})}function shoot(ms){if(ms-lastShot<115)return;lastShot=ms;let dx=pointer.x*W-player.x,dy=pointer.y*H-player.y,d=Math.hypot(dx,dy)||1;shots.push({x:player.x,y:player.y,vx:dx/d*620*devicePixelRatio,vy:dy/d*620*devicePixelRatio})}function hitPlayer(ms){if(ms-lastHit<900)return;lastHit=ms;lives--;combo=1;event(run,"impact",{wave,lives});if(lives<=0)end(false)}function end(win){ended=true;best=Math.max(best,score);localStorage.setItem("portal-vector-break-best",best);if(win){const clean=lives>=3&&score>=1800;grantArtifact(clean?"vector-core":"broken-vector");finishRun(run,{result:"clear",score,lives,artifact:clean?"vector-core":"broken-vector",physics:P.mode})}else{scar("vector-burn");finishRun(run,{result:"lost",score,wave,scar:"vector-burn",physics:P.mode})}gate.classList.remove("hidden");gate.innerHTML='<div><div>VECTOR//BREAK</div><h1>'+(win?"FIELD<br>OPEN":"VECTOR<br>LOST")+'</h1><p>SCORE '+score+' // LIVES '+lives+'<br>'+(win?(lives>=3&&score>=1800?"ARTIFACT // VECTOR CORE":"ARTIFACT // BROKEN VECTOR"):"SCAR // VECTOR BURN")+'</p><button onclick="location.reload()">AGAIN</button></div>'}let last=0;function frame(ms){if(ended)return;let dt=Math.min(.03,(ms-last)/1000||.016);last=ms;let vx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),d=Math.hypot(vx,vy)||1;player.x=Math.max(10,Math.min(W-10,player.x+vx/d*250*devicePixelRatio*dt));player.y=Math.max(10,Math.min(H-10,player.y+vy/d*250*devicePixelRatio*dt));shoot(ms);shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt});shots=shots.filter(s=>s.x>-20&&s.y>-20&&s.x<W+20&&s.y<H+20);for(const b of blocks){b.x+=b.vx*dt;b.y+=b.vy*dt;if(P.mode==="converged"){b.vx+=Math.sin(ms*.001+b.y*.001)*2;b.vy+=Math.cos(ms*.001+b.x*.001)*2}if(b.x<0||b.x+b.w>W)b.vx*=-1;if(b.y<0||b.y+b.h>H)b.vy*=-1;if(player.x>b.x&&player.x<b.x+b.w&&player.y>b.y&&player.y<b.y+b.h)hitPlayer(ms);for(const s of shots)if(s.x>b.x&&s.x<b.x+b.w&&s.y>b.y&&s.y<b.y+b.h&&!s.dead){s.dead=true;b.hp--;if(b.hp<=0&&!b.dead){b.dead=true;score+=Math.round(20*combo);combo=Math.min(5,combo+.2);for(let k=0;k<8;k++)sparks.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,l:1})}}}shots=shots.filter(s=>!s.dead);blocks=blocks.filter(b=>!b.dead);sparks.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt*2});sparks=sparks.filter(s=>s.l>0);if(!blocks.length){wave++;if(wave>7)return end(true);spawnWave()}x.fillStyle="#020305";x.fillRect(0,0,W,H);x.strokeStyle="#17202b";for(let i=0;i<12;i++){x.beginPath();x.moveTo(0,i*H/12);x.lineTo(W,i*H/12);x.stroke()}for(const b of blocks){x.strokeStyle="#9db3cc";x.strokeRect(b.x,b.y,b.w,b.h);x.fillStyle="#111923";x.fillRect(b.x+3,b.y+3,b.w-6,b.h-6)}x.fillStyle="#fff";for(const s of shots)x.fillRect(s.x-2,s.y-2,4,4);for(const s of sparks){x.globalAlpha=s.l;x.fillRect(s.x,s.y,3,3)}x.globalAlpha=1;x.beginPath();x.arc(player.x,player.y,8*devicePixelRatio,0,7);x.fill();hud.textContent="WAVE "+wave+"/7 // SCORE "+score+" // COMBO x"+combo.toFixed(1)+" // LIVES "+lives+" // "+P.mode.toUpperCase();requestAnimationFrame(frame)}start.onclick=()=>{run=beginRun("vector-break");player={x:W/2,y:H*.7};gate.classList.add("hidden");spawnWave();requestAnimationFrame(frame)};</script></body></html>
