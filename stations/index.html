<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>STATIONS // THE PORTAL</title><script src="../world.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#eee;font-family:ui-monospace,monospace}.back{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));left:18px;color:#686875;text-decoration:none;font-size:9px}.shell{height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:max(58px,calc(env(safe-area-inset-top) + 42px)) 18px max(20px,env(safe-area-inset-bottom));text-align:center}.ey{font-size:8px;letter-spacing:.32em;color:#666674}.stage{display:grid;place-items:center;min-height:0}.station{width:min(620px,92vw)}.glyph{font-size:clamp(76px,24vw,150px);filter:drop-shadow(0 0 35px #8070b444)}h1{font:900 clamp(48px,14vw,100px)/.8 Arial Black,sans-serif;letter-spacing:-.06em;margin:12px 0}.line{color:#7d7d89;font-size:9px;letter-spacing:.12em}.rooms{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:28px}.rooms a,.rooms button{border:1px solid #2b2b35;background:#0b0b10;color:#aaa;border-radius:999px;padding:12px 15px;text-decoration:none;font:8px ui-monospace;letter-spacing:.12em}.dormant{color:#555}.nav{display:flex;justify-content:center;align-items:center;gap:16px}.nav button{width:52px;height:52px;border-radius:50%;border:1px solid #292933;background:#09090d;color:#999;font-size:18px}.dots{font-size:8px;color:#555;letter-spacing:.3em}@media(prefers-reduced-motion:no-preference){.station{animation:arrive .45s ease}@keyframes arrive{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}}</style></head><body><a class="back" href="../">← PORTAL</a><main class="shell"><div class="ey">PORTAL TRANSIT // SWIPE OR USE ARROWS</div><section class="stage"><div class="station" id="station"></div></section><nav class="nav"><button id="prev" aria-label="Previous station">←</button><span class="dots" id="dots"></span><button id="next" aria-label="Next station">→</button></nav></main><script>
let stations=[],i=0,touch=null;const el=document.querySelector("#station"),dots=document.querySelector("#dots");function render(){const s=stations[i],dormant=s.status==="dormant";el.innerHTML='<div class="glyph">'+s.glyph+'</div><h1>'+s.label+'</h1><div class="line">'+s.line+'</div><div class="rooms">'+(dormant?'<span class="dormant">NO VERIFIED INTELLIGENCE ENDPOINT YET.</span>':s.rooms.map(r=>r[1]==="#chaos"?'<a href="../#chaos">'+r[0]+'</a>':'<a href="../'+r[1]+'">'+r[0]+'</a>').join(""))+'</div>';dots.textContent=stations.map((_,n)=>n===i?"●":"·").join(" ");localStorage.setItem("portal-station-last",s.id)}function move(n){i=(i+n+stations.length)%stations.length;render()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});addEventListener("pointerdown",e=>touch=e.clientX);addEventListener("pointerup",e=>{if(touch===null)return;const d=e.clientX-touch;if(Math.abs(d)>45)move(d<0?1:-1);touch=null});fetch("../stations.json").then(r=>r.json()).then(d=>{if(d.schema!=="portal.stations.v1")throw 0;stations=d.stations;const secrets=secretRoutes();if(secrets.length)stations.push({id:"secret",label:"SECRET",glyph:"⌁",line:"this station did not exist for you before",rooms:secrets.map(x=>[x.label,x.href])});const wanted=new URLSearchParams(location.search).get("s")||localStorage.getItem("portal-station-last"),found=stations.findIndex(s=>s.id===wanted);i=found>=0?found:0;render()}).catch(()=>{el.innerHTML='<h1>NO LINE.</h1><div class="line">THE STATION MAP COULD NOT BE VERIFIED.</div>'});
</script></body></html>
<script type="module">import{installPhysics}from"../physics.js";const p=installPhysics();if(p.mode==="converged"){const target=document.querySelector("main,.shell,.stage,canvas");if(target)target.setAttribute("data-portal-depth","");}</script>
