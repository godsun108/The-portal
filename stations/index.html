<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>STATIONS // THE PORTAL</title><script src="../world.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050507;color:#eee;font-family:ui-monospace,monospace}body{min-height:100svh;overflow-x:hidden}.back{position:fixed;z-index:20;top:max(18px,env(safe-area-inset-top));left:18px;color:#777784;text-decoration:none;font-size:9px;letter-spacing:.12em}.shell{min-height:100svh;padding:max(66px,calc(env(safe-area-inset-top) + 48px)) 18px max(32px,env(safe-area-inset-bottom));width:min(1000px,100%);margin:auto}.head{text-align:center;margin-bottom:28px}.ey{font-size:8px;letter-spacing:.32em;color:#6f6f7d}.head h1{font:900 clamp(42px,10vw,78px)/.85 Arial Black,sans-serif;letter-spacing:-.055em;margin:10px 0}.head p{color:#7e7e8c;font-size:9px;letter-spacing:.08em;line-height:1.7;margin:0}.station-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.station-card{appearance:none;text-align:left;border:1px solid #292934;background:linear-gradient(145deg,#0b0b10,#07070a);color:#ddd;border-radius:18px;min-height:150px;padding:20px;cursor:pointer;position:relative;overflow:hidden}.station-card:after{content:"→";position:absolute;right:18px;bottom:17px;color:#565665}.station-card:hover,.station-card:focus-visible{border-color:#766b92;background:#101017;outline:none}.station-card .glyph{display:block;font-size:38px;margin-bottom:18px;filter:drop-shadow(0 0 18px #8070b444)}.station-card strong{display:block;font:900 23px Arial Black,sans-serif;letter-spacing:-.035em}.station-card small{display:block;color:#777785;font-size:8px;line-height:1.55;letter-spacing:.06em;margin-top:7px;max-width:34em}.station-card b{display:block;color:#555562;font-size:7px;letter-spacing:.15em;margin-top:13px}.detail{max-width:760px;margin:auto}.detail-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.station-back{border:1px solid #2c2c37;background:#09090d;color:#aaaab5;border-radius:999px;padding:11px 15px;font:8px ui-monospace;letter-spacing:.12em;cursor:pointer}.detail-mark{font-size:8px;letter-spacing:.2em;color:#666674}.detail-hero{text-align:center;margin:4vh auto 30px}.detail-hero .glyph{font-size:clamp(62px,18vw,110px);filter:drop-shadow(0 0 30px #8070b444)}.detail-hero h2{font:900 clamp(48px,12vw,88px)/.85 Arial Black,sans-serif;letter-spacing:-.06em;margin:12px 0}.detail-hero p{color:#888895;font-size:9px;letter-spacing:.08em;line-height:1.7}.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.rooms a{min-height:64px;border:1px solid #30303b;background:#0a0a0f;color:#c8c8d0;border-radius:14px;padding:16px;text-decoration:none;font:9px ui-monospace;letter-spacing:.12em;display:flex;align-items:center;justify-content:space-between}.rooms a:after{content:"→";color:#555563}.rooms a:hover,.rooms a:focus-visible{border-color:#766b92;color:#fff;background:#111019;outline:none}.dormant{color:#666;text-align:center;display:block;padding:30px}.hidden{display:none!important}@media(max-width:620px){.shell{padding-left:14px;padding-right:14px}.station-grid{grid-template-columns:1fr 1fr;gap:9px}.station-card{min-height:135px;padding:16px;border-radius:15px}.station-card .glyph{font-size:31px;margin-bottom:15px}.station-card strong{font-size:18px}.station-card small{font-size:7px}.rooms{grid-template-columns:1fr}.rooms a{min-height:58px}.detail-hero{margin-top:2vh}}@media(max-width:360px){.station-grid{grid-template-columns:1fr}.station-card{min-height:120px}}@media(prefers-reduced-motion:no-preference){.station-grid,.detail{animation:arrive .35s ease}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style><link rel="stylesheet" href="../portal-atmosphere.css"><link rel="stylesheet" href="../portal-magic.css"></head>
<body><a class="back" href="../">← PORTAL</a><main class="shell">
<section id="directory"><header class="head"><div class="ey">THE PORTAL NETWORK</div><h1>STATIONS</h1><p>Choose a station.<br>Then choose where you want to go.</p></header><div class="station-grid" id="stationGrid" aria-label="Portal stations"></div></section>
<section id="detail" class="detail hidden" aria-live="polite"><div class="detail-top"><button class="station-back" id="stationBack" type="button">← ALL STATIONS</button><span class="detail-mark">SELECT A DOOR</span></div><div id="stationDetail"></div></section>
</main>
<script>
let stations=[];const directory=document.querySelector("#directory"),detail=document.querySelector("#detail"),grid=document.querySelector("#stationGrid"),stationDetail=document.querySelector("#stationDetail");
function roomHref(path){return path==="#chaos"?"../#chaos":"../"+path}
function showDirectory(push=true){detail.classList.add("hidden");directory.classList.remove("hidden");if(push)history.pushState({view:"stations"},"",location.pathname);scrollTo(0,0)}
function openStation(id,push=true){const s=stations.find(x=>x.id===id);if(!s)return;directory.classList.add("hidden");detail.classList.remove("hidden");const dormant=s.status==="dormant";stationDetail.innerHTML='<div class="detail-hero"><div class="glyph">'+s.glyph+'</div><h2>'+s.label+'</h2><p>'+s.line+'</p></div><div class="rooms">'+(dormant?'<span class="dormant">NO VERIFIED ENDPOINT YET.</span>':s.rooms.map(r=>'<a href="'+roomHref(r[1])+'"><span>'+r[0]+'</span></a>').join(""))+'</div>';localStorage.setItem("portal-station-last",s.id);if(push)history.pushState({station:s.id},"","?s="+encodeURIComponent(s.id));scrollTo(0,0)}
function renderGrid(){grid.innerHTML=stations.map(s=>'<button class="station-card" type="button" data-id="'+s.id+'"><span class="glyph">'+s.glyph+'</span><strong>'+s.label+'</strong><small>'+s.line+'</small><b>'+s.rooms.length+' DOOR'+(s.rooms.length===1?"":"S")+'</b></button>').join("");grid.querySelectorAll(".station-card").forEach(b=>b.onclick=()=>openStation(b.dataset.id))}
document.querySelector("#stationBack").onclick=()=>showDirectory();
addEventListener("popstate",()=>{const wanted=new URLSearchParams(location.search).get("s");wanted?openStation(wanted,false):showDirectory(false)});
fetch("../stations.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{if(d.schema!=="portal.stations.v1")throw 0;stations=d.stations;const secrets=typeof secretRoutes==="function"?secretRoutes():[];if(secrets.length)stations.push({id:"secret",label:"SECRET",glyph:"⌁",line:"this station did not exist for you before",rooms:secrets.map(x=>[x.label,x.href])});renderGrid();const wanted=new URLSearchParams(location.search).get("s");if(wanted)openStation(wanted,false)}).catch(()=>{grid.innerHTML='<div class="dormant">THE STATION MAP COULD NOT BE VERIFIED.</div>'});
</script>
<script type="module">import{installPhysics}from"../physics.js";const p=installPhysics();if(p.mode==="converged"){const target=document.querySelector("main,.shell,.stage,canvas");if(target)target.setAttribute("data-portal-depth","");}</script>
<script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>
<script type="module">import{installTransitions}from"../transitions.js";installTransitions("stations");</script>
</body></html>
