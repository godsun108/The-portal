<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>THE FIFTH MACHINE</title><link rel="stylesheet" href="../../portal-atmosphere.css"><link rel="stylesheet" href="../../portal-magic.css"><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#000;color:#eee;font-family:ui-monospace}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:3;inset:15px 18px auto;display:flex;justify-content:space-between;font-size:10px}.screen{position:fixed;z-index:8;inset:0;display:grid;place-items:center;text-align:center;background:#000e;padding:24px}.hide{display:none}h1{font:900 clamp(50px,16vw,120px)/.75 Arial Black;letter-spacing:-.08em;margin:10px}.sigils{font-size:24px;letter-spacing:.35em}.hint{color:#777;max-width:470px;line-height:1.8;margin:20px auto}button,a{border:1px solid #ffffff35;background:#08080c;color:#eee;border-radius:999px;padding:13px 18px;font:10px ui-monospace;text-decoration:none}</style></head><body><canvas id="c"></canvas><div class="hud"><span id="score">DEPTH 000</span><span id="life">◇◇◇</span></div><section class="screen" id="gate"><div><div>BACK WALL // CABINET ?</div><h1>THE FIFTH<br>MACHINE</h1><div class="sigils" id="sigils"></div><p class="hint" id="status"></p><p class="hint" id="rule"></p><button id="go" class="hide">POWER ON</button> <a href="../../arcade/">ARCADE</a></div></section><section class="screen hide" id="over"><div><div>THE MACHINE CLOSES</div><h1 id="final">000</h1><p class="hint" id="result"></p><button id="again">AGAIN</button> <a href="../../arcade/">ARCADE</a></div></section><script type="module">import{masteryState}from"../../arcade/mastery.js";import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{installTravelerHUD}from"../../traveler-hud.js";import{installTransitions}from"../../transitions.js";installTravelerHUD();installTransitions("fifth-machine");const ms=masteryState(),cv=document.querySelector("#c"),x=cv.getContext("2d");sigils.textContent=ms.required.map(id=>ms.have.includes(id)?"◆":"◇").join(" ");status.textContent=ms.complete?"FIVE SIGNALS PRESENT. THE MACHINE RECOGNIZES THE CIRCUIT.":ms.have.length+" / 5 SIGNALS PRESENT // MISSING: "+ms.missing.map(x=>x.toUpperCase()).join(" · ");document.querySelector("#rule").textContent=ms.complete?"MOVE THE SIGNAL. WHITE ORBS ADD DEPTH. DARK ORBS COST A LIFE. REACH DEPTH 1200.":"MASTER THE FIVE POWER CABINETS TO WAKE THIS MACHINE.";if(ms.complete)go.classList.remove("hide");let w,h,dpr,p,orbs,depth,lives,playing,last,run,best=Number(localStorage.getItem("portal-fifth-machine-best")||0);function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener("resize",size);function start(){if(!masteryState().complete)return;p={x:w/2,y:h*.78};orbs=[];depth=0;lives=3;last=performance.now();run=beginRun("fifth-machine");playing=true;gate.classList.add("hide");over.classList.add("hide");requestAnimationFrame(loop)}function loop(t){if(!playing)return;const dt=Math.min(2,(t-last)/16.67);last=t;depth+=dt;if(Math.random()<.035+Math.min(.08,depth/12000))orbs.push({x:Math.random()*w,y:-20,r:7+Math.random()*18,v:2.5+Math.random()*4,kind:Math.random()<.18?"light":"dark"});x.clearRect(0,0,w,h);for(const o of orbs){o.y+=o.v*dt;x.strokeStyle=o.kind==="light"?"#fff":"#956cff88";x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.stroke();if(Math.hypot(o.x-p.x,o.y-p.y)<o.r+8){o.y=h+100;if(o.kind==="light"){depth+=90;event(run,"light",{depth:Math.floor(depth)})}else{lives--;event(run,"impact",{depth:Math.floor(depth)});if(lives<=0)return end()}}}orbs=orbs.filter(o=>o.y<h+40);x.fillStyle="#fff";x.beginPath();x.arc(p.x,p.y,7,0,7);x.fill();score.textContent="DEPTH "+String(Math.floor(depth)).padStart(3,"0");life.textContent="◇".repeat(lives);if(depth>=1200)return end(true);requestAnimationFrame(loop)}function end(clear=false){playing=false;const d=Math.floor(depth);best=Math.max(best,d);localStorage.setItem("portal-fifth-machine-best",best);let r=null;if(clear){r="arcade-singularity";grantArtifact(r)}else scar("fifth-machine-mark");finishRun(run,{depth:d,clear,reward:r,mastery:ms.have});final.textContent=String(d).padStart(3,"0");result.textContent=(clear?"ARTIFACT // ARCADE SINGULARITY":"THE MACHINE HAS RECORDED YOUR DEPTH.")+" // BEST "+best;over.classList.remove("hide")}function point(e){p.x=e.clientX;p.y=e.clientY}cv.addEventListener("pointermove",e=>{if(playing)point(e)});cv.addEventListener("pointerdown",e=>{if(playing)point(e)});go.onclick=start;again.onclick=start;</script></body></html>
