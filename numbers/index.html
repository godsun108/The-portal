<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030403"><title>NUMBERS STATION // THE PORTAL</title><script src="../world.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020302;color:#c8d5c8;font-family:ui-monospace,monospace}body{min-height:100svh;display:grid;place-items:center;padding:28px;overflow:hidden}.back{position:fixed;top:max(20px,env(safe-area-inset-top));left:20px;color:#4d5d4d;text-decoration:none;font-size:9px;letter-spacing:.14em}.noise{position:fixed;inset:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 4px);animation:scan 8s linear infinite}.x{text-align:center;width:min(700px,100%);position:relative}.eye{font-size:8px;letter-spacing:.34em;color:#536753}.dial{font:900 clamp(62px,20vw,140px)/.8 Arial Black,sans-serif;letter-spacing:-.07em;margin:25px 0 12px;color:#e1eadf;text-shadow:0 0 25px #b9ffb930}.freq{font-size:10px;letter-spacing:.28em;color:#647b64}.message{margin:38px auto;min-height:110px;font-size:clamp(14px,4vw,23px);line-height:2;letter-spacing:.2em;word-spacing:.5em;color:#aebdae}.go{border:1px solid #2d3c2d;background:#050805;color:#91a491;border-radius:999px;padding:13px 19px;font:8px ui-monospace;letter-spacing:.17em}.meta{margin-top:25px;color:#435143;font-size:8px;line-height:1.8;letter-spacing:.08em}@keyframes scan{to{transform:translateY(12px)}}@media(prefers-reduced-motion:reduce){.noise{animation:none}}</style></head><body><div class="noise"></div><a class="back" href="../stations/?s=world">← WORLD</a><main class="x"><div class="eye">LOCAL RECEIVER // NO EXTERNAL BROADCAST CLAIMED</div><div class="dial">██.█</div><div class="freq">UNASSIGNED FREQUENCY</div><div class="message" id="message"></div><button class="go" id="tune">RETUNE</button><div class="meta" id="meta"></div></main><script>
const key="portal-numbers-seed";let seed=Number(localStorage.getItem(key));if(!seed){const id=localStorage.getItem("portal-passport-id")||String(Date.now());seed=[...id].reduce((a,c)=>(a*33+c.charCodeAt(0))>>>0,5381)||1;localStorage.setItem(key,String(seed))}
let turn=Number(localStorage.getItem("portal-numbers-turn")||0);function rng(n){let x=(seed+n*2654435761)>>>0;x^=x<<13;x^=x>>>17;x^=x<<5;return x>>>0}
function transmission(){turn++;localStorage.setItem("portal-numbers-turn",turn);const n=rng(turn),groups=[];for(let i=0;i<7;i++)groups.push(String((rng(turn*11+i)%100000)).padStart(5,"0"));message.textContent=groups.join("  ");const W=window.PortalWorld?.state,pressure=W?.pressure||0;meta.textContent="TRANSMISSION "+String(turn).padStart(3,"0")+" // WORLD PRESSURE "+pressure+" // GENERATED FROM THIS TRAVELER'S LOCAL STATE";localStorage.setItem("portal-numbers","1");localStorage.setItem("portal-numbers-last",JSON.stringify({turn,code:groups.join("-"),t:Date.now()}));if(turn===3)localStorage.setItem("portal-numbers-three","1")}
tune.onclick=transmission;transmission();
</script><script type="module">import{installTravelerHUD}from"../traveler-hud.js";import{installTransitions}from"../transitions.js";installTravelerHUD();installTransitions("numbers");</script></body></html>
