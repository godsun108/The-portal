<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09060d"><title>ORACLE // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 30%,#281337,#060508 60%);color:#f6efff;font-family:ui-monospace,monospace;display:grid;place-items:center;padding:28px}.back{position:absolute;top:20px;left:20px;color:#76657e;text-decoration:none;font-size:9px}.wrap{text-align:center;width:min(680px,100%)}.orb{width:min(48vw,250px);aspect-ratio:1;border-radius:50%;margin:auto;display:grid;place-items:center;border:1px solid #8b5bab55;background:radial-gradient(circle at 38% 32%,#c988ed55,#321543 35%,#08050b 72%);box-shadow:0 0 100px #853eac33;font-size:70px}.eye{font-size:9px;letter-spacing:.3em;color:#7d6888;margin-top:24px}h1{font:900 clamp(55px,15vw,110px)/.8 Arial Black,sans-serif;letter-spacing:-.06em;margin:14px 0}.lab{margin-top:28px;border:1px solid #34243d;border-radius:18px;padding:20px;background:#0a070d}.question{width:100%;background:#0d0911;border:1px solid #3d2b47;color:#d8c7df;padding:14px;border-radius:10px;font:11px ui-monospace;margin-bottom:18px}.row{display:flex;justify-content:space-between;color:#927f9b;font-size:9px}.range{width:100%;margin:20px 0}.btn{border:1px solid #654576;background:#160d1c;color:#d2b9df;padding:12px 18px;border-radius:999px;font:9px ui-monospace;letter-spacing:.12em;margin:5px}.receipt{color:#7c6985;font-size:9px;line-height:1.8;min-height:35px;margin-top:16px}.resolve{display:none}.history{text-align:left;margin-top:20px;border-top:1px solid #291d30;padding-top:15px;color:#77677e;font-size:9px;line-height:1.8}</style></head><body><a class="back" href="../">← PORTAL</a><main class="wrap"><div class="orb" id="orb">◇</div><div class="eye">CALIBRATION MACHINE // NOT PROPHECY</div><h1>ORACLE</h1><section class="lab"><div id="forecast"><input class="question" id="q" maxlength="140" placeholder="What do you think will happen?"><div class="row"><span>YOUR PROBABILITY</span><b id="pct">50%</b></div><input class="range" id="prob" type="range" min="1" max="99" value="50"><button class="btn" id="lock">LOCK FORECAST</button></div><div class="resolve" id="resolve"><div id="locked"></div><p class="receipt">The prediction is frozen. Resolve it only after reality answers.</p><button class="btn" id="yes">HAPPENED</button><button class="btn" id="no">DID NOT</button></div><div class="receipt" id="receipt"></div><div class="history" id="history"></div></section></main><script>const P="portal-oracle-forecast",H="portal-oracle-history";prob.oninput=()=>pct.textContent=prob.value+"%";const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};function hist(){let h=[];try{h=JSON.parse(localStorage.getItem(H)||"[]")}catch(e){}history.innerHTML=h.length?"RESOLVED // "+h.slice(-5).reverse().map(x=>Math.round(x.p)+"% → "+(x.y?"YES":"NO")+" // BRIER "+x.b.toFixed(3)).join("<br>"):"NO RESOLVED FORECASTS YET."}function draw(){let f=null;try{f=JSON.parse(localStorage.getItem(P)||"null")}catch(e){}forecast.style.display=f?"none":"block";resolve.style.display=f?"block":"none";if(f)locked.innerHTML="<b>"+esc(f.q||"Unnamed future")+"</b><br><br>"+f.p+"% // LOCKED "+new Date(f.t).toLocaleString()}lock.onclick=()=>{if(!q.value.trim())return receipt.textContent="NAME THE FUTURE FIRST.";localStorage.setItem(P,JSON.stringify({q:q.value.trim(),p:+prob.value,t:Date.now()}));receipt.textContent="FORECAST FROZEN.";draw()};function done(y){const f=JSON.parse(localStorage.getItem(P)||"null");if(!f)return;const pr=f.p/100,b=(pr-(y?1:0))**2;let h=[];try{h=JSON.parse(localStorage.getItem(H)||"[]")}catch(e){}h.push({...f,y,b});localStorage.setItem(H,JSON.stringify(h.slice(-50)));localStorage.removeItem(P);receipt.textContent="REALITY RECORDED // BRIER SCORE "+b.toFixed(3)+" // LOWER IS BETTER.";orb.textContent=y?"◆":"◇";draw();hist()}yes.onclick=()=>done(true);no.onclick=()=>done(false);draw();hist();</script></body></html>
