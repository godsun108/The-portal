<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORLD CLOCK</title><style>html,body{margin:0;background:#050507;color:#eee;min-height:100%;font:13px ui-monospace,monospace}main{max-width:720px;margin:auto;padding:9vh 24px}.clock{font-size:clamp(48px,13vw,100px);letter-spacing:-.07em}.event{border:1px solid #ffffff28;padding:18px;margin:14px 0}button{background:#09090d;color:#eee;border:1px solid #ffffff35;padding:12px 15px;font:inherit;cursor:pointer}a{color:#eee}.dim{opacity:.5}</style><main><div class="clock" id="clock"></div><h1>WORLD CLOCK</h1><p class="dim">LOCAL PORTAL TIME // FICTIONAL WORLD EVENTS ARE EXPLICITLY LABELED</p><div id="active"></div><h2>LOCAL EVENT CHAMBER</h2><p>These switches begin temporary events in this browser's Portal world.</p><button data-e="redshift">BEGIN REDSHIFT</button> <button data-e="stillness">BEGIN STILLNESS</button><p><a href="../stations/">RETURN</a> · <a href="../passport/">PASSPORT</a> · <a href="../map/">MAP</a></p></main><script type="module">import{activeEvents,beginEvent,eventCatalog}from"../events.js";const clock=document.querySelector("#clock"),active=document.querySelector("#active");function render(){const now=new Date();clock.textContent=now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});const xs=activeEvents();active.innerHTML=xs.length?xs.map(e=>'<div class="event"><b>'+e.label+'</b> // LOCAL FICTIONAL EVENT<br>ENDS '+new Date(e.endsAt).toLocaleTimeString()+'<br>'+e.effects.join(" · ")+'</div>').join(""):'<div class="event dim">NO ACTIVE WORLD EVENT</div>'}setInterval(render,1000);render();document.querySelectorAll("button[data-e]").forEach(b=>b.onclick=()=>{beginEvent(b.dataset.e);render()})</script>
<section id="journeyTime" class="event" hidden></section><script type="module">import{journey,consequence}from"../journey.js";const j=journey(),xs=consequence(),el=document.querySelector("#journeyTime");if(xs.length){el.hidden=false;el.innerHTML="<b>JOURNEY TIME // REAL LOCAL STATE</b><br>"+xs.map(x=>x.text).join("<br>")+"<br><span class=\"dim\">WORLD AGE "+j.ageDays+"D // "+j.roomCount+" ROOMS REMEMBERED</span>"}</script>
<script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>

<script type="module">import{installTransitions}from"../transitions.js";installTransitions("clock");</script>

<section id="echoTime" hidden style="border:1px solid #ffffff28;padding:18px;margin:14px 0"><b>ECHO TIME // AVAILABLE</b><p class="dim">The clock can expose one moment this browser actually remembers.</p><button id="recallMoment">RECALL A MOMENT</button><div id="recalledMoment" class="event dim" hidden></div></section>
<script type="module">import{capability}from"../capabilities.js";import{history}from"../games/protocol.js";import{grantArtifact}from"../games/state.js";const chamber=document.querySelector("#echoTime"),btn=document.querySelector("#recallMoment"),out=document.querySelector("#recalledMoment");if(capability("echoTime"))chamber.hidden=false;btn.onclick=()=>{const h=history();out.hidden=false;if(!h.length){out.textContent="NO RECORDED GAME HISTORY EXISTS IN THIS BROWSER.";return}const r=h[Math.floor(Math.random()*h.length)],when=new Date(r.finishedAt||r.startedAt),o=r.outcome||{};out.classList.remove("dim");out.innerHTML="<b>"+r.game.toUpperCase()+"</b><br>"+when.toLocaleString()+"<br>RESULT // "+String(o.result||"RECORDED").toUpperCase();grantArtifact("remembered-moment");btn.disabled=true;btn.textContent="MOMENT RECALLED"}</script>
