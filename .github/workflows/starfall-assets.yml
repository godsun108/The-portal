name: Starfall asset validation
on:
  pull_request:
    paths:
      - 'games/starfall/**'
      - '.github/workflows/starfall-assets.yml'
  push:
    branches: [main]
    paths:
      - 'games/starfall/**'
      - '.github/workflows/starfall-assets.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check animation and atlas math
        run: node --test games/starfall/animation-engine.test.mjs games/starfall/sprite-atlas.test.mjs games/starfall/assets/intake-contract.test.mjs
      - name: Validate shipped atlas files
        run: node games/starfall/assets/validate-assets.mjs
