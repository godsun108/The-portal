name: EIDOLON automated mobile smoke
on:
  push:
    paths:
      - 'eidolon-native-motion/**'
      - 'eidolon-human-base/assets/**'
      - 'scripts/eidolon-mobile-smoke.cjs'
      - 'scripts/check-eidolon.cjs'
      - 'scripts/check-eidolon-motion-catalog.cjs'
      - 'scripts/generate-eidolon-wave.cjs'
      - '.github/workflows/eidolon-mobile-smoke.yml'
  pull_request:
    paths:
      - 'eidolon-native-motion/**'
      - 'eidolon-human-base/assets/**'
      - 'scripts/eidolon-mobile-smoke.cjs'
      - 'scripts/check-eidolon-motion-catalog.cjs'
      - '.github/workflows/eidolon-mobile-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          node node_modules/playwright/cli.js install --with-deps chromium
          node -e "const p=require('playwright');const fs=require('node:fs');const executable=p.chromium.executablePath();console.log('Browser executable:',executable);if(!fs.existsSync(executable))throw Error('Playwright Chromium executable missing')"
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/eidolon-http.log 2>&1 &
      - name: Generate and verify reproducible motion fixture
        run: |
          node scripts/generate-eidolon-wave.cjs
          sha256sum eidolon-native-motion/assets/motions/eidolon-wave-test.glb > /tmp/eidolon-wave.sha256
          node scripts/generate-eidolon-wave.cjs
          sha256sum -c /tmp/eidolon-wave.sha256
          node scripts/check-eidolon-motion-catalog.cjs
      - name: Check syntax and run mobile browser
        run: |
          node scripts/check-eidolon.cjs
          node scripts/check-eidolon-motion-catalog.cjs
          node scripts/eidolon-mobile-smoke.cjs
      - name: Publish failure issue
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          report={}
          try:
              with open('eidolon-mobile-results.json') as f: report=json.load(f)
          except (FileNotFoundError, json.JSONDecodeError): pass
          title='EIDOLON mobile browser smoke failure'
          body='Automated mobile browser smoke test failed.\n\nRun: '+os.environ['RUN_URL']+'\n\nFailure: '+str(report.get('failure','See workflow logs'))+'\n\nCompleted checks: '+', '.join(report.get('checks',[]))+'\n\nSee workflow artifacts for screenshot and JSON diagnostics.'
          existing=subprocess.run(['gh','issue','list','--repo',os.environ['REPO'],'--state','open','--search',title+' in:title','--json','number,title'],capture_output=True,text=True,check=True)
          issues=json.loads(existing.stdout)
          matches=[i for i in issues if i['title']==title]
          if matches:
              subprocess.run(['gh','issue','comment',str(matches[0]['number']),'--repo',os.environ['REPO'],'--body',body],check=True)
          else:
              subprocess.run(['gh','issue','create','--repo',os.environ['REPO'],'--title',title,'--body',body],check=True)
          PY
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eidolon-mobile-smoke
          path: |
            eidolon-mobile-smoke.png
            eidolon-mobile-results.json
            eidolon-motion-evidence/
            eidolon-native-motion/assets/motions/eidolon-wave-test.glb
          if-no-files-found: warn
