<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030306"><meta name="description" content="A tiny receiver pointed at the universe.">
<title>SIGNAL // THE PORTAL</title><script src="../world.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030306;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100svh;overflow:hidden;background:radial-gradient(circle at 50% 42%,#171426 0,#07070c 32%,#030306 67%)}canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.7}.shell{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}.back{position:absolute;top:24px;left:24px;color:#666;text-decoration:none;font-size:10px;letter-spacing:.2em}.eyebrow{font-size:9px;letter-spacing:.35em;color:#6f6f7c}.dish{width:min(54vw,280px);aspect-ratio:1;border:1px solid #3b3948;border-radius:50%;display:grid;place-items:center;margin:34px 0;position:relative;box-shadow:0 0 80px #29204422 inset,0 0 100px #2e255333}.dish:before,.dish:after{content:"";position:absolute;border:1px solid #252431;border-radius:50%}.dish:before{inset:14%}.dish:after{inset:31%}.core{width:9px;height:9px;border-radius:50%;background:#ddd;box-shadow:0 0 18px #fff;animation:pulse 2.8s ease-in-out infinite}.sweep{position:absolute;width:50%;height:1px;left:50%;top:50%;transform-origin:left;background:linear-gradient(90deg,#8f85bd,transparent);animation:scan 8s linear infinite}.readout{font-family:Arial Black,Impact,sans-serif;font-size:clamp(40px,11vw,88px);letter-spacing:-.05em;line-height:.85;margin:0}.sub{margin:20px auto 0;max-width:520px;color:#777784;font-size:10px;line-height:1.8;letter-spacing:.08em}.stats{display:flex;gap:26px;margin-top:34px;color:#555563;font-size:9px;letter-spacing:.12em}.stats b{display:block;color:#aaa;font-size:11px;margin-top:6px}.button{margin-top:34px;border:1px solid #343340;background:#09090e;color:#aaa;padding:13px 20px;border-radius:999px;font:9px ui-monospace,monospace;letter-spacing:.18em;cursor:pointer}@keyframes scan{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.8);opacity:.35}}@media(prefers-reduced-motion:reduce){.sweep,.core{animation:none}}
</style></head>
<body><canvas id="sky"></canvas><main class="shell">
<a class="back" href="../">← PORTAL</a><div class="eyebrow">DEEP SPACE RECEIVER // ONLINE</div>
<div class="dish"><div class="sweep"></div><div class="core"></div></div>
<h1 class="readout" id="headline">LISTENING.</h1>
<p class="sub" id="message">The universe is mostly quiet from here. That does not mean nothing is happening.</p>
<div class="stats"><span>LIGHT DELAY<b id="delay">08:20</b></span><span>SKY SEED<b id="seed">000000</b></span><span>STATE<b id="state">QUIET</b></span></div>
<button class="button" id="tune">RETUNE RECEIVER</button></main>
<script>localStorage.setItem('portal-artifact-signal','1');
const c=document.querySelector("#sky"),x=c.getContext("2d");function sky(){let d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,innerWidth,innerHeight);for(let i=0;i<180;i++){x.globalAlpha=Math.random()*.8+.1;x.fillStyle="#fff";x.fillRect(Math.random()*innerWidth,Math.random()*innerHeight,Math.random()*1.5+.2,Math.random()*1.5+.2)}x.globalAlpha=1}addEventListener("resize",sky);sky();
const signals=[["SIGNAL FOUND.","A photon arriving at your screen began somewhere else. Most of the universe reaches us as old news.","FAINT"],["NO MESSAGE.","Silence is data too. The receiver found no story, only distance.","QUIET"],["ANCIENT LIGHT.","Some of the light above you started traveling before anyone alive was born.","OLD"],["LOCAL STAR.","Sunlight takes about eight minutes and twenty seconds to reach Earth. You never see the Sun exactly now.","NEAR"],["DEEP FIELD.","Point long enough at apparent nothing and the nothing fills with galaxies.","DENSE"],["YOU ARE TRANSMITTING.","Earth has been leaking radio into space for generations. Somewhere far away, our oldest broadcasts are still traveling.","OUTBOUND"],["COSMIC STATIC.","A small part of old analog television static could trace to natural radio noise from space.","NOISY"]];
function tune(){let echo=null;try{echo=JSON.parse(localStorage.getItem("portal-blackbox-echo")||"null")}catch(e){}if(echo&&localStorage.getItem("portal-blackbox-echo-seen")==="1"&&!localStorage.getItem("portal-blackbox-signal")){headline.textContent="RETURN SIGNAL.";message.textContent="A consequence crossed the Void and reached the receiver. The original input is still gone.";state.textContent="ECHO";seed.textContent=echo.hash.slice(-6);localStorage.setItem("portal-blackbox-signal","1");window.PortalWorld?.event?.("blackbox-signal","THE BLACK BOX ECHO REACHED SIGNAL AFTER CROSSING THE VOID.");window.PortalWorld?.save?.();return}const s=signals[Math.floor(Math.random()*signals.length)];headline.textContent=s[0];message.textContent=s[1];state.textContent=s[2];seed.textContent=String(Math.floor(Math.random()*999999)).padStart(6,"0")}document.querySelector("#tune").onclick=tune;tune();
</script></body></html>
