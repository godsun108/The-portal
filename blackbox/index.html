<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACK BOX // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#000;color:#bbb;font-family:ui-monospace,monospace;display:grid;place-items:center;padding:28px}.back{position:absolute;top:22px;left:22px;color:#333;text-decoration:none;font-size:9px}.box{text-align:center;width:min(620px,100%)}.cube{width:180px;height:180px;margin:35px auto;background:#030303;border:1px solid #181818;box-shadow:0 0 80px #fff08 inset}h1{font:900 clamp(50px,14vw,100px)/.8 Arial Black,sans-serif}input{width:100%;background:#030303;border:1px solid #222;color:#aaa;padding:15px;font:11px ui-monospace}.go{margin-top:16px;border:1px solid #292929;background:#030303;color:#777;padding:13px 20px;border-radius:999px;font:9px ui-monospace}.out{color:#555;line-height:1.9;min-height:70px;margin-top:25px}</style></head><body><a class="back" href="../">← PORTAL</a><main class="box"><div class="cube"></div><h1>BLACK BOX</h1><input id="input" maxlength="120" placeholder="put something in"><button class="go" id="go">SUBMIT WITHOUT EXPLANATION</button><div class="out" id="out"></div></main><script>const replies=["ACCEPTED. IT IS DIFFERENT NOW.","THE BOX KEPT THE SHAPE, NOT THE WORDS.","INPUT DESTROYED. CONSEQUENCE RETAINED.","THANK YOU. THAT WAS PROBABLY IMPORTANT.","THE MACHINE HAS DECIDED NOT TO EXPLAIN ITSELF.","ONE THING ENTERED. ANOTHER THING WILL LEAVE LATER."];go.onclick=()=>{if(!input.value.trim())return;let h=[...input.value].reduce((a,c)=>((a*31+c.charCodeAt(0))>>>0),7);out.textContent=replies[h%replies.length]+" // HASH "+h.toString(16).toUpperCase().padStart(8,"0");localStorage.setItem("portal-blackbox","1");input.value=""}</script></body></html>
