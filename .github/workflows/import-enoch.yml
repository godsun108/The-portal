name: Import 1 Enoch source (review branch only)
on:
  push:
    branches:
      - feature/living-scriptures-v1
    paths:
      - '.github/workflows/import-enoch.yml'
      - 'scripts/import-enoch.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-enoch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/living-scriptures-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch verified Project Gutenberg source
        run: |
          curl --fail --location --retry 3 --output /tmp/enoch.txt https://www.gutenberg.org/cache/epub/77935/pg77935.txt
          test -s /tmp/enoch.txt
      - name: Validate and split into chapters
        run: node scripts/import-enoch.mjs /tmp/enoch.txt /tmp/enoch-chapters
      - name: Verify chapter files
        run: |
          test "$(find /tmp/enoch-chapters -name '[0-9][0-9][0-9].json' | wc -l)" -eq 108
          test -s /tmp/enoch-chapters/001.json
          test -s /tmp/enoch-chapters/108.json
      - name: Add validated source chapters to the draft branch
        run: |
          mkdir -p data/extra-scriptures/1-enoch
          cp /tmp/enoch-chapters/*.json data/extra-scriptures/1-enoch/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extra-scriptures/1-enoch/
          if ! git diff --cached --quiet; then
            git commit -m "Add validated 1 Enoch chapter source data for review"
            git push origin HEAD:feature/living-scriptures-v1
          else
            echo "No Enoch chapter changes to commit."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: enoch-108-chapters-for-editorial-review
          path: /tmp/enoch-chapters/
          retention-days: 14
