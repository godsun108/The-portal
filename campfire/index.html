<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080604"><title>CAMPFIRE // THE PORTAL</title><script src="../world.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080604;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100svh;overflow:hidden;background:radial-gradient(circle at 50% 68%,#241207 0,#0b0806 28%,#030303 68%)}.back{position:fixed;z-index:3;top:max(20px,env(safe-area-inset-top));left:20px;color:#66594e;text-decoration:none;font-size:9px;letter-spacing:.18em}.room{min-height:100svh;display:grid;place-items:center;text-align:center;padding:30px}.inner{max-width:560px}.ey{font-size:8px;letter-spacing:.32em;color:#716153}.fire{height:180px;display:grid;place-items:end center;margin:18px auto 10px}.ember{width:42px;height:70px;border-radius:52% 48% 48% 52%/65% 65% 35% 35%;background:radial-gradient(circle at 50% 75%,#ffd58b,#bd5826 38%,#5b1e10 65%,transparent 67%);filter:drop-shadow(0 0 24px #d8662855);animation:breathe 3s ease-in-out infinite}.ground{width:180px;height:1px;background:linear-gradient(90deg,transparent,#5b3924,transparent);box-shadow:0 0 28px #8e482d}.count{font:900 clamp(48px,15vw,110px)/.8 Arial Black,sans-serif;letter-spacing:-.07em;margin:25px 0 12px;color:#d2c4b7}.truth{color:#8c7867;font-size:10px;line-height:1.9}.truth b{color:#c5aa92}.future{margin:28px auto 0;padding-top:20px;border-top:1px solid #211b17;color:#51473f;font-size:8px;line-height:1.8;letter-spacing:.1em;max-width:420px}@keyframes breathe{50%{transform:scale(.93) rotate(2deg);opacity:.78}}@media(prefers-reduced-motion:reduce){.ember{animation:none}}</style><link rel="stylesheet" href="../portal-atmosphere.css"></head><body><a class="back" href="../">← PORTAL</a><main class="room"><div class="inner"><div class="ey">CONNECTION // CAMPFIRE</div><div class="fire"><div><div class="ember"></div><div class="ground"></div></div></div><div class="count" id="count">—</div><div class="truth" id="truth"><b>CHECKING THE FIRE.</b><br>VERIFYING WHETHER ANYONE ELSE IS REALLY HERE.</div><div class="future">WHEN THE FIRE LIGHTS, EVERY PRESENCE HERE WILL REPRESENT A REAL REMOTE VISITOR VERIFIED BY THE CANONICAL CONNECTION SERVICE.</div></div></main><script>
const count=document.querySelector("#count"),truth=document.querySelector("#truth");let endpoint=null,visitor=sessionStorage.getItem("portal-campfire-visitor")||(crypto.randomUUID?.()||("v-"+Date.now()+"-"+Math.random().toString(36).slice(2))),timer=null;sessionStorage.setItem("portal-campfire-visitor",visitor);
function unavailable(){count.textContent="—";truth.innerHTML="<b>NO FIRE YET.</b><br>THIS ROOM REFUSES TO INVENT COMPANY.<br><br>The shared human connection is not available."}
async function lease(){try{const r=await fetch(endpoint+"/v0/presence/campfire",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({visitor_id:visitor,lease_seconds:45}),cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();if(d.schema!=="portal.presence.v0"||d.room!=="campfire"||d.verified!==true||!Number.isInteger(d.others)||d.others<0)throw 0;count.textContent=String(d.others);localStorage.setItem("portal-campfire-verified","1");if(d.others>0&&!localStorage.getItem("portal-campfire-overlap")){localStorage.setItem("portal-campfire-overlap","1");localStorage.setItem("portal-campfire-overlap-at",String(Date.now()));window.PortalWorld?.event?.("campfire-overlap","TWO OR MORE REAL REMOTE VISITORS SHARED THE CAMPFIRE.");window.PortalWorld?.save?.()}truth.innerHTML=d.others===0?"<b>YOU ARE THE ONLY VERIFIED WANDERER HERE.</b><br>The fire is listening.":"<b>"+d.others+" OTHER "+(d.others===1?"WANDERER IS":"WANDERERS ARE")+" HERE.</b><br>No names. No followers. Just shared presence.";timer=setTimeout(lease,20000)}catch(e){unavailable()}}
(async()=>{try{const r=await fetch("../connection/config.json?ts="+Date.now(),{cache:"no-store"}),cfg=await r.json();if(cfg.schema!=="portal.connection-config.v0"||!cfg.endpoint){unavailable();return}endpoint=String(cfg.endpoint).replace(/\/$/,"");await lease()}catch(e){unavailable()}})();
addEventListener("pagehide",()=>{if(timer)clearTimeout(timer);if(endpoint)fetch(endpoint+"/v0/presence/campfire/"+encodeURIComponent(visitor),{method:"DELETE",keepalive:true}).catch(()=>{})});
</script></body></html>
<script type="module">import{manifestUndertone}from"../undertone/layer.js";manifestUndertone("campfire");</script>

<script type="module">import{installPhysics}from"../physics.js";const p=installPhysics();if(p.mode==="converged"){const target=document.querySelector("main,.shell,.stage,canvas");if(target)target.setAttribute("data-portal-depth","");}</script>

<script type="module">import{installEventLayer}from"../event-layer.js";installEventLayer("campfire");</script>
