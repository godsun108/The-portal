<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>ARCADE // THE PORTAL</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 0,#23152f,#050507 52%);color:#eee;font-family:ui-monospace,monospace;padding:28px}.back{color:#6f6576;text-decoration:none;font-size:9px;letter-spacing:.2em}.wrap{width:min(850px,100%);margin:70px auto}.ey{font-size:9px;letter-spacing:.34em;color:#7f7089}h1{font:900 clamp(58px,15vw,120px)/.75 Arial Black,sans-serif;letter-spacing:-.07em;margin:22px 0 18px}.lede{color:#93879b;font-size:11px;line-height:1.8}.games{display:grid;gap:12px;margin-top:42px}.game{min-height:190px;border:1px solid #30283a;border-radius:22px;background:#0a080d;padding:22px;position:relative;overflow:hidden;cursor:pointer;color:#eee;text-align:left}.game strong{display:block;font-size:16px;letter-spacing:.1em}.game small{color:#766b7d}.moon{position:absolute;width:86px;height:86px;border-radius:50%;right:28px;bottom:26px;background:#ddd;box-shadow:0 0 45px #ddd6}.red{position:absolute;width:92px;height:92px;border-radius:50%;right:26px;bottom:24px;background:#42131b;border:1px solid #8b3342;box-shadow:0 0 40px #b21d3633}.life{position:absolute;right:34px;bottom:30px;font-size:70px}.stage{position:fixed;inset:0;background:#030304;z-index:5;display:none;place-items:center;text-align:center;padding:28px}.stage.open{display:grid}.stage h2{font:900 clamp(42px,12vw,96px)/.82 Arial Black,sans-serif;letter-spacing:-.05em}.stage p{color:#777;line-height:1.8;max-width:600px}.stage button{border:1px solid #333;background:#09090c;color:#aaa;padding:14px 20px;border-radius:999px;font:9px ui-monospace;letter-spacing:.16em}.moonbig{width:min(210px,55vw);aspect-ratio:1;border-radius:50%;background:#e7e3d9;box-shadow:0 0 80px #fff4;margin:30px auto;cursor:pointer;transition:.3s}.moonbig:active{transform:scale(.92)}@media(min-width:700px){.games{grid-template-columns:repeat(3,1fr)}}@media(max-width:699px){body{padding:18px}.wrap{margin:54px auto 28px}.games{margin-top:28px}.game{min-height:150px;padding:18px}.cabinetHall{grid-template-columns:1fr 1fr}.cabinet{min-height:132px;padding:15px}.stage{padding:20px}.stage button{min-height:44px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}.cabinetHall{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px}.cabinet{display:block;min-height:155px;text-decoration:none;border:1px solid #352a42;border-radius:18px;padding:18px;background:linear-gradient(145deg,#0c0911,#07070a);color:#eee;position:relative;overflow:hidden}.cabinet:after{content:"";position:absolute;inset:auto -20% -55% -20%;height:90%;background:radial-gradient(ellipse,#8f62c51f,transparent 65%)}.cabinet strong{display:block;font-size:15px;letter-spacing:.09em}.cabinet small{display:block;color:#7d7185;margin-top:8px;line-height:1.5}.cabinet .lamp{position:absolute;right:14px;top:14px;width:7px;height:7px;border-radius:50%;background:#bfa8ff;box-shadow:0 0 13px #bfa8ff}.cabinet.dark{opacity:.32;filter:saturate(.2)}.floorTitle{margin-top:48px;font-size:9px;letter-spacing:.3em;color:#776982;grid-column:1/-1}.floorGroup{grid-column:1/-1;margin-top:20px}.floorGroup:first-child{margin-top:0}.groupTitle{font-size:8px;letter-spacing:.24em;color:#655b6c;margin:4px 0 10px}.progress{grid-column:1/-1;border:1px solid #2e2735;border-radius:14px;padding:12px 14px;color:#817588;font-size:9px;line-height:1.7;background:#08070a}.cabinet.mastery{border-color:#68517d;background:linear-gradient(145deg,#120c19,#08070a)}@media(hover:hover){.cabinet:hover{transform:translateY(-2px);border-color:#6e5689}}</style><link rel="stylesheet" href="../portal-atmosphere.css"><link rel="stylesheet" href="../portal-magic.css"><link rel="stylesheet" href="circuit.css"><script src="../world.js"></script></head><body>
<a class="back" href="../?station=play">← PLAY</a><main class="wrap"><div class="ey">PLAY STATION // GAME HALL</div><h1>ARCADE</h1><p class="lede" id="lede">Three machines are always awake. The cabinet hall gets stranger the longer you play.</p><p style="margin-top:18px"><a class="back" href="circuit.html">INSPECT THE CIRCUIT →</a></p><section class="games">
<button class="game" data-g="moon"><strong>DON'T TOUCH<br>THE MOON</strong><small id="moonLabel">one instruction</small><i class="moon"></i></button>
<button class="game" data-g="button"><strong>THE BUTTON</strong><small id="pressLabel">DO NOT PRESS</small><i class="red"></i></button>
<button class="game" data-g="life"><strong>ONE LIFE</strong><small id="lifeLabel">this browser gets one</small><i class="life">◇</i></button>
<div class="floorTitle">CABINET HALL // PLAYABLE MACHINES + DARK DOORS</div><div id="network" class="cabinetHall"></div></section></main><section class="stage" id="stage"><div id="inside"></div></section><script>
localStorage.setItem("portal-arcade","1");const moonLabel=document.querySelector("#moonLabel"),pressLabel=document.querySelector("#pressLabel"),lifeLabel=document.querySelector("#lifeLabel");if(localStorage.getItem("portal-moon-touched"))moonLabel.textContent="you touched it";const pc=Number(localStorage.getItem("portal-button")||0);if(pc)pressLabel.textContent=pc+" PRESSES";const ls=localStorage.getItem("portal-one-life");if(ls==="won")lifeLabel.textContent="life preserved";if(ls==="dead")lifeLabel.textContent="life spent";if(window.PortalWorld?.state.pressure>=8)document.addEventListener("DOMContentLoaded",()=>{document.querySelector("#lede").textContent="No coins. No leaderboard. The games have started talking to the other rooms."});const stage=document.querySelector("#stage"),inside=document.querySelector("#inside");function close(){stage.classList.remove("open")}function open(html){inside.innerHTML=html;stage.classList.add("open")}
const artifactIds=()=>{try{return new Set(JSON.parse(localStorage.getItem("portal-game-artifacts")||"[]").map(x=>x.id))}catch{return new Set}};const powered=g=>{if(g.artifactUnlock?.all){const a=artifactIds();return g.artifactUnlock.all.every(k=>a.has(k))}return !g.unlock||!g.unlock.all||g.unlock.all.every(k=>localStorage.getItem(k)!==null)};fetch("cabinets.json",{cache:"no-store"}).then(r=>r.json()).then(reg=>{const extra=reg.cabinets.filter(g=>!["moon","button","one-life"].includes(g.id)),ids=artifactIds(),five=["gravity-pearl","null-compass","swarm-heart","phase-chord","void-feather"],have=five.filter(x=>ids.has(x)).length;const card=g=>{const on=powered(g),play=g.status==="playable"&&on,mastery=g.kind==="mastery-cabinet"||g.kind==="singularity-cabinet";if(play){const href=g.id==="maze"?g.href+"?from=arcade":g.href;return `<a class="cabinet ${mastery?"mastery":""}" href="${href}"><i class="lamp"></i><strong>${g.title}</strong><small>${g.tagline||"CONNECTED CABINET // PLAYABLE"}</small></a>`}let label=g.artifactUnlock?.all&&!on?(g.id==="fifth-machine"?have+"/5 POWER SIGNALS RECOVERED // CABINET DARK":"REQUIRED ARTIFACT NOT YET RECOVERED // CABINET DARK"):g.status==="awaiting-recovery"?"ORIGINAL SOURCE MISSING // CABINET DARK":g.kind==="networked"?"VERIFIED CONNECTION REQUIRED // CABINET DARK":g.status==="locked"&&!on?"NO POWER // SOMETHING ELSE MUST HAPPEN FIRST":"CABINET NOT YET BUILT";return `<div class="cabinet dark ${mastery?"mastery":""}"><strong>${g.title}</strong><small>${label}</small></div>`};const groups=[["START HERE",["maze","rift","echo-maze","colorfall"]],["POWER CABINETS",["drift","null-racer","star-swarm","pulse-4","up-void","fifth-machine","deep-run"]],["DEEP FLOOR",["house-edge","parallax","vector-break","gravity-well","afterimage","glyph-lock","time-loop","blind-spot","signal-war","forge","tower-zero","echo-duel"]],["WORLD / STRANGE MACHINES",["orbit","signal-hunt","echo-run","turbo-turtle","campfire-coop"]]];const byId=new Map(extra.map(g=>[g.id,g]));document.querySelector("#network").innerHTML=`<div class="progress">ARCADE MEMORY // ${ids.size} ARTIFACTS RECOVERED // FIFTH MACHINE POWER ${have}/5</div>`+groups.map(([name,list])=>{const machines=list.map(id=>byId.get(id)).filter(Boolean);return machines.length?`<section class="floorGroup"><div class="groupTitle">${name}</div><div class="cabinetHall">${machines.map(card).join("")}</div></section>`:""}).join("")}).catch(()=>{document.querySelector("#network").innerHTML='<div class="progress">CABINET REGISTRY OFFLINE // THE THREE NATIVE MACHINES STILL WORK.</div>'});
const games={
moon(){open('<div class="ey">RULE 01</div><h2>DON\'T TOUCH<br>THE MOON.</h2><div class="moonbig" id="mb"></div><p id="msg">Seriously.</p><button id="exit">LEAVE IT ALONE</button>');const exitBtn=inside.querySelector("#exit"),moon=inside.querySelector("#mb"),message=inside.querySelector("#msg");exitBtn.addEventListener("click",close);moon.addEventListener("click",()=>{localStorage.setItem("portal-moon-touched","1");moon.style.transform="translateY(70vh) scale(.2)";message.textContent="You had one job. Somewhere, the tide is filing paperwork.";setTimeout(()=>moon.remove(),600);moonLabel.textContent="you touched it"})},
button(){let n=Number(localStorage.getItem("portal-button")||0);open('<div class="ey">PRESS COUNT // <span id="n">'+n+'</span></div><h2 id="bt">DO NOT<br>PRESS.</h2><button id="pb" style="font-size:18px;padding:24px 34px">PRESS ANYWAY</button><p id="msg"></p><button id="exit">ESCAPE</button>');const exitBtn=inside.querySelector("#exit"),press=inside.querySelector("#pb"),count=inside.querySelector("#n"),message=inside.querySelector("#msg");exitBtn.addEventListener("click",close);press.addEventListener("click",()=>{n++;localStorage.setItem("portal-button",n);count.textContent=n;const m=["Nothing happened.","Again?","The button has noticed a pattern.","This is now between you and the button.","You are creating a statistic nobody requested.","The machine appreciates your lack of restraint."];message.textContent=n===13?"THIRTEEN. A LOCK SOMEWHERE JUST COUGHED.":n===37?"THE BUTTON WOULD LIKE YOU TO STOP. IT IS LYING.":m[Math.min(n-1,m.length-1)];if(n===13)localStorage.setItem("portal-arcade-13","1");pressLabel.textContent=n+" PRESSES"})},
life(){if(localStorage.getItem("portal-one-life")==="dead"){open('<div class="ey">ONE LIFE</div><h2>YOU ALREADY<br>USED IT.</h2><p>This browser remembers.</p><button id="exit">ACCEPT FATE</button>');inside.querySelector("#exit").addEventListener("click",close);return}open('<div class="ey">ONE LIFE // TAP THE SIGNAL BEFORE IT VANISHES</div><h2 id="lh">READY?</h2><p id="msg">There will be no second life on this browser.</p><button id="start">USE MY LIFE</button><button id="exit">LEAVE WHILE YOU CAN</button>');const exitBtn=inside.querySelector("#exit"),startBtn=inside.querySelector("#start"),heading=inside.querySelector("#lh"),message=inside.querySelector("#msg");exitBtn.addEventListener("click",close);startBtn.addEventListener("click",()=>{startBtn.remove();heading.textContent="WAIT.";let delay=1200+Math.random()*2600;setTimeout(()=>{heading.textContent="NOW";const target=document.createElement("button");target.textContent="✦";target.style.cssText="font-size:48px;padding:22px 30px";inside.insertBefore(target,message);let done=false;target.addEventListener("click",()=>{if(done)return;done=true;localStorage.setItem("portal-one-life","won");lifeLabel.textContent="life preserved";heading.textContent="ALIVE.";message.textContent="You kept your one life.";target.remove()});setTimeout(()=>{if(done)return;done=true;localStorage.setItem("portal-one-life","dead");lifeLabel.textContent="life spent";heading.textContent="TOO LATE.";message.textContent="That was it.";target.remove()},900)},delay)})}};
document.querySelectorAll("[data-g]").forEach(card=>card.addEventListener("click",()=>{const game=games[card.dataset.g];if(game)game()}));
</script><script type="module">import{manifestCapabilityConsequence}from"./capability-consequence.js";manifestCapabilityConsequence();</script><script src="../station-nav.js"></script></body></html>
