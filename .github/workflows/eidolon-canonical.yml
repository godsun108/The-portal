name: EIDOLON Canonical Mesh Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_eidolon_canonical.py'
      - 'scripts/build_eidolon_rigged.py'
      - 'scripts/build_eidolon_rigged_v2.py'
      - 'scripts/build_eidolon_rigged_v3.py'
      - 'scripts/build_eidolon_rigged_v4.py'
      - 'scripts/build_eidolon_rigged_v5.py'
      - 'scripts/build_eidolon_rigged_v6.py'
      - 'scripts/build_eidolon_rigged_v7.py'
      - 'scripts/build_eidolon_rigged_v8.py'
      - 'scripts/build_eidolon_rigged_v9.py'
      - 'scripts/build_eidolon_rigged_v10.py'
      - 'scripts/build_eidolon_rigged_v11.py'
      - 'scripts/eidolon_surface_v10.py'
      - 'scripts/eidolon_surface_v9.py'
      - 'scripts/eidolon_surface_v8.py'
      - 'scripts/eidolon_surface_v7.py'
      - 'scripts/eidolon_surface_v5.py'
      - '.github/workflows/eidolon-canonical.yml'
permissions:
  contents: write
concurrency:
  group: eidolon-canonical-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic mesh dependencies
        run: python -m pip install "numpy==2.3.5" "scikit-image==0.26.0"
      - name: Reconstruct and verify canonical actor
        run: python scripts/build_eidolon_canonical.py
      - name: Build experimental 17-joint actor and two clips
        run: python scripts/build_eidolon_rigged.py
      - name: Build experimental deformation v2
        run: python scripts/build_eidolon_rigged_v2.py
      - name: Build adjacency-smoothed V3 rig
        run: python scripts/build_eidolon_rigged_v3.py
      - name: Build V4 smoothed rig and audit
        run: python scripts/build_eidolon_rigged_v4.py
      - name: Build experimental V5 smooth-union human
        run: python scripts/build_eidolon_rigged_v5.py
      - name: Build experimental V6 gait
        run: python scripts/build_eidolon_rigged_v6.py
      - name: Build V7 experimental anatomy
        run: python scripts/build_eidolon_rigged_v7.py
      - name: Build V8 anatomical and clothing prototype
        run: python scripts/build_eidolon_rigged_v8.py
      - name: Build V9 hero geometry candidate
        run: python scripts/build_eidolon_rigged_v9.py
      - name: Build V10 hero anatomy candidate
        run: python scripts/build_eidolon_rigged_v10.py
      - name: Build V11 anatomical pivot rig
        run: python scripts/build_eidolon_rigged_v11.py
      - name: Archive GLB and manifest
        uses: actions/upload-artifact@v4
        with:
          name: eidolon-human-v1-canonical
          path: |
            eidolon-canonical/assets/eidolon-human-v1-canonical.glb
            eidolon-canonical/assets/manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-experimental.glb
            eidolon-canonical/assets/rig-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v2-experimental.glb
            eidolon-canonical/assets/rig-v2-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v3-experimental.glb
            eidolon-canonical/assets/rig-v3-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v4-experimental.glb
            eidolon-canonical/assets/rig-v4-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v5-surface.glb
            eidolon-canonical/assets/rig-v5-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v6-gait.glb
            eidolon-canonical/assets/rig-v6-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v7-anatomy.glb
            eidolon-canonical/assets/rig-v7-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v8-anatomy.glb
            eidolon-canonical/assets/rig-v8-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v9-hero.glb
            eidolon-canonical/assets/rig-v9-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v10-hero.glb
            eidolon-canonical/assets/rig-v10-manifest.json
            eidolon-canonical/assets/eidolon-human-v1-rigged-v11-pivots.glb
            eidolon-canonical/assets/rig-v11-manifest.json
      - name: Publish static assets for iPhone viewer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eidolon-canonical/assets/eidolon-human-v1-canonical.glb eidolon-canonical/assets/manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-experimental.glb eidolon-canonical/assets/rig-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v2-experimental.glb eidolon-canonical/assets/rig-v2-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v3-experimental.glb eidolon-canonical/assets/rig-v3-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v4-experimental.glb eidolon-canonical/assets/rig-v4-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v5-surface.glb eidolon-canonical/assets/rig-v5-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v6-gait.glb eidolon-canonical/assets/rig-v6-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v7-anatomy.glb eidolon-canonical/assets/rig-v7-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v8-anatomy.glb eidolon-canonical/assets/rig-v8-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v9-hero.glb eidolon-canonical/assets/rig-v9-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v10-hero.glb eidolon-canonical/assets/rig-v10-manifest.json eidolon-canonical/assets/eidolon-human-v1-rigged-v11-pivots.glb eidolon-canonical/assets/rig-v11-manifest.json
          if git diff --cached --quiet; then
            echo "Canonical assets unchanged."
          else
            git commit -m "build: publish verified EIDOLON Human v1 canonical GLB"
            # Retry concurrent commits to main without losing generated GLB assets.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Generated assets published"
                exit 0
              fi
              sleep 2
            done
            echo "Asset publication failed after retries"
            exit 1
          fi
