<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09080d"><title>TIME MACHINE // THE PORTAL</title><script src="../world.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 34%,#21162c,#07070a 58%);color:#eee;font-family:ui-monospace,monospace;padding:28px}.back{position:fixed;top:max(20px,env(safe-area-inset-top));left:20px;color:#665d70;text-decoration:none;font-size:9px}.box{text-align:center;max-width:720px;margin:auto;padding:12vh 0 8vh}.eye{font-size:9px;letter-spacing:.3em;color:#76677d}h1{font:900 clamp(50px,14vw,105px)/.78 Arial Black,sans-serif;letter-spacing:-.06em;margin:28px 0 8px}.year{font:900 clamp(72px,22vw,150px)/1 Arial Black,sans-serif;color:#b9a3c6}.event{min-height:70px;color:#b0a3b7;line-height:1.8;font-size:11px;margin:12px auto 22px;max-width:580px}.rail{width:100%;accent-color:#b9a3c6}.era{display:flex;justify-content:space-between;color:#655b6a;font-size:8px;margin-top:7px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:25px 0}.fact{border:1px solid #2c2631;background:#0a080d;padding:13px 8px;min-height:70px;color:#817687;font-size:8px;line-height:1.55}.fact b{display:block;color:#c2b4c8;font-size:9px;margin-bottom:6px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.go{border:1px solid #45384c;background:#0b080d;color:#b5a6bb;padding:13px 18px;border-radius:999px;font:9px ui-monospace;letter-spacing:.14em}.visited{margin-top:18px;color:#5f5664;font-size:8px;letter-spacing:.12em}</style></head><body><a class="back" href="../stations/?s=world">← WORLD</a><main class="box"><div class="eye">TEMPORAL VIEWER // ARCHIVE FRAGMENTS</div><h1>TIME<br>MACHINE</h1><div class="year" id="year"></div><p class="event" id="event"></p><input class="rail" id="rail" type="range" min="0" max="9" value="6" aria-label="Choose archive year"><div class="era"><span>13,000 BCE</span><span>FUTURE</span></div><div class="facts"><div class="fact"><b>WORLD</b><span id="world"></span></div><div class="fact"><b>TECH</b><span id="tech"></span></div><div class="fact"><b>SIGNAL</b><span id="signal"></span></div></div><div class="controls"><button class="go" id="random">RANDOM JUMP</button><button class="go" id="remember">MARK THIS YEAR</button></div><div class="visited" id="visited"></div></main><script>
const eras=[
[-13000,"Humans are making art, tools and long journeys through landscapes that would look alien to you.","Ice-age worlds and changing coastlines.","Stone, fiber, fire, memory.","Stories travel only as far as people can carry them."],
[1054,"A supernova becomes bright enough to be recorded by observers on Earth.","Observers across Asia record a new star.","Astronomy is naked-eye precision.","Light crossed space for millennia before reaching witnesses."],
[1455,"Movable-type printing in Europe begins changing how quickly written ideas reproduce.","Books are becoming easier to multiply.","Mechanical movable type accelerates copying.","Information begins outrunning individual scribes."],
[1609,"Galileo points improved telescopes skyward.","Old diagrams collide with new observations.","Telescopes extend the human eye.","The sky starts returning evidence instead of reassurance."],
[1837,"Electrical telegraph systems turn messages into signals that outrun horses.","Distance begins shrinking for information.","Electric telegraphy links distant places.","Language becomes pulses on wire."],
[1903,"A powered airplane leaves the ground for seconds.","Human flight becomes engineering, not mythology.","Controlled powered flight.","The atmosphere becomes a road."],
[1969,"Humans leave footprints on the Moon while hundreds of millions watch through screens.","Apollo 11 reaches the lunar surface.","Computers guide spacecraft with tiny resources by modern standards.","Earth watches another world almost together."],
[1991,"The World Wide Web begins escaping the laboratory.","Linked documents are becoming public geography.","HTTP, HTML and browsers connect documents.","A link becomes somewhere you can go."],
[2007,"Pocket computers with permanent network connections begin reshaping ordinary behavior.","The network moves into pockets.","Multi-touch smartphones consolidate cameras, maps and web access.","People become persistently reachable."],
[2050,"ARCHIVE UNAVAILABLE. The future refuses to become historical fact early.","Unknown. This is not being presented as history.","Unknown.","NO VERIFIED ARCHIVE // FUTURE"]
];let marks=[];try{marks=JSON.parse(localStorage.getItem("portal-time-marks")||"[]")}catch{}const rail=document.querySelector("#rail");function show(i){i=Math.max(0,Math.min(eras.length-1,+i));rail.value=i;const r=eras[i];year.textContent=r[0]<0?Math.abs(r[0]).toLocaleString()+" BCE":r[0];event.textContent=r[1];world.textContent=r[2];tech.textContent=r[3];signal.textContent=r[4];localStorage.setItem("portal-time","1");localStorage.setItem("portal-time-current",String(r[0]));visited.textContent=marks.length?"MARKED YEARS // "+marks.join(" · "):"MOVE THE TIMELINE OR JUMP"}rail.oninput=()=>show(rail.value);random.onclick=()=>show(Math.floor(Math.random()*eras.length));remember.onclick=()=>{const y=eras[+rail.value][0];const label=y<0?Math.abs(y)+" BCE":String(y);if(!marks.includes(label))marks.push(label);marks=marks.slice(-8);localStorage.setItem("portal-time-marks",JSON.stringify(marks));localStorage.setItem("portal-time-marked","1");window.PortalWorld?.event?.("time-marked","THE TRAVELER LEFT A MARK IN THE ARCHIVE.");window.PortalWorld?.save?.();show(rail.value)};show(6);
</script><script type="module">import{installTravelerHUD}from"../traveler-hud.js";import{installTransitions}from"../transitions.js";installTravelerHUD();installTransitions("time");</script></body></html>
