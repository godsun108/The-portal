<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050908"><title>MACHINE // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#040706;color:#dce9e1;font-family:ui-monospace,monospace}.back{position:fixed;top:18px;left:18px;color:#53645b;text-decoration:none;font-size:9px}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:65px 0;text-align:center}.eye{font-size:9px;letter-spacing:.3em;color:#587064}h1{font:900 clamp(54px,15vw,110px)/.78 Arial Black,sans-serif;letter-spacing:-.06em}canvas{width:100%;aspect-ratio:1.7;border:1px solid #203029;border-radius:18px;background:#07100b;image-rendering:pixelated}.hint{color:#56675e;font-size:9px;line-height:1.8;margin:18px}.go{border:1px solid #2c4437;background:#07100b;color:#829b8d;padding:12px 18px;border-radius:999px;font:9px ui-monospace}</style><script src="../world.js"></script><script src="../world-events.js"></script><script src="../creature.js"></script></head><body><a class="back" href="../">← PORTAL</a><main class="wrap"><div class="eye">CELLULAR MACHINE // TOUCH TO SEED</div><h1>MACHINE</h1><canvas id="c" width="96" height="56"></canvas><p class="hint" id="hint">Tap the field. Simple local rules decide what survives. No creature knows the rules.</p><button class="go" id="clear">RESET WORLD</button></main><script>const c=document.querySelector("#c"),x=c.getContext("2d"),W=c.width,H=c.height;const eventResonance=window.PortalEvents?.active?.id==="resonance";if(eventResonance)document.querySelector(".eye").textContent="CELLULAR MACHINE // FIELD RESONANCE";if(window.PortalCreature?.stage>=1&&window.PortalCreature.seen("machine"))document.querySelector("#hint").textContent="For one frame, a cluster moved against the local rule. It is behaving normally again.";let a=new Uint8Array(W*H);const shard=localStorage.getItem("portal-item-signal-shard")==="1";if(shard){document.querySelector("#hint").textContent="Something you are carrying is interfering with the field. The creatures still do not know the rules.";localStorage.setItem("portal-machine-shard-exposure","1")}function seed(px,py){for(let j=-4;j<=4;j++)for(let i=-4;i<=4;i++)if(Math.random()>.55){let X=(px+i+W)%W,Y=(py+j+H)%H;a[Y*W+X]=1}localStorage.setItem("portal-machine","1")}c.onclick=e=>{const r=c.getBoundingClientRect();seed(Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H))};clear.onclick=()=>a.fill(0);function tick(){let n=new Uint8Array(a.length);for(let y=0;y<H;y++)for(let z=0;z<W;z++){let q=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(i||j)q+=a[((y+j+H)%H)*W+(z+i+W)%W];let k=y*W+z;n[k]=shard?(q===3||(a[k]&&(q===2||q===4))):(q===3||(a[k]&&q===2))}a=n;x.fillStyle="#07100b";x.fillRect(0,0,W,H);x.fillStyle=shard?"#d7c4ff":"#b7dfc8";for(let i=0;i<a.length;i++)if(a[i])x.fillRect(i%W,Math.floor(i/W),1,1);requestAnimationFrame(tick)}seed(48,28);tick();</script></body></html>
