<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLORFALL</title><style>*{box-sizing:border-box}html,body{margin:0;background:#05050a;color:#fff;overflow:hidden;font:12px ui-monospace,monospace;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}#hud{position:fixed;inset:15px;display:flex;justify-content:space-between;pointer-events:none}.p{padding:9px 11px;border:1px solid #ffffff2b;background:#05050acc}.p a{color:#fff;pointer-events:auto}#msg{position:fixed;left:50%;bottom:5%;transform:translateX(-50%);letter-spacing:.14em;text-align:center;width:90%}</style><canvas id="c"></canvas><div id="hud"><div class="p">COLORFALL ◌<br><span id="s"></span></div><div class="p"><a href="../../?station=play">EXIT</a></div></div><div id="msg">CATCH CHROMA // BUILD HARMONY</div><script type="module">import{beginRun,finishRun}from"../protocol.js";import{grantArtifact}from"../state.js";import{physicsState}from"../../physics.js";const c=document.querySelector("#c"),x=c.getContext("2d"),hud=document.querySelector("#s"),msg=document.querySelector("#msg"),P=physicsState();let W,H,dpr,score=0,miss=0,ended=false,drops=[],px=.5,py=.75,run=beginRun("colorfall"),basket={x:0,y:0,w:90,h:18};const hues=[0,45,120,190,270,320];function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);basket.y=H-70;if(!basket.x)basket.x=W/2}addEventListener("resize",resize);resize();function spawn(){drops.push({x:20+Math.random()*(W-40),y:-20,vx:0,vy:1.2+Math.random()*1.5,r:9+Math.random()*8,h:hues[Math.floor(Math.random()*hues.length)]})}setInterval(()=>!ended&&spawn(),430);function point(e){px=e.clientX/W;py=e.clientY/H;basket.x=e.clientX}addEventListener("pointermove",point,{passive:true});addEventListener("pointerdown",point,{passive:true});function end(){if(ended)return;ended=true;const artifact=score>=24?(P.mode==="converged"?"prismatic-core":"color-seed"):"chroma-dust";grantArtifact({id:artifact,source:"colorfall"});finishRun(run,{score,miss,artifact,physics:P.mode});msg.textContent="COLORFALL COMPLETE // "+artifact.toUpperCase()}function frame(){x.clearRect(0,0,W,H);const gx=P.mode==="converged"?(px-.5)*.055:0,gy=P.mode==="converged"?.035+(py*.025):.055;for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.vx+=gx;d.vy+=gy;const cap=P.mode==="converged"?3.8:4.2;d.vx=Math.max(-cap,Math.min(cap,d.vx));d.vy=Math.min(cap,d.vy);d.x+=d.vx;d.y+=d.vy;if(d.x<d.r||d.x>W-d.r)d.vx*=-.75;if(d.y>basket.y-d.r&&d.y<basket.y+basket.h&&Math.abs(d.x-basket.x)<basket.w/2){score+=2;drops.splice(i,1);continue}if(d.y>H+25){miss++;drops.splice(i,1);if(miss>=10)end();continue}x.beginPath();x.arc(d.x,d.y,d.r,0,7);x.fillStyle=`hsl(${d.h} 90% 62%)`;x.shadowBlur=22;x.shadowColor=x.fillStyle;x.fill();x.shadowBlur=0}const grad=x.createLinearGradient(basket.x-basket.w/2,0,basket.x+basket.w/2,0);hues.forEach((h,i)=>grad.addColorStop(i/(hues.length-1),`hsl(${h} 90% 62%)`));x.fillStyle=grad;x.fillRect(basket.x-basket.w/2,basket.y,basket.w,basket.h);hud.textContent=`HARMONY ${score} // MISSED ${miss}/10 // ${P.mode.toUpperCase()} PHYSICS`;if(!ended)requestAnimationFrame(frame)}requestAnimationFrame(frame);setTimeout(end,50000)</script>
