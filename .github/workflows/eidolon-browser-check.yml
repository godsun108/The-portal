name: EIDOLON browser syntax gate
on:
  push:
    paths:
      - 'eidolon-native-motion/**'
      - 'eidolon-motion-foundry/**'
      - 'scripts/check-eidolon.cjs'
      - '.github/workflows/eidolon-browser-check.yml'
  pull_request:
    paths:
      - 'eidolon-native-motion/**'
      - 'eidolon-motion-foundry/**'
      - 'scripts/check-eidolon.cjs'
      - '.github/workflows/eidolon-browser-check.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-eidolon.cjs
