name: EIDOLON automated mobile smoke
on:
  push:
    paths:
      - 'eidolon-native-motion/**'
      - 'eidolon-human-base/assets/**'
      - 'scripts/eidolon-mobile-smoke.cjs'
      - '.github/workflows/eidolon-mobile-smoke.yml'
  pull_request:
    paths:
      - 'eidolon-native-motion/**'
      - 'eidolon-human-base/assets/**'
      - 'scripts/eidolon-mobile-smoke.cjs'
      - '.github/workflows/eidolon-mobile-smoke.yml'
  workflow_dispatch:
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/eidolon-http.log 2>&1 &
      - name: Check syntax and run mobile browser
        run: |
          node scripts/check-eidolon.cjs
          node scripts/eidolon-mobile-smoke.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eidolon-mobile-smoke
          path: eidolon-mobile-smoke.png
          if-no-files-found: ignore
