<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090713"><title>DREAM // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 35%,#302044,#08070d 62%);color:#eee;font-family:ui-monospace,monospace;display:grid;place-items:center;padding:28px}.back{position:absolute;top:22px;left:22px;color:#74627c;text-decoration:none;font-size:9px}.d{text-align:center;max-width:680px}.sig{font-size:clamp(90px,28vw,190px);filter:drop-shadow(0 0 30px #a96dcc55)}h1{font:900 clamp(54px,15vw,110px)/.78 Arial Black,sans-serif;letter-spacing:-.06em;margin:20px}.story{color:#a08da8;line-height:2;min-height:100px;font-size:11px}.go{border:1px solid #513e59;background:#0b080e;color:#b9a4c0;padding:14px 22px;border-radius:999px;font:9px ui-monospace;letter-spacing:.18em}</style><script src="../world.js"></script><script src="../reality.js"></script></head><body><a class="back" href="../">← PORTAL</a><main class="d"><div class="sig" id="sig"></div><h1>DREAM</h1><p class="story" id="story"></p><button class="go" id="go">DREAM AGAIN</button><div id="artifact" style="display:none;margin-top:34px"><button id="take" class="go">TAKE THE BLACK FEATHER</button><p style="color:#66576d;font-size:9px">It was not here when you arrived.</p></div></main><script>const a=["an elevator","a forest","your childhood kitchen","a city underwater","an empty airport","a staircase in the ocean","a house with no exterior"],b=["knows your name","is waiting for rain","contains one impossible door","is slowly rotating","has forgotten gravity","is broadcasting to the Moon","exists for eleven minutes"],c=["Do not explain it.","You have been here before.","Something small follows you home.","Nobody else notices.","The clock is going backward.","There is music behind the wall.","You wake up holding a key."];let dc=Number(localStorage.getItem("portal-dream-count")||0);function historyDream(){const W=window.PortalWorld?.state,scars=W?.scars||[];if(scars.length<4)return null;const id=localStorage.getItem("portal-passport-id")||"NEW",n=dc+scars.length+[...id].reduce((a,x)=>a+x.charCodeAt(0),0),one=scars[n%scars.length],two=scars[(n*3+1)%scars.length];return "You dream of "+one.replaceAll("-"," ")+". Behind it is "+two.replaceAll("-"," ")+". The dream refuses to say which happened first."}function dream(){dc++;localStorage.setItem("portal-dream-count",dc);sig.textContent=["◌","⌁","◇","∞","☾","⌬"][Math.floor(Math.random()*6)];const W=window.PortalWorld?.state,D=window.PortalWorld?.divergence,R=window.PortalReality,hist=historyDream();if(R?.strong_quake&&Date.now()-R.strong_quake.observed_at<21600000){story.textContent="The ground moves somewhere outside the dream. "+R.strong_quake.title+" // M"+R.strong_quake.mag.toFixed(1)+". This part is real.";sig.textContent="⌁"}else if(hist&&dc%3===0){story.textContent=hist;sig.textContent="⌬"}else if(D?.dreamTone==="familiar"&&Math.random()<.3){story.textContent="You enter a room you remember choosing not to enter. It remembers you anyway.";sig.textContent="◐"}else if(D?.dreamTone==="missing"&&Math.random()<.3){story.textContent="A hallway ends where you are certain a door used to be. Nobody else remembers the door.";sig.textContent="◑"}else if(localStorage.getItem("portal-numbers-three")==="1"&&dc%4===0){let tx=null;try{tx=JSON.parse(localStorage.getItem("portal-numbers-last")||"null")}catch(e){}story.textContent=tx?"Seven groups are written across the ceiling. The last one is "+tx.code.split("-").at(-1)+". You know you have seen it before.":"A sequence repeats behind the wall. You wake before the final group.";sig.textContent="⌁";localStorage.setItem("portal-numbers-dream","1")}else if(W?.returnBand==="days"||W?.returnBand==="long"){story.textContent="You return to a room that continued existing while you were gone. Something has moved closer to the door.";sig.textContent="◌";localStorage.setItem("portal-return-dream","1")}else if(W?.scars?.includes("moonless")&&Math.random()<.4){story.textContent="You look up. The Moon is missing. Everyone else insists it was never there.";sig.textContent="●"}else if(W?.scars?.includes("one-life-lost")&&Math.random()<.35){story.textContent="You find an arcade cabinet with your name scratched out. It will not turn on.";sig.textContent="◇"}else story.textContent="You find "+a[Math.floor(Math.random()*a.length)]+". It "+b[Math.floor(Math.random()*b.length)]+". "+c[Math.floor(Math.random()*c.length)];localStorage.setItem("portal-dream","1");if(dc>=3&&!localStorage.getItem("portal-item-feather"))artifact.style.display="block"}go.onclick=dream;take.onclick=()=>{localStorage.setItem("portal-item-feather","1");localStorage.setItem("portal-arcade","1");artifact.innerHTML="<p style=\"color:#bca9c5\">THE FEATHER FOLLOWS YOU.</p>"};dream();</script></body></html>
