<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09080d"><title>TIME MACHINE // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle,#21162c,#07070a 58%);color:#eee;font-family:ui-monospace,monospace;display:grid;place-items:center;padding:28px}.back{position:absolute;top:22px;left:22px;color:#665d70;text-decoration:none;font-size:9px}.box{text-align:center;max-width:680px}.eye{font-size:9px;letter-spacing:.3em;color:#76677d}h1{font:900 clamp(52px,15vw,110px)/.78 Arial Black,sans-serif;letter-spacing:-.06em}.year{font:900 clamp(70px,22vw,160px)/1 Arial Black,sans-serif;color:#b9a3c6}.event{min-height:80px;color:#95899b;line-height:1.8;font-size:11px}.go{border:1px solid #45384c;background:#0b080d;color:#b5a6bb;padding:14px 22px;border-radius:999px;font:9px ui-monospace;letter-spacing:.18em;cursor:pointer}</style></head><body><a class="back" href="../">← PORTAL</a><main class="box"><div class="eye">TEMPORAL VIEWER // ARCHIVE FRAGMENTS</div><h1>TIME<br>MACHINE</h1><div class="year" id="year"></div><p class="event" id="event"></p><button class="go" id="go">JUMP</button></main><script>const x=[[-13000,"Humans are already making art, tools, stories, and journeys through landscapes that would look alien to you."],[1054,"A supernova becomes bright enough to be recorded by observers on Earth. Its remnant will later be called the Crab Nebula."],[1455,"Movable-type printing in Europe is beginning to change how quickly written ideas can reproduce."],[1609,"Galileo points improved telescopes skyward and finds a universe less tidy than inherited diagrams suggested."],[1837,"Electrical telegraph systems are turning messages into signals that can outrun horses."],[1903,"A powered airplane leaves the ground for seconds. The atmosphere has become a road."],[1969,"Humans leave footprints on the Moon while hundreds of millions watch through electronic screens."],[1991,"The World Wide Web begins escaping the laboratory. Links are about to become geography."],[2007,"Pocket computers with permanent network connections begin changing ordinary human behavior."],[2050,"ARCHIVE UNAVAILABLE. The future refuses to become a historical fact early."]];function jump(){const r=x[Math.floor(Math.random()*x.length)];year.textContent=r[0]<0?Math.abs(r[0])+" BCE":r[0];event.textContent=r[1];localStorage.setItem("portal-time","1")}go.onclick=jump;jump();</script></body></html>
