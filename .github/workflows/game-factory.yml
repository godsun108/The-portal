name: Game Factory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game-factory/**'
      - 'games/**'
      - 'arcade/cabinets.json'
      - '.github/workflows/game-factory.yml'
permissions:
  contents: read
jobs:
  validate-and-playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA
        run: npm install --no-audit --no-fund
      - name: Validate factory contracts
        run: node --check game-factory/game-factory.cjs && node game-factory/game-factory.cjs --validate
      - name: Test systemic world runtime
        run: node game-factory/qa/world-runtime.test.cjs
      - name: Test shared combat runtime
        run: node game-factory/qa/combat-runtime.test.cjs
      - name: Validate mechanic composition
        run: node game-factory/mechanic-engine.cjs
      - name: Generate isolated candidates
        run: |
          for spec in game-factory/examples/*.json; do
            node game-factory/game-factory.cjs "$spec"
          done
          for batch in game-factory/batches/*.json; do
            node game-factory/batch-runner.cjs "$batch"
          done
      - name: Score generated candidates
        run: node game-factory/selection-engine.cjs
      - name: Build promotion evidence
        run: node game-factory/promotion-engine.cjs
      - name: Build release queue
        run: node game-factory/release-queue.cjs
      - name: Validate AEGIS combat lab source
        run: grep -q 'combat-lab-start' games/aegis-combat-lab-01/index.html && grep -q 'runtime/combat.js' games/aegis-combat-lab-01/index.html
      - name: Validate AEGIS world lab source
        run: grep -q 'world-lab-start' games/aegis-world-lab-01/index.html && grep -q 'runtime/world.js' games/aegis-world-lab-01/index.html
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start candidate preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/game-factory-http.log 2>&1 &
          echo $! > /tmp/game-factory-http.pid
      - name: Browser playtest generated candidates
        env:
          FACTORY_PREVIEW_URL: http://127.0.0.1:4173
        run: |
          cp game-factory/qa/factory-playtest.spec.cjs e2e/factory-playtest.spec.cjs
          npx playwright test e2e/factory-playtest.spec.cjs e2e/aegis-combat-lab.spec.cjs e2e/aegis-world-lab.spec.cjs --project=chromium
      - name: Capture candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-factory-evidence
          path: |
            playwright-report/
            test-results/
            game-factory/reports/
          if-no-files-found: ignore
          retention-days: 14
