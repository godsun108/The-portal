name: PORTAL World TV stream health sample
on:
  pull_request:
    paths:
      - 'tv-channel-lab.html'
      - 'tv-cinema-classics.json'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    - cron: '11 10 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/probe-world-tv-streams.mjs
      - run: node scripts/probe-world-tv-streams.mjs
      - name: Verify bounded HLS video decode evidence
        run: node scripts/probe-world-tv-decode.mjs
      - name: Validate authorized publication manifest (fail closed)
        run: node scripts/build-authorized-tv-catalog.mjs
      - name: Install Chromium for bounded browser checks
        run: npm ci && npx playwright install --with-deps chromium
      - name: Check browser playback evidence
        run: node scripts/test-world-tv-browser-playback.mjs
      - name: Triage candidate review queue
        run: node scripts/review-world-tv-candidates.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-world-tv-stream-health
          path: |
            world-tv-stream-health.json
            world-tv-candidate-review.json
            world-tv-decode-evidence.json
            world-tv-browser-evidence.json
            tv-publication-gate-report.json
            tv-authorized-channels.json
          if-no-files-found: warn
          retention-days: 14
