<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030406"><title>WINDOW // THE PORTAL</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030406;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100svh;overflow-x:hidden;background:radial-gradient(circle at 50% 20%,#171a20,#030406 60%)}.back{position:fixed;z-index:20;top:20px;left:20px;color:#747983;text-decoration:none;font-size:9px;letter-spacing:.18em}.room{width:min(1080px,100%);margin:auto;padding:64px 18px 40px;text-align:center}.window{position:relative;height:min(67svh,650px);min-height:390px;border:clamp(10px,2vw,18px) solid #101216;border-radius:7px;overflow:hidden;background:#0c1118;box-shadow:0 35px 120px #000,0 0 0 1px #343942,inset 0 0 0 1px #000;isolation:isolate;touch-action:pan-y}.world{position:absolute;inset:-7%;transform:translate3d(var(--px,0),var(--py,0),0) scale(1.08);transition:transform .18s ease-out}.sky{position:absolute;inset:0;background:linear-gradient(#172438,#91a3a5 65%,#ccd0c8)}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 0 1px,transparent 1.2px);background-size:67px 61px;opacity:0}.orb{position:absolute;width:clamp(48px,9vw,90px);aspect-ratio:1;border-radius:50%;left:72%;top:18%;background:#ffe0a1;box-shadow:0 0 70px #ffd88c88}.far,.near{position:absolute;left:-5%;width:110%;bottom:-4%}.far{height:57%;background:#253b3c;clip-path:polygon(0 48%,10% 31%,18% 41%,28% 19%,37% 39%,49% 9%,61% 38%,71% 22%,82% 43%,91% 25%,100% 45%,100% 100%,0 100%);opacity:.78;transform:translateX(calc(var(--px,0) * -.22))}.near{height:39%;background:#0b1817;clip-path:polygon(0 39%,13% 20%,28% 46%,43% 13%,58% 38%,73% 18%,86% 43%,100% 22%,100% 100%,0 100%);transform:translateX(calc(var(--px,0) * -.42))}.water{position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(#355866aa,#0b2634);display:none;overflow:hidden}.water:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(174deg,transparent 0 12px,#ffffff10 13px 14px);animation:water 8s linear infinite}.weather{position:absolute;inset:-20%;pointer-events:none}.rain{display:none;background-image:repeating-linear-gradient(104deg,transparent 0 28px,#dcecff44 29px 30px,transparent 31px 58px);animation:rain .65s linear infinite}.snow{display:none;background-image:radial-gradient(#fff9 0 1px,transparent 1.5px);background-size:38px 44px;animation:snow 9s linear infinite}.fireflies{display:none;background-image:radial-gradient(#dfff8d 0 2px,transparent 2.5px);background-size:113px 97px;filter:drop-shadow(0 0 6px #dfff8d);animation:drift 8s ease-in-out infinite}.clouds{position:absolute;inset:8% -20% auto;height:32%;opacity:.18;background:radial-gradient(ellipse at 20% 60%,#fff 0 10%,transparent 11%),radial-gradient(ellipse at 45% 35%,#fff 0 13%,transparent 14%),radial-gradient(ellipse at 72% 60%,#fff 0 12%,transparent 13%);filter:blur(18px);animation:cloud 24s linear infinite}.glass{position:absolute;inset:0;z-index:8;background:linear-gradient(118deg,#ffffff0c 0 15%,transparent 25% 62%,#ffffff08 70%,transparent 78%);box-shadow:inset 0 0 90px #0005;pointer-events:none}.mullion{position:absolute;z-index:9;background:#111318;box-shadow:0 0 0 1px #343840}.mullion.v{top:0;bottom:0;width:9px;left:50%}.mullion.h{left:0;right:0;height:9px;top:58%}.caption{position:absolute;z-index:11;left:18px;bottom:16px;text-align:left;color:#ffffffa8;font-size:8px;letter-spacing:.14em;line-height:1.7}.touch{position:absolute;z-index:10;border:1px solid #fff5;border-radius:50%;width:10px;height:10px;transform:translate(-50%,-50%);animation:ripple .8s ease-out forwards;pointer-events:none}.anomaly{position:absolute;z-index:7;display:none;left:50%;top:45%;font-size:clamp(28px,7vw,68px);text-shadow:0 0 30px #fff;opacity:.7;animation:watch 5s ease-in-out forwards}h1{font:900 clamp(58px,15vw,118px)/.76 Arial Black,Impact,sans-serif;letter-spacing:-.07em;margin:36px 0 12px}.meta{color:#727883;font-size:9px;line-height:1.8;letter-spacing:.08em}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:20px}.go{border:1px solid #353941;background:#090b0e;color:#aeb5bd;padding:13px 18px;border-radius:999px;font:9px ui-monospace,monospace;letter-spacing:.13em;cursor:pointer}.go:active{transform:scale(.97)}@keyframes rain{to{transform:translate(-45px,80px)}}@keyframes snow{to{transform:translate(20px,90px)}}@keyframes cloud{to{transform:translateX(20%)}}@keyframes drift{50%{transform:translate(3%,2%)}}@keyframes water{to{transform:translateX(40px)}}@keyframes ripple{to{width:170px;height:170px;opacity:0}}@keyframes watch{0%,100%{opacity:0}20%,72%{opacity:.7}80%{transform:translateX(12px)}}@media(max-width:600px){.room{padding-top:58px}.window{height:62svh;min-height:420px}.mullion.h{top:62%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<a class="back" href="../">← PORTAL</a><main class="room"><div class="window" id="frame"><div class="world" id="world"><div class="sky" id="sky"></div><div class="stars" id="stars"></div><div class="orb" id="orb"></div><div class="clouds" id="clouds"></div><div class="far" id="far"></div><div class="water" id="water"></div><div class="near" id="near"></div><div class="weather rain" id="rain"></div><div class="weather snow" id="snow"></div><div class="weather fireflies" id="fireflies"></div><div class="anomaly" id="anomaly">◌</div></div><div class="glass"></div><div class="mullion v"></div><div class="mullion h"></div><div class="caption" id="caption"></div></div><h1>WINDOW</h1><div class="meta">NOT A CAMERA. NOT A DESTINATION.<br>A PROCEDURAL PLACE THAT EXISTS WHILE YOU ARE LOOKING AT IT.</div><div class="controls"><button class="go" id="move">OPEN ANOTHER WINDOW</button><button class="go" id="tilt">ENABLE TILT</button></div></main><script>
localStorage.setItem("portal-window","1");const $=id=>document.getElementById(id),frame=$("frame"),world=$("world"),sky=$("sky"),orb=$("orb"),far=$("far"),near=$("near"),water=$("water"),stars=$("stars"),rain=$("rain"),snow=$("snow"),fireflies=$("fireflies"),caption=$("caption"),anomaly=$("anomaly");
const scenes=[
{n:"FJORD // BLUE HOUR",sky:"linear-gradient(#101b30,#587684 62%,#b1b8ad)",far:"#314b4d",near:"#0c1c1a",orb:"#d9e6e3",water:1},
{n:"DESERT // LAST LIGHT",sky:"linear-gradient(#35213f,#ba6252 55%,#e5a066)",far:"#744231",near:"#2a1815",orb:"#ffd17d"},
{n:"HIGH ALPINE // FIRST LIGHT",sky:"linear-gradient(#102941,#6e9caf 58%,#c5d5d2)",far:"#617273",near:"#1c2c2c",orb:"#fff0bd",snow:1},
{n:"OPEN OCEAN // AFTERNOON",sky:"linear-gradient(#39768e,#86b4c0 62%,#d0dad7)",far:"#27586b",near:"#123442",orb:"#fff2c2",water:1},
{n:"POLAR NIGHT // 02:13",sky:"linear-gradient(#020712,#092438 62%,#16464b)",far:"#10282d",near:"#061316",orb:"#b5e4dc",stars:1,snow:1},
{n:"STORM COAST // 16:04",sky:"linear-gradient(#111820,#4d5960 58%,#858b87)",far:"#293438",near:"#10191b",orb:"#b9b4a5",water:1,rain:1},
{n:"FOREST RAIN // MORNING",sky:"linear-gradient(#152b2c,#55756b 58%,#a5aaa0)",far:"#244235",near:"#081b11",orb:"#cbd7bd",rain:1},
{n:"FIREFLY VALLEY // 22:48",sky:"linear-gradient(#030713,#0c1b24 60%,#182c28)",far:"#10251f",near:"#06130d",orb:"#d7d0a4",stars:1,fireflies:1},
{n:"MARS THAT NEVER WAS // 19:02",sky:"linear-gradient(#291517,#9b4937 62%,#c9784e)",far:"#673326",near:"#28120e",orb:"#e8b28b"},
{n:"MOONLESS LAKE // 03:31",sky:"linear-gradient(#01040a,#071725 65%,#18313a)",far:"#0a2025",near:"#030d0f",orb:"#75898f",water:1,stars:1}
];let last=-1;
function openWindow(){let i;do{i=Math.floor(Math.random()*scenes.length)}while(i===last);last=i;const s=scenes[i];frame.animate([{filter:"brightness(1)"},{filter:"brightness(.05)"},{filter:"brightness(1)"}],{duration:650});setTimeout(()=>{sky.style.background=s.sky;far.style.background=s.far;near.style.background=s.near;orb.style.background=s.orb;orb.style.boxShadow="0 0 70px "+s.orb+"88";water.style.display=s.water?"block":"none";stars.style.opacity=s.stars?".72":"0";rain.style.display=s.rain?"block":"none";snow.style.display=s.snow?"block":"none";fireflies.style.display=s.fireflies?"block":"none";caption.innerHTML=s.n+"<br>INSTANCE "+Math.random().toString(36).slice(2,8).toUpperCase();if(Math.random()<.09){setTimeout(()=>{anomaly.style.display="block";localStorage.setItem("portal-window-anomaly","1");setTimeout(()=>anomaly.style.display="none",5000)},1400)}},260)}
frame.addEventListener("pointermove",e=>{const r=frame.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;world.style.setProperty("--px",(x*-16)+"px");world.style.setProperty("--py",(y*-10)+"px")});frame.addEventListener("pointerleave",()=>{world.style.setProperty("--px","0px");world.style.setProperty("--py","0px")});frame.addEventListener("pointerdown",e=>{const r=frame.getBoundingClientRect(),q=document.createElement("i");q.className="touch";q.style.left=(e.clientX-r.left)+"px";q.style.top=(e.clientY-r.top)+"px";frame.appendChild(q);setTimeout(()=>q.remove(),850)});
$("tilt").onclick=async()=>{try{if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){const p=await DeviceOrientationEvent.requestPermission();if(p!=="granted")throw 0}addEventListener("deviceorientation",e=>{const x=Math.max(-1,Math.min(1,(e.gamma||0)/30)),y=Math.max(-1,Math.min(1,(e.beta||0)/45));world.style.setProperty("--px",(x*-18)+"px");world.style.setProperty("--py",(y*-12)+"px")});$("tilt").textContent="TILT // ON"}catch(e){$("tilt").textContent="TILT UNAVAILABLE"}};
$("move").onclick=openWindow;openWindow();
</script></body></html>
