name: PORTAL Cinema intake triage
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tv-cinema-classics.json'
      - 'scripts/cinema-intake-triage.mjs'
      - '.github/workflows/cinema-intake-triage.yml'
  schedule:
    - cron: '43 12 * * 0'
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/cinema-intake-triage.mjs
      - run: node scripts/cinema-intake-triage.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: portal-cinema-intake
          path: tv-cinema-intake-report.json
          retention-days: 14
