<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE WORKSHOP // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#050607;color:#c9d3dc;font-family:ui-monospace;padding:24px}.wrap{width:min(820px,96vw);margin:7vh auto}.ey{font-size:9px;letter-spacing:.25em;color:#63717d}h1{font:900 clamp(54px,14vw,112px)/.76 Arial Black;letter-spacing:-.07em;margin:25px 0}.dim{color:#59656f;font-size:10px;line-height:1.8}.bench{display:grid;grid-template-columns:repeat(7,minmax(32px,56px));gap:6px;margin:28px 0}.cell{aspect-ratio:1;border:1px solid #27313a;background:#090c0f;color:#60707d;font:18px ui-monospace}.cell.on{background:#dce8ef;color:#071018;box-shadow:0 0 18px #cde7ff22}.controls{display:flex;gap:8px;flex-wrap:wrap}.control,input{border:1px solid #34414b;background:#070a0d;color:#bfcbd5;padding:12px;font:9px ui-monospace;letter-spacing:.12em}.object{margin-top:28px;border-left:1px solid #45525d;padding:18px}.sigil{font-size:32px;letter-spacing:-.12em;white-space:pre;line-height:.72}a{color:#71808b;text-decoration:none;font-size:9px}</style></head><body><main class="wrap" id="root"></main><script type="module">import{hasArtifact,grantArtifact}from"../games/state.js";const root=document.querySelector("#root"),KEY="portal-workshop-object-v1";if(!hasArtifact("operator")){root.innerHTML='<div class="ey">WORK SURFACE // AUTHORIZATION REQUIRED</div><h1>NO<br>INTERFACE</h1><p class="dim">Power is not permission.</p><a href="../behind/">RETURN BEHIND</a>'}else{let cells=new Set(),saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved?.cells)cells=new Set(saved.cells)}catch{}root.innerHTML='<a href="../behind/">← BEHIND</a><div class="ey" style="margin-top:32px">OPERATOR // ACCEPTED</div><h1>THE<br>WORKSHOP</h1><p class="dim">The Portal remembers what is built here. Construct a form. Name it. Commit it to this browser.</p><input id="name" maxlength="24" placeholder="OBJECT NAME"><div class="bench" id="bench"></div><div class="controls"><button class="control" id="commit">COMMIT OBJECT</button><button class="control" id="clear">CLEAR BENCH</button></div><section class="object" id="object"></section>';const bench=document.querySelector("#bench"),name=document.querySelector("#name"),object=document.querySelector("#object");if(saved?.name)name.value=saved.name;function draw(){bench.innerHTML="";for(let i=0;i<35;i++){const b=document.createElement("button");b.className="cell"+(cells.has(i)?" on":"");b.textContent=cells.has(i)?"■":"·";b.onclick=()=>{cells.has(i)?cells.delete(i):cells.add(i);draw()};bench.append(b)}renderObject()}function renderObject(){if(!saved){object.innerHTML='<span class="dim">NO COMMITTED OBJECT</span>';return}const rows=[];for(let y=0;y<5;y++){let row="";for(let x=0;x<7;x++)row+=saved.cells.includes(y*7+x)?"■":"·";rows.push(row)}object.innerHTML='<div class="ey">PERSISTENT CONSTRUCTION</div><h2>'+escapeHtml(saved.name)+'</h2><div class="sigil">'+rows.join("\n")+'</div><p class="dim">BUILT '+new Date(saved.builtAt).toLocaleString()+' // LOCAL PORTAL STATE</p>'}function escapeHtml(v){const d=document.createElement("div");d.textContent=v;return d.innerHTML}commit.onclick=()=>{const n=name.value.trim();if(!n||cells.size<3){object.innerHTML='<span class="dim">CONSTRUCTION REJECTED // NAME + AT LEAST 3 CELLS REQUIRED</span>';return}saved={schema:"portal.workshop.object.v1",name:n,cells:[...cells].sort((a,b)=>a-b),builtAt:Date.now()};localStorage.setItem(KEY,JSON.stringify(saved));grantArtifact("first-construction");document.dispatchEvent(new CustomEvent("portal:workshop-commit",{detail:saved}));renderObject()};clear.onclick=()=>{cells.clear();draw()};draw()}</script></body></html>
<script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>
<script type="module">import{installTransitions}from"../transitions.js";installTransitions("workshop");</script>
