<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PORTAL TV regression checks</title><style>body{font:16px system-ui;background:#0a1424;color:#eafffa;max-width:740px;margin:auto;padding:24px}li{margin:10px 0} .ok{color:#91ffb7}.fail{color:#ffaaa0}button{padding:12px;background:#244f63;color:white;border:1px solid #75b5b8;border-radius:8px}</style></head><body><h1>PORTAL TV regression checks</h1><p>Read-only source and DOM-contract checks. This page never starts streams or changes saved channels.</p><button id="run">Run checks</button><ol id="results"></ol><p id="summary"></p><script>(()=>{'use strict';const results=document.getElementById('results'),summary=document.getElementById('summary');async function run(){results.replaceChildren();summary.textContent='Checking…';let passed=0,failed=0;function check(name,ok){const li=document.createElement('li');li.className=ok?'ok':'fail';li.textContent=(ok?'PASS · ':'FAIL · ')+name;results.append(li);ok?passed++:failed++}try{const response=await fetch('tv.html',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const source=await response.text(),doc=new DOMParser().parseFromString(source,'text/html');const ids=[...doc.querySelectorAll('[id]')].map(el=>el.id);check('All static element IDs unique',new Set(ids).size===ids.length);check('Exactly one main TV remote',doc.querySelectorAll('.main-tv > .portal-remote').length===1);check('Main remote contains Guide and Fullscreen',!!doc.getElementById('remoteGuide')&&!!doc.getElementById('remoteFullscreen'));check('Four stable personal remote actions', ['previous','next','last','favorite'].every(action=>source.includes("dataset.portalRemoteAction='"+action+"'")));check('Legacy personal remote has a stable ID',source.includes("personalRemote.id='portalPersonalRemoteLegacy'"));check('Legacy remote listeners remain attached',source.includes('remotePrev.onclick=()=>surfPersonal(-1)')&&source.includes('remoteNext.onclick=()=>surfPersonal(1)'));check('Existing personal playback retains saved last station',source.includes('localStorage.setItem(LAST_KEY,x.url)'));check('Unified remote retains original button nodes',source.includes('remote.append(b)')&&source.includes('tools.append(b)'));check('Playback error and stall handlers retained',source.includes("v.addEventListener('error'")&&source.includes("v.addEventListener('stalled'"));check('Playback report still available',source.includes('Copy playback report for Turbo'));const scripts=[...doc.querySelectorAll('script:not([src])')];let syntaxErrors=[];for(let i=0;i<scripts.length;i++){try{new Function(scripts[i].textContent)}catch(e){syntaxErrors.push('script '+(i+1)+': '+e.message)}}check('All '+scripts.length+' inline scripts parse',syntaxErrors.length===0);if(syntaxErrors.length){const li=document.createElement('li');li.textContent=syntaxErrors.join('; ');results.append(li)}}catch(e){check('tv.html fetched successfully',false);const li=document.createElement('li');li.textContent=String(e);results.append(li)}summary.textContent=passed+' passed · '+failed+' failed. These checks do not replace iPhone playback testing.'}document.getElementById('run').onclick=run;run()})();</script></body></html>
