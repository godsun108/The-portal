<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS Integrated Lab 01</title><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#eef6ff;font:13px ui-monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block;cursor:crosshair}header{position:fixed;inset:10px 12px auto;display:flex;justify-content:space-between;pointer-events:none}.help{position:fixed;left:12px;bottom:12px}.state{position:fixed;right:12px;bottom:12px;text-align:right}</style></head><body><header><span>AEGIS // INTEGRATED LAB 01</span><span id="hud"></span></header><canvas></canvas><div class="help">WASD MOVE/DRIVE · CLICK FIRE · E VEHICLE · F MISSION · R RESET</div><div class="state" id="state"></div><script type="module">
import{health,fireWeapon,weapons,enemy,intersects,clamp,seeded}from"../runtime/combat.js";import{responseSystem,reputation,wallet,vehicle,mission,responseDirector,memoryStore}from"../runtime/world.js";import{beginRun,event,finishRun}from"../protocol.js";
const c=document.querySelector("canvas"),g=c.getContext("2d"),hud=document.querySelector("#hud"),stateEl=document.querySelector("#state"),store=memoryStore("aegis-integrated-lab-01");function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);
let keys=new Set,aim={x:.5,y:.2},run,p,car,heat,rep,cash,job,shots=[],hostiles=[],responders,done=false,last=performance.now(),lastShot=0,rnd=seeded(808);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),broker={x:.13,y:.2},beacon={x:.86,y:.78};
function spawnResponder(level){const e=enemy({x:.1+level*.14,y:.08,speed:.08+level*.015,hp:20+level*6,kind:"response-"+level});return e}
function reset(clear=false){if(clear)store.clear();const saved=store.load({credits:40,civic:0,frontier:0});run=beginRun("aegis-integrated-lab-01");p={x:.18,y:.8,inVehicle:false,health:health(100),weapon:weapons.pulse};car=vehicle({id:"runner-01",x:.29,y:.73,speed:.43});heat=responseSystem({decay:5});rep=reputation({civic:saved.civic,frontier:saved.frontier});cash=wallet(saved.credits);job=mission({id:"hot-courier",title:"Hot Courier",steps:["Meet broker","Clear ambush","Deliver package","Return"]});shots=[];hostiles=[];responders=responseDirector({spawn:spawnResponder});done=false;event(run,"integrated-lab-start",{saved})}reset();
function save(){store.save({credits:cash.balance,civic:rep.get("civic"),frontier:rep.get("frontier")})}
function spawnAmbush(){hostiles=[enemy({x:.55,y:.38,hp:25,speed:.11}),enemy({x:.68,y:.4,hp:25,speed:.12}),enemy({x:.62,y:.3,hp:32,speed:.09})];event(run,"ambush-start",{count:hostiles.length})}
function interact(){const a=p.inVehicle?car:p;if(job.state==="available"&&dist(a,broker)<.11){job.start();job.advance();spawnAmbush();return}if(job.state==="active"&&job.step==="Deliver package"&&dist(a,beacon)<.12){job.advance();cash.credit(75);rep.add("frontier",2);heat.add(18);save();event(run,"delivery",{credits:75});return}if(job.state==="active"&&job.step==="Return"&&dist(a,broker)<.11){job.advance();cash.credit(125);rep.add("civic",3);save();finishRun(run,{result:"clear",credits:cash.balance,heat:heat.level});done=true}}
function shoot(t=performance.now()){if(p.inVehicle||done||t-lastShot<160)return;lastShot=t;shots.push(...fireWeapon({weapon:p.weapon,x:p.x,y:p.y,dx:aim.x-p.x,dy:aim.y-p.y,rnd}));heat.add(4);event(run,"world-shot")}
c.addEventListener("pointermove",e=>{aim.x=e.clientX/innerWidth;aim.y=e.clientY/innerHeight});c.addEventListener("pointerdown",()=>shoot());addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());const k=e.key.toLowerCase();if(k==="f")interact();if(k==="r")reset(true);if(k==="e"){if(!p.inVehicle&&dist(p,car)<.1&&car.enter()){p.inVehicle=true;event(run,"vehicle-enter")}else if(p.inVehicle&&car.exit()){p.inVehicle=false;p.x=clamp(car.x+.06,.03,.97);p.y=car.y;event(run,"vehicle-exit")}}});addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function frame(t){const dt=Math.min(.04,(t-last)/1000);last=t;let dx=0,dy=0;if(keys.has("a"))dx--;if(keys.has("d"))dx++;if(keys.has("w"))dy--;if(keys.has("s"))dy++;if(!done){if(p.inVehicle){car.drive(dx,dy,dt);car.x=clamp(car.x,.03,.97);car.y=clamp(car.y,.06,.94);p.x=car.x;p.y=car.y}else{const m=Math.hypot(dx,dy)||1;p.x=clamp(p.x+dx/m*.25*dt,.03,.97);p.y=clamp(p.y+dy/m*.25*dt,.06,.94)}shots.forEach(s=>s.step(dt));shots=shots.filter(s=>s.alive);const targets=[...hostiles,...responders.sync(heat.level)];for(const e of targets){e.step(dt,p);for(const s of shots)if(s.alive&&e.health.alive&&intersects(s,e,.035)){s.alive=false;e.hit(s.damage);if(!e.health.alive){event(run,"enemy-defeat",{kind:e.kind});if(String(e.kind).startsWith("response"))heat.add(12)}}if(e.health.alive&&intersects(e,p,.045)){p.health.damage(18*dt);heat.add(2*dt)}}hostiles=hostiles.filter(e=>e.health.alive);if(job.state==="active"&&job.step==="Clear ambush"&&hostiles.length===0){job.advance();cash.credit(25);event(run,"ambush-clear")}heat.step(dt,false);responders.sync(heat.level);if(!p.health.alive){finishRun(run,{result:"lost",heat:heat.level});done=true}}
g.clearRect(0,0,c.width,c.height);g.save();g.scale(c.width,c.height);g.fillStyle="#10202d";g.fillRect(.04,.1,.92,.82);g.fillStyle="#203848";for(let i=0;i<4;i++)g.fillRect(.1+i*.22,.16,.12,.16);g.fillStyle="#526778";g.fillRect(.04,.5,.92,.12);g.fillStyle="#7ef0b8";g.beginPath();g.arc(beacon.x,beacon.y,.03,0,7);g.fill();g.fillStyle="#c99cff";g.beginPath();g.arc(broker.x,broker.y,.022,0,7);g.fill();g.fillStyle="#f1a052";g.fillRect(car.x-.04,car.y-.023,.08,.046);g.fillStyle="#77d8ff";for(const s of shots){g.beginPath();g.arc(s.x,s.y,.007,0,7);g.fill()}g.fillStyle="#ff728e";for(const e of hostiles){g.beginPath();g.arc(e.x,e.y,.022,0,7);g.fill()}g.fillStyle="#ffd45f";for(const e of responders.units.filter(e=>e.health.alive)){g.beginPath();g.arc(e.x,e.y,.024,0,7);g.fill()}if(!p.inVehicle){g.fillStyle="#eef6ff";g.beginPath();g.arc(p.x,p.y,.021,0,7);g.fill()}g.restore();hud.textContent="HP "+Math.ceil(p.health.value)+" // CR "+cash.balance+" // HEAT "+heat.level+" // RESPONSE "+responders.units.filter(e=>e.health.alive).length;stateEl.textContent=(job.state==="available"?"F: MEET BROKER":job.state==="complete"?"MISSION COMPLETE":job.step)+" // CIV "+rep.get("civic")+" FRT "+rep.get("frontier");requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
