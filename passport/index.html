<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c"><title>PASSPORT // THE PORTAL</title><script src="../world.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090c;color:#e7e3d9;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100svh;background:radial-gradient(circle at 50% 0,#1b1b22,#08090c 45%)}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:72px 0 50px}.back{position:absolute;top:22px;left:22px;color:#77736a;text-decoration:none;font-size:9px;letter-spacing:.18em}.eyebrow{font-size:9px;letter-spacing:.35em;color:#77736a}.head{border-bottom:1px solid #302f31;padding-bottom:28px}.head h1{font-family:Arial Black,Impact,sans-serif;font-size:clamp(58px,15vw,110px);line-height:.78;letter-spacing:-.06em;margin:18px 0}.id{color:#817d74;font-size:10px;line-height:1.8}.stamps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:28px}.stamp{min-height:145px;border:1px dashed #3a3838;border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;background:#0b0b0e}.stamp .symbol{font-size:34px;color:#9a9180}.stamp b{font-size:11px;letter-spacing:.14em}.stamp small{color:#69665f;line-height:1.5}.stamp.journey{border-style:solid;background:radial-gradient(circle at 80% 0,#17151c,#0b0b0e 55%)}.stamp time{display:block;margin-top:8px;color:#4f4c48;font-size:7px;letter-spacing:.1em}.locked{opacity:.28;filter:blur(.2px)}.foot{margin-top:28px;color:#55524d;font-size:9px;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.actions a{border:1px solid #343238;border-radius:999px;padding:11px 14px;color:#aaa293;text-decoration:none;font-size:8px;letter-spacing:.12em}.count{color:#aaa293}.telemetry{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px}.telemetry div{border:1px solid #2b2a2d;background:#0a0a0d;padding:14px 12px;min-height:74px}.telemetry small{display:block;color:#5e5b55;font-size:7px;letter-spacing:.14em}.telemetry b{display:block;margin-top:9px;color:#aaa293;font-size:12px}.scarline{grid-column:1/-1!important;min-height:auto!important}.scarline b{font-size:9px;line-height:1.7}@media(max-width:520px){.stamps{grid-template-columns:1fr}.stamp{min-height:115px}.telemetry{grid-template-columns:repeat(2,1fr)}}</style></head><body><a class="back" href="../">← PORTAL</a><main class="wrap"><section class="head"><div class="eyebrow">LOCAL TRAVEL DOCUMENT // NOT AN ACCOUNT</div><h1>PORTAL<br>PASSPORT</h1><div class="id" id="id"></div></section><section class="telemetry" id="telemetry"></section><section class="stamps" id="stamps"></section><nav class="actions"><a href="../map/">OPEN MY MAP →</a><a href="../wonder/">RARE ENCOUNTERS →</a><a href="../stations/">KEEP TRAVELING →</a></nav><p class="foot">This document exists only in this browser. Clear browser storage and this traveler becomes new again.<br><br><span class="count" id="count"></span></p></main><script>
const first=localStorage.getItem("portal-first-contact")||new Date().toISOString();localStorage.setItem("portal-first-contact",first);
const pid=localStorage.getItem("portal-passport-id")||Math.random().toString(36).slice(2,10).toUpperCase();localStorage.setItem("portal-passport-id",pid);
const lastSeen=new Date().toISOString();localStorage.setItem("portal-passport-last-seen",lastSeen);document.querySelector("#id").innerHTML="TRAVELER "+pid+"<br>FIRST CONTACT // "+new Date(first).toLocaleDateString()+"<br>LAST SEEN // "+new Date(lastSeen).toLocaleDateString();
const defs=[
["◉","EARTH","PLANETARY CONTACT","portal-artifact-earth"],
["⌁","SIGNAL","RECEIVER ONLINE","portal-artifact-signal"],
["◌","VOID","UNMAPPED ROOM","portal-artifact-void"],
["88.8","UNKNOWN","ORIGIN UNRESOLVED","portal-radio-888"],
["000","ROOM 000","CURIOSITY ACCEPTED","portal-secret-unlocked"],
["⌬","UNDERNET","BELOW-SURFACE CLEARANCE","portal-undernet"],
["◉","LISTENER","IT REMEMBERS YOU","portal-listener"],
["13","CHAOS XIII","THE MACHINE NOTICED",null],["97.3","NUMBERS","7 1 9 0","portal-numbers"],["✣","RARE DAY","THE PORTAL NOTICED FIRST","portal-rare"],["⌖","CARTOGRAPHER","BOUNDARY OBSERVED","portal-cartographer"],[".","THE END","YOU LEFT","portal-end"],["✧","RELEASE","BEAUTY LET GO","portal-release-made"],["◎","ORBIT","CONTINUOUS FALL","portal-orbit-found"],["∆","MACHINE","LIFE SEEDED","portal-machine"],["♜","ARCADE","MACHINE BELOW","portal-arcade"],["⌁","ECHO RUN","SIGNAL CARRIED","portal-echo-run-complete"],["∴","CONVERGENCE","ROOMS CROSSED","portal-convergence"],["◐","THE SPLIT","WORLD FORKED","portal-world-fork"],["◦","ECOLOGY","VOID CHANGED","portal-creature-void-choice"],["◆","FONZI","FIRST CONTACT","portal-fonzi-found"],["◍","COLOR","ONE LIGHT KEPT","portal-color-kept"],["⚒","BUILDER","THE PORTAL ACCEPTED YOUR CONSTRUCTION","portal-workshop-nature"]
];
const travel=(()=>{try{return JSON.parse(localStorage.getItem("portal-travel-history-v1")||"[]")}catch(_){return[]}})();const uniqueRooms=[...new Set(travel.map(x=>x.room).filter(Boolean))];const roomSet=new Set(uniqueRooms),chaos=Number(localStorage.getItem("portal-chaos")||0);let unlocked=0;
const artifactHTML=defs.map(([sym,name,note,key])=>{const ok=key?localStorage.getItem(key)!==null:chaos>=13;if(ok)unlocked++;return '<article class="stamp '+(ok?'':'locked')+'"><span class="symbol">'+(ok?sym:'?')+'</span><div><b>'+(ok?name:'UNDISCOVERED')+'</b><br><small>'+(ok?note:'NO RECORD')+'</small></div></article>'}).join("");
const firstVisit=room=>travel.find(x=>x.room===room)?.at,visitedAny=xs=>xs.some(x=>roomSet.has(x));
const journeys=[
["↳","FIRST STEP","THE PORTAL REMEMBERED A ROUTE",travel.length>=1,travel[0]?.at],
["III","WANDERER","THREE ROOMS REMEMBER YOU",uniqueRooms.length>=3,travel.find((x,idx)=>new Set(travel.slice(0,idx+1).map(y=>y.room)).size>=3)?.at],
["VII","EXPLORER","SEVEN DISTINCT ROOMS CROSSED",uniqueRooms.length>=7,travel.find((x,idx)=>new Set(travel.slice(0,idx+1).map(y=>y.room)).size>=7)?.at],
["XIII","WAYFARER","THIRTEEN DISTINCT ROOMS CROSSED",uniqueRooms.length>=13,travel.find((x,idx)=>new Set(travel.slice(0,idx+1).map(y=>y.room)).size>=13)?.at],
["⌬","DEEP TRAVELER","YOU WENT BELOW THE SURFACE",visitedAny(["undernet","void","dead","blackbox"]),travel.find(x=>["undernet","void","dead","blackbox"].includes(x.room))?.at],
["◉","REALITY WALKER","THE PORTAL OPENED ONTO THE WORLD",visitedAny(["earth","window","weather","sky","pulse"]),travel.find(x=>["earth","window","weather","sky","pulse"].includes(x.room))?.at],
["◇","THE PORTAL SPOKE","INTELLIGENCE CONTACT RECORDED",visitedAny(["intelligence","oracle"]),travel.find(x=>["intelligence","oracle"].includes(x.room))?.at],
["∞","RETURNING TRAVELER","YOU CAME BACK AFTER THE FIRST DAY",Date.now()-new Date(first).getTime()>=86400000,Date.now()]
];
const journeyHTML=journeys.map(([sym,name,note,ok,at])=>{if(ok)unlocked++;return '<article class="stamp journey '+(ok?'':'locked')+'"><span class="symbol">'+(ok?sym:'?')+'</span><div><b>'+(ok?name:'JOURNEY UNRECORDED')+'</b><br><small>'+(ok?note:'KEEP TRAVELING')+'</small>'+(ok&&at?'<time>'+new Date(at).toLocaleDateString()+'</time>':'')+'</div></article>'}).join("");
document.querySelector("#stamps").innerHTML=journeyHTML+artifactHTML;
document.querySelector("#count").textContent=unlocked+" STAMPS RECORDED // "+uniqueRooms.length+" ROOMS REMEMBERED // "+chaos+" CHAOS INTERACTIONS";
const W=window.PortalWorld?.state||{},eventState=(()=>{try{return JSON.parse(localStorage.getItem("portal-world-events-v1")||"null")}catch(e){return null}})(),creatureState=(()=>{try{return JSON.parse(localStorage.getItem("portal-creature-v1")||"null")}catch(e){return null}})(),age=Math.max(0,Date.now()-(W.born||Date.now())),days=Math.floor(age/86400000),hours=Math.floor(age/36e5)%24;
const scars=(W.scars||[]).map(x=>String(x).replaceAll("-"," ").toUpperCase());
const inventory=(W.inventory||[]).map(x=>String(x).replaceAll("-"," ").toUpperCase());
document.querySelector("#telemetry").innerHTML=
'<div><small>WORLD AGE</small><b>'+days+'D '+hours+'H</b></div>'+
'<div><small>PORTAL VISITS</small><b>'+(W.visits||1)+'</b></div>'+'<div><small>ROOMS REMEMBERED</small><b>'+uniqueRooms.length+'</b></div>'+
'<div><small>WORLD PRESSURE</small><b>'+(W.pressure||0)+'</b></div>'+'<div><small>ATMOSPHERE</small><b>'+(W.atmosphere||"STILL")+'</b></div>'+
'<div><small>CARRYING</small><b>'+(inventory.length?inventory.join(" · "):"NOTHING")+'</b></div>'+
'<div class="scarline"><small>RECENT TRAVEL</small><b>'+(uniqueRooms.length?uniqueRooms.slice(-10).map(x=>String(x).replaceAll("-"," ").toUpperCase()).join(" → "):"NO ROUTE RECORDED YET")+'</b></div>'+'<div class="scarline"><small>THINGS THE WORLD REMEMBERS</small><b>'+(scars.length?scars.join(" // "):"NO SCARS YET")+'</b></div>'+ '<div class="scarline"><small>WORLD HISTORY</small><b>'+((eventState?.history||[]).length?eventState.history.map(e=>String(e.id).toUpperCase()).join(" // "):"NO WORLD EVENTS RECORDED")+'</b></div>'+ '<div class="scarline"><small>UNCLASSIFIED EVIDENCE</small><b>'+(creatureState?.stage?"STAGE "+creatureState.stage+" // "+(creatureState.sightings||0)+" SIGHTING"+((creatureState.sightings||0)===1?"":"S")+(creatureState.afterAbsence?" // CHANGE AFTER ABSENCE":""):"NONE RECORDED")+'</b></div>';
</script></body></html>
<script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>
<script type="module">import{installTransitions}from"../transitions.js";installTransitions("passport");</script>
