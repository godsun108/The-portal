<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09070d"><title>ORACLE — THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 38%,#21122d,#070609 58%);color:#f5efff;font-family:ui-monospace,monospace;display:grid;place-items:center}.back{position:fixed;top:20px;left:20px;color:#81758a;text-decoration:none;font-size:11px}.wrap{text-align:center;width:min(700px,90vw)}.orb{width:min(55vw,320px);aspect-ratio:1;border-radius:50%;margin:auto;border:1px solid #9e68c844;background:radial-gradient(circle at 42% 35%,#b57ad844,#1b0e28 42%,#050407 72%);box-shadow:0 0 90px #7e3cac33,inset -30px -35px 60px #000;display:grid;place-items:center;font-size:70px}.orb span{filter:drop-shadow(0 0 18px #c993ff);animation:pulse 3s ease-in-out infinite}h1{font:900 clamp(52px,14vw,110px)/.8 Arial Black,sans-serif;letter-spacing:-.06em;margin:42px 0 18px}p{color:#8e8098;font-size:10px;letter-spacing:.12em;line-height:1.8}.law{margin-top:20px;color:#b8a4c5} @keyframes pulse{50%{opacity:.45;transform:scale(.9)}}@media(prefers-reduced-motion:reduce){.orb span{animation:none}}.lab{margin:32px auto 0;width:min(440px,100%);padding:20px;border:1px solid #35283f;border-radius:18px;background:#0b080f99}.lab label{display:flex;justify-content:space-between;font-size:10px;color:#9f90aa}.lab input{width:100%;margin:22px 0}.lab button{border:1px solid #63487a;background:#160e1d;color:#cdb5df;padding:12px 17px;border-radius:999px;font:9px ui-monospace,monospace;letter-spacing:.13em}.lab #receipt{min-height:32px;font-size:9px;color:#76677f}</style></head><body><a class="back" href="../">← THE PORTAL</a><main class="wrap"><div class="orb"><span>◇</span></div><h1>ORACLE</h1><p>PROBABILITY, NOT PROPHECY.</p><p class="law">PAST → DISCOVER → FREEZE → UNSEEN → TEST</p><div class="lab"><label>YOUR PROBABILITY <b id="pct">50%</b></label><input id="prob" type="range" min="1" max="99" value="50"><button id="lock">LOCK FORECAST</button><p id="receipt"></p></div></main><script>const p=document.querySelector("#prob"),pct=document.querySelector("#pct"),receipt=document.querySelector("#receipt");p.oninput=()=>pct.textContent=p.value+"%";document.querySelector("#lock").onclick=()=>{const t=new Date().toISOString();receipt.textContent="FORECAST LOCKED LOCALLY // "+p.value+"% // "+t+" // no outcome supplied";localStorage.setItem("portal-oracle-forecast",JSON.stringify({p:+p.value,t}))}</script></body></html>
