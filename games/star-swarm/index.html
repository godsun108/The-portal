<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>STAR//SWARM</title><link rel="stylesheet" href="../../portal-atmosphere.css"><link rel="stylesheet" href="../../portal-magic.css"><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#020205;color:#eee;font-family:ui-monospace}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:3;inset:16px 18px auto;display:flex;justify-content:space-between;font-size:10px}.screen{position:fixed;z-index:5;inset:0;display:grid;place-items:center;text-align:center;background:#020205e8;padding:22px}.hide{display:none}h1{font:900 clamp(52px,16vw,120px)/.78 Arial Black;letter-spacing:-.07em;margin:8px}.hint{color:#777;max-width:450px;line-height:1.7;margin:20px auto}button,a{border:1px solid #ffffff35;background:#090911;color:#eee;border-radius:999px;padding:13px 18px;font:10px ui-monospace;text-decoration:none}</style></head><body><canvas id="c"></canvas><div class="hud"><span id="score">SWARM 000</span><span id="life">◇◇◇◇</span></div><section class="screen" id="intro"><div><div>ARCADE // ARENA CABINET</div><h1>STAR//<br>SWARM</h1><p class="hint">MOVE WITH WASD / ARROWS OR DRAG. AIM WITH POINTER. FIRING IS AUTOMATIC. SURVIVE THE SWARM.</p><button id="go">ENTER ARENA</button> <a href="../../arcade/">ARCADE</a></div></section><section class="screen hide" id="over"><div><div>ARENA CLOSED</div><h1 id="final">000</h1><p class="hint" id="reward"></p><button id="again">AGAIN</button> <a href="../../arcade/">ARCADE</a></div></section><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{physicsState}from"../../physics.js";import{installTravelerHUD}from"../../traveler-hud.js";import{installTransitions}from"../../transitions.js";installTravelerHUD();installTransitions("star-swarm");const cv=document.querySelector("#c"),x=cv.getContext("2d"),phys=physicsState();let w,h,dpr,p,enemies,shots,score,lives,playing,last,spawn,fire,aim={x:0,y:0},keys={},run;function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);aim={x:w/2,y:0}}size();addEventListener("resize",size);function start(){p={x:w/2,y:h/2};enemies=[];shots=[];score=0;lives=4;spawn=fire=0;last=performance.now();run=beginRun("star-swarm");playing=true;intro.classList.add("hide");over.classList.add("hide");requestAnimationFrame(loop)}function enemy(){const side=Math.floor(Math.random()*4),q=side<2?{x:Math.random()*w,y:side? h+20:-20}:{x:side===2?-20:w+20,y:Math.random()*h};enemies.push({...q,r:8+Math.random()*9,s:1+Math.random()*1.3})}function shoot(){let dx=aim.x-p.x,dy=aim.y-p.y,m=Math.hypot(dx,dy)||1;shots.push({x:p.x,y:p.y,vx:dx/m*8,vy:dy/m*8})}function loop(t){if(!playing)return;const dt=Math.min(2,(t-last)/16.67);last=t;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);p.x=Math.max(10,Math.min(w-10,p.x+dx*4.5*dt));p.y=Math.max(10,Math.min(h-10,p.y+dy*4.5*dt));spawn-=dt;fire-=dt;if(spawn<=0){enemy();spawn=Math.max(8,28-score/18)}if(fire<=0){shoot();fire=9}x.clearRect(0,0,w,h);x.fillStyle="#eee";x.beginPath();x.arc(p.x,p.y,6,0,7);x.fill();for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;x.fillRect(s.x-2,s.y-2,4,4)}for(const e of enemies){let vx=p.x-e.x,vy=p.y-e.y,m=Math.hypot(vx,vy)||1,curve=phys.mode==="converged"?Math.sin(t/450+e.x)*.35:0;e.x+=(vx/m*e.s- vy/m*curve)*dt;e.y+=(vy/m*e.s+vx/m*curve)*dt;x.strokeStyle="#d38affaa";x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.stroke();if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+6){e.dead=true;lives--;event(run,"hit",{score});if(lives<=0)return end()}}for(const s of shots)for(const e of enemies)if(!e.dead&&Math.hypot(e.x-s.x,e.y-s.y)<e.r+3){e.dead=true;s.dead=true;score++}shots=shots.filter(s=>!s.dead&&s.x>-20&&s.x<w+20&&s.y>-20&&s.y<h+20);enemies=enemies.filter(e=>!e.dead);document.querySelector("#score").textContent="SWARM "+String(score).padStart(3,"0");document.querySelector("#life").textContent="◇".repeat(lives);requestAnimationFrame(loop)}function end(){playing=false;let r=null;if(score>=55){r=phys.mode==="converged"?"swarm-heart":"star-shard";grantArtifact(r)}else scar("swarm-bite");finishRun(run,{score,reward:r,physics:phys.mode});final.textContent=String(score).padStart(3,"0");reward.textContent=r?"ARTIFACT // "+r.toUpperCase():"THE SWARM LEFT A MARK.";over.classList.remove("hide")}go.onclick=start;again.onclick=start;addEventListener("keydown",e=>keys[e.key]=true);addEventListener("keyup",e=>keys[e.key]=false);cv.addEventListener("pointermove",e=>{aim={x:e.clientX,y:e.clientY};if(e.buttons&&playing){p.x=e.clientX;p.y=e.clientY}});cv.addEventListener("pointerdown",e=>{if(playing){p.x=e.clientX;p.y=e.clientY;aim={x:e.clientX,y:e.clientY-100}}});</script></body></html>
