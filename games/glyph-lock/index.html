<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLYPH//LOCK</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#050508;color:#eee;font-family:ui-monospace;display:grid;place-items:center;padding:20px}.wrap{width:min(760px,96vw)}header{display:flex;justify-content:space-between;color:#756c80;font-size:9px;letter-spacing:.15em}h1{font:900 clamp(52px,14vw,100px)/.78 Arial Black;letter-spacing:-.07em;margin:22px 0}.examples{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.ex,.query{border:1px solid #302a38;background:#0b0910;padding:15px;border-radius:10px;text-align:center}.glyphs{font-size:22px;letter-spacing:.22em;margin-bottom:9px}.result{color:#a99ab8}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.answers button{padding:18px 8px;border:1px solid #4b4057;background:#0d0a11;color:#eee;border-radius:10px;font:15px ui-monospace;cursor:pointer}.answers button:hover{border-color:#a58dbb}.meta,.status{color:#80758a;font-size:10px;line-height:1.8}.gate{position:fixed;inset:0;background:#030305ee;display:grid;place-items:center;text-align:center;padding:25px;z-index:5}.gate button{padding:13px 20px;border:1px solid #746282;background:#0b0810;color:#eee;border-radius:999px;font:10px ui-monospace;letter-spacing:.14em}.hidden{display:none}@media(max-width:620px){.examples{grid-template-columns:1fr}.answers{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><header><a href="../../arcade/" style="color:inherit;text-decoration:none">← ARCADE</a><span>DEDUCTION // UNKNOWN GRAMMAR</span></header><h1>GLYPH//<br>LOCK</h1><div class="meta" id="meta"></div><section class="examples" id="examples"></section><section class="query" id="query"></section><section class="answers" id="answers"></section><div class="status" id="status"></div></main><div class="gate" id="gate"><div><div>THE MACHINE WILL NOT DEFINE ITS LANGUAGE.<br>IT WILL ONLY SHOW YOU WHAT HAPPENED.<br>6/9 OPENS THE LANGUAGE // 9/9 EARNS THE GRAMMAR KEY.</div><h1>GLYPH//LOCK</h1><button id="start">OBSERVE</button></div></div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();const G=["△","◉","⌁","□","✧"],names=["SHIFT","DOUBLE","MIRROR","CUT","SPARK"];let run,round=0,score=0,ruleMap,best=Number(localStorage.getItem("portal-glyph-lock-best")||0);function apply(seq,n){let v=n;for(const g of seq){const op=ruleMap[g];if(op===0)v+=1;else if(op===1)v*=2;else if(op===2)v=10-v;else if(op===3)v=Math.max(0,v-2);else v=(v*v)%11}return v}function makeRules(){const ops=[0,1,2,3,4].sort(()=>Math.random()-.5);ruleMap={};G.forEach((g,i)=>ruleMap[g]=ops[i])}function seq(len){return Array.from({length:len},()=>G[Math.floor(Math.random()*G.length)])}function render(){const len=round<3?1:round<6?2:3,base=1+Math.floor(Math.random()*5),q=seq(len),truth=apply(q,base);examples.innerHTML="";for(let i=0;i<3;i++){const b=1+Math.floor(Math.random()*5),s=seq(len),r=apply(s,b),d=document.createElement("div");d.className="ex";d.innerHTML='<div class="glyphs">'+b+' → '+s.join(" ")+'</div><div class="result">OUTPUT '+r+'</div>';examples.append(d)}query.innerHTML='<div class="glyphs">'+base+' → '+q.join(" ")+'</div><div class="result">OUTPUT ?</div>';let opts=new Set([truth]);while(opts.size<4)opts.add(Math.max(0,truth-4+Math.floor(Math.random()*9)));answers.innerHTML="";[...opts].sort(()=>Math.random()-.5).forEach(v=>{const b=document.createElement("button");b.textContent=v;b.onclick=()=>answer(v,truth,q,base);answers.append(b)});meta.textContent="LOCK "+(round+1)+"/9 // CORRECT "+score;status.textContent=round<3?"ONE GLYPH. INFER THE OPERATOR.":round<6?"ORDER NOW MATTERS.":"THREE OPERATORS. READ LEFT TO RIGHT."}function answer(v,t,q,b){const ok=v===t;if(ok)score++;event(run,"deduction",{round,input:b,glyphs:q,answer:v,truth:t,correct:ok});status.textContent=ok?"LOCK ACCEPTED.":"LOCK REJECTED // OUTPUT WAS "+t;[...answers.children].forEach(x=>x.disabled=true);setTimeout(()=>{round++;if(round>=9)end();else render()},650)}function end(){const ratio=score/9;best=Math.max(best,score);localStorage.setItem("portal-glyph-lock-best",best);if(score>=6){const mastery=score===9;grantArtifact(mastery?"grammar-key":"glyph-fragment");finishRun(run,{result:"clear",score,artifact:mastery?"grammar-key":"glyph-fragment"})}else{scar("syntax-burn");finishRun(run,{result:"lost",score,scar:"syntax-burn"})}gate.classList.remove("hidden");gate.innerHTML='<div><div>GLYPH//LOCK</div><h1>'+(score>=6?"LANGUAGE<br>OPEN":"SYNTAX<br>FAILED")+'</h1><p>'+score+'/9 CORRECT // BEST '+best+'/9<br>'+(score===9?"ARTIFACT // GRAMMAR KEY":score>=6?"ARTIFACT // GLYPH FRAGMENT":"SCAR // SYNTAX BURN")+'</p><button onclick="location.reload()">NEW LANGUAGE</button></div>'}start.onclick=()=>{run=beginRun("glyph-lock");makeRules();gate.classList.add("hidden");render()};</script></body></html>
