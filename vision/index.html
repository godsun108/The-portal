<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b25"><title>EarthChain VISION · Field Test</title><style>body{font:16px system-ui;background:#102b25;color:#f2f7ed;max-width:680px;margin:auto;padding:25px}button,input,textarea{font:inherit;max-width:100%;padding:12px;border-radius:9px;margin:8px 0}button{background:#d5ebac;border:0}img{max-width:100%;border-radius:12px}small{color:#bfd0c7}textarea{width:95%;min-height:90px}</style><h1>🔬 EarthChain VISION</h1><p>iPhone field-station smoke test · not the complete VISION Science app</p><p id="secure"></p><label>Take or choose a non-sensitive test photo <input id="photo" type="file" accept="image/*" capture="environment"></label><img id="preview" alt="Selected photo preview" hidden><p id="fingerprint"></p><label>Field observation<textarea id="notes" placeholder="Describe what you observe. Do not enter sensitive data."></textarea></label><button id="record">Create observation</button><button id="export">Export JSON</button><pre id="result"></pre><p><small>Data stays in this page's memory until you export. This smoke test does not encrypt or persist records. Do not use it for private photos or sensitive information.</small></p><script>let fingerprint='',records=[];const $=id=>document.getElementById(id);$('secure').textContent=isSecureContext?'✓ Secure HTTPS context':'⚠ Secure context unavailable';$('photo').onchange=async e=>{let f=e.target.files[0];if(!f)return;let bytes=await f.arrayBuffer();let hash=await crypto.subtle.digest('SHA-256',bytes);fingerprint=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');$('fingerprint').textContent='SHA-256: '+fingerprint;$('preview').src=URL.createObjectURL(f);$('preview').hidden=false};$('record').onclick=()=>{if(!fingerprint||!$('notes').value.trim())return alert('Select a photo and enter an observation');records.push({schema:'earthchain.vision.field-smoke-test',timestamp:new Date().toISOString(),imageSha256:fingerprint,observation:$('notes').value.trim(),source:'human-entered',verified:false});$('result').textContent=JSON.stringify(records.at(-1),null,2)};$('export').onclick=()=>{if(!records.length)return alert('No observations yet');let u=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='vision-test-observations.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}</script></html>
