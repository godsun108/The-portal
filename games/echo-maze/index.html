<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO MAZE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020204;color:#eee;font:14px ui-monospace,monospace;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#h{position:fixed;inset:16px;pointer-events:none;display:flex;justify-content:space-between}.p{background:#020204cc;border:1px solid #ffffff25;padding:10px}.p a{color:white;pointer-events:auto}#m{position:fixed;bottom:7%;width:100%;text-align:center;letter-spacing:.16em;pointer-events:none}</style><canvas id="c"></canvas><div id="h"><div class="p">ECHO MAZE<br><span id="mood"></span></div><div class="p"><a href="../../stations/">EXIT</a></div></div><div id="m">THE MAZE REMEMBERS WHAT YOU CARRY</div><script type="module">import{beginRun,finishRun}from"../protocol.js";import{hasArtifact,grantArtifact,scar}from"../state.js";const c=document.querySelector("#c"),x=c.getContext("2d"),msg=document.querySelector("#m"),mood=document.querySelector("#mood");let W,H,dpr,run=beginRun("echo-maze"),won=false;const keyed=hasArtifact("rift-key"),frag=hasArtifact("stabilizer-fragment");mood.textContent=keyed?"RIFT KEY RESONATING":frag?"FRAGMENT DETECTED":"NO RIFT RESONANCE";const N=keyed?9:frag?11:13;let grid=Array.from({length:N},()=>Array(N).fill(15)),seen=Array.from({length:N},()=>Array(N).fill(false));function carve(cx,cy){seen[cy][cx]=true;const dirs=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]].sort(()=>Math.random()-.5);for(const[dx,dy,a,b]of dirs){let nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&!seen[ny][nx]){grid[cy][cx]&=~a;grid[ny][nx]&=~b;carve(nx,ny)}}}carve(0,0);let p={x:0,y:0};function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);draw()}addEventListener("resize",resize);function draw(){x.clearRect(0,0,W,H);const z=Math.min(W,H-100)/N,ox=(W-z*N)/2,oy=(H-z*N)/2;x.strokeStyle="#ffffff55";x.lineWidth=1;for(let y=0;y<N;y++)for(let q=0;q<N;q++){const v=grid[y][q],a=ox+q*z,b=oy+y*z;x.beginPath();if(v&1){x.moveTo(a,b);x.lineTo(a+z,b)}if(v&2){x.moveTo(a+z,b);x.lineTo(a+z,b+z)}if(v&4){x.moveTo(a,b+z);x.lineTo(a+z,b+z)}if(v&8){x.moveTo(a,b);x.lineTo(a,b+z)}x.stroke()}x.fillStyle="#fff";x.beginPath();x.arc(ox+(p.x+.5)*z,oy+(p.y+.5)*z,z*.18,0,7);x.fill();x.strokeStyle="#fff";x.strokeRect(ox+(N-1)*z+z*.28,oy+(N-1)*z+z*.28,z*.44,z*.44)}function move(dx,dy,bit){if(won)return;const v=grid[p.y][p.x];if(v&bit)return;p.x+=dx;p.y+=dy;draw();if(p.x===N-1&&p.y===N-1){won=true;const artifact=keyed?"echo-crown":"echo-shard";grantArtifact({id:artifact,source:"echo-maze"});finishRun(run,{won:true,artifact,riftResonance:keyed?"key":frag?"fragment":"none"});msg.textContent="THE MAZE YIELDS // "+artifact.toUpperCase()}}addEventListener("keydown",e=>({ArrowUp:()=>move(0,-1,1),ArrowRight:()=>move(1,0,2),ArrowDown:()=>move(0,1,4),ArrowLeft:()=>move(-1,0,8)})[e.key]?.());let sx,sy;addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY});addEventListener("pointerup",e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))dx>0?move(1,0,2):move(-1,0,8);else dy>0?move(0,1,4):move(0,-1,1)});resize()</script>
