<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>STATIONS // THE PORTAL</title><script src="../world.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#eee;font-family:ui-monospace,monospace}.back{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));left:18px;color:#686875;text-decoration:none;font-size:9px}.shell{height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:max(58px,calc(env(safe-area-inset-top) + 42px)) 18px max(20px,env(safe-area-inset-bottom));text-align:center}.ey{font-size:8px;letter-spacing:.32em;color:#666674}.stage{display:grid;place-items:center;min-height:0}.station{width:min(620px,92vw)}.glyph{font-size:clamp(76px,24vw,150px);filter:drop-shadow(0 0 35px #8070b444)}h1{font:900 clamp(48px,14vw,100px)/.8 Arial Black,sans-serif;letter-spacing:-.06em;margin:12px 0}.line{color:#8b8b98;font-size:10px;letter-spacing:.1em;line-height:1.7;max-width:520px;margin:auto}.rooms{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:24px}.rooms a,.rooms button{border:1px solid #30303b;background:#0b0b10;color:#c1c1ca;border-radius:999px;min-height:44px;padding:12px 16px;text-decoration:none;font:8px ui-monospace;letter-spacing:.12em;display:inline-flex;align-items:center;justify-content:center}.rooms a:focus-visible,.rooms a:hover{border-color:#716785;color:#fff;background:#111019}.dormant{color:#555}.nav{display:flex;justify-content:center;align-items:center;gap:16px}.nav button{width:56px;height:56px;border-radius:50%;border:1px solid #343440;background:#0a0a0f;color:#bbb;font-size:20px;cursor:pointer}.nav button:active{transform:scale(.96)}.dots{font-size:8px;color:#686878;letter-spacing:.26em}@media(max-width:699px){.shell{padding:max(58px,calc(env(safe-area-inset-top) + 42px)) 14px max(92px,calc(env(safe-area-inset-bottom) + 76px))}.stage{overflow:auto;align-items:start;padding:6vh 0 18px}.station{width:100%}.glyph{font-size:clamp(58px,19vw,92px)}h1{font-size:clamp(44px,13vw,70px)}.rooms{display:grid;grid-template-columns:1fr 1fr;width:100%;margin-top:22px}.rooms a,.rooms button{width:100%;padding:12px 10px}.nav{position:relative;z-index:6}.ey{line-height:1.6}}@media(max-width:390px){.rooms{grid-template-columns:1fr}}@media(prefers-reduced-motion:no-preference){.station{animation:arrive .45s ease}@keyframes arrive{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}}</style><link rel="stylesheet" href="../portal-atmosphere.css"><link rel="stylesheet" href="../portal-magic.css"></head><body><a class="back" href="../">← PORTAL</a><main class="shell"><div class="ey">PORTAL TRANSIT // SWIPE OR USE ARROWS</div><section class="stage"><div class="station" id="station"></div></section><nav class="nav"><button id="prev" aria-label="Previous station">←</button><span class="dots" id="dots"></span><button id="next" aria-label="Next station">→</button></nav></main><script>
let stations=[],i=0,touch=null;const el=document.querySelector("#station"),dots=document.querySelector("#dots");function render(){const s=stations[i],dormant=s.status==="dormant";el.innerHTML='<div class="glyph">'+s.glyph+'</div><h1>'+s.label+'</h1><div class="line">'+s.line+'</div><div class="rooms">'+(dormant?'<span class="dormant">NO VERIFIED INTELLIGENCE ENDPOINT YET.</span>':s.rooms.map(r=>r[1]==="#chaos"?'<a href="../#chaos">'+r[0]+'</a>':'<a href="../'+r[1]+'">'+r[0]+'</a>').join(""))+'</div>';dots.textContent=stations.map((_,n)=>n===i?"●":"·").join(" ");localStorage.setItem("portal-station-last",s.id)}function move(n){i=(i+n+stations.length)%stations.length;render()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});addEventListener("pointerdown",e=>touch=e.clientX);addEventListener("pointerup",e=>{if(touch===null)return;const d=e.clientX-touch;if(Math.abs(d)>45)move(d<0?1:-1);touch=null});fetch("../stations.json").then(r=>r.json()).then(d=>{if(d.schema!=="portal.stations.v1")throw 0;stations=d.stations;const secrets=typeof secretRoutes==="function"?secretRoutes():[];if(secrets.length)stations.push({id:"secret",label:"SECRET",glyph:"⌁",line:"this station did not exist for you before",rooms:secrets.map(x=>[x.label,x.href])});const wanted=new URLSearchParams(location.search).get("s")||localStorage.getItem("portal-station-last"),found=stations.findIndex(s=>s.id===wanted);i=found>=0?found:0;render()}).catch(()=>{el.innerHTML='<h1>NO LINE.</h1><div class="line">THE STATION MAP COULD NOT BE VERIFIED.</div>'});
</script></body></html>
<script type="module">import{installPhysics}from"../physics.js";const p=installPhysics();if(p.mode==="converged"){const target=document.querySelector("main,.shell,.stage,canvas");if(target)target.setAttribute("data-portal-depth","");}</script>
