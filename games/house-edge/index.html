<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOUSE//EDGE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#070709;color:#eee;font-family:ui-monospace;padding:22px}.top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.16em;color:#82788b}.wrap{max-width:850px;margin:7vh auto}.title{font:900 clamp(45px,10vw,90px)/.8 Arial Black;letter-spacing:-.07em;margin:18px 0}.stats{display:flex;gap:20px;flex-wrap:wrap;color:#9e91a9;font-size:10px}.enemy{margin:28px 0;padding:18px;border:1px solid #29242d;background:#0c0b0e}.enemy strong{font-size:18px}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{min-height:180px;text-align:left;padding:16px;border:1px solid #403747;background:linear-gradient(160deg,#16121a,#09080a);color:#ddd;border-radius:14px;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:#9279a5}.card b{display:block;font-size:15px;margin-bottom:12px}.card small{color:#897c92;line-height:1.6}.log{margin-top:22px;color:#675e6e;font-size:10px;min-height:34px}.gate{position:fixed;inset:0;background:#050506;display:grid;place-items:center;text-align:center;padding:25px;z-index:5}.gate button,.choice{padding:13px 20px;border:1px solid #6e5c7b;background:#0c0910;color:#eee;border-radius:999px;font:10px ui-monospace;letter-spacing:.13em;cursor:pointer}.rewards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}@media(max-width:650px){.hand{grid-template-columns:1fr}.card{min-height:120px}.wrap{margin-top:3vh}}</style></head><body><div class="top"><a href="../../arcade/" style="color:inherit;text-decoration:none">← ARCADE</a><span>ROGUELIKE STRATEGY CABINET</span></div><main class="wrap"><div>PORTAL ARCADE // TABLE 01</div><h1 class="title">HOUSE//<br>EDGE</h1><div class="stats" id="stats"></div><section class="enemy" id="enemy"></section><section class="hand" id="hand"></section><div class="log" id="log"></div></main><div class="gate" id="gate"><div><div>CLEAR FIVE ROOMS. EACH WIN ADDS ONE CARD FOR THIS RUN.<br>THE HOUSE REMEMBERS NOTHING BETWEEN RUNS. YOU DO.</div><h1 class="title">HOUSE//EDGE</h1><button id="start">DEAL</button></div></div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();const stats=document.querySelector("#stats"),enemy=document.querySelector("#enemy"),hand=document.querySelector("#hand"),log=document.querySelector("#log"),gate=document.querySelector("#gate"),start=document.querySelector("#start");const base=[["CUT",3,0,"Deal 3 damage."],["CUT",3,0,"Deal 3 damage."],["GUARD",0,3,"Gain 3 shield."],["GUARD",0,3,"Gain 3 shield."],["GAMBIT",6,-2,"Deal 6. Lose 2 integrity."],["READ",2,1,"Deal 2. Gain 1 shield."]],relics=[["VOID ACE",8,0,"Deal 8."],["MIRROR",4,4,"Deal 4. Gain 4 shield."],["RED THREAD",7,-1,"Deal 7. Lose 1 integrity."],["STILL HAND",1,7,"Deal 1. Gain 7 shield."],["NULL CARD",5,2,"Deal 5. Gain 2 shield."]];let run,deck=[],hp=18,shield=0,node=0,foeHp=0,foeAtk=0,ended=false;const E=["STATIC DEALER","GLASS JACK","NULL CLERK","RED QUEEN","THE HOUSE"];function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){stats.textContent="INTEGRITY "+hp+" // SHIELD "+shield+" // ROOM "+(node+1)+"/5 // DECK "+deck.length;enemy.innerHTML="<strong>"+E[node]+"</strong><br>INTEGRITY "+foeHp+" // STRIKE "+foeAtk;const cards=shuffle([...deck]).slice(0,3);hand.innerHTML="";cards.forEach(c=>{const b=document.createElement("button");b.className="card";b.innerHTML="<b>"+c[0]+"</b><small>"+c[3]+"</small>";b.onclick=()=>play(c);hand.append(b)})}function play(c){if(ended)return;let dmg=c[1],guard=c[2];foeHp-=dmg;if(guard>=0)shield+=guard;else hp+=guard;log.textContent=c[0]+" // "+dmg+" DAMAGE"+(guard?" // "+guard+" SHIELD":"");event(run,"card",{name:c[0],node});if(foeHp<=0)return winNode();const taken=Math.max(0,foeAtk-shield);shield=Math.max(0,shield-foeAtk);hp-=taken;if(hp<=0)return end(false);render()}function winNode(){event(run,"room-clear",{node});if(node===4)return end(true);const picks=shuffle([...relics]).slice(0,3);gate.style.display="grid";gate.innerHTML='<div><div>CHOOSE ONE CARD FOR THIS RUN</div><h2>THE TABLE CHANGES</h2><div class="rewards" id="rewards"></div></div>';const rewards=gate.querySelector("#rewards");picks.forEach(c=>{const b=document.createElement("button");b.className="choice";b.textContent=c[0];b.onclick=()=>{deck.push(c);node++;foeHp=10+node*6;foeAtk=3+node;shield=0;gate.style.display="none";event(run,"draft",{card:c[0],node});render()};rewards.append(b)})}function end(win){ended=true;if(win){grantArtifact("house-mark");finishRun(run,{result:"clear",artifact:"house-mark",deck:deck.map(x=>x[0])})}else{scar("house-took-its-cut");finishRun(run,{result:"lost",room:node+1,scar:"house-took-its-cut"})}gate.style.display="grid";gate.innerHTML='<div><div>HOUSE//EDGE</div><h1 class="title">'+(win?"YOU LEFT<br>AHEAD":"THE HOUSE<br>COLLECTS")+'</h1><p>'+(win?"ARTIFACT // HOUSE MARK":"SCAR // THE HOUSE TOOK ITS CUT")+' // ROOM '+(node+1)+'/5</p><button onclick="location.reload()">NEW RUN</button> <a class="choice" href="../../arcade/">ARCADE</a></div>'}start.onclick=()=>{run=beginRun("house-edge");deck=[...base];foeHp=10;foeAtk=3;gate.style.display="none";render()};</script></body></html>
