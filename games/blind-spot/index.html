<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLIND//SPOT</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020204;color:#eee;font-family:ui-monospace}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:16px;top:14px;z-index:3;font-size:10px;letter-spacing:.12em;line-height:1.7}.back{position:fixed;right:16px;top:14px;color:#756f7d;text-decoration:none;font-size:9px;z-index:3}.gate{position:fixed;inset:0;background:#020204ee;display:grid;place-items:center;text-align:center;padding:24px;z-index:8}.gate h1{font:900 clamp(54px,15vw,105px)/.76 Arial Black;letter-spacing:-.08em;margin:16px}.gate p{color:#7b7482;line-height:1.8}.gate button{padding:14px 22px;border:1px solid #786c83;background:#0b0810;color:#eee;border-radius:999px;font:10px ui-monospace;letter-spacing:.14em}.hidden{display:none}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud"></div><a class="back" href="../../arcade/">ARCADE ↑</a><div class="gate" id="gate"><div><div>PERCEPTION // INVERSE ATTENTION</div><h1>BLIND//<br>SPOT</h1><p>MOVE WITH WASD / ARROWS OR DRAG.<br>THE PATH DISAPPEARS NEAR YOUR ATTENTION.<br>LOOK AWAY TO SEE WHERE YOU MUST GO.<br>ZERO CONTACTS UNDER 32 SECONDS EARNS THE PERIPHERAL EYE.</p><button id="start">DON'T LOOK</button></div></div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();const cv=c,x=cv.getContext("2d");let W,H,run,player,keys={},pointer={x:0,y:0},segments=[],goal,started=false,ended=false,hits=0,t0=0,best=Number(localStorage.getItem("portal-blind-spot-best")||0);function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;if(started)build()}size();addEventListener("resize",size);addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);function ppos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*devicePixelRatio,y:(e.clientY-r.top)*devicePixelRatio}}cv.addEventListener("pointermove",e=>{pointer=ppos(e);if(e.pointerType==="touch"){player.x=pointer.x;player.y=pointer.y}});function build(){const pts=[[.1,.82],[.22,.68],[.18,.48],[.38,.38],[.52,.56],[.65,.34],[.78,.48],[.9,.2]];segments=[];for(let i=0;i<pts.length-1;i++)segments.push({a:{x:pts[i][0]*W,y:pts[i][1]*H},b:{x:pts[i+1][0]*W,y:pts[i+1][1]*H}});player={x:pts[0][0]*W,y:pts[0][1]*H};goal={x:pts.at(-1)[0]*W,y:pts.at(-1)[1]*H}}function distSeg(px,py,a,b){const vx=b.x-a.x,vy=b.y-a.y,wx=px-a.x,wy=py-a.y,t=Math.max(0,Math.min(1,(wx*vx+wy*vy)/(vx*vx+vy*vy))),dx=px-(a.x+t*vx),dy=py-(a.y+t*vy);return Math.hypot(dx,dy)}function end(win){ended=true;const sec=(performance.now()-t0)/1000;if(win){if(!best||sec<best){best=sec;localStorage.setItem("portal-blind-spot-best",best)}const mastery=hits===0&&sec<32;grantArtifact(mastery?"peripheral-eye":"blind-thread");finishRun(run,{result:"clear",hits,time:sec,artifact:mastery?"peripheral-eye":"blind-thread"})}else{scar("attention-burn");finishRun(run,{result:"lost",hits,scar:"attention-burn"})}gate.classList.remove("hidden");gate.innerHTML='<div><div>BLIND//SPOT</div><h1>'+(win?"SEEN<br>SIDEWAYS":"LOOKED<br>TOO HARD")+'</h1><p>'+(win?(hits===0&&sec<32?"ARTIFACT // PERIPHERAL EYE":"ARTIFACT // BLIND THREAD"):"SCAR // ATTENTION BURN")+'<br>CONTACTS '+hits+(best?' // BEST '+best.toFixed(1)+' S':'')+'</p><button onclick="location.reload()">LOOK AGAIN</button></div>'}let last=0,lastHit=0;function frame(ms){if(ended)return;const dt=Math.min(.03,(ms-last)/1000||.016);last=ms;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),d=Math.hypot(dx,dy)||1;player.x+=dx/d*190*devicePixelRatio*dt;player.y+=dy/d*190*devicePixelRatio*dt;player.x=Math.max(8,Math.min(W-8,player.x));player.y=Math.max(8,Math.min(H-8,player.y));const corridor=Math.min(...segments.map(s=>distSeg(player.x,player.y,s.a,s.b)));if(corridor>42*devicePixelRatio&&ms-lastHit>650){hits++;lastHit=ms;event(run,"off-path",{hits});if(hits>=4)return end(false)}if(Math.hypot(player.x-goal.x,player.y-goal.y)<24*devicePixelRatio)return end(true);x.fillStyle="#020204";x.fillRect(0,0,W,H);x.lineCap="round";x.lineWidth=18*devicePixelRatio;for(const s of segments){const midx=(s.a.x+s.b.x)/2,midy=(s.a.y+s.b.y)/2,attention=Math.hypot(midx-pointer.x,midy-pointer.y),alpha=Math.max(0,Math.min(.75,(attention-100*devicePixelRatio)/(300*devicePixelRatio)));x.strokeStyle="rgba(202,190,220,"+alpha+")";x.beginPath();x.moveTo(s.a.x,s.a.y);x.lineTo(s.b.x,s.b.y);x.stroke()}x.strokeStyle="#fff8";x.lineWidth=2*devicePixelRatio;x.beginPath();x.arc(goal.x,goal.y,18*devicePixelRatio,0,7);x.stroke();x.fillStyle="#fff";x.beginPath();x.arc(player.x,player.y,8*devicePixelRatio,0,7);x.fill();x.strokeStyle="#695f72";x.beginPath();x.arc(pointer.x,pointer.y,90*devicePixelRatio,0,7);x.stroke();hud.textContent="CONTACTS "+hits+"/4 // TIME "+Math.floor((ms-t0)/1000)+" // LOOK AWAY TO REVEAL";requestAnimationFrame(frame)}start.onclick=()=>{run=beginRun("blind-spot");build();pointer={x:W*.5,y:H*.95};t0=performance.now();started=true;gate.classList.add("hidden");requestAnimationFrame(frame)};</script></body></html>
