<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PORTAL XR Lab 01</title><style>*{box-sizing:border-box}body{margin:0;background:#05080d;color:#eaf5ff;font:14px ui-monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}header{position:fixed;inset:12px auto auto 12px}.panel{position:fixed;right:12px;top:12px;text-align:right}button{background:#102436;color:#dff7ff;border:1px solid #46708b;padding:8px 12px}.help{position:fixed;bottom:12px;left:12px}</style></head><body><header>PORTAL // XR LAB 01</header><div class="panel"><div id="cap">CHECKING XR…</div><button id="enter" hidden>ENTER VR</button><div id="held">HELD: NONE</div></div><canvas></canvas><div class="help">DESKTOP: WASD MOVE · MOUSE AIM · CLICK GRAB/RELEASE · XR: CAPABILITY-GATED</div><script type="module">
import{xrCapabilities,comfortSettings,spatialAnchor,interactionTarget,grabState,requestXRSession,referenceSpace,controllerRegistry,updateControllerPoses,bindSelect}from"../runtime/xr.js";import{beginRun,event,finishRun}from"../protocol.js";
const c=document.querySelector("canvas"),g=c.getContext("2d"),capEl=document.querySelector("#cap"),enter=document.querySelector("#enter"),heldEl=document.querySelector("#held");function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);
const run=beginRun("portal-xr-lab-01"),comfort=comfortSettings(),grab=grabState(),keys=new Set,controllers=controllerRegistry();let player={x:.5,y:.78,z:0},aim={x:.5,y:.5,z:0},last=performance.now(),session=null,xrSpace=null,xrFrameCount=0;
const objects=[{id:"orb",position:{x:.28,y:.36,z:0},r:.035},{id:"cube",position:{x:.68,y:.32,z:0},r:.04},{id:"signal",position:{x:.5,y:.52,z:0},r:.03}],anchors=[spatialAnchor({id:"north",x:.5,y:.16,z:0}),spatialAnchor({id:"west",x:.14,y:.5,z:0})];
const caps=await xrCapabilities();capEl.textContent=caps.webxr?("XR // VR "+(caps.vr?"READY":"NO")+" // AR "+(caps.ar?"READY":"NO")):"XR UNAVAILABLE // DESKTOP FALLBACK";enter.hidden=!caps.vr;event(run,"xr-lab-start",{caps,comfort});
enter.onclick=async()=>{try{session=await requestXRSession("immersive-vr");const ref=await referenceSpace(session);xrSpace=ref.space;event(run,"xr-session-start",{referenceSpace:ref.type});capEl.textContent="VR ACTIVE // "+ref.type.toUpperCase();bindSelect(session,controllers,{onStart:(hand,ctrl)=>event(run,"xr-select-start",{hand,point:ctrl?.ray||null}),onEnd:(hand)=>event(run,"xr-select-end",{hand})});const xrFrame=(time,frame)=>{if(!session||!xrSpace)return;controllers.sync(session);updateControllerPoses(controllers,frame,xrSpace);xrFrameCount++;if(xrFrameCount%120===0)event(run,"xr-frame-sample",{controllers:controllers.all().map(x=>({hand:x.hand,grip:x.grip,ray:x.ray}))});session.requestAnimationFrame(xrFrame)};session.requestAnimationFrame(xrFrame);session.addEventListener("end",()=>{session=null;xrSpace=null;capEl.textContent="VR SESSION ENDED";event(run,"xr-session-end",{frames:xrFrameCount})})}catch(e){capEl.textContent="VR ENTRY FAILED";event(run,"xr-session-error",{message:String(e.message||e)})}};
addEventListener("keydown",e=>keys.add(e.key.toLowerCase()));addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));c.addEventListener("pointermove",e=>{aim.x=e.clientX/innerWidth;aim.y=e.clientY/innerHeight});c.addEventListener("pointerdown",()=>{if(grab.held){const o=grab.release();event(run,"release",{id:o.id})}else{const target=interactionTarget(objects,aim,.1);if(target&&grab.grab(target))event(run,"grab",{id:target.id})}});
function frame(t){const dt=Math.min(.04,(t-last)/1000);last=t;let dx=0,dy=0;if(keys.has("a"))dx--;if(keys.has("d"))dx++;if(keys.has("w"))dy--;if(keys.has("s"))dy++;const m=Math.hypot(dx,dy)||1;player.x=Math.max(.05,Math.min(.95,player.x+dx/m*.25*dt));player.y=Math.max(.1,Math.min(.92,player.y+dy/m*.25*dt));if(grab.held){grab.held.position.x=aim.x;grab.held.position.y=aim.y}heldEl.textContent="HELD: "+(grab.held?grab.held.id.toUpperCase():"NONE")+" // XR HANDS "+controllers.all().length;
g.clearRect(0,0,c.width,c.height);g.save();g.scale(c.width,c.height);g.fillStyle="#0d1824";g.fillRect(.06,.1,.88,.82);g.strokeStyle="#20394d";for(let i=0;i<8;i++){g.beginPath();g.moveTo(.06,.1+i*.1);g.lineTo(.94,.1+i*.1);g.stroke()}for(const a of anchors){g.strokeStyle="#65e0ff";g.strokeRect(a.position.x-.018,a.position.y-.018,.036,.036)}for(const o of objects){g.fillStyle=o.id==="orb"?"#8deaff":o.id==="cube"?"#d4a2ff":"#8dffba";g.beginPath();g.arc(o.position.x,o.position.y,o.r,0,7);g.fill()}g.strokeStyle="#7c93a6";g.beginPath();g.moveTo(player.x,player.y);g.lineTo(aim.x,aim.y);g.stroke();g.fillStyle="#fff";g.beginPath();g.arc(player.x,player.y,.022,0,7);g.fill();g.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener("pagehide",()=>finishRun(run,{result:"exit",xr:Boolean(session),held:grab.held?.id||null}));
</script></body></html>
