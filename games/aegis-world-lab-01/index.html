<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS World Lab 01</title><style>*{box-sizing:border-box}body{margin:0;background:#081017;color:#eef6ff;font:13px ui-monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}header{position:fixed;inset:10px 12px auto;display:flex;justify-content:space-between;pointer-events:none}.note{position:fixed;left:12px;bottom:12px}.mission{position:fixed;right:12px;bottom:12px;text-align:right}</style></head><body><header><span>AEGIS // WORLD LAB 01</span><span id="hud"></span></header><canvas></canvas><div class="note">WASD MOVE/DRIVE · E ENTER/EXIT · F INTERACT · R RESET</div><div class="mission" id="mission"></div><script type="module">
import{responseSystem,reputation,wallet,vehicle,mission,worldEventDirector}from"../runtime/world.js";import{beginRun,event,finishRun}from"../protocol.js";
const c=document.querySelector("canvas"),g=c.getContext("2d"),hud=document.querySelector("#hud"),missionEl=document.querySelector("#mission");function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);
let keys=new Set,run,p,car,heat,rep,cash,job,director,currentEvent,npcs,last=performance.now(),done=false;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){run=beginRun("aegis-world-lab-01");p={x:.18,y:.78,inVehicle:false};car=vehicle({id:"courier-01",x:.28,y:.72,speed:.42});heat=responseSystem({decay:3});rep=reputation({civic:0,frontier:0});cash=wallet(40);job=mission({id:"signal-courier",title:"Signal Courier",steps:["Meet the broker","Deliver to the beacon","Return to broker"]});director=worldEventDirector([{id:"street-market",label:"STREET MARKET"},{id:"patrol-sweep",label:"PATROL SWEEP"},{id:"distress-call",label:"DISTRESS CALL"}],108);currentEvent=director.pick();npcs=[{x:.14,y:.22,faction:"civic"},{x:.82,y:.28,faction:"frontier"},{x:.62,y:.76,faction:"civic"}];done=false;event(run,"world-lab-start",{event:currentEvent.id})}reset();
addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==="r")reset();if(e.key.toLowerCase()==="e"){if(!p.inVehicle&&dist(p,car)<.1&&car.enter()){p.inVehicle=true;event(run,"vehicle-enter",{id:car.id})}else if(p.inVehicle&&car.exit()){p.inVehicle=false;p.x=clamp(car.x+.06,.03,.97);p.y=car.y;event(run,"vehicle-exit",{id:car.id})}}if(e.key.toLowerCase()==="f")interact()});addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function interact(){const broker={x:.14,y:.22},beacon={x:.86,y:.82};if(job.state==="available"&&dist(p.inVehicle?car:p,broker)<.11){job.start();job.advance();event(run,"mission-start",{id:job.id});return}if(job.state==="active"&&job.step==="Deliver to the beacon"&&dist(p.inVehicle?car:p,beacon)<.12){job.advance();cash.credit(60);rep.add("frontier",2);event(run,"mission-delivery",{credits:60});return}if(job.state==="active"&&job.step==="Return to broker"&&dist(p.inVehicle?car:p,broker)<.11){job.advance();cash.credit(100);rep.add("civic",3);event(run,"mission-complete",{credits:100});finishRun(run,{result:"clear",credits:cash.balance,civic:rep.get("civic"),frontier:rep.get("frontier")});done=true}}
function frame(t){const dt=Math.min(.04,(t-last)/1000);last=t;let dx=0,dy=0;if(keys.has("a")||keys.has("arrowleft"))dx--;if(keys.has("d")||keys.has("arrowright"))dx++;if(keys.has("w")||keys.has("arrowup"))dy--;if(keys.has("s")||keys.has("arrowdown"))dy++;if(!done){if(p.inVehicle){car.drive(dx,dy,dt);car.x=clamp(car.x,.03,.97);car.y=clamp(car.y,.07,.94);p.x=car.x;p.y=car.y;if(Math.hypot(dx,dy)>0&&npcs.some(n=>dist(car,n)<.055))heat.add(18*dt)}else{const m=Math.hypot(dx,dy)||1;p.x=clamp(p.x+dx/m*.24*dt,.03,.97);p.y=clamp(p.y+dy/m*.24*dt,.07,.94)}const observed=heat.level>0&&npcs.some(n=>dist(p.inVehicle?car:p,n)<.2);heat.step(dt,observed)}
g.clearRect(0,0,c.width,c.height);g.save();g.scale(c.width,c.height);g.fillStyle="#101d29";g.fillRect(.05,.12,.9,.76);g.fillStyle="#1d3342";for(let i=0;i<5;i++)g.fillRect(.08+i*.19,.15,.11,.18);g.fillStyle="#4d6271";g.fillRect(.05,.48,.9,.14);g.fillStyle="#7df0bd";g.beginPath();g.arc(.86,.82,.035,0,7);g.fill();g.fillStyle="#d3a7ff";for(const n of npcs){g.beginPath();g.arc(n.x,n.y,.018,0,7);g.fill()}g.fillStyle=car.occupied?"#ffd166":"#f09d51";g.fillRect(car.x-.035,car.y-.022,.07,.044);if(!p.inVehicle){g.fillStyle="#eef6ff";g.beginPath();g.arc(p.x,p.y,.02,0,7);g.fill()}g.restore();hud.textContent="CR "+cash.balance+" // HEAT "+heat.level+" // CIV "+rep.get("civic")+" // FRT "+rep.get("frontier");missionEl.textContent=(job.state==="complete"?"MISSION COMPLETE":job.state==="available"?"F: MEET BROKER":job.step)+" // "+currentEvent.label;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
