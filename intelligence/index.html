<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>INTELLIGENCE // THE PORTAL</title><script src="../world.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#eee;font-family:ui-monospace,monospace}.back{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));left:18px;color:#777784;text-decoration:none;font-size:9px}.shell{height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:max(58px,calc(env(safe-area-inset-top) + 42px)) 18px max(18px,env(safe-area-inset-bottom));max-width:860px;margin:auto}.head{text-align:center}.glyph{font-size:42px;filter:drop-shadow(0 0 28px #9c8cff77)}h1{font:900 clamp(34px,9vw,70px)/.9 Arial Black,sans-serif;letter-spacing:-.055em;margin:5px}.truth{font-size:8px;letter-spacing:.16em;color:#666674}.minds{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:14px 0}.minds button{border:1px solid #292933;background:#09090d;color:#777784;border-radius:999px;padding:9px 11px;font:8px ui-monospace;letter-spacing:.08em}.minds button.on{border-color:#8174aa;color:#eee}.log{min-height:0;overflow:auto;border:1px solid #1d1d25;border-radius:18px;padding:16px;background:#08080c}.msg{max-width:82%;margin:9px 0;padding:11px 13px;border-radius:14px;font-size:11px;line-height:1.55;white-space:pre-wrap}.user{margin-left:auto;background:#171720}.ai{background:#0e0e14;border:1px solid #22222d}.system{max-width:100%;text-align:center;color:#666674;font-size:9px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding-top:10px}.composer input{min-width:0;border:1px solid #292933;border-radius:999px;background:#09090d;color:#eee;padding:13px 16px;font:11px ui-monospace}.composer button{border:1px solid #8174aa;border-radius:999px;background:#121019;color:#ddd;padding:0 17px;font:9px ui-monospace}.composer button:disabled{opacity:.35}
</style></head><body><a class="back" href="../stations/?s=intelligence">← INTELLIGENCE STATION</a><main class="shell"><header class="head"><div class="glyph" id="glyph">◇</div><h1>INTELLIGENCE</h1><div class="truth">NATIVE PORTAL SURFACE // NO FABRICATED REPLIES</div><div class="minds" id="minds"></div></header><section class="log" id="log"></section><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="speak into the portal…" aria-label="Message"><button id="send">SEND</button></form></main><script>
let cfg,mind="portal",history=[];const log=document.querySelector("#log"),input=document.querySelector("#input"),send=document.querySelector("#send"),minds=document.querySelector("#minds"),glyph=document.querySelector("#glyph");
function say(role,text){const d=document.createElement("div");d.className="msg "+role;d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight}
function select(id){mind=id;const m=cfg.minds.find(x=>x.id===id)||cfg.minds[0];glyph.textContent=m.glyph;minds.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));localStorage.setItem("portal-intelligence-mind",id);say("system",m.label+" // "+m.purpose)}
function ready(){const live=cfg.endpoint&&cfg.mode==="live";send.disabled=!live;if(!live)say("system","THE MIND HAS A BODY BUT NO ENGINE YET. PORTAL WILL NOT PRETEND TO ANSWER.")}
fetch("config.json").then(r=>r.json()).then(c=>{if(c.schema!=="portal.intelligence.v1")throw 0;cfg=c;c.minds.forEach(m=>{const b=document.createElement("button");b.type="button";b.dataset.id=m.id;b.textContent=m.glyph+" "+m.label;b.onclick=()=>select(m.id);minds.append(b)});select(localStorage.getItem("portal-intelligence-mind")||"portal");ready();localStorage.setItem("portal-intelligence","1")}).catch(()=>say("system","INTELLIGENCE REGISTRY UNAVAILABLE."));
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||!cfg?.endpoint)return;input.value="";say("user",text);history.push({role:"user",content:text});send.disabled=true;try{const world=window.PortalWorld?.state||{};const r=await fetch(cfg.endpoint,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({schema:"portal.chat.v1",mind,messages:history.slice(-20),world:{visits:world.visits,pressure:world.pressure,inventory:world.inventory,scars:world.scars}})});const d=await r.json();if(!r.ok||d.schema!=="portal.chat.v1"||d.verified!==true||typeof d.message?.content!=="string"||!d.message.content.trim())throw 0;history.push({role:"assistant",content:d.message.content});say("ai",d.message.content);localStorage.setItem("portal-intelligence-spoke","1")}catch(_){say("system","NO VERIFIED INTELLIGENCE RESPONSE RETURNED.")}finally{send.disabled=!(cfg.endpoint&&cfg.mode==="live")}};
</script></body></html>
