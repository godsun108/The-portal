<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>UP//VOID</title><link rel="stylesheet" href="../../portal-atmosphere.css"><link rel="stylesheet" href="../../portal-magic.css"><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#030307;color:#eee;font-family:ui-monospace}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:3;inset:15px 18px auto;display:flex;justify-content:space-between;font-size:10px}.controls{position:fixed;z-index:4;left:16px;right:16px;bottom:18px;display:flex;justify-content:space-between}.controls button{width:68px;height:52px}.screen{position:fixed;z-index:8;inset:0;display:grid;place-items:center;text-align:center;background:#030307ed;padding:22px}.hide{display:none}h1{font:900 clamp(58px,18vw,130px)/.76 Arial Black;letter-spacing:-.08em;margin:8px}.hint{color:#777;max-width:440px;line-height:1.7;margin:20px auto}button,a{border:1px solid #ffffff35;background:#090911;color:#eee;border-radius:999px;padding:12px 17px;font:10px ui-monospace;text-decoration:none}</style></head><body><canvas id="c"></canvas><div class="hud"><span id="height">HEIGHT 0</span><span id="falls">FALLS 0</span></div><div class="controls"><span><button data-k="left">←</button> <button data-k="right">→</button></span><button data-k="jump">↑</button></div><section class="screen" id="intro"><div><div>ARCADE // PLATFORM CABINET</div><h1>UP//VOID</h1><p class="hint">CLIMB. LEFT/RIGHT + JUMP. REACH THE WHITE DOOR ABOVE THE VOID. FOUR FALLS ENDS THE ASCENT.</p><button id="go">ASCEND</button> <a href="../../arcade/">ARCADE</a></div></section><section class="screen hide" id="over"><div><div id="label">ASCENT COMPLETE</div><h1 id="final">UP</h1><p class="hint" id="reward"></p><button id="again">AGAIN</button> <a href="../../arcade/">ARCADE</a></div></section><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{physicsState}from"../../physics.js";import{installTravelerHUD}from"../../traveler-hud.js";import{installTransitions}from"../../transitions.js";installTravelerHUD();installTransitions("up-void");const cv=document.querySelector("#c"),x=cv.getContext("2d"),phys=physicsState();let w,h,dpr,p,plats,keys={},playing=false,last,cam=0,fallCount=0,run,startTime,best=Number(localStorage.getItem("portal-up-void-best")||0);function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener("resize",size);function level(){plats=[{x:0,y:0,w:500},{x:70,y:-100,w:110},{x:230,y:-190,w:100},{x:90,y:-285,w:95},{x:260,y:-390,w:105},{x:120,y:-500,w:90},{x:280,y:-610,w:90},{x:130,y:-720,w:100},{x:260,y:-835,w:100},{x:100,y:-950,w:115},{x:250,y:-1070,w:120}]}function start(){level();p={x:80,y:-40,vx:0,vy:0,on:false};cam=0;fallCount=0;last=performance.now();startTime=last;run=beginRun("up-void");playing=true;intro.classList.add("hide");over.classList.add("hide");requestAnimationFrame(loop)}function jump(){if(p.on){p.vy=phys.mode==="converged"?-9.2:-8.4;p.on=false}}function loop(t){if(!playing)return;const dt=Math.min(2,(t-last)/16.67);last=t;p.vx+=(keys.left?-0.55:0)+(keys.right?.55:0);p.vx*=.84;p.vy+=(phys.mode==="converged"?.31:.42)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(4,Math.min(w-16,p.x));p.on=false;for(const q of plats){if(p.vy>=0&&p.x+12>q.x&&p.x<q.x+q.w&&p.y+18>=q.y&&p.y+18-p.vy*dt<q.y+4){p.y=q.y-18;p.vy=0;p.on=true}}if(p.y>cam+h+160){fallCount++;event(run,"fall",{falls:fallCount});p={x:80,y:cam+20,vx:0,vy:0,on:false};if(fallCount>=4)return end(false)}cam=Math.min(cam,p.y-h*.55);x.clearRect(0,0,w,h);x.save();x.translate(0,-cam);x.fillStyle="#ffffff55";for(const q of plats)x.fillRect(q.x,q.y,q.w,3);x.fillStyle="#eee";x.fillRect(p.x,p.y,12,18);x.strokeStyle="#fff";x.strokeRect(270,-1145,42,60);x.restore();height.textContent="HEIGHT "+Math.max(0,Math.floor(-p.y));falls.textContent="FALLS "+fallCount;if(p.y<-1090&&p.x>255&&p.x<325)return end(true);requestAnimationFrame(loop)}function end(win){playing=false;const time=Math.round(performance.now()-startTime),seconds=(time/1000).toFixed(1),r=win?(phys.mode==="converged"?"void-feather":"white-door-key"):null;if(r){grantArtifact(r);if(!best||time<best){best=time;localStorage.setItem("portal-up-void-best",best)}}else scar("void-fall");finishRun(run,{win,falls:fallCount,timeMs:time,reward:r,physics:phys.mode});label.textContent=win?"ASCENT COMPLETE":"THE VOID WON";final.textContent=win?"UP":"DOWN";reward.textContent=(r?"ARTIFACT // "+r.toUpperCase()+" // "+seconds+" S // BEST "+(best/1000).toFixed(1)+" S":"FOUR FALLS. THE VOID REMEMBERS.");over.classList.remove("hide")}go.onclick=start;again.onclick=start;addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;if(e.key==="ArrowRight"||e.key==="d")keys.right=true;if(e.key==="ArrowUp"||e.key===" "||e.key==="w")jump()});addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;if(e.key==="ArrowRight"||e.key==="d")keys.right=false});document.querySelectorAll("[data-k]").forEach(b=>{const k=b.dataset.k;b.onpointerdown=()=>k==="jump"?jump():keys[k]=true;b.onpointerup=b.onpointercancel=()=>keys[k]=false});</script></body></html>
