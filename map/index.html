<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05060a"><title>MAP // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle,#101528,#040509 60%);color:#e9e9ee;font-family:ui-monospace,monospace}.back{position:fixed;top:18px;left:18px;color:#586077;text-decoration:none;font-size:9px}.wrap{width:min(820px,calc(100% - 28px));margin:auto;padding:70px 0;text-align:center}.eye{font-size:9px;letter-spacing:.3em;color:#606a87}h1{font:900 clamp(56px,15vw,110px)/.8 Arial Black,sans-serif;letter-spacing:-.06em}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:35px}.node{min-height:110px;border:1px solid #222a40;border-radius:50%;display:grid;place-items:center;padding:15px;color:#8d96b0;font-size:9px;letter-spacing:.12em;box-shadow:0 0 35px #26335c18}.unknown{opacity:.16}.deep{border-style:dashed;color:#b096ba}.note{margin-top:30px;color:#555d73;font-size:9px;line-height:1.8}@media(max-width:520px){.map{grid-template-columns:repeat(2,1fr)}.node{min-height:95px}}</style></head><body><a class="back" href="../">← PORTAL</a><main class="wrap"><div class="eye">LOCAL CARTOGRAPHY // OBSERVED TERRITORY ONLY</div><h1>MAP</h1><section class="map" id="map"></section><p class="note">The map does not reveal places you have not reached.<br>Absence is not evidence that nothing is there.</p></main><script>const n=[["EARTH","portal-artifact-earth"],["SIGNAL","portal-artifact-signal"],["VOID","portal-artifact-void"],["88.8","portal-radio-888"],["ROOM 000","portal-secret-unlocked"],["UNDERNET","portal-undernet","deep"],["LISTENER","portal-listener","deep"],["TIME","portal-time"],["DREAM","portal-dream"],["COLOR","portal-color"],["MACHINE","portal-machine"],["DEAD WEB","portal-dead"],["CAPSULE","portal-capsule-used"],["BLACK BOX","portal-blackbox"],["WEATHER","portal-weather"],["EARTH PULSE","portal-pulse"],["SKY","portal-sky"],["ARCHIVE","portal-archive","deep"],["CARTOGRAPHER","portal-cartographer","deep"]];map.innerHTML=n.map(([name,key,cl])=>{const ok=localStorage.getItem(key)==="1";return '<div class="node '+(ok?(cl||""):"unknown")+'">'+(ok?name:"?")+"</div>"}).join("");localStorage.setItem("portal-map","1");</script></body></html>
