<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS Combat Lab 01</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#eef4ff;font:14px ui-monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}header{position:fixed;inset:12px;display:flex;justify-content:space-between;pointer-events:none}.note{position:fixed;left:12px;bottom:12px}</style></head><body><header><span>AEGIS // COMBAT LAB 01</span><span id="hud"></span></header><canvas></canvas><div class="note">WASD / ARROWS MOVE · SPACE FIRE · R RESET</div><script type="module">
import{health,projectile,spawnField,objective,intersects,clamp}from"../runtime/combat.js";
import{beginRun,event,finishRun}from"../protocol.js";
const c=document.querySelector("canvas"),g=c.getContext("2d"),hud=document.querySelector("#hud");function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);
let run,p,enemies,shots,goal,keys=new Set,done=false,last=performance.now();function reset(){run=beginRun("aegis-combat-lab-01");p={x:.5,y:.82,health:health(100)};enemies=spawnField({seed:108,count:8});shots=[];goal=objective(enemies.length);done=false;event(run,"combat-lab-start",{enemies:enemies.length})}reset();
addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(e.key===" "){shots.push(projectile({x:p.x,y:p.y,vx:0,vy:-1,speed:.9,damage:10}));event(run,"shot")}if(e.key.toLowerCase()==="r")reset()});addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function end(result){if(done)return;done=true;finishRun(run,{result,defeats:goal.progress,health:p.health.value})}
function frame(t){const dt=Math.min(.04,(t-last)/1000);last=t;if(!done){if(keys.has("a")||keys.has("arrowleft"))p.x-=dt*.35;if(keys.has("d")||keys.has("arrowright"))p.x+=dt*.35;if(keys.has("w")||keys.has("arrowup"))p.y-=dt*.35;if(keys.has("s")||keys.has("arrowdown"))p.y+=dt*.35;p.x=clamp(p.x,.03,.97);p.y=clamp(p.y,.08,.94);shots.forEach(s=>s.step(dt));shots=shots.filter(s=>s.alive);for(const e of enemies){e.step(dt,p);for(const s of shots)if(s.alive&&e.health.alive&&intersects(s,e,.035)){s.alive=false;e.hit(s.damage);event(run,"hit",{kind:e.kind});if(!e.health.alive){goal.advance();event(run,"enemy-defeat",{progress:goal.progress})}}if(e.health.alive&&intersects(e,p,.045)){p.health.damage(22*dt);if(!p.health.alive)end("lost")}}enemies=enemies.filter(e=>e.health.alive);if(goal.complete)end("clear")}
g.clearRect(0,0,c.width,c.height);g.save();g.scale(c.width,c.height);g.fillStyle="#dce8ff";g.beginPath();g.arc(p.x,p.y,.025,0,7);g.fill();g.fillStyle="#8ad4ff";for(const s of shots){g.beginPath();g.arc(s.x,s.y,.008,0,7);g.fill()}g.fillStyle="#ff7892";for(const e of enemies){g.beginPath();g.arc(e.x,e.y,.024,0,7);g.fill()}g.restore();hud.textContent="HP "+Math.ceil(p.health.value)+" // HOSTILES "+enemies.length+(done?" // "+(goal.complete?"CLEAR":"DOWN"):"");requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
