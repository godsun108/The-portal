<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOWER//ZERO</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030406;color:#eef;font-family:ui-monospace}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;left:16px;top:14px;font-size:10px;letter-spacing:.12em;z-index:2}.back{position:fixed;right:16px;top:14px;color:#77808b;text-decoration:none;font-size:9px;z-index:3}.gate{position:fixed;inset:0;background:#020305ee;display:grid;place-items:center;text-align:center;padding:24px;z-index:8}.gate h1{font:900 clamp(52px,14vw,100px)/.78 Arial Black;letter-spacing:-.07em;margin:16px}.gate p{color:#7b838e;line-height:1.8}.gate button{padding:14px 22px;border:1px solid #687482;background:#090d12;color:#eef;border-radius:999px;font:10px ui-monospace;letter-spacing:.14em}.hidden{display:none}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud"></div><a class="back" href="../../arcade/">ARCADE ↑</a><div class="gate" id="gate"><div><div>VERTICAL // ASCENT</div><h1>TOWER//<br>ZERO</h1><p>MOVE LEFT/RIGHT. JUMP WITH SPACE / TAP.<br>THE TOWER FALLS WHILE YOU CLIMB.<br>REACH FLOOR 20.<br>NO FALLS + UNDER 55 SECONDS EARNS THE ZERO CROWN.</p><button id="start">ASCEND</button></div></div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();const cv=c,x=cv.getContext("2d");let W,H,run,p,plats=[],keys={},floor=0,falls=0,ended=false,t0=0,best=Number(localStorage.getItem("portal-tower-zero-best")||0);function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=1;if(e.code==="Space")jump()});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);cv.addEventListener("pointerdown",e=>{if(e.clientX<innerWidth*.4)keys.a=1;else if(e.clientX>innerWidth*.6)keys.d=1;else jump()});cv.addEventListener("pointerup",()=>{keys.a=keys.d=0});function jump(){if(p&&p.ground){p.vy=-520*devicePixelRatio;p.ground=false}}function build(){plats=[];for(let i=0;i<22;i++)plats.push({x:(.08+Math.random()*.7)*W,y:H-i*115*devicePixelRatio,w:(.16+Math.random()*.14)*W,n:i});plats[0]={x:W*.35,y:H-45*devicePixelRatio,w:W*.3,n:0};p={x:W*.48,y:H-80*devicePixelRatio,vx:0,vy:0,ground:false};floor=0;t0=performance.now()}function end(win){ended=true;const sec=(performance.now()-t0)/1000;if(win){if(!best||sec<best){best=sec;localStorage.setItem("portal-tower-zero-best",best)}const mastery=falls===0&&sec<55;grantArtifact(mastery?"zero-crown":"tower-shard");finishRun(run,{result:"clear",time:sec,falls,artifact:mastery?"zero-crown":"tower-shard"})}else{scar("tower-fall");finishRun(run,{result:"lost",floor,falls,scar:"tower-fall"})}gate.classList.remove("hidden");gate.innerHTML='<div><div>TOWER//ZERO</div><h1>'+(win?"SUMMIT<br>ZERO":"FALL<br>BELOW")+'</h1><p>'+(win?(falls===0&&sec<55?"ARTIFACT // ZERO CROWN":"ARTIFACT // TOWER SHARD"):"SCAR // TOWER FALL")+'<br>FLOOR '+floor+(best?' // BEST '+best.toFixed(1)+' S':'')+'</p><button onclick="location.reload()">CLIMB AGAIN</button></div>'}let last=0;function frame(ms){if(ended)return;let dt=Math.min(.025,(ms-last)/1000||.016);last=ms;p.vx=((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0))*240*devicePixelRatio;p.vy+=1100*devicePixelRatio*dt;let oldY=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=(p.x+W)%W;p.ground=false;for(const q of plats){if(p.vy>=0&&oldY+12*devicePixelRatio<=q.y&&p.y+12*devicePixelRatio>=q.y&&p.x>=q.x&&p.x<=q.x+q.w){p.y=q.y-12*devicePixelRatio;p.vy=0;p.ground=true;if(q.n>floor){floor=q.n;event(run,"floor",{floor})}}}if(p.y<H*.38){let shift=H*.38-p.y;p.y+=shift;plats.forEach(q=>q.y+=shift)}plats.forEach(q=>q.y+=18*devicePixelRatio*dt);if(floor>=20)return end(true);if(p.y>H+60*devicePixelRatio){falls++;return end(false)}x.fillStyle="#030406";x.fillRect(0,0,W,H);for(const q of plats){if(q.y>-20&&q.y<H+20){x.strokeStyle=q.n===20?"#fff":"#53606e";x.lineWidth=3*devicePixelRatio;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x+q.w,q.y);x.stroke();x.fillStyle="#6d7885";x.font=9*devicePixelRatio+"px ui-monospace";x.fillText(String(q.n).padStart(2,"0"),q.x,q.y-7)}}x.fillStyle="#fff";x.fillRect(p.x-6*devicePixelRatio,p.y-12*devicePixelRatio,12*devicePixelRatio,24*devicePixelRatio);hud.textContent="FLOOR "+floor+"/20 // TIME "+Math.floor((ms-t0)/1000);requestAnimationFrame(frame)}start.onclick=()=>{run=beginRun("tower-zero");build();gate.classList.add("hidden");requestAnimationFrame(frame)};</script></body></html>
