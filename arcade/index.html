<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>ARCADE // THE PORTAL</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 0,#23152f,#050507 52%);color:#eee;font-family:ui-monospace,monospace;padding:28px}.back{color:#6f6576;text-decoration:none;font-size:9px;letter-spacing:.2em}.wrap{width:min(850px,100%);margin:70px auto}.ey{font-size:9px;letter-spacing:.34em;color:#7f7089}h1{font:900 clamp(58px,15vw,120px)/.75 Arial Black,sans-serif;letter-spacing:-.07em;margin:22px 0 18px}.lede{color:#93879b;font-size:11px;line-height:1.8}.games{display:grid;gap:12px;margin-top:42px}.game{min-height:190px;border:1px solid #30283a;border-radius:22px;background:#0a080d;padding:22px;position:relative;overflow:hidden;cursor:pointer;color:#eee;text-align:left}.game strong{display:block;font-size:16px;letter-spacing:.1em}.game small{color:#766b7d}.moon{position:absolute;width:86px;height:86px;border-radius:50%;right:28px;bottom:26px;background:#ddd;box-shadow:0 0 45px #ddd6}.red{position:absolute;width:92px;height:92px;border-radius:50%;right:26px;bottom:24px;background:#42131b;border:1px solid #8b3342;box-shadow:0 0 40px #b21d3633}.life{position:absolute;right:34px;bottom:30px;font-size:70px}.stage{position:fixed;inset:0;background:#030304;z-index:5;display:none;place-items:center;text-align:center;padding:28px}.stage.open{display:grid}.stage h2{font:900 clamp(42px,12vw,96px)/.82 Arial Black,sans-serif;letter-spacing:-.05em}.stage p{color:#777;line-height:1.8;max-width:600px}.stage button{border:1px solid #333;background:#09090c;color:#aaa;padding:14px 20px;border-radius:999px;font:9px ui-monospace;letter-spacing:.16em}.moonbig{width:min(210px,55vw);aspect-ratio:1;border-radius:50%;background:#e7e3d9;box-shadow:0 0 80px #fff4;margin:30px auto;cursor:pointer;transition:.3s}.moonbig:active{transform:scale(.92)}@media(min-width:700px){.games{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body>
<a class="back" href="../">← PORTAL</a><main class="wrap"><div class="ey">UNLISTED ENTERTAINMENT SYSTEM</div><h1>ARCADE</h1><p class="lede">No coins. No leaderboard. Some games remember.</p><section class="games">
<button class="game" data-g="moon"><strong>DON'T TOUCH<br>THE MOON</strong><small>one instruction</small><i class="moon"></i></button>
<button class="game" data-g="button"><strong>THE BUTTON</strong><small id="pressLabel">DO NOT PRESS</small><i class="red"></i></button>
<button class="game" data-g="life"><strong>ONE LIFE</strong><small>this browser gets one</small><i class="life">◇</i></button>
</section></main><section class="stage" id="stage"><div id="inside"></div></section><script>
localStorage.setItem("portal-arcade","1");const stage=document.querySelector("#stage"),inside=document.querySelector("#inside");function close(){stage.classList.remove("open")}function open(html){inside.innerHTML=html;stage.classList.add("open")}
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>games[b.dataset.g]());
const games={
moon(){open('<div class="ey">RULE 01</div><h2>DON\'T TOUCH<br>THE MOON.</h2><div class="moonbig" id="mb"></div><p id="msg">Seriously.</p><button id="exit">LEAVE IT ALONE</button>');exit.onclick=close;mb.onclick=()=>{localStorage.setItem("portal-moon-touched","1");mb.style.transform="translateY(70vh) scale(.2)";msg.textContent="You had one job. Somewhere, the tide is filing paperwork.";setTimeout(()=>mb.remove(),600)}},
button(){let n=Number(localStorage.getItem("portal-button")||0);open('<div class="ey">PRESS COUNT // <span id="n">'+n+'</span></div><h2 id="bt">DO NOT<br>PRESS.</h2><button id="pb" style="font-size:18px;padding:24px 34px">PRESS ANYWAY</button><p id="msg"></p><button id="exit">ESCAPE</button>');exit.onclick=close;pb.onclick=()=>{n++;localStorage.setItem("portal-button",n);document.querySelector("#n").textContent=n;const m=["Nothing happened.","Again?","The button has noticed a pattern.","This is now between you and the button.","You are creating a statistic nobody requested.","The machine appreciates your lack of restraint."];msg.textContent=n===13?"THIRTEEN. A LOCK SOMEWHERE JUST COUGHED.":n===37?"THE BUTTON WOULD LIKE YOU TO STOP. IT IS LYING.":m[Math.min(n-1,m.length-1)];if(n===13)localStorage.setItem("portal-arcade-13","1")}},
life(){if(localStorage.getItem("portal-one-life")==="dead"){open('<div class="ey">ONE LIFE</div><h2>YOU ALREADY<br>USED IT.</h2><p>This browser remembers.</p><button id="exit">ACCEPT FATE</button>');exit.onclick=close;return}open('<div class="ey">ONE LIFE // TAP THE SIGNAL BEFORE IT VANISHES</div><h2 id="lh">READY?</h2><p id="msg">There will be no second life on this browser.</p><button id="start">USE MY LIFE</button><button id="exit">LEAVE WHILE YOU CAN</button>');exit.onclick=close;start.onclick=()=>{start.remove();lh.textContent="WAIT.";let delay=1200+Math.random()*2600;setTimeout(()=>{lh.textContent="NOW";const target=document.createElement("button");target.textContent="✦";target.style.cssText="font-size:48px;padding:22px 30px";inside.insertBefore(target,msg);let done=false;target.onclick=()=>{if(done)return;done=true;localStorage.setItem("portal-one-life","won");lh.textContent="ALIVE.";msg.textContent="You kept your one life.";target.remove()};setTimeout(()=>{if(done)return;done=true;localStorage.setItem("portal-one-life","dead");lh.textContent="TOO LATE.";msg.textContent="That was it.";target.remove()},900)},delay)}}};
</script></body></html>
