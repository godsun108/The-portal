<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PORTAL TV · Broadcast Directory</title><style>body{background:#08101b;color:#e5f7ff;font:16px system-ui;max-width:1100px;margin:auto;padding:24px}h1{letter-spacing:.13em;color:#8de5db}a{color:#8de5db}input,select{background:#14263b;color:white;padding:12px;border:1px solid #547483;border-radius:8px}input{width:min(95%,420px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:20px}article{background:#132338;border:1px solid #38516b;border-radius:12px;padding:15px}small{color:#acc3d4}.notice{background:#263044;padding:12px;border-radius:8px}</style><p><a href="tv.html">← Back to PORTAL TV</a></p><h1>BROADCAST DIRECTORY</h1><p class="notice">Official destinations only. Open services in their own authorized players. OTA requires antenna/tuner hardware. Availability, accounts and location restrictions vary. This is not an EPG or a claim that these services can be embedded.</p><label for="search">Find programming </label><input id="search" type="search" placeholder="News, documentaries, free TV…"><label for="category"> Category </label><select id="category"><option value="">All</option></select><p id="count"></p><main class="grid" id="results"></main><script src="tv-catalog.js"></script><script>const all=window.PORTAL_TV_CATALOG.entries,results=document.querySelector('#results'),search=document.querySelector('#search'),category=document.querySelector('#category');[...new Set(all.map(x=>x.category))].sort().forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;category.append(o)});function draw(){results.replaceChildren();const q=search.value.toLowerCase().trim(),matches=all.filter(x=>(!category.value||x.category===category.value)&&[x.title,x.description,x.category].join(' ').toLowerCase().includes(q));document.querySelector('#count').textContent=matches.length+' official destinations';for(const x of matches){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),link=document.createElement('a'),tag=document.createElement('small');h.textContent=x.title;p.textContent=x.description;tag.textContent=x.category+' · official external destination';link.href=x.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open official service ↗';a.append(tag,h,p,link);results.append(a)}}search.oninput=category.onchange=draw;draw();</script></html>
