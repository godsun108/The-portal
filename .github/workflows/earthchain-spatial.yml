name: EarthChain Spatial Checks
on:
  pull_request:
    paths:
      - 'earthchain-spatial/**'
      - '.github/workflows/earthchain-spatial.yml'
  workflow_dispatch:
jobs:
  scene-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run spatial unit tests
        run: node --test earthchain-spatial/*.test.mjs
