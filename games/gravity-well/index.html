<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRAVITY//WELL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307;color:#edf4ff;font-family:ui-monospace}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:16px;top:14px;z-index:2;font-size:10px;letter-spacing:.12em;line-height:1.7}.back{position:fixed;right:16px;top:14px;color:#7d8796;text-decoration:none;font-size:9px;z-index:3}.gate{position:fixed;inset:0;background:#020307ee;display:grid;place-items:center;text-align:center;padding:24px;z-index:8}.gate h1{font:900 clamp(48px,14vw,100px)/.78 Arial Black;letter-spacing:-.07em;margin:16px}.gate p{color:#778497;line-height:1.8}.gate button{padding:14px 22px;border:1px solid #69788e;background:#080c13;color:#eef;border-radius:999px;font:10px ui-monospace;letter-spacing:.14em}.hidden{display:none}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud"></div><a class="back" href="../../arcade/">ARCADE ↑</a><div class="gate" id="gate"><div><div>PRECISION // ORBITAL CABINET</div><h1>GRAVITY//<br>WELL</h1><p>DRAG FROM THE PROBE TO SET AN IMPULSE.<br>RELEASE TO FIRE. COLLECT ALL NODES. LAND IN THE RING.<br>YOU HAVE SIX IMPULSES.<br>LAND WITH 2+ IMPULSES LEFT FOR THE GRAVITY SEAL.</p><button id="start">ENTER ORBIT</button></div></div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{physicsState}from"../../physics.js";import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();const cv=c,x=cv.getContext("2d"),P=physicsState();let W,H,run,probe,wells,nodes,target,impulses=6,drag=null,ended=false,startTime=0,best=Number(localStorage.getItem("portal-gravity-well-best")||-1);function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);function setup(){probe={x:W*.13,y:H*.75,vx:0,vy:0};wells=[{x:W*.38,y:H*.55,m:850},{x:W*.66,y:H*.35,m:1050}];nodes=[{x:W*.3,y:H*.28,on:1},{x:W*.55,y:H*.72,on:1},{x:W*.76,y:H*.58,on:1}];target={x:W*.88,y:H*.2,r:34*devicePixelRatio};startTime=performance.now()}function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*devicePixelRatio,y:(e.clientY-r.top)*devicePixelRatio}}cv.addEventListener("pointerdown",e=>{if(ended||impulses<=0)return;const p=pos(e);if(Math.hypot(p.x-probe.x,p.y-probe.y)<55*devicePixelRatio){drag=p;cv.setPointerCapture?.(e.pointerId)}});cv.addEventListener("pointermove",e=>{if(drag)drag=pos(e)});cv.addEventListener("pointerup",e=>{if(!drag||impulses<=0)return;const p=pos(e),dx=probe.x-p.x,dy=probe.y-p.y,d=Math.hypot(dx,dy),cap=Math.min(d,150*devicePixelRatio),n=d||1;probe.vx+=dx/n*cap*2.2;probe.vy+=dy/n*cap*2.2;impulses--;event(run,"impulse",{impulses});drag=null});function end(win){ended=true;const collected=nodes.filter(n=>!n.on).length,time=Math.round((performance.now()-startTime)/1000);if(win){best=Math.max(best,impulses);localStorage.setItem("portal-gravity-well-best",best);const mastery=impulses>=2;grantArtifact(mastery?"gravity-seal":"orbit-dust");finishRun(run,{result:"landed",impulses,time,artifact:mastery?"gravity-seal":"orbit-dust",physics:P.mode})}else{scar("lost-probe");finishRun(run,{result:"lost",collected,scar:"lost-probe",physics:P.mode})}gate.classList.remove("hidden");gate.innerHTML='<div><div>GRAVITY//WELL</div><h1>'+(win?"ORBIT<br>CLOSED":"PROBE<br>LOST")+'</h1><p>'+(win?(impulses>=2?"ARTIFACT // GRAVITY SEAL":"ARTIFACT // ORBIT DUST"):"SCAR // LOST PROBE")+'<br>IMPULSES REMAINING '+impulses+(best>=0?' // BEST '+best:'')+'</p><button onclick="location.reload()">NEW TRAJECTORY</button> <a href="../../arcade/" style="color:#eef;margin-left:12px">ARCADE</a></div>'}let last=0;function frame(ms){if(ended)return;let dt=Math.min(.025,(ms-last)/1000||.016);last=ms;for(const w of wells){let dx=w.x-probe.x,dy=w.y-probe.y,d2=Math.max(900*devicePixelRatio*devicePixelRatio,dx*dx+dy*dy),d=Math.sqrt(d2),g=w.m*110000*devicePixelRatio/d2;if(P.mode==="converged")g*=1+.18*Math.sin(ms*.001+w.x);probe.vx+=dx/d*g*dt;probe.vy+=dy/d*g*dt}probe.x+=probe.vx*dt;probe.y+=probe.vy*dt;for(const n of nodes)if(n.on&&Math.hypot(n.x-probe.x,n.y-probe.y)<25*devicePixelRatio){n.on=0;event(run,"node",{remaining:nodes.filter(q=>q.on).length})}const all=nodes.every(n=>!n.on),speed=Math.hypot(probe.vx,probe.vy);if(all&&Math.hypot(target.x-probe.x,target.y-probe.y)<target.r&&speed<150*devicePixelRatio)return end(true);if(probe.x<-W*.25||probe.x>W*1.25||probe.y<-H*.25||probe.y>H*1.25)return end(false);x.fillStyle="#020307";x.fillRect(0,0,W,H);for(const w of wells){let gr=x.createRadialGradient(w.x,w.y,2,w.x,w.y,75*devicePixelRatio);gr.addColorStop(0,"#d8e6ff");gr.addColorStop(.12,"#536a8d");gr.addColorStop(1,"#02030700");x.fillStyle=gr;x.beginPath();x.arc(w.x,w.y,75*devicePixelRatio,0,7);x.fill()}for(const n of nodes)if(n.on){x.strokeStyle="#9fc9ff";x.beginPath();x.arc(n.x,n.y,10*devicePixelRatio,0,7);x.stroke()}x.strokeStyle=all?"#fff":"#455064";x.lineWidth=2*devicePixelRatio;x.beginPath();x.arc(target.x,target.y,target.r,0,7);x.stroke();x.fillStyle="#fff";x.beginPath();x.arc(probe.x,probe.y,7*devicePixelRatio,0,7);x.fill();if(drag){x.strokeStyle="#fff8";x.beginPath();x.moveTo(probe.x,probe.y);x.lineTo(drag.x,drag.y);x.stroke()}hud.textContent="NODES "+nodes.filter(n=>!n.on).length+"/3 // IMPULSES "+impulses+" // SPEED "+Math.round(speed/devicePixelRatio)+" // "+P.mode.toUpperCase();if(impulses===0&&speed<5*devicePixelRatio&&!all)return end(false);requestAnimationFrame(frame)}start.onclick=()=>{run=beginRun("gravity-well");setup();gate.classList.add("hidden");requestAnimationFrame(frame)};</script></body></html>
