<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040407"><title>THE SPLIT // THE PORTAL</title><script src="../world.js"></script><script src="../world-events.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#040407;color:#ddd;font-family:ui-monospace,monospace;display:grid;place-items:center}.wrap{text-align:center;width:min(720px,90vw)}.mark{font-size:70px;letter-spacing:-.4em;transform:translateX(-.2em);opacity:.8}h1{font:900 clamp(60px,18vw,130px)/.75 Arial Black,sans-serif;letter-spacing:-.07em;margin:.3em 0}p{font-size:9px;color:#696976;line-height:2}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:38px}.choices button{height:130px;background:#07070c;border:1px solid #242430;color:#888;font:10px ui-monospace;letter-spacing:.18em;border-radius:18px}.locked{display:none}.locked.show{display:block}.choices.hide{display:none}.back{display:inline-block;margin-top:28px;color:#666;text-decoration:none;font-size:8px}</style></head><body><main class="wrap"><div class="mark">◐◑</div><h1>THE<br>SPLIT</h1><p id="copy">Both ways continue.<br>Neither one explains itself.</p><div class="choices" id="choices"><button data-fork="left">GO LEFT</button><button data-fork="right">GO RIGHT</button></div><div class="locked" id="locked"><p>THAT WAY IS NOW BEHIND YOU.</p><a class="back" href="../">RETURN TO PORTAL</a></div></main><script>const active=window.PortalEvents?.active?.id==="resonance",existing=localStorage.getItem("portal-world-fork");if(!active&&!existing){location.replace("../")}function showLocked(){document.querySelector("#choices").classList.add("hide");document.querySelector("#locked").classList.add("show");document.querySelector("#copy").textContent="You remember choosing. Portal remembers the consequence."}if(existing)showLocked();document.querySelectorAll("[data-fork]").forEach(b=>b.onclick=()=>{if(localStorage.getItem("portal-world-fork"))return;const fork=b.dataset.fork;localStorage.setItem("portal-world-fork",fork);localStorage.setItem("portal-world-fork-at",String(Date.now()));window.PortalWorld?.event?.("world-fork","THE WORLD CONTINUED IN ONE DIRECTION. ANOTHER VERSION DID NOT.");window.PortalWorld?.save?.();showLocked()});</script><script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>
<script type="module">import{installTransitions}from"../transitions.js";installTransitions("split");</script>
</body></html>
