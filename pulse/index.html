<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03100d"><title>EARTH PULSE // THE PORTAL</title><script src="../world.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle,#123229,#020806 65%);color:#e8fff6;font-family:ui-monospace,monospace}.back{position:fixed;top:20px;left:20px;color:#4f7567;text-decoration:none;font-size:9px}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:70px 0}.eye{font-size:9px;letter-spacing:.3em;color:#5e8275}h1{font:900 clamp(54px,15vw,110px)/.8 Arial Black,sans-serif;letter-spacing:-.06em}.big{font-size:clamp(45px,13vw,90px);font-weight:900}.meta{color:#6f9185;font-size:10px;line-height:1.8}.events{margin-top:25px;border-top:1px solid #17342b}.e{padding:14px 0;border-bottom:1px solid #132a23;font-size:10px;color:#8eaa9f}</style></head><body><a class="back" href="../">← PORTAL</a><main class="wrap"><div class="eye">USGS // PLANETARY MOTION</div><h1>EARTH<br>PULSE</h1><div class="big" id="big">LISTENING…</div><div class="meta" id="meta">Recent M2.5+ earthquakes, last 24 hours.</div><div class="events" id="events"></div></main><script>fetch("https://godsun108.github.io/earth-now/dynamic/latest.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("earth-now");return r.json()}).then(d=>{const cutoff=Date.now()-86400000,a=(d.events||[]).filter(q=>q.kind==="quake"&&Number(q.mag)>=2.5&&(!q.time||Number(q.time)>=cutoff)).sort((a,b)=>(Number(b.time)||0)-(Number(a.time)||0));big.textContent=a.length+" EVENTS";events.innerHTML=a.slice(0,8).map(q=>'<div class="e">M'+Number(q.mag||0).toFixed(1)+' // '+String(q.title||"Earthquake")+'</div>').join("");meta.textContent="M2.5+ EARTHQUAKES // EARTH NOW CANONICAL SNAPSHOT // "+(d.generated_at?"ARCHIVED "+new Date(d.generated_at).toLocaleString():"TIMESTAMP UNAVAILABLE");localStorage.setItem("portal-pulse","1");window.PortalWorld?.event("earth-pulse","YOU LISTENED TO EARTH NOW THROUGH THE PULSE.");window.PortalWorld?.save()}).catch(()=>{big.textContent="RECEIVER OFFLINE";meta.textContent="EARTH NOW canonical snapshot is unavailable. No observation is being fabricated."});</script></body></html>
