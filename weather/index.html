<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071018"><title>WEATHER ELSEWHERE // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 30%,#183047,#05090d 65%);color:#edf6ff;font-family:ui-monospace,monospace;display:grid;place-items:center;padding:28px}.back{position:absolute;top:22px;left:22px;color:#5c7180;text-decoration:none;font-size:9px}.w{text-align:center;max-width:650px}.eye{font-size:9px;letter-spacing:.28em;color:#698396}h1{font:900 clamp(48px,14vw,100px)/.8 Arial Black,sans-serif;letter-spacing:-.06em}.city{font-size:22px}.temp{font:900 clamp(70px,22vw,150px)/1 Arial Black,sans-serif}.meta{color:#7991a2;line-height:1.8;font-size:10px}.actions{margin-top:25px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.go{border:1px solid #31495a;background:#071019;color:#91aabd;padding:13px 20px;border-radius:999px;font:9px ui-monospace;text-decoration:none}.go:disabled{opacity:.55;cursor:wait}@media(max-width:600px){body{padding:20px}.back{top:max(16px,env(safe-area-inset-top));left:18px}.w{width:100%}h1{margin:28px 0}.actions{display:grid}.go{min-height:46px;display:grid;place-items:center}.temp{font-size:clamp(68px,25vw,120px)}}</style></head><body><a class="back" href="../">← PORTAL</a><main class="w"><div class="eye">OPEN-METEO // SOMEWHERE ELSE</div><h1>WEATHER<br>ELSEWHERE</h1><div class="city" id="city">SEARCHING EARTH…</div><div class="temp" id="temp">—</div><div class="meta" id="meta"></div><div class="actions"><button class="go" id="go">SOMEWHERE ELSE</button><a class="go" id="eyes" href="../window/">OPEN EYES THERE →</a><a class="go" id="earth" href="../earth/">FIND ON EARTH →</a></div></main><script>const places=[["Reykjavík, Iceland",64.1466,-21.9426],["Tokyo, Japan",35.6762,139.6503],["Cape Town, South Africa",-33.9249,18.4241],["Ushuaia, Argentina",-54.8019,-68.303],["Nairobi, Kenya",-1.2921,36.8219],["Singapore",1.3521,103.8198],["Anchorage, Alaska",61.2181,-149.9003],["Lisbon, Portugal",38.7223,-9.1393],["Queenstown, New Zealand",-45.0312,168.6626],["Nuuk, Greenland",64.1835,-51.7216]];let current=null,last=-1,busy=false;async function load(){if(busy)return;busy=true;go.disabled=true;go.textContent="SEEKING…";let n=Math.floor(Math.random()*places.length);if(places.length>1&&n===last)n=(n+1)%places.length;last=n;const p=places[n];current=p;eyes.href="../window/?lat="+p[1]+"&lng="+p[2]+"&place="+encodeURIComponent(p[0]);earth.href="../earth/?lat="+p[1]+"&lng="+p[2]+"&place="+encodeURIComponent(p[0]);city.textContent=p[0];temp.textContent="…";meta.textContent="";try{const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+p[1]+"&longitude="+p[2]+"&current=temperature_2m,apparent_temperature,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph");const d=await r.json(),c=d.current;temp.textContent=Math.round(c.temperature_2m)+"°F";meta.textContent="FEELS "+Math.round(c.apparent_temperature)+"°F // WIND "+Math.round(c.wind_speed_10m)+" MPH // OBSERVED "+c.time;localStorage.setItem("portal-weather","1")}catch(e){temp.textContent="OFFLINE";meta.textContent="THE WEATHER EXISTS. THE FEED DOES NOT."}finally{busy=false;go.disabled=false;go.textContent="SOMEWHERE ELSE"}}go.onclick=load;load();</script><script src="../station-nav.js"></script></body></html>
<script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>
<script type="module">import{installTransitions}from"../transitions.js";installTransitions("weather");</script>
