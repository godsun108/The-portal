<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0d"><title>WINDOW — THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#07090c;color:#eee;font-family:ui-monospace,monospace;display:grid;place-items:center}.back{position:fixed;top:20px;left:20px;color:#737780;text-decoration:none;font-size:11px}.room{text-align:center;width:min(760px,90vw)}.frame{height:min(54vh,430px);border:12px solid #15181d;box-shadow:0 24px 80px #000,inset 0 0 0 1px #353a42;background:linear-gradient(#071525 0 46%,#bd7754 47% 51%,#101a19 52%);position:relative;overflow:hidden}.frame:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 38%,#ffd28a 0 2%,#d57a4c 3%,transparent 14%),linear-gradient(115deg,transparent 50%,#07100d 51% 55%,transparent 56%);filter:blur(.3px)}.frame:after{content:"SOMEWHERE // EARTH";position:absolute;left:14px;bottom:12px;font-size:9px;letter-spacing:.15em;color:#ffffff88}h1{font:900 clamp(48px,13vw,100px)/.8 Arial Black,sans-serif;letter-spacing:-.06em;margin:38px 0 14px}p{color:#777d86;font-size:10px;letter-spacing:.12em;line-height:1.8}button{margin-top:18px;border:1px solid #353a42;background:#0d1014;color:#aeb5bf;padding:13px 18px;border-radius:999px;font:9px ui-monospace,monospace;letter-spacing:.14em} .frame{transition:filter .35s,background .5s}</style></head><body><a class="back" href="../">← THE PORTAL</a><main class="room"><div class="frame" id="frame"></div><h1>WINDOW</h1><p id="where">SOMEWHERE // EARTH</p><button id="move">GO SOMEWHERE ELSE</button></main><script>const scenes=[["NORTH ATLANTIC // 04:12","linear-gradient(#071525 0 48%,#294758 49%,#071012 100%)"],["DESERT // 18:44","linear-gradient(#4b3150 0 48%,#d48750 49% 55%,#5b2d20 56%)"],["FOREST // 06:03","linear-gradient(#14222c 0 44%,#718b75 45% 50%,#102016 51%)"],["OPEN OCEAN // 13:27","linear-gradient(#4b8195 0
