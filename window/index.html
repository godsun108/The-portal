<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020304"><title>WINDOW // THE PORTAL</title><script src="../world.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020304;color:#dce2e5;font-family:ui-monospace,monospace}body{min-height:100svh;overflow:hidden}.back{position:fixed;z-index:30;left:22px;top:22px;color:#59636a;text-decoration:none;font-size:9px;letter-spacing:.18em}.shell{min-height:100svh;display:grid;place-items:center;padding:55px 18px 24px}.frame{width:min(760px,94vw);height:min(76svh,760px);position:relative;border:12px solid #0b0d0f;border-radius:5px;overflow:hidden;background:#000;box-shadow:0 30px 100px #000,0 0 0 1px #343a3e;touch-action:none}.beyond{position:absolute;inset:-8%;background:radial-gradient(circle at 50% 62%,#16323a 0,#071218 23%,#020609 55%,#000 78%);transform:translate(var(--x,0),var(--y,0)) scale(1.08);transition:transform .15s ease-out}.horizon{position:absolute;left:-10%;right:-10%;bottom:18%;height:1px;background:#73939a33;box-shadow:0 0 30px #67d6ee44}.sea{position:absolute;left:-10%;right:-10%;bottom:-10%;height:30%;background:linear-gradient(#071319,#010304);perspective:300px;overflow:hidden}.sea:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 16px,#6ea3ae14 17px 18px);transform:perspective(220px) rotateX(62deg) scale(1.8);animation:sea 9s linear infinite}.stars{position:absolute;inset:0;background-image:radial-gradient(#9cb3b8 0 1px,transparent 1.4px);background-size:83px 71px;opacity:.34}.thing{position:absolute;left:50%;top:46%;width:7px;height:38px;background:#8fb4b8;border-radius:50%;box-shadow:0 0 14px #8fe7f0aa;opacity:.25;transform:translate(-50%,-50%);transition:2.2s cubic-bezier(.2,.8,.2,1)}.thing.seen{opacity:.8;width:10px;height:54px}.thing.close{top:57%;width:20px;height:105px;opacity:.9;filter:blur(.4px)}.glass{position:absolute;inset:0;z-index:10;background:linear-gradient(115deg,#fff0 0 25%,#d7f4ff08 33%,#fff0 44% 74%,#fff07 75%,#fff0 77%);box-shadow:inset 0 0 110px #000;pointer-events:none}.crack{position:absolute;z-index:14;width:1px;height:0;background:#cbe8ef88;box-shadow:0 0 8px #b9f4ff;transform-origin:top;transition:height .6s}.message{position:absolute;z-index:15;left:50%;bottom:24px;transform:translateX(-50%);width:90%;text-align:center;color:#82949a;font-size:9px;letter-spacing:.18em;line-height:1.8}.hand{position:absolute;z-index:13;width:42px;height:42px;border:1px solid #b9e7ee66;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none}.hand.hit{animation:hit 1.1s ease-out}.object{display:none;position:absolute;z-index:18;left:50%;top:62%;transform:translate(-50%,-50%);font-size:54px;filter:drop-shadow(0 0 18px #9ceaff);cursor:pointer;animation:float 2.5s ease-in-out infinite}.status{position:fixed;z-index:20;right:18px;bottom:16px;color:#39484d;font-size:8px;letter-spacing:.15em}.breach .frame{animation:breach .18s steps(2) 8}.breach .glass{background:radial-gradient(circle at 50% 55%,#b9f4ff18,transparent 32%),linear-gradient(115deg,#fff0,#d7f4ff0d,#fff0)}@keyframes sea{to{transform:perspective(220px) rotateX(62deg) translateY(34px) scale(1.8)}}@keyframes hit{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:.8}100%{opacity:0;transform:translate(-50%,-50%) scale(4)}}@keyframes breach{50%{filter:brightness(2);transform:translateX(2px)}}@keyframes float{50%{transform:translate(-50%,-58%) rotate(5deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<a class="back" href="../">← PORTAL</a><main class="shell"><div class="frame" id="frame"><div class="beyond" id="beyond"><div class="stars"></div><div class="horizon"></div><div class="sea"></div><div class="thing" id="thing"></div></div><div class="glass"></div><i class="hand" id="hand"></i><div class="object" id="object">⌁</div><div class="message" id="message">THIS WINDOW WAS ALREADY OPEN.</div></div></main><div class="status" id="status">GLASS INTEGRITY // 100%</div><script>
localStorage.setItem("portal-window","1");const frame=document.querySelector("#frame"),beyond=document.querySelector("#beyond"),thing=document.querySelector("#thing"),hand=document.querySelector("#hand"),msg=document.querySelector("#message"),status=document.querySelector("#status"),obj=document.querySelector("#object");let touches=+(localStorage.getItem("portal-window-touches")||0),breached=localStorage.getItem("portal-item-glass-seed")==="1",watchTimer;
function say(t){msg.textContent=t}
function move(e){const r=frame.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;beyond.style.setProperty("--x",(x*-20)+"px");beyond.style.setProperty("--y",(y*-14)+"px")}
frame.addEventListener("pointermove",move);
frame.addEventListener("pointerdown",e=>{if(breached)return;touches++;localStorage.setItem("portal-window-touches",touches);const r=frame.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;hand.style.left=x+"px";hand.style.top=y+"px";hand.classList.remove("hit");void hand.offsetWidth;hand.classList.add("hit");if(touches===1)say("THE GLASS IS COLDER THAN THE ROOM.");if(touches===3){thing.classList.add("seen");say("SOMETHING MOVED WHEN YOU TOUCHED IT.");localStorage.setItem("portal-window-anomaly","1")}if(touches===5){thing.classList.add("close");say("STOP TOUCHING THE GLASS.");status.textContent="GLASS INTEGRITY // 71%"}if(touches>=7)breach()});
function breach(){if(breached)return;breached=true;document.body.classList.add("breach");status.textContent="GLASS INTEGRITY // UNKNOWN";say("IT DID NOT BREAK INWARD.");for(let i=0;i<5;i++){const c=document.createElement("i");c.className="crack";c.style.left=(48+Math.random()*8)+"%";c.style.top=(48+Math.random()*10)+"%";c.style.transform="rotate("+(-70+Math.random()*140)+"deg)";frame.appendChild(c);requestAnimationFrame(()=>c.style.height=(80+Math.random()*160)+"px")}setTimeout(()=>{thing.style.display="none";obj.style.display="block";say("SOMETHING CAME THROUGH. TAKE IT OR LEAVE IT.");},1400);localStorage.setItem("portal-window-breached","1")}
obj.onclick=()=>{localStorage.setItem("portal-item-glass-seed","1");obj.style.display="none";say("THE GLASS SEED IS NOW SOMEWHERE IT SHOULD NOT BE.");status.textContent="FOREIGN OBJECT // CARRIED";window.PortalWorld?.event("glass-seed","SOMETHING CROSSED THROUGH THE WINDOW.");window.PortalWorld?.save()};
if(localStorage.getItem("portal-window-breached")==="1"&&!localStorage.getItem("portal-item-glass-seed")){breached=false;setTimeout(breach,600)}if(localStorage.getItem("portal-item-glass-seed")==="1"){breached=true;thing.style.display="none";say("THE WINDOW IS EMPTY NOW.");status.textContent="GLASS INTEGRITY // NOT APPLICABLE"}
watchTimer=setTimeout(()=>{if(touches<3&&!breached){thing.classList.add("seen");say("YOU DID NOT MOVE. IT DID.");localStorage.setItem("portal-window-anomaly","1")}},12000);
</script></body></html>
