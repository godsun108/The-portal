<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTERIMAGE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#050407;color:#f1edf5;font-family:ui-monospace;display:grid;place-items:center;padding:20px}.wrap{width:min(620px,95vw)}header{display:flex;justify-content:space-between;color:#796f80;font-size:9px;letter-spacing:.15em}h1{font:900 clamp(52px,14vw,96px)/.78 Arial Black;letter-spacing:-.07em;margin:24px 0}.meta{font-size:10px;color:#8b8092;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cell{aspect-ratio:1;border:1px solid #312b36;background:#0b090d;border-radius:8px;cursor:pointer}.cell.on{background:#eee8f5;box-shadow:0 0 24px #d8bfff77}.cell.pick{background:#79618d}.cell.wrong{outline:2px solid #fff3}.status{min-height:48px;margin-top:18px;color:#766c7e;font-size:10px;line-height:1.7}.gate{position:fixed;inset:0;background:#030204ee;display:grid;place-items:center;text-align:center;padding:25px;z-index:5}.gate button,.submit{padding:13px 20px;border:1px solid #776583;background:#0b0810;color:#eee;border-radius:999px;font:10px ui-monospace;letter-spacing:.14em}.submit{margin-top:16px}.hidden{display:none}</style></head><body><main class="wrap"><header><a href="../../arcade/" style="color:inherit;text-decoration:none">← ARCADE</a><span>MEMORY // CABINET</span></header><h1>AFTERIMAGE</h1><div class="meta" id="meta"></div><div class="grid" id="grid"></div><button class="submit hidden" id="submit">LOCK MEMORY</button><div class="status" id="status"></div></main><div class="gate" id="gate"><div><div>LOOK.<br>THEN THE LIGHT GOES AWAY.<br>82% RECALL EARNS AFTERIMAGE // 95% EARNS PERFECT MEMORY.</div><h1>AFTERIMAGE</h1><button id="start">REMEMBER</button></div></div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{physicsState}from"../../physics.js";import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();const meta=document.querySelector("#meta"),grid=document.querySelector("#grid"),submit=document.querySelector("#submit"),status=document.querySelector("#status"),gate=document.querySelector("#gate"),start=document.querySelector("#start");const P=physicsState();let run,round=0,score=0,pattern=[],picked=new Set(),accept=false,best=Number(localStorage.getItem("portal-afterimage-best")||0);function cells(){grid.innerHTML="";for(let i=0;i<25;i++){const b=document.createElement("button");b.className="cell";b.onclick=()=>{if(!accept)return;picked.has(i)?picked.delete(i):picked.add(i);b.classList.toggle("pick");meta.textContent="ROUND "+(round+1)+"/7 // SELECTED "+picked.size+" // SCORE "+score;};grid.append(b)}}function makePattern(){const count=3+round,arr=[];while(arr.length<count){const i=Math.floor(Math.random()*25);if(!arr.includes(i))arr.push(i)}return arr}function show(){accept=false;submit.classList.add("hidden");picked.clear();cells();pattern=makePattern();pattern.forEach(i=>grid.children[i].classList.add("on"));const view=Math.max(650,1750-round*130-(P.mode==="converged"?120:0));status.textContent="HOLD THE IMAGE.";meta.textContent="ROUND "+(round+1)+"/7 // SIGNALS "+pattern.length+" // SCORE "+score;setTimeout(()=>{[...grid.children].forEach(c=>c.classList.remove("on"));accept=true;submit.classList.remove("hidden");status.textContent="REBUILD WHAT WAS THERE.";event(run,"recall-start",{round,signals:pattern.length,viewMs:view});},view)}function grade(){if(!accept)return;accept=false;const target=new Set(pattern);let correct=0;for(const i of picked)if(target.has(i))correct++;const misses=pattern.filter(i=>!picked.has(i)).length,falsePos=[...picked].filter(i=>!target.has(i)).length,points=Math.max(0,pattern.length-misses-falsePos);score+=points;event(run,"recall",{round,correct,misses,falsePos,points});pattern.forEach(i=>{if(!picked.has(i))grid.children[i].classList.add("wrong")});status.textContent="CORRECT "+correct+"/"+pattern.length+" // FALSE "+falsePos;submit.classList.add("hidden");setTimeout(()=>{round++;if(round>=7)end();else show()},750)}function end(){const possible=42,ratio=score/possible;best=Math.max(best,score);localStorage.setItem("portal-afterimage-best",best);if(ratio>=.82){grantArtifact(ratio>=.95?"perfect-memory":"afterimage");finishRun(run,{result:"clear",score,possible,ratio,artifact:ratio>=.95?"perfect-memory":"afterimage",physics:P.mode})}else{scar("memory-static");finishRun(run,{result:"lost",score,possible,ratio,scar:"memory-static",physics:P.mode})}gate.classList.remove("hidden");gate.innerHTML='<div><div>AFTERIMAGE</div><h1>'+(ratio>=.82?"REMEMBERED":"DISSOLVED")+'</h1><p>SCORE '+score+'/'+possible+' // BEST '+best+'/'+possible+'<br>'+(ratio>=.95?"ARTIFACT // PERFECT MEMORY":ratio>=.82?"ARTIFACT // AFTERIMAGE":"SCAR // MEMORY STATIC")+'</p><button onclick="location.reload()">AGAIN</button></div>'}submit.onclick=grade;start.onclick=()=>{run=beginRun("afterimage");gate.classList.add("hidden");show()};</script></body></html>
