<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>VOID // THE PORTAL</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#e8e8e8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100svh;overflow:hidden}.noise{position:fixed;inset:-50%;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");animation:drift .25s steps(2) infinite}.shell{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.back{position:absolute;left:24px;top:24px;color:#444;text-decoration:none;font-size:9px;letter-spacing:.2em}.room{max-width:680px}.eyebrow{font-size:9px;letter-spacing:.38em;color:#4f4f55}.sigil{font-size:clamp(70px,22vw,180px);line-height:1;margin:36px 0 20px;filter:blur(.2px);text-shadow:0 0 45px #ffffff18}.room h1{font-family:Arial Black,Impact,sans-serif;font-size:clamp(44px,13vw,100px);line-height:.82;letter-spacing:-.06em;margin:0}.room p{max-width:500px;margin:26px auto;color:#6d6d74;line-height:1.9;font-size:11px}.coords{color:#33333a;font-size:9px;letter-spacing:.16em;margin-top:24px}.go{margin-top:32px;border:1px solid #2d2d33;background:#050506;color:#8b8b94;padding:14px 22px;border-radius:999px;font:9px ui-monospace,monospace;letter-spacing:.2em;cursor:pointer}.go:active{transform:scale(.97)}@keyframes drift{to{transform:translate(2%,1%)}}@media(prefers-reduced-motion:reduce){.noise{animation:none}}
</style><script src="../world.js"></script><script src="../creature.js"></script><link rel="stylesheet" href="../portal-atmosphere.css"><link rel="stylesheet" href="../portal-magic.css"></head><body><div class="noise"></div><main class="shell"><a class="back" href="../">← PORTAL</a><section class="room"><div class="eyebrow">UNMAPPED INTERNET // ROOM <span id="num"></span></div><div class="sigil" id="sigil">◌</div><h1 id="title">THE VOID</h1><p id="text"></p><div class="coords" id="coords"></div><div id="anomaly" hidden><button class="go" id="open">OPEN</button> <button class="go" id="close">CLOSE</button></div><button class="go" id="go">GO DEEPER</button></section></main><script>localStorage.setItem('portal-artifact-void','1');
const rooms=[
["◌","THE PAGE BETWEEN PAGES","You arrived somewhere that has no feed, no score, and nothing asking to be liked. Stay for ten seconds.","NO SIGNAL"],
["⟡","A VERY SMALL INTERNET","Imagine a web with only twelve websites. Everyone knows who built each one. What would you put on yours?","12 NODES"],
["⋮","LOST PACKET","Somewhere, a packet took the wrong route. It never knew it was lost. Neither did anyone waiting for it.","TTL 00"],
["□","EMPTY SERVER ROOM","No notifications. No recommendations. No infinite scroll. The machinery is on, but nobody is selling you anything.","0 REQUESTS"],
["∞","THE LAST TAB","You have reached the tab after the last tab. Closing it changes nothing. Keeping it open also changes nothing.","RAM UNKNOWN"],
["⊙","ONE PIXEL OF SUN","A screen cannot contain a star. It can contain a symbol for one. Your brain does the rest.","8.3 LIGHT MIN"],
["⌁","GHOST FREQUENCY","Every wireless device around you is filling the room with invisible structure. The room looks empty anyway.","SPECTRUM OCCUPIED"],
["?","UNANSWERED QUERY","There are questions no search engine can answer because nobody has made the page yet. Make one.","INDEX MISSING"],
["∆","PROCEDURAL RUIN","This room has never existed in exactly this form before you opened it. Most moments share that property.","INSTANCE UNIQUE"],
["·","SMALLEST WEBSITE","Here it is.","1 DOT"]
];
function render(){const W=window.PortalWorld?.state;if(window.PortalCreature?.stage>=2&&!localStorage.getItem("portal-creature-void-choice")){sigil.textContent="◦";title.textContent="THERE IS LESS NOTHING HERE";text.textContent="A small interruption is holding its shape.";coords.textContent="LOCAL ANOMALY // UNCLASSIFIED";go.hidden=true;anomaly.hidden=false;return}let echo=null;try{echo=JSON.parse(localStorage.getItem("portal-blackbox-echo")||"null")}catch(e){}if(echo&&!localStorage.getItem("portal-blackbox-echo-seen")){localStorage.setItem("portal-blackbox-echo-seen","1");sigil.textContent="■";title.textContent="SOMETHING ARRIVED FIRST";text.textContent="The void found a shape with no message attached. Whatever entered the Black Box did not come back. Its consequence did.";coords.textContent="FOREIGN HASH // "+echo.hash;window.PortalWorld?.event?.("blackbox-echo","THE VOID RECEIVED A CONSEQUENCE FROM THE BLACK BOX.");window.PortalWorld?.save?.();return}if(W?.pressure>=8&&Math.random()<.28){sigil.textContent="⌬";title.textContent="THIS ROOM WAS NOT EMPTY";text.textContent="Too many things have happened elsewhere. The walls are beginning to share memories.";coords.textContent="WORLD PRESSURE // "+W.pressure;localStorage.setItem("portal-void-awake","1");return}if(localStorage.getItem("portal-item-feather")==="1"&&Math.random()<.35){sigil.textContent="⌁";title.textContent="IT FOLLOWED YOU";text.textContent="The black feather is weightless here. Something deeper in the dark recognizes it.";coords.textContent="FOREIGN OBJECT // ACCEPTED";localStorage.setItem("portal-feather-void","1");return}const r=rooms[Math.floor(Math.random()*rooms.length)];sigil.textContent=r[0];title.textContent=r[1];text.textContent=r[2];coords.textContent=r[3]+" // "+Math.floor(Math.random()*90)+"."+String(Math.floor(Math.random()*9999)).padStart(4,"0")+" / "+Math.floor(Math.random()*180)+"."+String(Math.floor(Math.random()*9999)).padStart(4,"0");num.textContent=String(Math.floor(Math.random()*999)).padStart(3,"0")}function choose(v){if(localStorage.getItem("portal-creature-void-choice"))return;localStorage.setItem("portal-creature-void-choice",v);localStorage.setItem("portal-creature-void-choice-at",String(Date.now()));window.PortalWorld?.event?.("void-choice","THE VOID WAS LEFT IN A DIFFERENT CONDITION.");window.PortalWorld?.save?.();anomaly.hidden=true;go.hidden=false;sigil.textContent=v==="open"?"○":"●";title.textContent=v==="open"?"THE GAP REMAINS":"THE GAP IS CLOSED";text.textContent="Nothing explains what changed.";coords.textContent="CONDITION // PERSISTENT"}open.onclick=()=>choose("open");close.onclick=()=>choose("close");go.onclick=render;render();
</script></body></html>
