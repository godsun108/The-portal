name: Portal Contracts

on:
  push:
  pull_request:

jobs:
  canonical-integrations:
    runs-on: [self-hosted, macOS, ARM64, sovereign]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check contract programs
        run: node --check test-contracts.cjs && node --check test-experience.cjs && node --check tv-open-curator.cjs && node --check tv-network.js && node --check tv-programming-director.js
      - name: Verify canonical integration contracts
        run: node test-contracts.cjs
      - name: Verify Music Foundry player syntax and mixer
        run: node scripts/check-music-preview-player.cjs
      - name: Verify traveler experience invariants
        run: node test-experience.cjs
      - name: Install EarthID vetted WebAuthn verifier
        run: npm install --prefix genesis-core --no-package-lock --ignore-scripts
      - name: Verify Genesis and EarthID Node test suites
        run: node --test earthchain-genesis/*.test.mjs genesis-core/*.test.mjs
      - name: Syntax-check Genesis Sight and signed pairing modules
        run: >-
          node --check earthchain-test/sovereign-operator/operator.mjs
          && node --check earthchain-test/sovereign-operator/sight.mjs
          && node --check earthchain-test/sovereign-operator/assessment.mjs
          && node --check earthchain-test/sovereign-operator/local-bridge.mjs
          && node --check earthchain-test/sovereign-operator/peer-approval.mjs
          && node --check earthchain-test/sovereign-operator/sovereign-execution-bridge.mjs
          && node --check earthchain-test/sovereign-operator/pairing-code.mjs
          && node --check earthchain-test/sovereign-operator/invite-link.mjs
          && node --check earthchain-test/sovereign-operator/signed-bridge-offer.mjs
          && node --check earthchain-test/sovereign-operator/signed-bridge-answer.mjs
          && node --check earthchain-test/sovereign-operator/qrcode.js
      - name: Syntax-check portable offline Arrival script
        run: >-
          python3 -c "from pathlib import Path; import re; html=Path('earthchain-test/sovereign-operator/arrival-portable.html').read_text(); scripts=re.findall(r'<script>(.*?)</script>', html, re.S); assert len(scripts)==1; Path('/tmp/genesis-arrival-portable.js').write_text(scripts[0])"
          && node --check /tmp/genesis-arrival-portable.js
      - name: Verify Genesis Sight device assessment tests
        run: node --test earthchain-test/sovereign-operator/*.test.mjs
