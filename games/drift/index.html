<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>DRIFT // ARCADE</title><link rel="stylesheet" href="../../portal-atmosphere.css"><link rel="stylesheet" href="../../portal-magic.css"><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#030307;color:#eee;font-family:ui-monospace}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:3;inset:18px 18px auto;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;pointer-events:none}.center{position:fixed;z-index:4;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#030307dd}.center.hide{display:none}h1{font:900 clamp(60px,20vw,150px)/.75 Arial Black;letter-spacing:-.08em;margin:0}button,a{border:1px solid #ffffff35;background:#0b0912;color:#eee;border-radius:999px;padding:13px 18px;font:10px ui-monospace;text-decoration:none}.hint{color:#777;max-width:420px;line-height:1.7;margin:22px auto}</style></head><body><canvas id="c"></canvas><div class="ui"><span id="score">DRIFT 0000</span><span id="lives">◇◇◇</span></div><section class="center" id="start"><div><div>ARCADE // CABINET 09</div><h1>DRIFT</h1><p class="hint">MOVE THE SIGNAL. SURVIVE THE FIELD. POINTER / TOUCH / ARROW KEYS. CONVERGED PHYSICS BENDS THE HAZARDS. SURVIVE TO 900 FOR AN ARTIFACT.</p><button id="go">INSERT NOTHING</button> <a href="../../arcade/">ARCADE</a></div></section><section class="center hide" id="end"><div><div>RUN COMPLETE</div><h1 id="final">0000</h1><p class="hint" id="result"></p><button id="again">AGAIN</button> <a href="../../arcade/">ARCADE</a></div></section><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{physicsState}from"../../physics.js";import{activeEvents}from"../../events.js";import{installTravelerHUD}from"../../traveler-hud.js";import{installTransitions}from"../../transitions.js";installTravelerHUD();installTransitions("drift");const cv=document.querySelector("#c"),x=cv.getContext("2d"),S=document.querySelector("#start"),E=document.querySelector("#end"),scoreEl=document.querySelector("#score"),livesEl=document.querySelector("#lives"),go=document.querySelector("#go"),again=document.querySelector("#again"),finalEl=document.querySelector("#final"),resultEl=document.querySelector("#result");let w,h,dpr,p,rocks,score,lives,run,playing,keys={},last,spawn,best=Number(localStorage.getItem("portal-drift-best")||0);const phys=physicsState();function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",size);size();function reset(){p={x:w/2,y:h*.72,vx:0,vy:0};rocks=[];score=0;lives=3;spawn=0;last=performance.now();run=beginRun("drift");playing=true;S.classList.add("hide");E.classList.add("hide");requestAnimationFrame(loop)}function addRock(){const r=10+Math.random()*22;rocks.push({x:Math.random()*w,y:-r,r,vx:(Math.random()-.5)*(phys.mode==="converged"?3.8:1.2),vy:2.2+Math.random()*3+score/1800})}function loop(t){if(!playing)return;const dt=Math.min(2,(t-last)/16.67);last=t;spawn-=dt;if(spawn<=0){addRock();spawn=Math.max(5,24-score/500)}if(keys.ArrowLeft)p.vx-=.55*dt;if(keys.ArrowRight)p.vx+=.55*dt;if(keys.ArrowUp)p.vy-=.55*dt;if(keys.ArrowDown)p.vy+=.55*dt;p.vx*=.91;p.vy*=.91;p.x=Math.max(12,Math.min(w-12,p.x+p.vx*dt));p.y=Math.max(12,Math.min(h-12,p.y+p.vy*dt));x.clearRect(0,0,w,h);x.fillStyle="#bfa8ff";x.beginPath();x.arc(p.x,p.y,7,0,Math.PI*2);x.fill();x.strokeStyle="#ffffff28";for(const r of rocks){if(phys.mode==="converged")r.vx+=Math.sin((t+r.y)/700)*.012*dt;r.x+=r.vx*dt;r.y+=r.vy*dt;x.beginPath();x.arc(r.x,r.y,r.r,0,Math.PI*2);x.stroke();if(Math.hypot(r.x-p.x,r.y-p.y)<r.r+7){r.y=h+100;lives--;event(run,"collision",{score});if(lives<=0)return over()}}rocks=rocks.filter(r=>r.y<h+50);score+=dt;scoreEl.textContent="DRIFT "+String(Math.floor(score)).padStart(4,"0");livesEl.textContent="◇".repeat(lives);requestAnimationFrame(loop)}function over(){playing=false;const n=Math.floor(score),ev=activeEvents().map(e=>e.id);best=Math.max(best,n);localStorage.setItem("portal-drift-best",best);let reward;if(n>=900){reward=phys.mode==="converged"?"gravity-pearl":"drift-token";grantArtifact(reward)}else scar("drift-impact");finishRun(run,{score:n,reward:reward||null,physics:phys.mode,events:ev});finalEl.textContent=String(n).padStart(4,"0");resultEl.textContent=(reward?"ARTIFACT // "+reward.toUpperCase():"THE CABINET REMEMBERS THE IMPACT.")+" // BEST "+best;E.classList.remove("hide")}go.onclick=reset;again.onclick=reset;addEventListener("keydown",e=>keys[e.key]=true);addEventListener("keyup",e=>keys[e.key]=false);function point(e){const q=e.touches?.[0]||e;p.x=q.clientX;p.y=q.clientY}cv.addEventListener("pointermove",e=>{if(playing)point(e)});cv.addEventListener("touchmove",e=>{if(playing){e.preventDefault();point(e)}},{passive:false});</script></body></html>
