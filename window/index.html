<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090b"><title>WINDOW // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#050608;color:#eee;font-family:ui-monospace,monospace;display:grid;place-items:center;padding:25px}.back{position:absolute;z-index:5;top:18px;left:18px;color:#70757c;text-decoration:none;font-size:9px}.room{width:min(900px,100%);text-align:center}.frame{height:min(58svh,500px);border:12px solid #121419;border-radius:4px;box-shadow:0 25px 90px #000,inset 0 0 0 1px #343840;position:relative;overflow:hidden;background:#111;transition:filter .35s}.sky,.land,.sun,.mist{position:absolute;inset:0}.sun{width:70px;height:70px;border-radius:50%;inset:18% auto auto 70%;background:#ffe2a4;box-shadow:0 0 55px #ffc56f}.land{top:52%;background:#14201b;clip-path:polygon(0 20%,18% 5%,35% 25%,52% 0,70% 22%,86% 8%,100% 28%,100% 100%,0 100%)}.mist{background:linear-gradient(transparent 48%,#dce7e522 58%,transparent 72%);animation:drift 12s ease-in-out infinite}.pane{position:absolute;inset:0}.pane:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;background:#111419;box-shadow:0 0 0 1px #30343a}.caption{position:absolute;left:16px;bottom:14px;color:#ffffff99;font-size:9px;letter-spacing:.14em;text-align:left}h1{font:900 clamp(50px,14vw,105px)/.8 Arial Black,sans-serif;letter-spacing:-.06em;margin:34px 0 10px}.meta{color:#747a82;font-size:9px;line-height:1.8}.go{margin-top:16px;border:1px solid #363a41;background:#0b0d10;color:#aeb5bd;padding:13px 19px;border-radius:999px;font:9px ui-monospace;letter-spacing:.13em}@keyframes drift{50%{transform:translateX(4%)}}@media(prefers-reduced-motion:reduce){.mist{animation:none}}</style></head><body><a class="back" href="../">← PORTAL</a><main class="room"><div class="frame" id="frame"><div class="sky" id="sky"></div><div class="sun" id="sun"></div><div class="land" id="land"></div><div class="mist"></div><div class="pane"></div><div class="caption" id="caption"></div></div><h1>WINDOW</h1><div class="meta">A simulated view somewhere else. No stock photography. No destination to buy.</div><button class="go" id="move">OPEN ANOTHER WINDOW</button></main><script>const scenes=[{n:"FJORD // 05:41",sky:"linear-gradient(#172438,#9aa9a9)",land:"#13201c",sun:"#ffe1a3"},{n:"DESERT // 18:52",sky:"linear-gradient(#4a3155,#d9855b)",land:"#633927",sun:"#ffd092"},{n:"HIGH ALPINE // 06:12",sky:"linear-gradient(#17314a,#9fc1d2)",land:"#27332f",sun:"#fff2c1"},{n:"OPEN OCEAN // 13:27",sky:"linear-gradient(#4b8195,#a8c7cc)",land:"#17465b",sun:"#fff5cb"},{n:"POLAR NIGHT // 23:18",sky:"linear-gradient(#061120,#153a45)",land:"#091719",sun:"#78d7c0"},{n:"STORM COAST // 16:04",sky:"linear-gradient(#1b2029,#687079)",land:"#192125",sun:"#d9d1b5"},{n:"FOREST RAIN // 07:33",sky:"linear-gradient(#263a3c,#87958c)",land:"#10251a",sun:"#d9e2c5"}];let last=-1;function openWindow(){let i;do{i=Math.floor(Math.random()*scenes.length)}while(i===last&&scenes.length>1);last=i;const s=scenes[i];frame.style.filter="blur(7px)";setTimeout(()=>{sky.style.background=s.sky;land.style.background=s.land;sun.style.background=s.sun;sun.style.boxShadow="0 0 55px "+s.sun;caption.textContent=s.n+" // SIMULATED";frame.style.filter="none";localStorage.setItem("portal-window","1")},260)}move.onclick=openWindow;openWindow();</script></body></html>
