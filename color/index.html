<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><title>COLOR // THE PORTAL</title><script src="../world.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:ui-monospace,monospace}canvas{position:fixed;inset:0;width:100%;height:100%}.back{position:fixed;z-index:3;top:max(18px,env(safe-area-inset-top));left:18px;color:#ffffff99;text-decoration:none;font-size:9px;mix-blend-mode:difference}.word{position:fixed;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);color:white;mix-blend-mode:difference;text-align:center;pointer-events:none}.word h1{font:900 clamp(60px,22vw,170px)/.75 Arial Black,sans-serif;letter-spacing:-.07em;margin:0}.word small{font-size:8px;letter-spacing:.28em}.read{position:fixed;z-index:2;right:18px;bottom:max(18px,env(safe-area-inset-bottom));color:#ffffffaa;mix-blend-mode:difference;font-size:8px;letter-spacing:.12em;text-align:right}</style><link rel="stylesheet" href="../portal-atmosphere.css"></head><body><canvas id="c"></canvas><a class="back" href="../stations/?s=art">← ART STATION</a><div class="word"><h1>COLOR</h1><small>TOUCH THE LIGHT</small></div><div class="read" id="read"></div><script>
const c=document.querySelector("#c"),g=c.getContext("2d");let w,h,dpr,pointers=new Map(),hue=280,sat=80,light=50,last=performance.now();function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);paint(w/2,h/2,Math.max(w,h)*.8)}function paint(x,y,r,velocity=0){hue=(x/w*360+velocity*.15)%360;sat=45+(1-y/h)*55;light=30+(y/h)*45;const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,`hsla(${hue},${sat}%,${light}%,.92)`);q.addColorStop(.45,`hsla(${(hue+55)%360},${Math.max(40,sat-12)}%,${Math.min(76,light+8)}%,.42)`);q.addColorStop(1,"transparent");g.globalCompositeOperation="screen";g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2);read.textContent=`H ${Math.round(hue)}° // S ${Math.round(sat)} // L ${Math.round(light)}`;localStorage.setItem("portal-color","1")}function fade(){g.globalCompositeOperation="source-over";g.fillStyle="rgba(0,0,0,.018)";g.fillRect(0,0,w,h);requestAnimationFrame(fade)}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,t:performance.now()});paint(e.clientX,e.clientY,180)};c.onpointermove=e=>{const p=pointers.get(e.pointerId);if(!p)return;const now=performance.now(),v=Math.hypot(e.clientX-p.x,e.clientY-p.y)/Math.max(1,now-p.t)*100;paint(e.clientX,e.clientY,100+Math.min(260,v),v);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,t:now})};c.onpointerup=c.onpointercancel=e=>pointers.delete(e.pointerId);addEventListener("resize",size);size();fade();
</script></body></html>
