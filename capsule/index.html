<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0d"><title>CAPSULE // THE PORTAL</title><script src="../world.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle,#1b1e28,#07080b 60%);color:#eee;font-family:ui-monospace,monospace;display:grid;place-items:center;padding:28px}.back{position:absolute;top:22px;left:22px;color:#606675;text-decoration:none;font-size:9px}.x{width:min(650px,100%);text-align:center}h1{font:900 clamp(58px,16vw,120px)/.8 Arial Black,sans-serif;letter-spacing:-.06em}.sub{color:#747b8b;font-size:10px;line-height:1.8}textarea,input{width:100%;margin-top:12px;background:#090b10;border:1px solid #2c303b;color:#bbb;padding:14px;border-radius:12px;font:11px ui-monospace}.go{margin-top:15px;border:1px solid #39404f;background:#0b0d12;color:#9da6ba;padding:13px 20px;border-radius:999px;font:9px ui-monospace}.sealed{padding:30px;border:1px dashed #343947;border-radius:18px;color:#7d8597;line-height:1.9}</style></head><body><a class="back" href="../">← PORTAL</a><main class="x"><h1>CAPSULE</h1><div id="stage"></div></main><script>const st=document.querySelector("#stage");function draw(){let c=null;try{c=JSON.parse(localStorage.getItem("portal-capsule")||"null")}catch(e){}if(c&&Date.now()<c.open){st.innerHTML='<div class="sealed">SEALED.<br><br>THIS MESSAGE OPENS<br><b>'+new Date(c.open).toLocaleString()+'</b><br><br>THE BROWSER IS KEEPING IT.</div>';return}if(c){if(!localStorage.getItem('portal-capsule-opened')){localStorage.setItem('portal-capsule-opened','1');localStorage.setItem('portal-capsule-echo',JSON.stringify({sealed:c.sealed||null,opened:Date.now()}));window.PortalWorld?.event?.('capsule-open','A MESSAGE SURVIVED LONG ENOUGH TO BECOME THE PRESENT.');window.PortalWorld?.save?.()}st.innerHTML='<div class="sealed">CAPSULE OPEN.<br><br><b>'+esc(c.msg)+'</b><br><br><button class="go" onclick="localStorage.removeItem(\'portal-capsule\');draw()">EMPTY CAPSULE</button></div>';return}st.innerHTML='<p class="sub">Leave something for your future self. It stays only in this browser.</p><textarea id="msg" maxlength="500" placeholder="message to later..."></textarea><input id="hours" type="number" min="1" max="8760" value="24" aria-label="Hours until opening"><button class="go" id="seal">SEAL FOR LATER</button>';seal.onclick=()=>{if(!msg.value.trim())return;localStorage.setItem("portal-capsule",JSON.stringify({msg:msg.value.trim(),sealed:Date.now(),open:Date.now()+Math.max(1,+hours.value||24)*36e5}));localStorage.setItem("portal-capsule-used","1");draw()}}function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}draw();</script></body></html>
