<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09080c"><title>DAILY DOOR // THE PORTAL</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09080c;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.shell{min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 35%,#20152c,#09080c 50%)}.back{position:absolute;top:22px;left:22px;color:#625a69;text-decoration:none;font-size:9px;letter-spacing:.18em}.room{text-align:center;max-width:650px}.date{font-size:9px;letter-spacing:.3em;color:#786b80}.symbol{font-size:clamp(90px,28vw,190px);margin:32px 0;line-height:.8}.room h1{font-family:Arial Black,Impact,sans-serif;font-size:clamp(44px,13vw,92px);line-height:.82;letter-spacing:-.06em;margin:0}.room p{color:#827887;line-height:1.9;font-size:11px;max-width:500px;margin:28px auto}.timer{font-size:9px;letter-spacing:.15em;color:#514a55}</style></head><body><main class="shell"><a class="back" href="../">← PORTAL</a><section class="room"><div class="date" id="date"></div><div class="symbol" id="symbol"></div><h1 id="title"></h1><p id="text"></p><div class="timer" id="timer"></div></section></main><script>
const rooms=[["☼","BORROWED SUN","Find a patch of sunlight today. Stand in it long enough to notice its temperature."],["≈","WATER DAY","Notice every time water appears in your day without being invited into your attention."],["∆","CHANGE ONE ROUTE","Take one harmless route differently today. The destination can stay the same."],["◌","EMPTY MINUTE","Spend one minute without consuming information. No task. No feed. No optimization."],["✦","SEND SOMETHING GOOD","Send one sincere sentence to somebody who is not expecting it."],["⊙","LOOK UP","At some point today, deliberately look at the sky for longer than feels necessary."],["?","ASK BETTER","Replace one answer you were about to give with a better question."],["⌁","LISTEN FARTHER","Find the most distant sound you can hear from where you are."],["∞","TEN YEARS","Touch an object you expect could still exist ten years from now. Imagine where it will be."],["·","SMALL THING","Find something tiny that would normally escape your attention. Give it ten seconds."]];
function dayKey(d){return Math.floor(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())/86400000)}const now=new Date(),k=dayKey(now),r=rooms[k%rooms.length];date.textContent="DAILY DOOR // "+now.toLocaleDateString();symbol.textContent=r[0];title.textContent=r[1];text.textContent=r[2];localStorage.setItem("portal-daily-"+k,"1");function tick(){const n=new Date(),next=new Date(n);next.setHours(24,0,0,0);const ms=next-n,h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);timer.textContent="THIS DOOR CHANGES IN "+h+"H "+m+"M"}tick();setInterval(tick,30000);
</script></body></html>
