name: Production Experience
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium production journey
        run: npx playwright test --project=chromium
      - name: WebKit production journey
        if: always()
        run: npx playwright test --project=webkit
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-experience-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
