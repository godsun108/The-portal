<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS Combat Lab 01</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#eef4ff;font:14px ui-monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block;cursor:crosshair}header{position:fixed;inset:12px;display:flex;justify-content:space-between;pointer-events:none}.note{position:fixed;left:12px;bottom:12px}.weapon{position:fixed;right:12px;bottom:12px}</style></head><body><header><span>AEGIS // COMBAT LAB 01</span><span id="hud"></span></header><canvas></canvas><div class="note">WASD MOVE · MOUSE AIM/FIRE · 1/2/3 WEAPONS · R RESET</div><div class="weapon" id="weapon"></div><script type="module">
import{health,fireWeapon,weapons,enemy,rangedEnemy,objective,intersects,clamp,obstacle,encounter,seeded}from"../runtime/combat.js";import{beginRun,event,finishRun}from"../protocol.js";
const c=document.querySelector("canvas"),g=c.getContext("2d"),hud=document.querySelector("#hud"),weaponEl=document.querySelector("#weapon");function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);
const walls=[obstacle({x:.3,y:.48,w:.22,h:.055}),obstacle({x:.7,y:.58,w:.22,h:.055})],director=()=>encounter([[["chaser",4],["ranged",2]],[["chaser",5],["ranged",3]],[["chaser",6],["ranged",4]]]);let run,p,enemies,shots,enemyShots,goal,keys=new Set,aim={x:.5,y:.2},done=false,last=performance.now(),lastShot=0,wave,rnd;
function spawn(def){const out=[];for(const [kind,n] of def)for(let i=0;i<n;i++){const x=.08+rnd()*.84,y=.06+rnd()*.2;out.push(kind==="ranged"?rangedEnemy({x,y,hp:28,range:.3}):enemy({x,y,hp:24,speed:.1+rnd()*.05,kind}))}return out}
function reset(){run=beginRun("aegis-combat-lab-01");p={x:.5,y:.84,health:health(100),weapon:weapons.pulse};shots=[];enemyShots=[];goal=objective(1);done=false;wave=director();rnd=seeded(108);enemies=spawn(wave.start());event(run,"combat-lab-start",{wave:1})}reset();
function shoot(t=performance.now()){if(done||t-lastShot<p.weapon.cooldown*1000)return;lastShot=t;shots.push(...fireWeapon({weapon:p.weapon,x:p.x,y:p.y,dx:aim.x-p.x,dy:aim.y-p.y,rnd}));event(run,"shot",{weapon:p.weapon.id})}
c.addEventListener("pointermove",e=>{aim.x=e.clientX/innerWidth;aim.y=e.clientY/innerHeight});c.addEventListener("pointerdown",()=>shoot());
addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(e.key==="1")p.weapon=weapons.pulse;if(e.key==="2")p.weapon=weapons.scatter;if(e.key==="3")p.weapon=weapons.lance;if(e.key.toLowerCase()==="r")reset()});addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function end(result){if(done)return;done=true;finishRun(run,{result,wave:wave.index+1,health:p.health.value})}
function blocked(x,y){return walls.some(w=>w.contains(x,y))}
function frame(t){const dt=Math.min(.04,(t-last)/1000);last=t;if(!done){let nx=p.x,ny=p.y;if(keys.has("a")||keys.has("arrowleft"))nx-=dt*.35;if(keys.has("d")||keys.has("arrowright"))nx+=dt*.35;if(keys.has("w")||keys.has("arrowup"))ny-=dt*.35;if(keys.has("s")||keys.has("arrowdown"))ny+=dt*.35;nx=clamp(nx,.03,.97);ny=clamp(ny,.08,.94);if(!blocked(nx,ny)){p.x=nx;p.y=ny}if(keys.has(" "))shoot(t);shots.forEach(s=>s.step(dt));enemyShots.forEach(s=>s.step(dt));shots=shots.filter(s=>s.alive);enemyShots=enemyShots.filter(s=>s.alive);
for(const e of enemies){if(e.kind==="ranged"){if(e.update(dt,p))enemyShots.push(e.shoot(p))}else e.step(dt,p);for(const s of shots)if(s.alive&&e.health.alive&&intersects(s,e,.035)){s.alive=false;e.hit(s.damage);event(run,"hit",{weapon:p.weapon.id,kind:e.kind});if(!e.health.alive)event(run,"enemy-defeat",{kind:e.kind})}if(e.health.alive&&intersects(e,p,.045)){p.health.damage(20*dt)}}for(const s of enemyShots)if(s.alive&&intersects(s,p,.03)){s.alive=false;p.health.damage(s.damage);event(run,"damage",{source:"ranged"})}
enemies=enemies.filter(e=>e.health.alive);if(!p.health.alive)end("lost");if(enemies.length===0&&!done){const finished=wave.clear();if(finished){goal.advance();end("clear")}else{enemies=spawn(wave.start());event(run,"wave-start",{wave:wave.index+1})}}}
g.clearRect(0,0,c.width,c.height);g.save();g.scale(c.width,c.height);g.fillStyle="#344052";for(const w of walls)g.fillRect(w.x-w.w/2,w.y-w.h/2,w.w,w.h);g.strokeStyle="#607089";g.beginPath();g.moveTo(p.x,p.y);g.lineTo(aim.x,aim.y);g.stroke();g.fillStyle="#e7f1ff";g.beginPath();g.arc(p.x,p.y,.025,0,7);g.fill();g.fillStyle="#83d7ff";for(const s of shots){g.beginPath();g.arc(s.x,s.y,.008,0,7);g.fill()}g.fillStyle="#ffb35c";for(const s of enemyShots){g.beginPath();g.arc(s.x,s.y,.009,0,7);g.fill()}for(const e of enemies){g.fillStyle=e.kind==="ranged"?"#d98cff":"#ff718d";g.beginPath();g.arc(e.x,e.y,.024,0,7);g.fill()}g.restore();hud.textContent="HP "+Math.ceil(p.health.value)+" // WAVE "+Math.min(wave.index+1,3)+"/3 // HOSTILES "+enemies.length;weaponEl.textContent=p.weapon.id.toUpperCase();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
