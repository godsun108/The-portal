<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050506"><title>RADIO // THE PORTAL</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050506;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100svh;background:radial-gradient(circle at 50% 38%,#242018 0,#0b0a09 35%,#040405 70%)}.shell{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px;position:relative}.back{position:absolute;top:24px;left:24px;color:#5b5850;text-decoration:none;font-size:9px;letter-spacing:.2em}.radio{width:min(680px,100%);text-align:center}.eyebrow{font-size:9px;letter-spacing:.35em;color:#777065}.display{border:1px solid #37332c;background:#080806;padding:28px 18px;margin:30px 0 24px;box-shadow:inset 0 0 50px #000}.freq{font-family:Arial Black,Impact,sans-serif;font-size:clamp(65px,20vw,140px);letter-spacing:-.06em;line-height:.8}.unit{font-size:10px;color:#6b665c;letter-spacing:.3em;margin-top:16px}.station{min-height:62px;margin-top:22px;color:#aaa396;font-size:11px;line-height:1.8}.dial{width:100%;accent-color:#aaa18d}.scale{display:flex;justify-content:space-between;color:#4c4942;font-size:8px;margin-top:8px}.status{margin-top:26px;font-size:9px;letter-spacing:.18em;color:#5f5a51}.anomaly{animation:shake .15s steps(2) infinite;background:radial-gradient(circle at 50% 38%,#301015 0,#090607 40%,#000 75%)}.anomaly .display{border-color:#742e39;box-shadow:inset 0 0 60px #34070d,0 0 60px #5b0e1822}.anomaly .freq{color:#ffccd2;text-shadow:0 0 20px #e33a50}.anomaly .status{color:#b44b5b}.anomaly .eyebrow{color:#9e3d4b}@keyframes shake{50%{transform:translateX(1px)}}@media(prefers-reduced-motion:reduce){.anomaly{animation:none}}
</style><script src="../world.js"></script></head><body><main class="shell"><a class="back" href="../">← PORTAL</a><section class="radio"><div class="eyebrow">PORTAL RADIO // MANUAL TUNING</div><div class="display"><div class="freq"><span id="freq">94.7</span></div><div class="unit">MHz</div><div class="station" id="station"></div></div><input class="dial" id="dial" type="range" min="880" max="1080" step="1" value="947" aria-label="Radio frequency"><div class="scale"><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></div><div class="status" id="status">SEARCHING FOR SOMETHING WORTH HEARING</div><button id="audio" style="margin-top:24px;border:1px solid #37332c;background:#080806;color:#777065;padding:12px 18px;border-radius:999px;font:9px ui-monospace,monospace;letter-spacing:.16em">ENABLE RECEIVER AUDIO</button></section></main><script>
const d=document.querySelector("#dial"),f=document.querySelector("#freq"),s=document.querySelector("#station"),st=document.querySelector("#status"),audioBtn=document.querySelector("#audio");let ac=null,noise=null,gain=null,osc=null;
function audioOn(){if(ac){ac.resume();return}ac=new (window.AudioContext||window.webkitAudioContext)();gain=ac.createGain();gain.gain.value=.035;gain.connect(ac.destination);const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;noise=ac.createBufferSource();noise.buffer=buf;noise.loop=true;noise.connect(gain);noise.start();osc=ac.createOscillator();const og=ac.createGain();og.gain.value=.008;osc.connect(og);og.connect(ac.destination);osc.start();audioBtn.textContent="RECEIVER AUDIO // ON";tune()}audioBtn.onclick=audioOn;
const stations={888:["UNKNOWN STATION","TRANSMISSION ORIGIN: UNRESOLVED"],903:["TIDELINE","low water // distant bells // somebody walking on a dock"],927:["NIGHT DRIVE","tires on wet pavement // city disappearing behind you"],947:["EARTH FM","wind through leaves // one dog barking very far away"],973:["NUMBERS","seven // one // nine // zero // repeat"],999:["TOMORROW","weather report for a day that has not happened yet"],1024:["ORBITAL","machine hum // periodic click // nothing else"],1057:["DEEP WATER","hydrophone // pressure // something moving below"],1079:["LAST STATION","a song you almost remember // signal fading"]};
function tune(){const v=+d.value,shown=(v/10).toFixed(1);f.textContent=shown;document.body.classList.toggle("anomaly",v===888);if(stations[v]){s.innerHTML="<b>"+stations[v][0]+"</b><br>"+stations[v][1];st.textContent=v===888?"DO NOT ADJUST YOUR RECEIVER":"SIGNAL LOCKED"}else{s.textContent="— static —";st.textContent="SEARCHING"}if(ac&&gain&&osc){gain.gain.setTargetAtTime(stations[v]?.02:.055,ac.currentTime,.03);osc.frequency.setTargetAtTime(v===888?88.8:180+(v-880)*2.1,ac.currentTime,.04)}if(v===888){localStorage.setItem("portal-radio-888","1");if(localStorage.getItem("portal-moon-touched")==="1"){s.innerHTML="<b>UNKNOWN STATION</b><br>THE MOON IS NOT WHERE WE LEFT IT";st.textContent="TIDAL ERROR // SOURCE UNKNOWN"}if(localStorage.getItem("portal-item-feather")==="1"){s.innerHTML="<b>UNKNOWN STATION</b><br>WE SEE WHAT YOU ARE CARRYING";st.textContent="FOREIGN OBJECT DETECTED";localStorage.setItem("portal-feather-radio","1")}}if(v===973){localStorage.setItem("portal-numbers","1");let tx=null;try{tx=JSON.parse(localStorage.getItem("portal-numbers-last")||"null")}catch(e){}if(tx){const groups=tx.code.split("-");s.innerHTML="<b>NUMBERS</b><br>"+groups.slice(-4).join(" // ");st.textContent="LOCAL SEQUENCE RECOVERED // TRANSMISSION "+String(tx.turn).padStart(3,"0");localStorage.setItem("portal-numbers-radio","1")}}if(v===999){let ce=null;try{ce=JSON.parse(localStorage.getItem("portal-capsule-echo")||"null")}catch(e){}if(ce){s.innerHTML="<b>TOMORROW</b><br>ONE MESSAGE FROM THE PAST HAS ALREADY ARRIVED";st.textContent="TEMPORAL ECHO // LOCAL ORIGIN";localStorage.setItem("portal-capsule-radio","1");window.PortalWorld?.event?.("capsule-radio","99.9 HEARD THE AFTERIMAGE OF AN OPENED CAPSULE.");window.PortalWorld?.save?.()}}}d.oninput=tune;tune();if(window.PortalWorld?.state.scars?.includes("one-life-lost")){setTimeout(()=>{if(+d.value!==888){s.innerHTML="<b>BURIAL FREQUENCY</b><br>ONE SIGNAL ENDED. THE RECEIVER REMEMBERS.";st.textContent="WORLD SCAR DETECTED"}},900)}
</script><script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>
<script type="module">import{installTransitions}from"../transitions.js";installTransitions("radio");</script>
</body></html>
