<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO//DUEL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030305;color:#f2f2f5;font-family:ui-monospace}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:16px;top:14px;z-index:2;font-size:10px;letter-spacing:.12em;line-height:1.7}.back{position:fixed;right:16px;top:14px;color:#777783;text-decoration:none;font-size:9px;z-index:3}.gate{position:fixed;inset:0;background:#020204ee;display:grid;place-items:center;text-align:center;padding:24px;z-index:8}.gate h1{font:900 clamp(54px,15vw,105px)/.76 Arial Black;letter-spacing:-.08em;margin:16px}.gate p{color:#7c7c88;line-height:1.8}.gate button{padding:14px 22px;border:1px solid #6c6c78;background:#0a0a0e;color:#eee;border-radius:999px;font:10px ui-monospace;letter-spacing:.14em}.hidden{display:none}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud"></div><a class="back" href="../../arcade/">ARCADE ↑</a><div class="gate" id="gate"><div><div>ASYNC DUEL // LOCAL ECHO</div><h1>ECHO//<br>DUEL</h1><p>WASD / ARROWS OR DRAG.<br>COLLECT SIGNALS FASTER THAN YOUR SAVED ECHO.<br>YOUR OPPONENT IS YOUR OWN PREVIOUS RUN.<br>FIRST RUN CREATES THE RIVAL. BEAT A SAVED ECHO WHILE COLLECTING ALL 12 FOR ECHO BREAKER.</p><button id="start">ENTER DUEL</button></div></div><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{installTravelerHUD}from"../../traveler-hud.js";installTravelerHUD();const KEY="portal-echo-duel-best",cv=c,x=cv.getContext("2d");let W,H,run,p,keys={},targets=[],record=[],echo=[],frameN=0,score=0,echoScore=0,ended=false,t0=0;function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);cv.addEventListener("pointermove",e=>{if(e.pointerType==="touch"){const r=cv.getBoundingClientRect();p.x=(e.clientX-r.left)*devicePixelRatio;p.y=(e.clientY-r.top)*devicePixelRatio}});function makeTargets(){targets=[];for(let i=0;i<12;i++)targets.push({x:(.08+Math.random()*.84)*W,y:(.12+Math.random()*.76)*H,t:i*45,taken:false,echoTaken:false})}function loadEcho(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}}function saveEcho(){const prev=loadEcho(),time=performance.now()-t0;if(!prev.length||time<(prev.at(-1)?.finish||Infinity)){record.push({finish:time});localStorage.setItem(KEY,JSON.stringify(record))}}function end(){ended=true;const time=performance.now()-t0,hasEcho=echo.length>1,won=!hasEcho||score>echoScore||(score===echoScore&&time<(echo.at(-1)?.finish||Infinity));if(won){saveEcho();const mastery=hasEcho&&score===12&&score>echoScore;grantArtifact(mastery?"echo-breaker":"self-rival");finishRun(run,{result:"win",score,echoScore,time,artifact:mastery?"echo-breaker":"self-rival",hadEcho:hasEcho})}else{scar("outpaced-by-self");finishRun(run,{result:"loss",score,echoScore,time,scar:"outpaced-by-self"})}gate.classList.remove("hidden");gate.innerHTML='<div><div>ECHO//DUEL</div><h1>'+(won?"SELF<br>EXCEEDED":"ECHO<br>WINS")+'</h1><p>YOU '+score+' // ECHO '+echoScore+' // '+(time/1000).toFixed(1)+' S<br>'+(won?(mastery?"ARTIFACT // ECHO BREAKER":"ARTIFACT // SELF RIVAL"):"SCAR // OUTPACED BY SELF")+'</p><button onclick="location.reload()">DUEL AGAIN</button></div>'}let last=0;function frame(ms){if(ended)return;const dt=Math.min(.03,(ms-last)/1000||.016);last=ms;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),d=Math.hypot(dx,dy)||1;p.x=Math.max(8,Math.min(W-8,p.x+dx/d*260*devicePixelRatio*dt));p.y=Math.max(8,Math.min(H-8,p.y+dy/d*260*devicePixelRatio*dt));record.push({x:p.x/W,y:p.y/H});const ep=echo[Math.min(frameN,Math.max(0,echo.length-2))],ex=ep?.x*W,ey=ep?.y*H;for(const q of targets){if(frameN>=q.t&&!q.taken&&Math.hypot(p.x-q.x,p.y-q.y)<18*devicePixelRatio){q.taken=true;score++;event(run,"signal",{score,index:targets.indexOf(q)})}if(ep&&frameN>=q.t&&!q.echoTaken&&Math.hypot(ex-q.x,ey-q.y)<18*devicePixelRatio){q.echoTaken=true;echoScore++}}x.fillStyle="#030305";x.fillRect(0,0,W,H);for(const q of targets)if(frameN>=q.t&&!q.taken){x.strokeStyle="#aab4c2";x.beginPath();x.arc(q.x,q.y,10*devicePixelRatio,0,7);x.stroke()}if(ep){x.globalAlpha=.28;x.fillStyle="#a9c8ff";x.beginPath();x.arc(ex,ey,9*devicePixelRatio,0,7);x.fill();x.globalAlpha=1}x.fillStyle="#fff";x.beginPath();x.arc(p.x,p.y,9*devicePixelRatio,0,7);x.fill();hud.textContent="YOU "+score+"/12 // ECHO "+echoScore+"/12 // "+(echo.length?"RIVAL // SAVED SELF":"RIVAL // NONE YET");frameN++;if(score>=12||frameN>=900)return end();requestAnimationFrame(frame)}start.onclick=()=>{run=beginRun("echo-duel");p={x:W*.5,y:H*.5};echo=loadEcho();makeTargets();t0=performance.now();gate.classList.add("hidden");requestAnimationFrame(frame)};</script></body></html>
