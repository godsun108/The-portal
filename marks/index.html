<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARKS // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#070707;color:#ddd;font-family:ui-monospace,monospace}.back{position:fixed;top:20px;left:20px;color:#555;text-decoration:none;font-size:9px}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:70px 0;text-align:center}h1{font:900 clamp(58px,16vw,120px)/.8 Arial Black,sans-serif}.field{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:35px 0}.m{aspect-ratio:1;border:1px solid #222;display:grid;place-items:center;color:#777}.go{border:1px solid #333;background:#0b0b0b;color:#888;padding:13px 20px;border-radius:999px;font:9px ui-monospace}.note{color:#555;font-size:9px;line-height:1.8}</style></head><body><a class="back" href="../">← PORTAL</a><main class="wrap"><h1>MARKS</h1><p class="note">Anonymous to the page. Local to this browser.<br>No server. No account. Leave evidence anyway.</p><div class="field" id="field"></div><div id="picker"></div><button class="go" id="go">LEAVE SELECTED SYMBOL</button><p class="note" id="chosen"></p></main><script>const picker=document.querySelector("#picker"),chosen=document.querySelector("#chosen"),field=document.querySelector("#field"),go=document.querySelector("#go");const sy=["·","◌","∆","⌁","✦","□","?","∞","☾","⊙"];let selected=sy[0];picker.innerHTML=sy.map(x=>'<button class="go pick" data-s="'+x+'" style="padding:9px 12px;margin:3px">'+x+'</button>').join("");picker.onclick=e=>{if(!e.target.dataset.s)return;selected=e.target.dataset.s;chosen.textContent="SELECTED // "+selected};chosen.textContent="SELECTED // "+selected;function draw(){let a=[];try{a=JSON.parse(localStorage.getItem("portal-marks")||"[]")}catch(e){}field.innerHTML=Array.from({length:50},(_,i)=>'<div class="m">'+(a[i]||"")+"</div>").join("")}go.onclick=()=>{let a=[];try{a=JSON.parse(localStorage.getItem("portal-marks")||"[]")}catch(e){}if(a.length<50)a.push(selected);else a[Math.floor(Math.random()*50)]=selected;localStorage.setItem("portal-marks",JSON.stringify(a));localStorage.setItem("portal-marks-used","1");draw()};draw();</script><script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();</script>
<script type="module">import{installTransitions}from"../transitions.js";installTransitions("marks");</script>
</body></html>
