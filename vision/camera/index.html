<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081512"><link rel="manifest" href="manifest.webmanifest"><title>EarthChain VISION Camera</title><style>*{box-sizing:border-box}body{margin:0;background:#081512;color:#eef7f2;font:16px system-ui}main{max-width:680px;margin:auto}header{padding:16px;font-weight:700;display:flex;justify-content:space-between}.view{position:relative;background:black;height:62dvh;overflow:hidden}video#live{width:100%;height:100%;object-fit:cover}.grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,#ffffff50 33.3%,transparent 33.5%,transparent 66.5%,#ffffff50 66.7%,transparent 66.9%),linear-gradient(transparent 33.2%,#ffffff50 33.3%,transparent 33.5%,transparent 66.5%,#ffffff50 66.7%,transparent 66.9%)}[hidden]{display:none!important}#status{position:absolute;bottom:8px;left:8px;background:#000b;padding:8px;border-radius:8px;font-size:12px}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px}button{background:#1c463a;color:white;border:1px solid #588174;border-radius:12px;padding:12px;font:inherit;min-height:44px}button:disabled{opacity:.45}#shutter{width:66px;height:66px;border:5px solid #effff6;border-radius:50%;background:#d5f0e0}#shutter.recording{background:#d94d4d;border-radius:18px}section{margin:12px;padding:14px;border:1px solid #335e4e;border-radius:12px}#gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{min-width:0;overflow:hidden}.tile img,.tile video{max-width:100%;max-height:180px}small{color:#c4d8d0}</style><main><header>◉ EarthChain VISION <small>CAMERA · iPhone test</small></header><div class="view"><video id="live" autoplay playsinline muted></video><div id="grid" class="grid" hidden></div><div id="status">Tap Start Camera</div></div><div class="controls"><button id="start">Start Camera</button><button id="flip" disabled>Flip ↺</button><button id="gridbtn">Grid</button><button id="photo">Photo</button><button id="video">Video</button><button id="shutter" disabled aria-label="Capture"></button><button id="stop" disabled>Stop</button></div><section><strong>Temporary Gallery</strong><p><small>Photos/videos remain in page memory only. Save each file before closing. No uploads or encrypted storage in this test.</small></p><div id="gallery"></div><button id="clear">Clear previews</button></section><section><strong>Diagnostics</strong><p id="diag"></p><small>Camera permission requires HTTPS. Video recording format depends on iOS Safari support.</small></section></main><script src="app.js"></script></html>
