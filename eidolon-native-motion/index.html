<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>EIDOLON Native Motion Lab</title><style>body{margin:0 auto;max-width:680px;padding:16px;background:#101827;color:#eaf1ff;font:16px system-ui}button,select,input{font:inherit;margin:5px;padding:10px;border-radius:8px}button{background:#294968;color:white;border:1px solid #8ca8c7}canvas{width:100%;aspect-ratio:3/4;touch-action:none;background:#1c2b40}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#acd5ff}</style><h2>EIDOLON · Native Motion Lab</h2><p>Experimental bone deformation on the original MakeHuman 163-bone GLB. Not certified gait, biomechanics, or photorealism.</p><button id="load">Load native human</button><label>Joint test <select id="pose"><option value="neutral">Neutral</option><option value="head">Head turn</option><option value="arm">Left arm elevation</option><option value="elbow">Left elbow flexion</option><option value="hip">Left hip flexion</option><option value="knee">Left knee bend</option><option value="finger">Left index flexion</option></select></label><label>Angle <input id="angle" type="range" min="-90" max="90" value="0"></label><button id="reset">Reset pose</button><button id="skeleton">Skeleton</button><button id="capture">Save PNG</button><canvas id="view" width="480" height="640"></canvas><pre id="status">Ready. Load model to begin.</pre><p><a href="../eidolon-human-base/index.html">Anatomical foundation viewer</a> · <a href="../eidolon-human-base/assets/rig-manifest.json">Rig provenance</a></p><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),say=s=>$('status').textContent=s;
let renderer,scene,camera,controls,actor,helper,bones=new Map(),rest=new Map(),manifest;
const joints={head:['head'],arm:['upperarm01.L','upperarm02.L'],elbow:['lowerarm01.L','lowerarm02.L'],hip:['upperleg01.L','upperleg02.L'],knee:['lowerleg01.L','lowerleg02.L'],finger:['finger2-1.L','finger2-2.L','finger2-3.L']};
function init(){renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(480,640,false);renderer.outputColorSpace=THREE.SRGBColorSpace;scene=new THREE.Scene();scene.background=new THREE.Color(0x19283c);scene.add(new THREE.HemisphereLight(0xffffff,0x4b617c,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(4,5,6);scene.add(light);camera=new THREE.PerspectiveCamera(35,.75,.01,100);controls=new OrbitControls(camera,$('view'));controls.enableDamping=true;controls.enablePan=false;function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)}tick()}
function apply(){if(!actor)return;for(const [name,q] of rest)bones.get(name).quaternion.copy(q);const p=$('pose').value,a=Number($('angle').value)*Math.PI/180;if(p!=='neutral'){const names=joints[p]||[];const match=names.map(n=>({wanted:n,bone:[...bones.values()].find(b=>b.name===n||b.name.replace(/[^a-z0-9]/gi,'').toLowerCase()===n.replace(/[^a-z0-9]/gi,'').toLowerCase()||b.name.toLowerCase().endsWith(n.toLowerCase()))})).reverse().find(v=>v.bone);const target=match?.bone;if(!target)return say('Missing target bone: '+names.join(', ')+' | available: '+[...bones.keys()].filter(n=>/arm|leg|head|finger|elbow|knee/i.test(n)).slice(0,35).join(', '));const name=target.name;const axis=p==='head'?'y':p==='arm'?'z':'x';target.rotateOnAxis(new THREE.Vector3(axis==='x'?1:0,axis==='y'?1:0,axis==='z'?1:0),a);say('EXPERIMENTAL '+p+' '+$('angle').value+'° on '+name+' | bone quaternion '+target.quaternion.toArray().map(v=>v.toFixed(2)).join(',')+' | inspect deformation. If invisible, send screenshot.')}else say('Neutral bind pose · '+bones.size+' named bones');}
$('load').onclick=async()=>{try{$('load').disabled=true;if(!renderer)init();say('Loading published GLB and verifying manifest…');const res=await fetch('../eidolon-human-base/assets/rig-manifest.json',{cache:'no-store'});if(!res.ok)throw Error('Manifest HTTP '+res.status);manifest=await res.json();if(manifest.joint_count!==163||manifest.rigged!==true)throw Error('Unexpected native rig manifest');const gltf=await new GLTFLoader().loadAsync('../eidolon-human-base/assets/makehuman-native-rig.glb');if(actor)scene.remove(actor);actor=gltf.scene;scene.add(actor);bones.clear();rest.clear();let meshes=0;actor.traverse(o=>{if(o.isBone){bones.set(o.name,o);rest.set(o.name,o.quaternion.clone())}if(o.isSkinnedMesh)meshes++});if(bones.size!==163||meshes<1)throw Error('Imported skeleton mismatch: '+bones.size+' bones, '+meshes+' meshes; samples '+[...bones.keys()].slice(0,12).join(', '));const box=new THREE.Box3().setFromObject(actor),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());camera.position.copy(center).add(new THREE.Vector3(0,size.y*.08,Math.max(size.y*1.7,size.length()*1.2)));controls.target.copy(center);controls.update();helper=new THREE.SkeletonHelper(actor);helper.visible=false;scene.add(helper);apply();say('LOADED: '+bones.size+' bones, '+meshes+' skinned meshes, '+manifest.triangles+' triangles. Select a joint test. Bone samples: '+[...bones.keys()].slice(0,12).join(', '));}catch(e){say('FAILED: '+e.message);$('load').disabled=false}};
$('pose').onchange=()=>{if($('pose').value!=='neutral'&&Number($('angle').value)===0)$('angle').value=45;apply()};$('angle').oninput=apply;$('reset').onclick=()=>{$('pose').value='neutral';$('angle').value=0;apply()};$('skeleton').onclick=()=>{if(helper)helper.visible=!helper.visible};$('capture').onclick=()=>{if(!actor)return say('Load first');renderer.render(scene,camera);const a=document.createElement('a');a.href=$('view').toDataURL('image/png');a.download='eidolon-native-motion.png';a.click()};
</script></html>
