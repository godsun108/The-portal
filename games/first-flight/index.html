<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PORTAL — First Flight</title><style>body{margin:0;background:#05070b;color:#eef;font:16px system-ui}main{max-width:720px;margin:auto;padding:24px}.card{border:1px solid #334;padding:18px;border-radius:16px;background:#0b1019}button{font:inherit;padding:12px 18px;border-radius:10px}.bar{height:8px;background:#223;border-radius:9px;overflow:hidden}.fill{height:100%;background:#9cf}small{color:#9aa}</style></head><body><main><h1>FIRST FLIGHT</h1><p>A continuous journey from home to orbit.</p><div class="card"><h2 id="title">Loading…</h2><p id="detail"></p><div class="bar"><div class="fill" id="fill"></div></div><p><button id="advance">Complete beat</button></p><small id="status"></small></div></main><script type="module">import{FIRST_FLIGHT,progress}from "../../src/first_flight_runtime.js";let done=[];const names={wake:"Wake",street:"Step Outside",drive:"Drive the City",spaceport:"Reach the Spaceport",board:"Board Your Ship",liftoff:"Liftoff",first_orbit:"First Orbit"};function draw(){const p=progress(done);document.querySelector("#fill").style.width=(p.ratio*100)+"%";document.querySelector("#status").textContent=p.completed+" / "+p.total+" campaign beats";if(!p.next){document.querySelector("#title").textContent="ORBIT ACHIEVED";document.querySelector("#detail").textContent="Vertical slice complete. The universe is now open.";document.querySelector("#advance").disabled=true;return}document.querySelector("#title").textContent=names[p.next.id];document.querySelector("#detail").textContent=p.next.fieldMission?"Optional real-world field mission available; in-game fallback preserved.":"Zone: "+p.next.zone+" • "+p.next.mode;document.querySelector("#advance").onclick=()=>{done.push(p.next.id);draw()}}draw();</script></body></html>
