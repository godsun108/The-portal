<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02090b"><title>EARTH NOW // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;background:#020608;color:#e6fbff;font-family:ui-monospace,monospace;min-height:100svh}.back{position:fixed;z-index:9;top:18px;left:18px;color:#66858b;text-decoration:none;font-size:9px}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:64px 0}.hero{text-align:center}.planet{width:min(48vw,260px);aspect-ratio:1;border-radius:50%;margin:auto;background:radial-gradient(circle at 35% 28%,#c6fbff 0 1%,#4da7ad 2% 8%,#17606c 9% 28%,#082a32 45%,#02090b 72%);box-shadow:0 0 90px #1a899d55,inset -55px -25px 80px #000;animation:breathe 6s ease-in-out infinite}.eye{font-size:9px;letter-spacing:.3em;color:#587b81;margin-top:25px}h1{font:900 clamp(55px,15vw,110px)/.78 Arial Black,sans-serif;letter-spacing:-.06em;margin:15px 0}.now{font-size:10px;color:#6e939a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:35px 0}.stat{border:1px solid #123039;background:#041014;padding:18px;border-radius:16px}.stat b{display:block;font-size:clamp(24px,7vw,44px)}.stat small{color:#66858c;font-size:8px;letter-spacing:.12em}.events{display:grid;gap:8px}.event{border-bottom:1px solid #10272d;padding:13px 4px;display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center}.mag{font-weight:900;font-size:18px}.place{font-size:10px;color:#b8d1d5}.time{font-size:8px;color:#55747a}.pulse{width:7px;height:7px;border-radius:50%;background:#6df0a1;display:inline-block;box-shadow:0 0 10px #6df0a1}.source{text-align:center;margin-top:30px;color:#47646a;font-size:8px;line-height:1.8}.source a{color:#698f96}@keyframes breathe{50%{transform:scale(1.025);box-shadow:0 0 125px #1a899d66,inset -55px -25px 80px #000}}@media(max-width:600px){.stats{grid-template-columns:1fr}.event{grid-template-columns:55px 1fr}.time{grid-column:2}}@media(prefers-reduced-motion:reduce){.planet{animation:none}}</style></head><body><a class="back" href="../">← PORTAL</a><main class="wrap"><section class="hero"><div class="planet"></div><div class="eye">LIVE PLANETARY RECEIVER</div><h1>EARTH<br>NOW</h1><div class="now" id="clock"><span class="pulse"></span> CONNECTING</div></section><section class="stats"><div class="stat"><b id="count">—</b><small>M2.5+ // 24H</small></div><div class="stat"><b id="strong">—</b><small>STRONGEST</small></div><div class="stat"><b id="depth">—</b><small>DEEPEST KM</small></div></section><section class="events" id="events"></section><p class="source">EARTHQUAKE DATA // <a href="https://earthquake.usgs.gov/" target="_blank" rel="noreferrer">USGS</a><br>Live public feed. No location permission. The planet does not need to know where you are.</p></main><script>localStorage.setItem("portal-artifact-earth","1");const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function tick(){clock.innerHTML='<span class="pulse"></span> EARTH // '+new Date().toLocaleTimeString()}tick();setInterval(tick,1000);fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson").then(r=>r.json()).then(d=>{const a=d.features||[],mags=a.map(x=>+x.properties.mag||0),deps=a.map(x=>+x.geometry.coordinates[2]||0);count.textContent=a.length;strong.textContent="M"+Math.max(0,...mags).toFixed(1);depth.textContent=Math.round(Math.max(0,...deps));events.innerHTML=a.slice(0,14).map(x=>'<article class="event"><div class="mag">M'+(+x.properties.mag).toFixed(1)+'</div><div class="place">'+esc(x.properties.place||"Unknown")+'</div><div class="time">'+new Date(x.properties.time).toLocaleTimeString()+'</div></article>').join("")}).catch(()=>events.innerHTML='<div class="event"><div class="place">RECEIVER OFFLINE // EARTH CONTINUES WITHOUT US.</div></div>')</script></body></html>
