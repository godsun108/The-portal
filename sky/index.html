<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03040a"><title>SKY // THE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 30%,#111638,#020309 65%);color:#eef0ff;font-family:ui-monospace,monospace;display:grid;place-items:center;padding:28px}.back{position:absolute;top:22px;left:22px;color:#555d80;text-decoration:none;font-size:9px}.s{text-align:center;max-width:650px}.moon{font-size:clamp(110px,34vw,220px);line-height:1}.eye{font-size:9px;letter-spacing:.3em;color:#687096}h1{font:900 clamp(55px,16vw,110px)/.8 Arial Black,sans-serif}.meta{color:#7980a0;font-size:10px;line-height:2}</style></head><body><a class="back" href="../">← PORTAL</a><main class="s"><div class="eye">LOCAL CLOCK ASTRONOMY // APPROXIMATE</div><div class="moon" id="moon"></div><h1>SKY</h1><div class="meta" id="meta"></div></main><script>const syn=29.53058867,known=Date.UTC(2000,0,6,18,14),age=((Date.now()-known)/86400000%syn+syn)%syn,phase=age/syn;const icons=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"],names=["NEW MOON","WAXING CRESCENT","FIRST QUARTER","WAXING GIBBOUS","FULL MOON","WANING GIBBOUS","LAST QUARTER","WANING CRESCENT"],i=Math.floor((phase*8+.5)%8);moon.textContent=icons[i];meta.innerHTML=names[i]+"<br>MOON AGE ≈ "+age.toFixed(1)+" DAYS<br>YOUR LOCAL CLOCK // "+new Date().toLocaleString()+"<br><br>No location permission required.";localStorage.setItem("portal-sky","1");</script></body></html>
