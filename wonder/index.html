<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WONDER // PORTAL</title><link rel="stylesheet" href="../portal-atmosphere.css"><style>body{margin:0;background:#050507;color:#aaa;font:11px/1.7 ui-monospace;min-height:100vh}main{max-width:680px;margin:auto;padding:10vh 24px}h1{color:#eee;font:900 clamp(42px,12vw,90px)/.85 Arial Black,sans-serif;letter-spacing:-.06em}.x{border-top:1px solid #ffffff18;padding:18px 0}.g{font-size:26px;color:#ddd}.dim{opacity:.5}a{color:#c8bfff}.x a{display:inline-block;margin-top:8px;font-size:9px}</style><link rel="stylesheet" href="../portal-magic.css"></head><body><main><h1>WONDER</h1><p class="dim">A JOURNAL OF THINGS THE PORTAL ACTUALLY MANIFESTED FOR THIS TRAVELER.</p><div id="log"></div><p><a href="../stations/">RETURN TO STATIONS</a></p></main><script type="module">import{installTravelerHUD}from"../traveler-hud.js";installTravelerHUD();const out=document.querySelector("#log");let xs=[];try{xs=JSON.parse(localStorage.getItem("portal-encounters")||"[]")}catch{}if(!xs.length)out.innerHTML='<div class="x dim">NOTHING RARE HAS FOUND YOU YET.</div>';else xs.slice().reverse().forEach(x=>{const d=document.createElement("div");d.className="x";const room=String(x.room||"unknown"),safe=/^[a-z0-9-]+$/i.test(room);d.innerHTML='<div class="g">'+x.glyph+'</div><b>'+x.title+'</b><br>'+room.toUpperCase()+' // '+new Date(x.seenAt).toLocaleString()+(safe?'<br><a href="../'+room+'/">RETURN TO WHERE IT HAPPENED →</a>':'');out.append(d)})</script><script type="module">import{installTransitions}from"../transitions.js";installTransitions("wonder");</script>
