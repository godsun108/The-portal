<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PORTAL Shared Reality Lab 01</title><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#eaf6ff;font:14px ui-monospace}main{max-width:760px;margin:auto;padding:24px}h1{font-size:20px}.view{position:relative;aspect-ratio:4/3;background:linear-gradient(#152737,#0c1822);overflow:hidden;border:1px solid #28465b}.anchor,.orb{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}.anchor{width:18px;height:18px;border:2px solid #8deaff;left:50%;top:68%}.orb{width:42px;height:42px;background:#d4a2ff;left:50%;top:42%;transition:.15s}.pair{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:16px 0}.qr{background:white;padding:8px;width:164px;min-height:164px;display:grid;place-items:center}.qr svg{width:148px;height:148px;display:block}.join{max-width:520px;overflow-wrap:anywhere;color:#9fc0d4}.status{padding:8px 10px;border:1px solid #28465b;margin:10px 0}.online{border-color:#7ee6a1}.offline{border-color:#d99}button{padding:12px 14px;background:#143049;color:white;border:1px solid #47718b;margin:5px}#state{white-space:pre-wrap;background:#08121b;padding:12px;margin-top:16px;overflow:auto}</style></head><body><main><h1>PORTAL // SHARED REALITY LAB 01</h1><p>ROOM <strong id="room"></strong> · DEVICE <strong id="device"></strong></p><div id="status" class="status offline">CONNECTING TO SHARED WORLD…</div><div class="pair"><div id="qr" class="qr"></div><div><strong>JOIN THIS ROOM</strong><div class="join" id="join"></div><div>Open this link or scan it on a second device.</div></div></div><div class="view"><div class="anchor"></div><div class="orb" id="orb"></div></div><div><button id="left">MOVE LEFT</button><button id="right">MOVE RIGHT</button><button id="reset">RESET ORB</button></div><div id="state"></div></main><script type="module">import{replicatedSpatialClient,createRoom,roomJoinUrl,relayConfig,socketSpatialBus,reconnectPolicy}from"../runtime/shared-spatial.js";const RELAY="wss://shared-reality-relay-production.up.railway.app";const q=new URLSearchParams(location.search),stored=localStorage.getItem("portal-shared-device"),deviceId=stored||("phone-"+crypto.randomUUID().slice(0,8));localStorage.setItem("portal-shared-device",deviceId);const room=createRoom({code:q.get("room")||Math.random().toString(36).slice(2,8),hostId:q.get("host")||deviceId}),joinUrl=roomJoinUrl(room,{base:location.href}),status=document.querySelector("#status"),state=document.querySelector("#state"),orb=document.querySelector("#orb"),retry=reconnectPolicy();document.querySelector("#room").textContent=room.id;document.querySelector("#device").textContent=deviceId;document.querySelector("#join").textContent=joinUrl;renderQR(document.querySelector("#qr"),joinUrl);let socket,bus,client;function setStatus(text,on=false){status.textContent=text;status.className="status "+(on?"online":"offline")}function connect(){const cfg=relayConfig({url:RELAY,room,deviceId});socket=new WebSocket(cfg.url);socket.addEventListener("open",()=>{retry.reset();bus=socketSpatialBus(socket);client=replicatedSpatialClient({sessionId:room.id,deviceId,bus,isHost:room.hostId===deviceId});client.join({kind:"phone",room:room.id});client.requestSnapshot();if(!client.snapshot().objects.length)client.object({id:"shared-orb",position:{x:0,y:1,z:-2},owner:deviceId});setStatus("LIVE · SHARED RELAY CONNECTED",true);render()});socket.addEventListener("message",()=>setTimeout(render,0));socket.addEventListener("close",()=>{client?.close();setStatus("DISCONNECTED · RECONNECTING…");setTimeout(connect,retry.next())});socket.addEventListener("error",()=>setStatus("NETWORK ERROR · RETRYING…"))}function render(){if(!client)return;const s=client.snapshot(),o=s.objects.find(x=>x.id==="shared-orb");if(o)orb.style.left=(50+o.position.x*18)+"%";state.textContent=JSON.stringify({room:room.id,device:deviceId,players:s.players.map(p=>p.id),object:o||null},null,2)}function move(dx){if(!client)return;const o=client.snapshot().objects.find(x=>x.id==="shared-orb")||{id:"shared-orb",position:{x:0,y:1,z:-2}};client.object({...o,position:{...o.position,x:Math.max(-1.5,Math.min(1.5,o.position.x+dx))},owner:deviceId});render()}document.querySelector("#left").onclick=()=>move(-.2);document.querySelector("#right").onclick=()=>move(.2);document.querySelector("#reset").onclick=()=>{if(client){client.object({id:"shared-orb",position:{x:0,y:1,z:-2},owner:deviceId});render()}};async function renderQR(el,value){try{const{default:QRCode}=await import("https://cdn.jsdelivr.net/npm/qrcode-svg@1.1.0/+esm");el.innerHTML=new QRCode({content:value,padding:0,width:148,height:148,ecl:"M",join:true}).svg()}catch{el.textContent=room.id;el.style.color="#000"}}connect();</script></body></html>
