<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIRCUIT // ARCADE</title><link rel="stylesheet" href="../portal-atmosphere.css"><link rel="stylesheet" href="../portal-magic.css"><link rel="stylesheet" href="circuit.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#020204;color:#eee;font-family:ui-monospace;padding:26px}.wrap{width:min(820px,100%);margin:65px auto}h1{font:900 clamp(60px,16vw,125px)/.76 Arial Black;letter-spacing:-.08em;margin:18px 0}.sub{color:#756b7b;font-size:10px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:38px}.node{min-height:120px;border:1px solid #2c2633;border-radius:18px;padding:16px;background:#08070b}.node.on{border-color:#8066a1;box-shadow:inset 0 0 28px #7e55aa18}.node.master{border-color:#c5b2e8}.node strong{display:block;font-size:11px}.node small{display:block;margin-top:9px;color:#716778}.big{margin-top:32px;border-top:1px solid #222;padding-top:22px;font-size:9px;letter-spacing:.16em;color:#7c7184}a{color:#8d8195;text-decoration:none}</style></head><body><a href="./">← ARCADE</a><main class="wrap"><div>ARCADE INTERNAL // READ ONLY</div><h1>CIRCUIT</h1><p class="sub">Every lit node corresponds to something this browser actually did. No simulated players. No invented victories.</p><div class="grid" id="nodes"></div><div class="big" id="meta"></div></main><script type="module">import{circuitState,installCircuit}from"./circuit.js";import{installTravelerHUD}from"../traveler-hud.js";import{installTransitions}from"../transitions.js";const s=installCircuit();installTravelerHUD();installTransitions("arcade-circuit");const games=["rift","echo-maze","signal-hunt","colorfall","drift","null-racer","star-swarm","pulse-4","up-void","fifth-machine"];nodes.innerHTML=games.map(g=>'<div class="node '+(s.played.includes(g)?"on":"")+'"><strong>'+g.toUpperCase()+'</strong><small>'+(s.played.includes(g)?"SIGNAL PRESENT":"NO RUN RECORDED")+'</small></div>').join("")+["gravity-pearl","null-compass","swarm-heart","phase-chord","void-feather"].map(a=>'<div class="node '+(s.masteryLit.includes(a)?"on master":"")+'"><strong>'+a.toUpperCase()+'</strong><small>'+(s.masteryLit.includes(a)?"MASTER SIGNAL LIT":"MASTER SIGNAL DARK")+'</small></div>').join("");meta.textContent="RUNS "+s.runCount+" // ARTIFACTS "+s.artifactCount+" // MASTER "+s.masteryLit.length+"/5 // SINGULARITY "+(s.singularity?"PRESENT":"ABSENT");</script></body></html>
