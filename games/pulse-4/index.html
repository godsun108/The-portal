<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>PULSE//4</title><link rel="stylesheet" href="../../portal-atmosphere.css"><link rel="stylesheet" href="../../portal-magic.css"><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#030307;color:#eee;font-family:ui-monospace}.game{position:fixed;inset:0;display:grid;grid-template-columns:repeat(4,1fr);max-width:620px;margin:auto;border-left:1px solid #ffffff12;border-right:1px solid #ffffff12}.lane{position:relative;border-right:1px solid #ffffff0c;touch-action:none}.hit{position:absolute;left:0;right:0;bottom:15%;height:2px;background:#ddd;box-shadow:0 0 16px #fff8}.note{position:absolute;left:16%;width:68%;height:18px;border:1px solid #b99aff;border-radius:8px;background:#8b6cff38;box-shadow:0 0 14px #8b6cff22}.hud{position:fixed;z-index:4;inset:14px 18px auto;display:flex;justify-content:space-between;font-size:10px}.screen{position:fixed;z-index:8;inset:0;display:grid;place-items:center;text-align:center;background:#030307ed;padding:22px}.hide{display:none}h1{font:900 clamp(58px,18vw,130px)/.76 Arial Black;letter-spacing:-.08em;margin:8px}.hint{color:#777;max-width:440px;line-height:1.7;margin:20px auto}button,a{border:1px solid #ffffff35;background:#090911;color:#eee;border-radius:999px;padding:13px 18px;font:10px ui-monospace;text-decoration:none}</style></head><body><div class="game" id="field"></div><div class="hud"><span id="score">PULSE 00000</span><span id="combo">COMBO 0</span></div><section class="screen" id="intro"><div><div>ARCADE // RHYTHM CABINET</div><h1>PULSE//4</h1><p class="hint">FOUR LANES. HIT THE SIGNAL AT THE LINE. KEYS D F J K OR TAP THE LANES. AUDIO IS SYNTHESIZED LOCALLY. A OR S GRADE EARNS AN ARTIFACT.</p><button id="go">BEGIN PULSE</button> <a href="../../arcade/">ARCADE</a></div></section><section class="screen hide" id="over"><div><div>SEQUENCE COMPLETE</div><h1 id="grade">C</h1><p class="hint" id="result"></p><button id="again">AGAIN</button> <a href="../../arcade/">ARCADE</a></div></section><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{physicsState}from"../../physics.js";import{installTravelerHUD}from"../../traveler-hud.js";import{installTransitions}from"../../transitions.js";installTravelerHUD();installTransitions("pulse-4");const score=document.querySelector("#score"),combo=document.querySelector("#combo"),intro=document.querySelector("#intro"),go=document.querySelector("#go"),over=document.querySelector("#over"),grade=document.querySelector("#grade"),result=document.querySelector("#result"),again=document.querySelector("#again");const field=document.querySelector("#field"),phys=physicsState();for(let i=0;i<4;i++){const l=document.createElement("div");l.className="lane";l.dataset.l=i;l.innerHTML='<div class="hit"></div>';field.append(l)}const lanes=[...document.querySelectorAll(".lane")];let ctx,notes=[],score=0,combo=0,hits=0,miss=0,startAt=0,playing=false,run,raf,best=localStorage.getItem("portal-pulse4-best")||"—";const BPM=126,beat=60000/BPM,duration=32000;function tone(l){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=[196,246.94,293.66,392][l];o.type="sine";g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.11);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.12)}function chart(){notes=[];for(let t=1200,i=0;t<duration-1800;t+=beat/2,i++){if(i%4===3&&i%8!==3)continue;let l=(i*3+Math.floor(i/5))%4;if(phys.mode==="converged"&&i%11===0)l=3-l;notes.push({t,l,hit:false,miss:false,el:null})}}function begin(){chart();score=combo=hits=miss=0;startAt=performance.now();run=beginRun("pulse-4");playing=true;intro.classList.add("hide");over.classList.add("hide");raf=requestAnimationFrame(loop)}function tap(l){if(!playing)return;const now=performance.now()-startAt,c=notes.filter(n=>!n.hit&&!n.miss&&n.l===l).sort((a,b)=>Math.abs(a.t-now)-Math.abs(b.t-now))[0];if(!c||Math.abs(c.t-now)>180){combo=0;return}const err=Math.abs(c.t-now);c.hit=true;c.el?.remove();hits++;combo++;score+=err<65?100:err<120?70:40;tone(l);event(run,"hit",{lane:l,error:Math.round(err)});update()}function update(){scoreEl.textContent="PULSE "+String(score).padStart(5,"0");comboEl.textContent="COMBO "+combo}function loop(now){if(!playing)return;const t=now-startAt,H=innerHeight*.7,line=innerHeight*.85;for(const n of notes){if(n.hit||n.miss)continue;const y=line-(n.t-t)/1500*H;if(!n.el&&y>-30){n.el=document.createElement("div");n.el.className="note";lanes[n.l].append(n.el)}if(n.el)n.el.style.top=y+"px";if(t-n.t>190){n.miss=true;n.el?.remove();miss++;combo=0;update()}}if(t>=duration)return end();raf=requestAnimationFrame(loop)}function end(){playing=false;cancelAnimationFrame(raf);document.querySelectorAll(".note").forEach(x=>x.remove());const total=hits+miss,acc=total?hits/total:0,g=acc>.93?"S":acc>.82?"A":acc>.68?"B":"C";let r=null;if(g==="S"||g==="A"){r=phys.mode==="converged"&&g==="S"?"phase-chord":"pulse-key";grantArtifact(r)}else if(g==="C")scar("broken-rhythm");finishRun(run,{score,hits,miss,accuracy:acc,grade:g,reward:r,physics:phys.mode});const rank={S:4,A:3,B:2,C:1};if(best==="—"||rank[g]>rank[best]){best=g;localStorage.setItem("portal-pulse4-best",g)}grade.textContent=g;result.textContent=(r?"ARTIFACT // "+r.toUpperCase()+" // ":"")+"HITS "+hits+" // MISSES "+miss+" // ACCURACY "+Math.round(acc*100)+"% // BEST "+best;over.classList.remove("hide")}const keys={d:0,f:1,j:2,k:3};addEventListener("keydown",e=>{if(keys[e.key.toLowerCase()]!==undefined)tap(keys[e.key.toLowerCase()])});lanes.forEach(l=>l.addEventListener("pointerdown",()=>tap(+l.dataset.l)));go.onclick=begin;again.onclick=begin;</script></body></html>
