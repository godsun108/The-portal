if(helper)helper.visible=!helper.visible};$('record').onclick=()=>{if(!actor||!renderer)return say('Load human first');if(recorder&&recorder.state==='recording')return say('Recording in progress');const canvas=$('view');if(!canvas.captureStream||!window.MediaRecorder)return say('Video recording unsupported in this browser. Try Safari or desktop Chrome; Save PNG still works.');let stream,rec;try{captureCanvas=document.createElement("canvas");captureCanvas.width=480;captureCanvas.height=640;captureContext=captureCanvas.getContext("2d");stream=captureCanvas.captureStream(24);const type=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(stream,type?{mimeType:type}:undefined)}catch(e){return say('Recording unavailable: '+e.message)}recorder=rec;const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onerror=e=>say('Recording error: '+(e.error?.message||'unknown'));rec.onstop=()=>{captureContext=null;captureCanvas=null;stream.getTracks().forEach(t=>t.stop());const mime=rec.mimeType||'video/webm',ext=mime.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type:mime});if(!blob.size)return say('Recording produced no video.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='eidolon-'+mode+'-'+Date.now()+'.'+ext;a.click();say('Recording complete: '+(blob.size/1048576).toFixed(1)+' MB '+ext+'. If iPhone did not save, try Safari Downloads.');setTimeout(()=>URL.revokeObjectURL(url),60000)};try{rec.start(500);say('Recording 10 seconds of canvas video (no audio). Keep this tab visible.');$('record').disabled=true;setTimeout(()=>{if(rec.state==='recording')rec.stop();$('record').disabled=false},10000)}catch(e){captureContext=null;captureCanvas=null;stream.getTracks().forEach(t=>t.stop());say('Recording failed: '+e.message);$('record').disabled=false}};$('capture').onclick=()=>{if(!actor)return say('Load first');renderer.render $('benchmark').onclick=()=>{if(!actor)return say('Wait for model load before benchmark');if(benchmark)return;benchmark={pass:0,frames:0};$('benchmark').disabled=true;$('footlock').checked=false;resetBenchmarkPass();$('qacompare').textContent='Running two 360-frame passes; keep this tab visible…';say('A/B benchmark started · fixed simulation timestep')};$('saveqa').onclick=()=>{if(!qaSamples)return say('Play animation first to collect QA samples');const key=$('footlock').checked?'IK on':'IK off';qaSnapshots[key]={drift:footFrames?footTravel/footFrames:null,peak:qaMax,ikMean:ikErrorSamples?ikErrorSum/ikErrorSamples:null,samples:footFrames};const fmt=n=>n===null?'n/a':n.toFixed(4);$('qacompare').textContent=Object.entries(qaSnapshots).map(([k,v])=>k+': mean stance drift/sample '+fmt(v.drift)+'; peak joint °/s '+v.peak.toFixed(0)+'; IK residual '+fmt(v.ikMean)+'; '+v.samples+' stance samples').join('\n')+'\nCompare only equal-duration walks at same speed. Heuristic, not a controlled benchmark.'};$('footlock').onchange=()=>{plantedTargets=[null,null];ikErrorSum=0;ikErrorSamples=0;ikErrorPeak=0;say($('footlock').checked?'Experimental foot IK enabled for walk · watch for knee distortion':'Foot IK disabled')};$('feel').onchange=()=>{motionProfile=$('feel').value;say('Motion feel: '+motionProfile+' · amplitude only, experimental')};const boot=()=>{$('build').textContent='EIDOLON V28 · Initializing 3D renderer…';$('load').click()};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();</script></html>
