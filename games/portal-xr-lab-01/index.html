<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PORTAL XR Lab 01</title><style>*{box-sizing:border-box}body{margin:0;background:#05080d;color:#eaf5ff;font:14px ui-monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}header{position:fixed;inset:12px auto auto 12px}.panel{position:fixed;right:12px;top:12px;text-align:right}button{background:#102436;color:#dff7ff;border:1px solid #46708b;padding:8px 12px}.help{position:fixed;bottom:12px;left:12px}</style></head><body><header>PORTAL // XR LAB 01</header><div class="panel"><div id="cap">CHECKING XR…</div><button id="enter" hidden>ENTER VR</button><div id="held">HELD: NONE</div></div><canvas></canvas><div class="help">DESKTOP: WASD MOVE · MOUSE AIM · CLICK GRAB/RELEASE · XR: CAPABILITY-GATED</div><script type="module">
import{createXRRenderer}from"../runtime/xr-renderer.js";import{createSpatialAudio}from"../runtime/spatial-audio.js";import{xrCapabilities,comfortSettings,spatialAnchor,interactionTarget,grabState,requestXRSession,referenceSpace,controllerRegistry,updateControllerPoses,bindSelect,updateControllerTransforms,teleportGesture,offsetReferenceSpace,handRegistry,updateHandJoints,pinchTransitions,xrWorldObject,controllerGrabSystem,locomotionState,teleportArc,comfortTeleport}from"../runtime/xr.js";import{beginRun,event,finishRun}from"../protocol.js";
const c=document.querySelector("canvas"),fallback=document.createElement("canvas"),g=fallback.getContext("2d"),capEl=document.querySelector("#cap"),enter=document.querySelector("#enter"),heldEl=document.querySelector("#held");function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;fallback.width=c.width;fallback.height=c.height}size();addEventListener("resize",size);
const xrRenderer=createXRRenderer(c);const xrObjects=[xrWorldObject({id:"xr-orb",x:-.5,y:1.2,z:-2,scale:.2,color:[.3,.85,1]}),xrWorldObject({id:"xr-cube",x:.5,y:1.1,z:-2.4,scale:.25,color:[.8,.45,1]}),xrWorldObject({id:"xr-signal",x:0,y:.8,z:-1.5,scale:.14,color:[.4,1,.65]})],xrGrab=controllerGrabSystem(xrObjects),locomotion=locomotionState(),teleportComfort=comfortTeleport(),teleport=teleportGesture({hand:"left"}),audio=createSpatialAudio();const run=beginRun("portal-xr-lab-01"),comfort=comfortSettings(),grab=grabState(),keys=new Set,controllers=controllerRegistry(),hands=handRegistry(),pinch=pinchTransitions();let player={x:.5,y:.78,z:0},aim={x:.5,y:.5,z:0},last=performance.now(),session=null,xrBaseSpace=null,xrSpace=null,xrFrameCount=0;
const objects=[{id:"orb",position:{x:.28,y:.36,z:0},r:.035},{id:"cube",position:{x:.68,y:.32,z:0},r:.04},{id:"signal",position:{x:.5,y:.52,z:0},r:.03}],anchors=[spatialAnchor({id:"north",x:.5,y:.16,z:0}),spatialAnchor({id:"west",x:.14,y:.5,z:0})];
const caps=await xrCapabilities();capEl.textContent=caps.webxr?("XR // VR "+(caps.vr?"READY":"NO")+" // AR "+(caps.ar?"READY":"NO")):"XR UNAVAILABLE // DESKTOP FALLBACK";enter.hidden=!caps.vr;event(run,"xr-lab-start",{caps,comfort});
enter.onclick=async()=>{try{await audio.resume();session=await requestXRSession("immersive-vr");await xrRenderer.attach(session);const ref=await referenceSpace(session);xrBaseSpace=ref.space;xrSpace=ref.space;event(run,"xr-session-start",{referenceSpace:ref.type});capEl.textContent="VR ACTIVE // "+ref.type.toUpperCase();bindSelect(session,controllers,{onStart:(hand,ctrl)=>{if(hand==="left"&&!xrGrab.held(hand)){teleport.start(hand);event(run,"teleport-aim-start",{hand});return}const o=xrGrab.start(hand,ctrl?.grip||ctrl?.ray);if(o){audio.tone({...o.position,frequency:o.id==="xr-orb"?520:o.id==="xr-cube"?360:700});}event(run,"xr-select-start",{hand,object:o?.id||null})},onEnd:(hand)=>{if(hand==="left"&&teleport.aiming){const target=teleport.end(hand,teleportComfort,locomotion);if(target){xrSpace=offsetReferenceSpace(xrBaseSpace,locomotion.offset);audio.tone({...target,frequency:220,duration:.2});event(run,"teleport",{hand,target,offset:locomotion.offset})}else event(run,"teleport-cancel",{hand});return}const o=xrGrab.end(hand);event(run,"xr-select-end",{hand,object:o?.id||null})}});const xrFrame=(time,frame)=>{if(!session||!xrSpace)return;controllers.sync(session);updateControllerTransforms(controllers,frame,xrSpace);hands.sync(session);updateHandJoints(hands,frame,xrSpace);for(const h of hands.all()){const tr=pinch(h),tip=h.joints["index-finger-tip"];if(tr.start){const o=xrGrab.start("hand-"+h.side,tip);event(run,"xr-pinch-start",{hand:h.side,object:o?.id||null})}if(tr.active)xrGrab.update("hand-"+h.side,tip);if(tr.end){const o=xrGrab.end("hand-"+h.side);event(run,"xr-pinch-end",{hand:h.side,object:o?.id||null})}}for(const ctrl of controllers.all())xrGrab.update(ctrl.hand,ctrl.grip||ctrl.ray);const left=controllers.get("left");const arc=teleport.update(left);const viewer=frame.getViewerPose(xrSpace);const head=viewer?.transform?.position;if(head)audio.listener({x:head.x,y:head.y,z:head.z});const renderObjects=xrObjects.map(o=>({x:o.position.x,y:o.position.y,z:o.position.z,scale:o.scale,color:o.color}));for(const h of hands.all())for(const j of Object.values(h.joints))renderObjects.push({x:j.x,y:j.y,z:j.z,scale:j.radius||.012,color:h.pinching?[1,.8,.2]:[.5,1,.9]});for(const ctrl of controllers.all())if(ctrl.grip)renderObjects.push({x:ctrl.grip.x,y:ctrl.grip.y,z:ctrl.grip.z,scale:.07,color:ctrl.hand==="left"?[.3,.7,1]:[1,.65,.3]});if(arc?.points)for(let i=0;i<arc.points.length;i+=2){const p=arc.points[i];renderObjects.push({x:p.x,y:p.y,z:p.z,scale:.025,color:arc.valid?[.3,1,.55]:[1,.3,.3]})}if(arc?.target)renderObjects.push({x:arc.target.x,y:.02,z:arc.target.z,scale:.1,color:[.3,1,.55]});xrRenderer.render(frame,xrSpace,renderObjects);xrFrameCount++;if(xrFrameCount%120===0)event(run,"xr-frame-sample",{controllers:controllers.all().map(x=>({hand:x.hand,grip:x.grip,ray:x.ray}))});session.requestAnimationFrame(xrFrame)};session.requestAnimationFrame(xrFrame);session.addEventListener("end",()=>{session=null;xrBaseSpace=null;xrSpace=null;capEl.textContent="VR SESSION ENDED";event(run,"xr-session-end",{frames:xrFrameCount})})}catch(e){capEl.textContent="VR ENTRY FAILED";event(run,"xr-session-error",{message:String(e.message||e)})}};
addEventListener("keydown",e=>keys.add(e.key.toLowerCase()));addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));c.addEventListener("pointermove",e=>{aim.x=e.clientX/innerWidth;aim.y=e.clientY/innerHeight});c.addEventListener("pointerdown",()=>{if(grab.held){const o=grab.release();event(run,"release",{id:o.id})}else{const target=interactionTarget(objects,aim,.1);if(target&&grab.grab(target))event(run,"grab",{id:target.id})}});
function frame(t){const dt=Math.min(.04,(t-last)/1000);last=t;let dx=0,dy=0;if(keys.has("a"))dx--;if(keys.has("d"))dx++;if(keys.has("w"))dy--;if(keys.has("s"))dy++;const m=Math.hypot(dx,dy)||1;player.x=Math.max(.05,Math.min(.95,player.x+dx/m*.25*dt));player.y=Math.max(.1,Math.min(.92,player.y+dy/m*.25*dt));if(grab.held){grab.held.position.x=aim.x;grab.held.position.y=aim.y}heldEl.textContent="HELD: "+(grab.held?grab.held.id.toUpperCase():"NONE")+" // XR HANDS "+controllers.all().length;
g.clearRect(0,0,c.width,c.height);g.save();g.scale(c.width,c.height);g.fillStyle="#0d1824";g.fillRect(.06,.1,.88,.82);g.strokeStyle="#20394d";for(let i=0;i<8;i++){g.beginPath();g.moveTo(.06,.1+i*.1);g.lineTo(.94,.1+i*.1);g.stroke()}for(const a of anchors){g.strokeStyle="#65e0ff";g.strokeRect(a.position.x-.018,a.position.y-.018,.036,.036)}for(const o of objects){g.fillStyle=o.id==="orb"?"#8deaff":o.id==="cube"?"#d4a2ff":"#8dffba";g.beginPath();g.arc(o.position.x,o.position.y,o.r,0,7);g.fill()}g.strokeStyle="#7c93a6";g.beginPath();g.moveTo(player.x,player.y);g.lineTo(aim.x,aim.y);g.stroke();g.fillStyle="#fff";g.beginPath();g.arc(player.x,player.y,.022,0,7);g.fill();g.restore();if(!session){const screen=c.getContext("2d");screen.clearRect(0,0,c.width,c.height);screen.drawImage(fallback,0,0)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener("pagehide",()=>finishRun(run,{result:"exit",xr:Boolean(session),held:grab.held?.id||null}));
</script></body></html>
