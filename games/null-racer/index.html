<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>NULL RACER // ARCADE</title><link rel="stylesheet" href="../../portal-atmosphere.css"><link rel="stylesheet" href="../../portal-magic.css"><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#020205;color:#eee;font-family:ui-monospace}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:3;inset:16px 18px auto;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em}.screen{position:fixed;z-index:5;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#020205e8}.hide{display:none}h1{font:900 clamp(54px,17vw,130px)/.76 Arial Black;letter-spacing:-.075em;margin:8px}.hint{max-width:440px;color:#777;line-height:1.7;margin:20px auto}button,a{border:1px solid #ffffff35;background:#090911;color:#eee;border-radius:999px;padding:13px 18px;font:10px ui-monospace;text-decoration:none}</style></head><body><canvas id="c"></canvas><div class="hud"><span id="speed">000 KM/H</span><span id="dist">0 M</span></div><section class="screen" id="intro"><div><div>ARCADE // SPEED CABINET</div><h1>NULL<br>RACER</h1><p class="hint">CHANGE LANES. THREAD THE GATES. SURVIVE THE ROAD. SWIPE / TAP LEFT-RIGHT / ARROW KEYS.</p><button id="go">IGNITION</button> <a href="../../arcade/">ARCADE</a></div></section><section class="screen hide" id="over"><div><div>RUN ENDED</div><h1 id="final">0 M</h1><p class="hint" id="reward"></p><button id="again">AGAIN</button> <a href="../../arcade/">ARCADE</a></div></section><script type="module">import{beginRun,event,finishRun}from"../protocol.js";import{grantArtifact,scar}from"../state.js";import{physicsState}from"../../physics.js";import{activeEvents}from"../../events.js";import{installTravelerHUD}from"../../traveler-hud.js";import{installTransitions}from"../../transitions.js";installTravelerHUD();installTransitions("null-racer");const cv=document.querySelector("#c"),x=cv.getContext("2d"),phys=physicsState();let w,h,dpr,lane=1,target=1,gates=[],distance=0,speed=8,playing=false,last=0,spawn=0,run;function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener("resize",size);const laneX=i=>w/2+(i-1)*Math.min(95,w*.24);function shift(d){target=Math.max(0,Math.min(2,target+d))}function start(){lane=target=1;gates=[];distance=0;speed=8;spawn=0;last=performance.now();run=beginRun("null-racer");playing=true;intro.classList.add("hide");over.classList.add("hide");requestAnimationFrame(loop)}function gate(){const safe=Math.floor(Math.random()*3);gates.push({y:-60,safe,phase:Math.random()*6.28})}function loop(t){if(!playing)return;const dt=Math.min(2,(t-last)/16.67);last=t;distance+=speed*.12*dt;speed=Math.min(24,8+distance/260);spawn-=dt;if(spawn<=0){gate();spawn=Math.max(22,55-speed)}lane+=(target-lane)*Math.min(1,.18*dt);x.clearRect(0,0,w,h);x.strokeStyle="#ffffff12";x.lineWidth=1;for(let i=0;i<3;i++){x.beginPath();x.moveTo(laneX(i),0);x.lineTo(laneX(i),h);x.stroke()}for(const g of gates){g.y+=speed*dt*(phys.mode==="converged"?1+.12*Math.sin(t/500+g.phase):1);for(let i=0;i<3;i++)if(i!==g.safe){x.strokeStyle="#c987ff88";x.strokeRect(laneX(i)-32,g.y,64,24)}if(g.y>h*.76&&g.y<h*.76+speed*dt*2&&Math.round(lane)!==g.safe)return crash()}gates=gates.filter(g=>g.y<h+80);const px=laneX(lane),py=h*.78;x.fillStyle="#eee";x.beginPath();x.moveTo(px,py-14);x.lineTo(px-9,py+12);x.lineTo(px+9,py+12);x.closePath();x.fill();document.querySelector("#speed").textContent=String(Math.floor(speed*14)).padStart(3,"0")+" KM/H";document.querySelector("#dist").textContent=Math.floor(distance)+" M";requestAnimationFrame(loop)}function crash(){playing=false;const n=Math.floor(distance),events=activeEvents().map(e=>e.id);event(run,"crash",{distance:n});let r=null;if(n>=900){r=phys.mode==="converged"?"null-compass":"road-key";grantArtifact(r)}else scar("null-racer-crash");finishRun(run,{distance:n,reward:r,physics:phys.mode,events});final.textContent=n+" M";reward.textContent=r?"ARTIFACT // "+r.toUpperCase():"THE ROAD REMEMBERS WHERE YOU LEFT IT.";over.classList.remove("hide")}go.onclick=start;again.onclick=start;addEventListener("keydown",e=>{if(e.key==="ArrowLeft")shift(-1);if(e.key==="ArrowRight")shift(1)});let sx=null;cv.addEventListener("pointerdown",e=>sx=e.clientX);cv.addEventListener("pointerup",e=>{if(sx==null)return;const d=e.clientX-sx;if(Math.abs(d)>25)shift(d>0?1:-1);else shift(e.clientX<w/2?-1:1);sx=null});</script></body></html>
