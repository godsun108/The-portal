name: Propose Starfall asset release
on:
  workflow_dispatch:
    inputs:
      hull:
        description: 'Approved hull to propose (staged assets only)'
        required: true
        type: choice
        options:
          - fire-horse
          - solar-lion
      format:
        description: 'Staged atlas format'
        required: true
        type: choice
        options:
          - svg
          - png
permissions:
  contents: write
  pull-requests: write
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate staged assets and prepare proposal
        env:
          HULL: ${{ inputs.hull }}
          FORMAT: ${{ inputs.format }}
        run: |
          set -eu
          test "$HULL" = fire-horse -o "$HULL" = solar-lion
          test "$FORMAT" = svg -o "$FORMAT" = png
          test -f "games/starfall/assets/staging/$HULL.$FORMAT"
          test -f "games/starfall/assets/staging/$HULL.json"
          if [ "$FORMAT" = svg ]; then node games/starfall/assets/validate-staged.mjs "$HULL"; else node games/starfall/assets/validate-staged-png.mjs "$HULL"; fi
          cp "games/starfall/assets/staging/$HULL.$FORMAT" "games/starfall/assets/$HULL.$FORMAT"
          cp "games/starfall/assets/staging/$HULL.json" "games/starfall/assets/$HULL.json"
          if [ "$FORMAT" = svg ]; then node games/starfall/assets/validate-assets.mjs; fi
          node --test games/starfall/animation-engine.test.mjs games/starfall/sprite-atlas.test.mjs
      - name: Open reviewable PR (never merge automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          HULL: ${{ inputs.hull }}
          FORMAT: ${{ inputs.format }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="asset-proposal/${HULL}-${FORMAT}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add "games/starfall/assets/$HULL.$FORMAT" "games/starfall/assets/$HULL.json"
          if git diff --cached --quiet; then
            echo "Staged assets match released assets; no PR necessary."
            exit 0
          fi
          git commit -m "assets: propose updated $HULL atlas"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Review $HULL atlas release" --body "Proposed by manually triggered workflow. Staged asset dimensions and content checked; human review required. No automatic merge."
