<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09070d"><title>ORACLE — THE PORTAL</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 35%,#21122d,#070609 58%);color:#f5efff;font-family:ui-monospace,monospace;display:grid;place-items:center;padding:28px;overflow-x:hidden}.back{position:fixed;z-index:5;top:20px;left:20px;color:#81758a;text-decoration:none;font-size:10px}.wrap{text-align:center;width:min(720px,100%)}.orb{width:min(64vw,350px);aspect-ratio:1;border-radius:50%;margin:auto;border:1px solid #9e68c844;background:radial-gradient(circle at 42% 35%,#d49af055,#38134d 34%,#12091b 53%,#050407 74%);box-shadow:0 0 110px #7e3cac44,inset -40px -42px 75px #000;display:grid;place-items:center;font-size:82px;cursor:pointer;position:relative;transition:.4s}.orb:before,.orb:after{content:"";position:absolute;border:1px solid #b277db33;border-radius:50%;inset:-8%;animation:orbit 12s linear infinite}.orb:after{inset:-15%;animation-direction:reverse;animation-duration:18s}.orb span{filter:drop-shadow(0 0 22px #c993ff);animation:pulse 3s ease-in-out infinite}.orb:hover{box-shadow:0 0 150px #9d52ca55,inset -40px -42px 75px #000}.orb.locked{background:radial-gradient(circle at 42% 35%,#efb5ff66,#431b59 34%,#100817 65%)}.orb.resolved{animation:flash .9s ease-out}.ey{margin-top:30px;font-size:9px;letter-spacing:.3em;color:#75617f}h1{font:900 clamp(58px,15vw,116px)/.76 Arial Black,sans-serif;letter-spacing:-.07em;margin:13px 0 18px}.law{color:#a38eae;font-size:9px;letter-spacing:.14em;line-height:1.8}.whisper{color:#65566e;font-size:9px;min-height:24px;margin:16px 0}.panel{display:none;margin:26px auto 0;width:min(480px,100%);padding:22px;border:1px solid #392944;border-radius:20px;background:#09070cdd;box-shadow:0 25px 80px #000}.panel.open{display:block;animation:appear .3s ease-out}.question{width:100%;background:#0d0911;border:1px solid #3d2b47;color:#e2d4e8;padding:14px;border-radius:11px;font:11px ui-monospace;margin-bottom:18px}.row{display:flex;justify-content:space-between;color:#927f9b;font-size:9px}.range{width:100%;margin:21px 0;accent-color:#9a63b7}.btn{border:1px solid #654576;background:#160d1c;color:#d2b9df;padding:12px 18px;border-radius:999px;font:9px ui-monospace;letter-spacing:.12em;margin:5px;cursor:pointer}.receipt{color:#806e88;font-size:9px;line-height:1.8;margin-top:14px}.history{margin-top:20px;color:#65586c;font-size:8px;line-height:1.8}.closed{display:none}@keyframes pulse{50%{opacity:.42;transform:scale(.88)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes appear{from{opacity:0;transform:translateY(-8px)}}@keyframes flash{50%{filter:brightness(2)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<a class="back" href="../">← THE PORTAL</a><main class="wrap"><div class="orb" id="orb" role="button" tabindex="0" aria-label="Consult the Oracle"><span id="sig">◇</span></div><div class="ey" id="ey">ORACLE // PROBABILITY, NOT PROPHECY</div><h1>ORACLE</h1><div class="law">PAST → DISCOVER → FREEZE → UNSEEN → TEST</div><div class="whisper" id="whisper">TOUCH THE ORB WHEN YOU HAVE A FUTURE IN MIND.</div>
<section class="panel" id="panel"><div id="forecast"><input class="question" id="q" maxlength="140" placeholder="Name a falsifiable future."><div class="row"><span>HOW SURE ARE YOU?</span><b id="pct">50%</b></div><input class="range" id="prob" type="range" min="1" max="99" value="50"><button class="btn" id="lock">FREEZE THIS FUTURE</button></div><div id="resolve" class="closed"><div id="locked"></div><p class="receipt">Reality has not answered yet.</p><button class="btn" id="yes">IT HAPPENED</button><button class="btn" id="no">IT DID NOT</button></div><div class="receipt" id="receipt"></div><div class="history" id="history"></div></section></main><script>
const P="portal-oracle-forecast",H="portal-oracle-history",$=id=>document.getElementById(id),orb=$("orb"),panel=$("panel"),forecast=$("forecast"),resolve=$("resolve"),locked=$("locked"),receipt=$("receipt"),history=$("history"),q=$("q"),prob=$("prob"),pct=$("pct"),whisper=$("whisper"),sig=$("sig");prob.oninput=()=>pct.textContent=prob.value+"%";const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};function getF(){try{return JSON.parse(localStorage.getItem(P)||"null")}catch(e){return null}}function getH(){try{return JSON.parse(localStorage.getItem(H)||"[]")}catch(e){return[]}}
function hist(){const h=getH();history.innerHTML=h.length?"PAST CONSULTATIONS // "+h.slice(-3).reverse().map(x=>Math.round(x.p)+"% → "+(x.y?"YES":"NO")+" // "+x.b.toFixed(3)).join("<br>"):""}
function draw(){const f=getF();forecast.classList.toggle("closed",!!f);resolve.classList.toggle("closed",!f);orb.classList.toggle("locked",!!f);sig.textContent=f?"◆":"◇";if(f){locked.innerHTML="<b>"+esc(f.q||"Unnamed future")+"</b><br><br>"+f.p+"% // FROZEN "+new Date(f.t).toLocaleString();whisper.textContent="THE FUTURE IS SEALED. RETURN WHEN REALITY ANSWERS."}else whisper.textContent="TOUCH THE ORB WHEN YOU HAVE A FUTURE IN MIND."}
function consult(){panel.classList.toggle("open");if(panel.classList.contains("open"))setTimeout(()=>q.focus(),150)}orb.onclick=consult;orb.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();consult()}};
$("lock").onclick=()=>{if(!q.value.trim()){receipt.textContent="THE ORACLE REQUIRES A QUESTION REALITY CAN ANSWER.";return}localStorage.setItem(P,JSON.stringify({q:q.value.trim(),p:+prob.value,t:Date.now()}));receipt.textContent="FUTURE FROZEN IN THIS BROWSER.";panel.classList.remove("open");draw()};
function done(y){const f=getF();if(!f)return;const pr=f.p/100,b=(pr-(y?1:0))**2,h=getH();h.push({...f,y,b});localStorage.setItem(H,JSON.stringify(h.slice(-50)));localStorage.removeItem(P);receipt.textContent="REALITY RECORDED // BRIER "+b.toFixed(3)+" // LOWER IS BETTER.";orb.classList.remove("locked");orb.classList.add("resolved");sig.textContent=y?"✦":"◌";setTimeout(()=>{orb.classList.remove("resolved");draw()},1000);hist()}$("yes").onclick=()=>done(true);$("no").onclick=()=>done(false);draw();hist();
</script></body></html>
