<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PORTAL TV playback state tests</title><style>body{background:#0b1425;color:#e6fff7;font:16px system-ui;padding:20px;max-width:700px;margin:auto}.ok{color:#9ef0b7}.fail{color:#ffa7a7}li{margin:10px 0}button{padding:12px;border-radius:8px}</style></head><body><h1>Playback lifecycle tests</h1><p>Deterministic, offline simulations. No streams are opened and saved channels are untouched.</p><button id="run">Run playback tests</button><ol id="results"></ol><p id="summary"></p><script src="tv-playback-state.js"></script><script>(()=>{'use strict';function run(){const list=document.getElementById('results');list.replaceChildren();let pass=0,fail=0;const p=window.PortalPlaybackState;function check(label,actual,expected){const ok=actual===expected,li=document.createElement('li');li.className=ok?'ok':'fail';li.textContent=(ok?'PASS':'FAIL')+' · '+label+' ('+String(actual)+')';list.append(li);ok?pass++:fail++}check('New tune connects',p.next('idle','tune'),'connecting');check('Playing establishes playback',p.next('connecting','playing'),'playing');check('Buffering after playback',p.next('playing','waiting'),'buffering');check('Stall remains buffering',p.next('buffering','stalled'),'buffering');check('Recover from buffering',p.next('buffering','playing'),'playing');check('Error marks failed',p.next('connecting','error'),'failed');check('Timeout marks failed',p.next('connecting','timeout'),'failed');check('Retry starts connecting',p.next('failed','retry'),'connecting');check('Stop resets',p.next('playing','stop'),'idle');check('Unrelated waiting does not invent playback',p.next('connecting','waiting'),'connecting');check('Old channel events rejected',p.current('https://a.example/1.m3u8','https://b.example/2.m3u8',true),false);check('Detached player events rejected',p.current('https://a.example/1.m3u8','https://a.example/1.m3u8',false),false);check('Current attached channel accepted',p.current('https://a.example/1.m3u8','https://a.example/1.m3u8',true),true);document.getElementById('summary').textContent=pass+' passed · '+fail+' failed. Live streaming and browser autoplay remain separate tests.'}document.getElementById('run').onclick=run;run()})();</script></body></html>
